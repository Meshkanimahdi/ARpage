<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدل اسکچ آپارتمان سوم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap">
<style>
/* Layout: white architect's sheet; the line model fills it; quiet chrome in the corners */
:root {
  --paper: #ffffff;
  --ink: #1f2321;
  --muted: #6c716e;
  --line: #d9dcda;
  --accent: #2e58c4;
  --chip: rgba(255, 255, 255, 0.92);
  --body: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); overflow: hidden; }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
.bar { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
.bar > * { pointer-events: auto; }
.title { padding: 10px 14px; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; }
.title h1 { margin: 0; font-size: 16px; }
.title small { color: var(--muted); font-size: 12px; }
.seg { display: flex; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-inline-start: auto; }
.seg button, .lnk { font: inherit; font-size: 13px; border: 0; background: none; color: var(--ink); padding: 7px 12px; border-radius: 9px; cursor: pointer; text-decoration: none; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.seg button:focus-visible, .lnk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lnk { background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 9px 14px; }
#labels { position: fixed; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translate(50%, -50%); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
.lab small { color: var(--muted); }
#hint { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; }
#err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--muted); }
@media (max-width: 640px) { .title small { display: none; } #hint { white-space: normal; width: calc(100% - 32px); text-align: center; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div class="bar">
  <div class="title"><h1>مدل سه‌بعدی اسکچ</h1><small id="sum"></small></div>
  <div class="seg" role="group" aria-label="نما">
    <button type="button" data-v="axo" aria-pressed="true">سه‌بعدی</button>
    <button type="button" data-v="plan" aria-pressed="false">از بالا</button>
    <button type="button" data-v="walk" aria-pressed="false">قدم زدن</button>
  </div>
  <a class="lnk" href="index.html">◎ تور ۳۶۰</a>
</div>
<div id="hint">برای چرخاندن بکشید · برای زوم اسکرول کنید</div>
<div id="err"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/lines/LineSegments2.js"></script>
<script src="home.js"></script>
<script>
(function () {
  const H = window.HOME, $ = (id) => document.getElementById(id);
  const fa = (v) => String(v).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]).replace(".", "٫");
  if (!window.THREE || !THREE.LineSegments2) { $("err").style.display = "grid"; $("err").textContent = "کتابخانه‌ی سه‌بعدی بارگذاری نشد. اتصال اینترنت را بررسی کنید."; return; }

  const CEIL = H.CEIL, CUT = 1.3, T = 0.14;   // wall height, section cut for the overview, wall thickness
  const room = Object.fromEntries(H.ROOMS.map((r) => [r.id, r]));
  const X0 = Math.min(...H.ROOMS.map((r) => r.x0)), X1 = Math.max(...H.ROOMS.map((r) => r.x1));
  const Y0 = Math.min(...H.ROOMS.map((r) => r.y0)), Y1 = Math.max(...H.ROOMS.map((r) => r.y1));
  const cx = (X0 + X1) / 2, cy = (Y0 + Y1) / 2, span = Math.hypot(X1 - X0, Y1 - Y0);

  /* plan (x east, y south) -> three (x, up, z = y) */
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  $("stage").appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color("#ffffff");
  const camera = new THREE.PerspectiveCamera(30, 1, .05, 400);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.target.set(cx, 0, cy);
  const clip = new THREE.Plane(new THREE.Vector3(0, -1, 0), CUT);
  renderer.localClippingEnabled = true;

  const white = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 2, clippingPlanes: [clip] });
  const floorMat = new THREE.MeshBasicMaterial({ color: 0xf4f5f4, side: THREE.DoubleSide });
  const solids = [];
  const lineSets = { ink: [], light: [] };
  const v = new THREE.Vector3();
  function box(x0, y0, x1, y1, z0, z1, kind) {
    if (x1 - x0 < .01 || y1 - y0 < .01 || z1 - z0 < .005) return;
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, z1 - z0, y1 - y0), white);
    m.position.set((x0 + x1) / 2, (z0 + z1) / 2, (y0 + y1) / 2); scene.add(m);
    const e = new THREE.EdgesGeometry(m.geometry), a = e.attributes.position.array;
    for (let i = 0; i < a.length; i += 3) { v.set(a[i], a[i + 1], a[i + 2]).add(m.position); lineSets[kind || "ink"].push(v.x, v.y, v.z); }
    if (kind !== "light") solids.push({ x0, y0, x1, y1 });
  }

  /* walls: every room edge, minus the openings on it, minus windows (their sill and head stay) */
  const seen = new Set();
  const OPEN = H.OPENINGS, WIN = H.WINDOWS;
  H.ROOMS.forEach((r) => {
    [["x", r.y0, r.x0, r.x1], ["x", r.y1, r.x0, r.x1], ["y", r.x0, r.y0, r.y1], ["y", r.x1, r.y0, r.y1]].forEach(([axis, c, a0, a1]) => {
      const key = axis + c.toFixed(2) + ":" + a0.toFixed(2) + ":" + a1.toFixed(2);
      if (seen.has(key)) return; seen.add(key);
      const cuts = OPEN.concat(WIN).filter((o) => o.axis === axis && Math.abs(o.c - c) < 1e-6 && o.a1 > a0 && o.a0 < a1).sort((p, q) => p.a0 - q.a0);
      const seg = (u0, u1, z0, z1) => axis === "x" ? box(u0, c - T / 2, u1, c + T / 2, z0, z1) : box(c - T / 2, u0, c + T / 2, u1, z0, z1);
      let s = a0;
      cuts.forEach((o) => {
        const u0 = Math.max(a0, o.a0), u1 = Math.min(a1, o.a1);
        if (u0 > s) seg(s, u0, 0, CEIL);
        if (o.sill !== undefined) { seg(u0, u1, 0, o.sill); seg(u0, u1, o.head, CEIL); }
        else if (o.head) seg(u0, u1, o.head, CEIL);
        s = Math.max(s, u1);
      });
      if (s < a1) seg(s, a1, 0, CEIL);
    });
  });
  // window glazing bars and door leaves as light lines
  WIN.forEach((w) => {
    const m = (w.a0 + w.a1) / 2, P = (a, z) => w.axis === "x" ? [a, z, w.c] : [w.c, z, a];
    lineSets.light.push(...P(m, w.sill), ...P(m, w.head), ...P(w.a0, w.sill), ...P(w.a1, w.sill), ...P(w.a0, w.head), ...P(w.a1, w.head));
  });
  OPEN.filter((o) => o.kind === "door" || o.kind === "front").forEach((o) => {
    const w = o.a1 - o.a0, P = (a, d, z) => o.axis === "x" ? [a, z, o.c + d] : [o.c + d, z, a];
    for (let k = 0; k <= 12; k++) {          // swing arc on the floor
      const t0 = k / 12 * Math.PI / 2, t1 = (k + 1) / 12 * Math.PI / 2;
      if (k < 12) lineSets.light.push(...P(o.a0 + Math.cos(t0) * w, Math.sin(t0) * w, .01), ...P(o.a0 + Math.cos(t1) * w, Math.sin(t1) * w, .01));
    }
  });
  // furniture
  Object.values(H.FURNITURE).flat().forEach((f) => box(f[0], f[1], f[2], f[3], f[4], Math.max(f[5], f[4] + .02), "ink"));
  // floors with a light tile grid
  H.ROOMS.forEach((r) => {
    const f = new THREE.Mesh(new THREE.PlaneGeometry(r.x1 - r.x0, r.y1 - r.y0), floorMat);
    f.rotation.x = -Math.PI / 2; f.position.set((r.x0 + r.x1) / 2, 0, (r.y0 + r.y1) / 2); f.userData.floor = true; scene.add(f);
    const s = .6;
    for (let x = r.x0 + s; x < r.x1 - .01; x += s) lineSets.light.push(x, .002, r.y0, x, .002, r.y1);
    for (let y = r.y0 + s; y < r.y1 - .01; y += s) lineSets.light.push(r.x0, .002, y, r.x1, .002, y);
  });

  const mats = [];
  function lines(arr, color, width) {
    const g = new THREE.LineSegmentsGeometry(); g.setPositions(arr);
    const m = new THREE.LineMaterial({ color, linewidth: width, clippingPlanes: [clip] }); mats.push(m);
    const l = new THREE.LineSegments2(g, m); scene.add(l); return l;
  }
  lines(lineSets.ink, 0x1f2321, 1.3);
  lines(lineSets.light, 0xb4b9b6, .8);

  /* room labels */
  const labs = H.ROOMS.map((r) => {
    const el = document.createElement("div"); el.className = "lab";
    el.innerHTML = `${r.name} <small>≈${fa(((r.x1 - r.x0) * (r.y1 - r.y0)).toFixed(1))} م²</small>`;
    $("labels").appendChild(el);
    return { el, p: new THREE.Vector3((r.x0 + r.x1) / 2, .2, (r.y0 + r.y1) / 2) };
  });
  const total = H.ROOMS.reduce((s, r) => s + (r.x1 - r.x0) * (r.y1 - r.y0), 0);
  $("sum").textContent = `${fa(H.ROOMS.length)} فضا · حدود ${fa(Math.round(total))} متر مربع · ابعاد تخمینی`;

  /* views */
  let view = "axo", walk = null; const keys = {};
  function setView(vw) {
    view = vw;
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === vw)));
    clip.constant = vw === "walk" ? 1000 : CUT;
    controls.enabled = vw !== "walk";
    $("labels").style.display = vw === "walk" ? "none" : "";
    // fit the whole flat to the screen: distance from the lens angle, with a margin; a tall screen needs more room
    const fit = (k) => span / (2 * Math.tan(THREE.MathUtils.degToRad(15))) * k / Math.min(1, camera.aspect);
    if (vw === "axo") { camera.fov = 30; const d = new THREE.Vector3(-.42, .8, .43).normalize(); camera.position.set(cx, 0, cy).addScaledVector(d, fit(1.05)); controls.target.set(cx, 0, cy); }
    if (vw === "plan") { camera.fov = 30; camera.position.set(cx, fit(1.0), cy + .001); controls.target.set(cx, 0, cy); }
    if (vw === "walk") {
      const n = H.NODES[0]; walk = { x: n.x, y: n.y, yaw: Math.atan2(-Math.cos(n.a * Math.PI / 180), -Math.sin(n.a * Math.PI / 180)), pitch: -.05 };
      camera.fov = 70;
    }
    camera.updateProjectionMatrix();
    $("hint").textContent = vw === "walk" ? "کلیدهای جهت یا W A S D برای حرکت · برای نگاه کردن بکشید · روی کف بزنید تا بروید" : "برای چرخاندن بکشید · برای زوم اسکرول کنید";
  }
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.v)));

  const blocked = (x, y) => solids.some((s) => x > s.x0 - .18 && x < s.x1 + .18 && y > s.y0 - .18 && y < s.y1 + .18);
  let drag = null, glide = null;
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  renderer.domElement.addEventListener("pointerdown", (e) => { if (view === "walk") { drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY }; renderer.domElement.setPointerCapture(e.pointerId); } });
  renderer.domElement.addEventListener("pointermove", (e) => {
    if (!drag) return;
    walk.yaw += (e.clientX - drag.x) * .004; walk.pitch = Math.max(-1.2, Math.min(1.2, walk.pitch + (e.clientY - drag.y) * .004));
    drag.x = e.clientX; drag.y = e.clientY;
  });
  renderer.domElement.addEventListener("pointerup", (e) => {
    if (!drag) return;
    const moved = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 5; drag = null;
    if (moved) return;
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(scene.children.filter((o) => o.userData.floor))[0];
    if (hit) glide = { x: hit.point.x, y: hit.point.z };
  });
  addEventListener("keydown", (e) => (keys[e.key.toLowerCase()] = 1));
  addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = 0));

  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); mats.forEach((m) => m.resolution.set(w, h)); }
  addEventListener("resize", resize);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (view === "walk") {
      const f = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0);
      const s = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
      walk.yaw += ((keys.arrowleft ? 1 : 0) - (keys.arrowright ? 1 : 0)) * 1.6 * dt;
      let dx = 0, dy = 0;
      if (f || s) { const sp = 1.4 * dt; dx = (-Math.sin(walk.yaw) * f + Math.cos(walk.yaw) * s) * sp; dy = (-Math.cos(walk.yaw) * f - Math.sin(walk.yaw) * s) * sp; glide = null; }
      else if (glide) { const gx = glide.x - walk.x, gy = glide.y - walk.y, L = Math.hypot(gx, gy); if (L < .05) glide = null; else { const sp = Math.min(L, 1.8 * dt); dx = gx / L * sp; dy = gy / L * sp; } }
      if (!blocked(walk.x + dx, walk.y)) walk.x += dx; else glide = null;
      if (!blocked(walk.x, walk.y + dy)) walk.y += dy; else glide = null;
      camera.position.set(walk.x, 1.55, walk.y);
      camera.rotation.order = "YXZ"; camera.rotation.set(walk.pitch, walk.yaw, 0);
    } else controls.update();
    renderer.render(scene, camera);
    if (view !== "walk") {
      const W = innerWidth, Hh = innerHeight;
      labs.forEach((l) => { const p = l.p.clone().project(camera); l.el.style.display = p.z < 1 ? "" : "none"; l.el.style.right = (W - (p.x + 1) / 2 * W) + "px"; l.el.style.top = ((1 - p.y) / 2 * Hh) + "px"; });
    }
    requestAnimationFrame(frame);
  }
  resize(); setView("axo"); requestAnimationFrame(frame);
  window.SKETCH = { setView };
})();
</script>
</body>
</html>
