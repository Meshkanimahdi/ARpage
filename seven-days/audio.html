<!doctype html>
<html><head><meta charset="utf-8"><title>mix</title></head><body>
<script src="node_modules/tone/build/Tone.js"></script>
<script src="timeline.js"></script>
<script>
const {T, M, BEAT, DURATION, NO_TIMES} = TL;
const SFX = ['arcade_achievement','arcade_bonus','arcade_level-up','arcade_press','arcade_purchase','arcade_send','arcade_streak','cinematic_swipe','glass_check','glass_notification','glass_press','glass_success','glass_unlock','glass_wake','mechanical_close','mechanical_delete','mechanical_lock','mechanical_select','mechanical_snap','rubber_cancel','rubber_error','rubber_reaction','rubber_receive','scifi_seek','scifi_skip-previous','soft_check','soft_toggle-off'];

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const db = d => Math.pow(10, d / 20);

async function renderMix(opts = {}) {
  const bufs = {};
  await Promise.all(SFX.map(async n => { bufs[n] = await Tone.ToneAudioBuffer.fromUrl(`sfx/${n}.mp3`); }));
  bufs.ding = await Tone.ToneAudioBuffer.fromUrl('sfx/ding.ogg');
  const out = await Tone.Offline(async () => {
    const ctx = Tone.getContext();
    const master = new Tone.Gain(.5).toDestination();
    const glue = new Tone.Compressor({threshold: -16, ratio: 2.5, attack: .01, release: .2}).connect(master);
    const music = new Tone.Gain(db(opts.musicDb ?? -3)).connect(glue);
    const fxBus = new Tone.Gain(db(opts.sfxDb ?? 0)).connect(master);
    /* algorithmic room: seeded noise impulse */
    const R = rng(77), irLen = Math.floor(ctx.sampleRate * 2.4), ir = ctx.createBuffer(2, irLen, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < irLen; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / irLen, 3.2); }
    const verb = new Tone.Convolver(new Tone.ToneAudioBuffer(ir)); const verbRet = new Tone.Gain(.32).connect(music); verb.connect(verbRet);
    const verbFx = new Tone.Gain(.18).connect(fxBus); verb.connect(verbFx);
    const send = (node, amt) => { const g = new Tone.Gain(amt); node.connect(g); g.connect(verb); return node; };
    /* duck bus: lowers the musical bed under dead stop and around big moments */
    const bed = new Tone.Gain(1).connect(music);
    const drumsBus = new Tone.Gain(1).connect(music);

    /* ---------------- instruments ---------------- */
    const kick = new Tone.MembraneSynth({pitchDecay: .05, octaves: 7, oscillator: {type: 'sine'}, envelope: {attack: .001, decay: .38, sustain: 0, release: .1}, volume: -8}).connect(drumsBus);
    const kickClick = new Tone.NoiseSynth({noise: {type: 'white'}, envelope: {attack: .001, decay: .012, sustain: 0}, volume: -22}).connect(new Tone.Filter(3000, 'highpass').connect(drumsBus));
    const sub = new Tone.MonoSynth({oscillator: {type: 'sine'}, filter: {Q: 0, type: 'lowpass', rolloff: -24}, filterEnvelope: {baseFrequency: 180, octaves: 1.5, attack: .005, decay: .3, sustain: .6}, envelope: {attack: .005, decay: .9, sustain: .5, release: .25}, portamento: .03, volume: -15});
    const subDist = new Tone.Distortion(.35); sub.chain(subDist, bed);
    const snBody = new Tone.MembraneSynth({pitchDecay: .02, octaves: 2, envelope: {attack: .001, decay: .12, sustain: 0}, volume: -12}).connect(drumsBus);
    const snNoise = new Tone.NoiseSynth({noise: {type: 'white'}, envelope: {attack: .001, decay: .2, sustain: 0}, volume: -4});
    const snF = new Tone.Filter({frequency: 1900, type: 'bandpass', Q: .7}); snNoise.chain(snF, drumsBus); send(snF, .35);
    const clap = new Tone.NoiseSynth({noise: {type: 'pink'}, envelope: {attack: .001, decay: .09, sustain: 0}, volume: -6});
    const clF = new Tone.Filter({frequency: 1300, type: 'bandpass', Q: 1.2}); clap.chain(clF, drumsBus); send(clF, .5);
    const hat = new Tone.NoiseSynth({noise: {type: 'white'}, envelope: {attack: .001, decay: .04, sustain: 0}, volume: -9});
    const hatF = new Tone.Filter(7000, 'highpass'); hat.chain(hatF, drumsBus);
    const ohat = new Tone.NoiseSynth({noise: {type: 'white'}, envelope: {attack: .002, decay: .22, sustain: 0}, volume: -15}); ohat.connect(hatF);
    const keys = new Tone.PolySynth(Tone.FMSynth, {harmonicity: 3, modulationIndex: 2.2, oscillator: {type: 'sine'}, modulation: {type: 'sine'}, envelope: {attack: .006, decay: 1.4, sustain: .25, release: 1.2}, modulationEnvelope: {attack: .002, decay: .5, sustain: .1, release: .6}, volume: -11});
    const chorus = new Tone.Chorus(2.2, 2.5, .4).start(); keys.chain(chorus, bed); send(chorus, .45);
    const pad = new Tone.PolySynth(Tone.Synth, {oscillator: {type: 'fatsawtooth', count: 3, spread: 28}, envelope: {attack: .9, decay: .4, sustain: .85, release: 2}, volume: -22});
    const padF = new Tone.Filter({frequency: 900, type: 'lowpass', rolloff: -24}); pad.chain(padF, bed); send(padF, .6);
    const lead = new Tone.PolySynth(Tone.Synth, {oscillator: {type: 'triangle'}, envelope: {attack: .002, decay: .32, sustain: 0, release: .25}, volume: -8});
    const leadSq = new Tone.PolySynth(Tone.Synth, {oscillator: {type: 'square'}, envelope: {attack: .002, decay: .18, sustain: 0, release: .15}, volume: -21});
    const lDelay = new Tone.FeedbackDelay({delayTime: BEAT * .75, feedback: .28, wet: .25}); const lF = new Tone.Filter(5200, 'lowpass');
    lead.chain(lF, lDelay, bed); leadSq.connect(lF); send(lDelay, .4);
    const brass = new Tone.PolySynth(Tone.Synth, {oscillator: {type: 'fatsawtooth', count: 4, spread: 40}, envelope: {attack: .25, decay: .3, sustain: .9, release: .06}, volume: -15});
    const brF = new Tone.Filter(2200, 'lowpass'); brass.chain(brF, bed); send(brF, .8);
    const timp = new Tone.MembraneSynth({pitchDecay: .08, octaves: 1.5, envelope: {attack: .002, decay: 1.1, sustain: 0}, volume: -4}).connect(bed); send(timp, .7);
    const plink = new Tone.PolySynth(Tone.Synth, {oscillator: {type: 'sine'}, envelope: {attack: .001, decay: .18, sustain: 0, release: .1}, volume: -20}); plink.connect(fxBus); send(plink, .3);

    /* mono synths need strictly increasing start times: defer, sort, then fire */
    const deferred = [];
    [kick, kickClick, sub, snBody, snNoise, clap, hat, ohat, timp].forEach((inst, id) => {
      const orig = inst.triggerAttackRelease.bind(inst);
      inst.triggerAttackRelease = (...args) => { const tIdx = inst instanceof Tone.NoiseSynth ? 1 : 2; deferred.push({id, t: args[tIdx], tIdx, args, orig}); return inst; };
    });
    /* ---------------- harmony ---------------- */
    const PROG = [['A3', 'C4', 'E4', 'G4'], ['F3', 'A3', 'C4', 'E4'], ['C4', 'E4', 'G4', 'B4'], ['G3', 'B3', 'D4', 'E4']];
    const ROOT = ['A1', 'F1', 'C2', 'G1'];
    const chordOf = b => PROG[((b % 4) + 4) % 4], rootOf = b => ROOT[((b % 4) + 4) % 4];
    const MOTIF = [[0, 'E5'], [.5, 'G5'], [1, 'A5'], [1.75, 'C6'], [2.5, 'A5'], [3, 'G5'], [3.5, 'E5']];
    const MOTIF2 = [[0, 'A5'], [.75, 'G5'], [1.5, 'E5'], [2, 'D5'], [2.5, 'E5'], [3.25, 'C5']];

    function beatBar(b, o = {}) {
      const t = T(b), r = rootOf(b), var4 = b % 4 === 3;
      const K = o.four ? [0, 1, 2, 3] : (var4 ? [0, .75, 1.75, 2.5, 3.25] : [0, 1.75, 2.5]);
      K.forEach(k => { kick.triggerAttackRelease('C1', .3, t + k * BEAT, o.kv ?? 1); kickClick.triggerAttackRelease(.01, t + k * BEAT, .6); });
      if (!o.noBass) K.forEach((k, i) => { const len = ((K[i + 1] ?? 4) - k) * BEAT * .92; sub.triggerAttackRelease(r, len, t + k * BEAT, .95); });
      if (!o.noSnare) [1, 3].forEach(k => { snNoise.triggerAttackRelease(.2, t + k * BEAT, .9); snBody.triggerAttackRelease('A3', .1, t + k * BEAT, .8); [0, .012, .024].forEach(d => clap.triggerAttackRelease(.08, t + k * BEAT + d, .7)); });
      const hstep = o.hat16 ? .25 : .5;
      for (let k = 0; k < 4; k += hstep) hat.triggerAttackRelease(.03, t + k * BEAT, (k % 1 === 0 ? .55 : .9) * (o.hv ?? 1));
      if (b % 2 === 1 && !o.hat16) [3.5, 3.625, 3.75, 3.875].forEach(k => hat.triggerAttackRelease(.02, t + k * BEAT, .6));
      if (b % 4 === 1) ohat.triggerAttackRelease(.2, t + 2.5 * BEAT, .7);
    }
    function keysBar(b, o = {}) {
      const t = T(b), ch = chordOf(b);
      keys.triggerAttackRelease(ch, BEAT * 2.2, t, o.v ?? .55);
      keys.triggerAttackRelease(ch.slice(1), BEAT * 1.2, t + BEAT * 2.5, (o.v ?? .55) * .7);
    }
    function padBar(b, len = 1, v = .5) { pad.triggerAttackRelease(chordOf(b), BAR() * len - .05, T(b), v); }
    function BAR() { return BEAT * 4; }
    function motif(b, m = MOTIF, v = .7) { m.forEach(([k, n]) => { lead.triggerAttackRelease(n, .25, T(b, k), v); leadSq.triggerAttackRelease(n, .15, T(b, k), v); }); }
    function fill(t) { [0, .25, .5, .75].forEach((k, i) => { snNoise.triggerAttackRelease(.12, t + k * BEAT, .5 + i * .15); snBody.triggerAttackRelease(['E3', 'D3', 'C3', 'A2'][i], .08, t + k * BEAT, .7); }); }

    /* ---------------- synth SFX ---------------- */
    function env(g, t, a, peak, d) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
    function whoosh(t, dur = .45, f0 = 300, f1 = 3800, peak = .55, f2 = 900) {
      const n = new Tone.Noise('pink'), bp = new Tone.Filter({type: 'bandpass', Q: 1.1}), hp = new Tone.Filter(180, 'highpass'), g = new Tone.Gain(0), pan = new Tone.Panner(0);
      n.chain(bp, hp, g, pan, fxBus); send(g, .25);
      const s = t - dur * .7;
      bp.frequency.setValueAtTime(f0, s); bp.frequency.exponentialRampToValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur * .3);
      g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur * .35);
      pan.pan.setValueAtTime(.6, s); pan.pan.linearRampToValueAtTime(-.6, t + dur * .3);
      n.start(s).stop(t + dur * .4);
    }
    function impact(t, size = 1) {
      const o = new Tone.Oscillator(110, 'sine'), g = new Tone.Gain(0); o.chain(g, fxBus);
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(38, t + .45);
      env(g, t, .004, .5 * size, .7 + .4 * size); o.start(t).stop(t + 1.4);
      const n = new Tone.Noise('white'), lp = new Tone.Filter(2600, 'lowpass'), gn = new Tone.Gain(0); n.chain(lp, gn, fxBus); send(gn, .6);
      env(gn, t, .002, .5 * size, .22); n.start(t).stop(t + .4);
      if (size >= 1) { const c = new Tone.Noise('white'), hp = new Tone.Filter(5500, 'highpass'), gc = new Tone.Gain(0); c.chain(hp, gc, fxBus); send(gc, .5); env(gc, t, .003, .16 * size, 1.6); c.start(t).stop(t + 1.8); }
    }
    function riser(t0, t1, peak = .3) {
      const n = new Tone.Noise('white'), hp = new Tone.Filter({type: 'bandpass', Q: 1.5}), g = new Tone.Gain(0); n.chain(hp, g, fxBus); send(g, .4);
      hp.frequency.setValueAtTime(400, t0); hp.frequency.exponentialRampToValueAtTime(7000, t1);
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(peak, t1 - .02); g.gain.linearRampToValueAtTime(0, t1);
      n.start(t0).stop(t1 + .05);
      const o = new Tone.Oscillator(200, 'sawtooth'), lp = new Tone.Filter(1800, 'lowpass'), go = new Tone.Gain(0); o.chain(lp, go, fxBus);
      o.frequency.setValueAtTime(180, t0); o.frequency.exponentialRampToValueAtTime(1400, t1);
      go.gain.setValueAtTime(0, t0); go.gain.linearRampToValueAtTime(peak * .12, t1 - .02); go.gain.linearRampToValueAtTime(0, t1);
      o.start(t0).stop(t1 + .05);
    }
    function revCym(t1, len = 1.6, peak = .22) { const t0 = t1 - len; const n = new Tone.Noise('white'), hp = new Tone.Filter(6000, 'highpass'), g = new Tone.Gain(0); n.chain(hp, g, fxBus); g.gain.setValueAtTime(0, t0); g.gain.exponentialRampToValueAtTime(peak, t1 - .01); g.gain.linearRampToValueAtTime(0, t1); n.start(t0).stop(t1); }
    function scratch(t) {
      const n = new Tone.Noise('white'), bp = new Tone.Filter({type: 'bandpass', Q: 4}), g = new Tone.Gain(0); n.chain(bp, g, fxBus);
      const pts = [[0, 500], [.06, 3200], [.12, 700], [.2, 2600], [.3, 400]];
      pts.forEach(([k, f], i) => i ? bp.frequency.exponentialRampToValueAtTime(f, t + k) : bp.frequency.setValueAtTime(f, t + k));
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.9, t + .01); g.gain.linearRampToValueAtTime(.7, t + .2); g.gain.linearRampToValueAtTime(0, t + .32); n.start(t).stop(t + .35);
      const o = new Tone.Oscillator(300, 'sawtooth'), lp = new Tone.Filter(2500, 'lowpass'), go = new Tone.Gain(0); o.chain(lp, go, fxBus);
      pts.forEach(([k, f], i) => i ? o.frequency.exponentialRampToValueAtTime(f / 4, t + k) : o.frequency.setValueAtTime(f / 4, t + k));
      go.gain.setValueAtTime(0, t); go.gain.linearRampToValueAtTime(.18, t + .01); go.gain.linearRampToValueAtTime(0, t + .32); o.start(t).stop(t + .35);
    }
    function rewindTape(t, dur) {
      const n = new Tone.Noise('pink'), bp = new Tone.Filter({type: 'bandpass', Q: 3}), g = new Tone.Gain(0), lfo = new Tone.LFO(17, 600, 2400);
      lfo.connect(bp.frequency); n.chain(bp, g, fxBus);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.5, t + .1); g.gain.setValueAtTime(.5, t + dur - .15); g.gain.linearRampToValueAtTime(0, t + dur);
      lfo.frequency.setValueAtTime(10, t); lfo.frequency.linearRampToValueAtTime(30, t + dur);
      n.start(t).stop(t + dur); lfo.start(t).stop(t + dur);
      const o = new Tone.Oscillator(800, 'sawtooth'), lp = new Tone.Filter(2000, 'lowpass'), go = new Tone.Gain(0); o.chain(lp, go, fxBus);
      o.frequency.setValueAtTime(1400, t); o.frequency.exponentialRampToValueAtTime(300, t + dur);
      go.gain.setValueAtTime(0, t); go.gain.linearRampToValueAtTime(.05, t + .1); go.gain.linearRampToValueAtTime(0, t + dur); o.start(t).stop(t + dur);
    }
    function bell(t, dur = 1.4) {
      const s = new Tone.FMSynth({harmonicity: 3.01, modulationIndex: 14, envelope: {attack: .001, decay: .2, sustain: 1, release: .3}, volume: -12}), g = new Tone.Gain(0), lfo = new Tone.LFO(24, 0, .9);
      s.chain(g, fxBus); send(g, .4); lfo.connect(g.gain);
      s.triggerAttackRelease('E6', dur, t); lfo.start(t).stop(t + dur + .3);
    }
    function vibrate(t, dur = .45) {
      const o = new Tone.Oscillator(155, 'square'), lp = new Tone.Filter(600, 'lowpass'), g = new Tone.Gain(0), lfo = new Tone.LFO(9, 0, .16);
      o.chain(lp, g, fxBus); lfo.connect(g.gain); o.start(t).stop(t + dur); lfo.start(t).stop(t + dur);
    }
    function squeak(t, dur = .5, seed = 1) {
      const RR = rng(seed);
      for (let k = 0; k < dur; k += .09 + RR() * .07) {
        const n = new Tone.Noise('white'), bp = new Tone.Filter({type: 'bandpass', Q: 9}), g = new Tone.Gain(0); n.chain(bp, g, fxBus);
        const f = 2400 + RR() * 1800; bp.frequency.setValueAtTime(f, t + k); bp.frequency.linearRampToValueAtTime(f * (.8 + RR() * .5), t + k + .07);
        env(g, t + k, .01, .55, .07); n.start(t + k).stop(t + k + .12);
      }
    }
    function crunch(t) { const RR = rng(5); for (let i = 0; i < 9; i++) { const k = i * .035 + RR() * .02; const n = new Tone.Noise('brown'), bp = new Tone.Filter({type: 'bandpass', frequency: 900 + RR() * 2500, Q: 1.5}), g = new Tone.Gain(0); n.chain(bp, g, fxBus); env(g, t + k, .002, .5, .04); n.start(t + k).stop(t + k + .08); } }
    function shutter(t, dur = .5) { const n = new Tone.Noise('pink'), bp = new Tone.Filter({type: 'bandpass', frequency: 900, Q: 1}), g = new Tone.Gain(0), lfo = new Tone.LFO(28, 0, .35); n.chain(bp, g, fxBus); lfo.connect(g.gain); n.start(t).stop(t + dur); lfo.start(t).stop(t + dur); impact(t + dur, .35); }
    function kaching(t) { const s = new Tone.PolySynth(Tone.Synth, {oscillator: {type: 'triangle'}, envelope: {attack: .001, decay: .5, sustain: 0, release: .3}, volume: -10}); s.connect(fxBus); send(s, .4); s.triggerAttackRelease('B6', .1, t, .8); s.triggerAttackRelease(['E7', 'G#7'], .4, t + .07, .8); }
    function ticks(t0, t1) { let t = t0, step = .03; while (t < t1) { const k = (t - t0) / (t1 - t0); const o = new Tone.Oscillator(2200 + k * 1400, 'sine'), g = new Tone.Gain(0); o.chain(g, fxBus); env(g, t, .001, .12, .025); o.start(t).stop(t + .04); step = .03 + k * k * .12; t += step; } }
    function sample(name, t, gainDb = 0, rate = 1) { const p = new Tone.Player(bufs[name]); p.playbackRate = rate; const g = new Tone.Gain(db(gainDb + 6)); p.chain(g, fxBus); send(g, .2); p.start(t); }
    function womp(t) { const o = new Tone.Oscillator(330, 'triangle'), g = new Tone.Gain(0); o.chain(g, fxBus); o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(140, t + .5); env(g, t, .01, .25, .5); o.start(t).stop(t + .6); }

    /* ================= ARRANGEMENT ================= */
    /* S0 intro: pad + glitter */
    pad.triggerAttackRelease(['A3', 'C4', 'E4', 'B4'], T(2) - .05, 0, .55);
    padF.frequency.setValueAtTime(500, 0); padF.frequency.exponentialRampToValueAtTime(2600, T(1, 3));
    ['E5', 'A5', 'B5', 'E6', 'A6'].forEach((n, i) => lead.triggerAttackRelease(n, .3, M.introName + i * BEAT / 2, .35));
    sample('glass_wake', M.introName + .55, -2);
    sample('glass_press', M.introPresents, -4);
    riser(T(1), M.introOut + .5, .22);
    whoosh(T(2) - .05, .5, 4000, 300, .5, 200);
    impact(T(2), .5);
    /* S1 hook: tension bed + heartbeat */
    sub.triggerAttackRelease('A1', T(4, 1) - T(2), T(2), .35);
    pad.triggerAttackRelease(['A3', 'E4', 'G4'], T(4, 1) - T(2), T(2), .4);
    padF.frequency.setValueAtTime(700, T(2));
    for (let b = 2; b < 4.25; b += .25) { const t = T(0, b * 4); if (b % 1 === 0 || b % 1 === .5) { kick.triggerAttackRelease('C1', .2, t, .5); kick.triggerAttackRelease('C1', .2, t + BEAT * .4, .32); } }
    for (let k = 0; k < 9 * 4; k++) { const t = T(2) + k * BEAT / 2; if (t < M.rewind) hat.triggerAttackRelease(.02, t, .35); }
    sample('ding', M.ding1, 3); vibrate(M.ding1 + .02);
    /* rewind */
    rewindTape(M.rewind, T(5) - M.rewind - .05);
    for (let i = 0; i < 7; i++) sample('scifi_skip-previous', M.rewind + .15 + i * .22, -4, 1 + i * .06);
    revCym(T(5), 1.2, .28);
    /* S2 drop */
    impact(M.drop, 1.4); beatBar(5); keysBar(5, {v: .6}); motif(5);
    sample('mechanical_snap', M.hudIn + .25, -2); whoosh(M.hudIn + .2, .4, 600, 3000, .35);
    /* S3 day zero */
    for (let b = 6; b < 10; b++) { beatBar(b, {kv: .9}); keysBar(b); }
    whoosh(M.d0In + .05, .45);
    bell(M.bell, 1.4);
    shutter(T(8, 1.5), .5);
    sample('rubber_cancel', T(9, 0), -6, .9);
    whoosh(M.d0Out + .35, .5, 300, 4200, .55);
    /* S4 cliché: epic parody, scratch */
    impact(M.epic, .8);
    brass.triggerAttackRelease(['D3', 'A3', 'D4', 'F#4', 'A4'], M.scratch - M.epic, M.epic, .8);
    [0, 2, 2.5, 3, 3.25, 3.5, 3.75].forEach(k => timp.triggerAttackRelease('D2', .8, T(10, k), k === 0 ? 1 : .7));
    revCym(M.scratch, 2.4, .25);
    sample('arcade_bonus', M.epic + .05, 0); sample('arcade_level-up', T(10, 1), -2);
    riser(M.rocket, M.scratch, .25);
    scratch(M.scratch);
    impact(T(11, .5), 1.1);
    squeak(M.scribble, .22, 3); squeak(M.scribble + .25, .22, 4);
    crunch(M.crumple); sample('mechanical_delete', M.crumple + .1, -2); whoosh(M.crumple + .55, .45, 500, 3500, .45);
    pad.triggerAttackRelease(['A2', 'E3'], T(12) - T(11, 1), T(11, 1), .25);
    fill(T(11, 3)); beatBar(12, {noSnare: true, noBass: true}); keysBar(12, {v: .45});
    sample('arcade_purchase', M.coin1, 0); kaching(M.coin1 + .05);
    whoosh(T(13) - .05, .5, 300, 4500, .6);
    /* S5 ten people */
    for (let b = 13; b < 19; b++) { beatBar(b); keysBar(b); }
    motif(17, MOTIF2, .55);
