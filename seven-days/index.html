<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>هفت روز</title>
<style>
@font-face{font-family:Lalezar;src:url(node_modules/@fontsource/lalezar/files/lalezar-arabic-400-normal.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:Lalezar;src:url(node_modules/@fontsource/lalezar/files/lalezar-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF}
@font-face{font-family:Vazirmatn;font-weight:400;src:url(node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-400-normal.woff2) format('woff2')}
@font-face{font-family:Vazirmatn;font-weight:700;src:url(node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-700-normal.woff2) format('woff2')}
@font-face{font-family:Vazirmatn;font-weight:900;src:url(node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2) format('woff2')}
@font-face{font-family:VazirLat;font-weight:700;src:url(node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-700-normal.woff2) format('woff2')}
:root{--y:#FFC72C;--y2:#FFE08A;--n:#0A1A44;--n2:#06102C;--n3:#13295E;--w:#F5F7FF;--g:#7A86A8;--r:#FF5468;--b:#3D63FF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--n2);transform-origin:0 0;font-family:Vazirmatn,VazirLat,sans-serif;color:var(--w)}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.layer,.bg,.fg{position:absolute;inset:0}
.bg{z-index:1}.mid{position:absolute;inset:0;z-index:2}.fg{z-index:3}
.line{position:absolute;white-space:nowrap;direction:rtl;text-align:center;line-height:1.25}
.disp{font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400}
.ui{font-family:Vazirmatn,sans-serif;font-weight:900}
.w{display:inline-block;overflow:hidden;padding:.16em .07em .22em;margin:-.16em 0 -.22em;vertical-align:top}
.wi{display:inline-block}
.hl{color:var(--y)}
.mk{position:absolute;right:0;left:0;bottom:-.02em;height:.13em;border-radius:.1em;background:var(--y);transform-origin:100% 50%;transform:scaleX(0)}
.shadow{text-shadow:0 .06em 0 rgba(0,0,0,.35),0 0 .5em rgba(0,0,0,.35)}
/* avatar */
.av{position:absolute;width:var(--s);height:calc(var(--s)*1.55)}
.av .bd{position:absolute;left:8%;right:8%;bottom:0;height:52%;border-radius:45% 45% 12% 12%;background:var(--c)}
.av .hd{position:absolute;left:18%;right:18%;top:0;height:42%;border-radius:50%;background:var(--sk)}
.av .hr{position:absolute;left:-4%;right:-4%;top:-6%;height:46%;border-radius:50% 50% 30% 30%;background:var(--hc)}
.av .e{position:absolute;top:50%;width:11%;height:13%;border-radius:50%;background:#1B1F2E}
.av .e1{right:28%}.av .e2{left:28%}
.av svg.mo{position:absolute;left:30%;width:40%;top:66%;height:20%;overflow:visible}
.av svg.mo path{fill:none;stroke:#1B1F2E;stroke-width:4;stroke-linecap:round}
/* phone */
.phone{position:absolute;width:470px;height:940px;border-radius:72px;background:#0E1220;box-shadow:0 0 0 3px #2A3150,0 40px 120px rgba(0,0,0,.6),0 0 160px rgba(61,99,255,.25)}
.phone .scr{position:absolute;inset:16px;border-radius:58px;overflow:hidden;background:radial-gradient(120% 80% at 50% 10%,#2A4AA8 0%,#13295E 45%,#081536 100%)}
.phone .isl{position:absolute;top:22px;left:50%;width:130px;height:36px;margin-left:-65px;border-radius:20px;background:#000}
.phone .tm{position:absolute;top:130px;width:100%;text-align:center;font:900 120px Vazirmatn;color:rgba(255,255,255,.92)}
.phone .dt{position:absolute;top:290px;width:100%;text-align:center;font:700 30px Vazirmatn;color:rgba(255,255,255,.7)}
.phone .ban{position:absolute;top:24px;left:22px;right:22px;height:132px;border-radius:34px;background:rgba(245,247,255,.96);color:#0A1A44;display:flex;align-items:center;gap:20px;padding:0 24px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.phone .ban .ic{flex:none;width:76px;height:76px;border-radius:22px;background:var(--y);display:grid;place-items:center;font:400 46px Lalezar;color:#0A1A44}
.phone .ban b{display:block;font:900 30px Vazirmatn}
.phone .ban span{display:block;font:700 27px Vazirmatn;color:#2B3A66}
.phone .ban em{font-style:normal;color:#0B8A4A;font-weight:900}
.crack{position:absolute;inset:16px;border-radius:58px;pointer-events:none}
.ring{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:5px solid var(--y);opacity:0}
/* hud */
#hud{position:absolute;z-index:20;top:46px;right:56px;height:96px;padding:0 30px 0 26px;border-radius:48px;background:rgba(6,16,44,.82);box-shadow:0 0 0 3px rgba(255,199,44,.85),0 10px 40px rgba(0,0,0,.4);display:flex;align-items:center;gap:20px;opacity:0}
#hud .lb{font:400 50px Lalezar;color:var(--w)}
#hud .dg{position:relative;width:58px;height:84px;overflow:hidden}
#hud .col{position:absolute;right:0;top:0;width:58px}
#hud .col div{height:84px;line-height:84px;text-align:center;font:400 80px Lalezar;color:var(--y)}
#hud .of{font:700 30px Vazirmatn;color:var(--g)}
#hud .dots{display:flex;gap:9px}
#hud .dot{width:16px;height:16px;border-radius:50%;background:#2A3A6B}
/* wipe */
#wipe{position:absolute;z-index:30;top:-100px;bottom:-100px;width:2600px;left:-340px;background:var(--y);transform:translateX(2600px) skewX(-14deg);display:grid;place-items:center}
#wipe .wt{font:400 260px Lalezar;color:var(--n);transform:skewX(14deg)}
#flash{position:absolute;inset:0;z-index:40;background:#fff;opacity:0}
#scan{position:absolute;inset:0;z-index:45;opacity:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 5px)}
#grain{position:absolute;inset:-64px;z-index:50;opacity:.07;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;z-index:49;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,10,.55) 100%)}
.chip{position:absolute;padding:8px 26px;border-radius:40px;font:900 34px Vazirmatn;white-space:nowrap}
.card{position:absolute;width:290px;height:330px;border-radius:34px;background:#1A3170;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.bubble{position:absolute;padding:14px 30px;border-radius:30px;font:900 34px Vazirmatn;white-space:nowrap}
.tile{position:absolute;width:150px;height:80px;border-radius:20px;background:rgba(245,247,255,.95);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--n)}
.tile i{flex:none;width:40px;height:40px;border-radius:12px;background:var(--y);display:grid;place-items:center;font:400 30px Lalezar;font-style:normal}
.tile span{font:900 18px Vazirmatn;line-height:1.2}
.face{position:absolute;width:360px;height:360px;left:-180px;top:-180px;border-radius:24px;backface-visibility:visible;display:grid;place-items:center;font:400 120px Lalezar;color:rgba(255,255,255,.35)}
</style>
</head>
<body>
<div id="stage"><div id="cam"></div>
<div id="hud"><div class="lb">روز</div><div class="dg"><div class="col"></div></div><div class="of">از ۷</div><div class="dots"></div></div>
<div id="wipe"><div class="wt"></div></div>
<div id="flash"></div><div id="scan"></div><div id="vig"></div><canvas id="grain" width="1048" height="1208"></canvas>
</div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script src="timeline.js"></script>
<script>
const {T, M, SCENES, DURATION, BEAT, NO_TIMES} = TL;
const FA = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const stage = document.getElementById('stage'), cam = document.getElementById('cam');
const tl = gsap.timeline({paused: true});
gsap.defaults({overwrite: false});
function h(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function add(parent, html, css) { const e = h(html); if (css) Object.assign(e.style, css); parent.appendChild(e); return e; }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

/* ---------- scenes ---------- */
function scene(id) {
  const root = add(cam, `<div class="layer" id="${id}"></div>`);
  const bg = add(root, '<div class="bg"></div>'), mid = add(root, '<div class="mid"></div>'), fg = add(root, '<div class="fg"></div>');
  const [a, b] = SCENES[id];
  gsap.set(root, {autoAlpha: a === 0 ? 1 : 0});
  if (a > 0) tl.set(root, {autoAlpha: 1}, a);
  tl.set(root, {autoAlpha: 0}, b);
  return {root, bg, mid, fg, a, b};
}
/* persistent layer (between scene bg and fg) */
const persist = add(cam, '<div class="layer" style="z-index:5;pointer-events:none"></div>');
const topL = add(cam, '<div class="layer" style="z-index:8;pointer-events:none"></div>');

/* ---------- kinetic text ---------- */
function line(parent, text, o) {
  o = Object.assign({x: 960, y: 540, size: 110, font: 'disp', color: 'var(--w)', hl: [], mk: false, shadow: true}, o);
  const words = text.split(' ');
  const e = add(parent, `<div class="line ${o.font}${o.shadow ? ' shadow' : ''}"></div>`, {left: o.x + 'px', top: o.y + 'px', fontSize: o.size + 'px', color: o.color});
  words.forEach((w, i) => {
    const hl = o.hl.includes(i) || o.hl.includes(w);
    e.appendChild(h(`<span class="w"><span class="wi${hl ? ' hl' : ''}">${w}</span></span>`));
    if (i < words.length - 1) e.appendChild(document.createTextNode(' '));
  });
  if (o.mk) e.appendChild(h('<div class="mk"></div>'));
  gsap.set(e, {xPercent: -50, yPercent: -50, autoAlpha: 0});
  return e;
}
function inLine(e, t, o = {}) {
  const wis = e.querySelectorAll('.wi');
  tl.set(e, {autoAlpha: 1, y: 0, scale: 1, filter: 'blur(0px)'}, t);
  if (o.slam) {
    tl.fromTo(e, {scale: o.from || 2.6, filter: 'blur(14px)'}, {scale: 1, filter: 'blur(0px)', duration: .42, ease: 'expo.out', immediateRender: false}, t);
    tl.fromTo(wis, {yPercent: 0}, {yPercent: 0, duration: .01, immediateRender: false}, t);
    shake(t, o.amp || 18, .45);
  } else {
    tl.fromTo(wis, {yPercent: 115, rotate: 5}, {yPercent: 0, rotate: 0, duration: .55, ease: 'expo.out', stagger: o.stagger || .07, immediateRender: false}, t);
  }
  const mk = e.querySelector('.mk');
  if (mk) tl.fromTo(mk, {scaleX: 0}, {scaleX: 1, duration: .45, ease: 'power3.out', immediateRender: false}, t + (o.mkDelay || .35));
  return e;
}
function outLine(e, t, o = {}) {
  tl.to(e, {autoAlpha: 0, y: o.dy ?? -50, scale: o.scale ?? 1, filter: 'blur(10px)', duration: o.d || .24, ease: 'power2.in'}, t);
}
function say(parent, text, t, tout, o = {}) { const e = line(parent, text, o); inLine(e, t, o); if (tout) outLine(e, tout, o); return e; }

/* ---------- global fx registries ---------- */
const shakes = [], glitches = [], fxFns = [];
function shake(t, amp, dur = .5) { shakes.push([t, amp, dur]); }
function glitch(t, dur, amp = 1) { glitches.push([t, dur, amp]); }
function flash(t, color = '#fff', a = .85, d = .35) { tl.fromTo('#flash', {opacity: a, background: color}, {opacity: 0, duration: d, ease: 'power2.out', immediateRender: false}, t); }
function wipe(t, label) {
  tl.set('#wipe .wt', {textContent: label}, t);
  tl.fromTo('#wipe', {x: 2600}, {x: -2700, duration: .62, ease: 'power3.inOut', immediateRender: false}, t);
}

/* ---------- avatar ---------- */
const SKIN = ['#F2C9A0', '#E0A982', '#C68B66', '#F6D5B5', '#D9A17A'], HAIR = ['#2B1D14', '#4A2F1F', '#1B1B22', '#6B4426', '#24180F'];
const BODY = ['#3D63FF', '#5A78D6', '#2E4BA8', '#7C8FD0', '#4B5FA0', '#6C7FB8'];
const MOUTH = {smile: 'M4 4 Q20 20 36 4', flat: 'M6 11 L34 11', frown: 'M4 17 Q20 3 36 17', open: 'M8 6 Q20 22 32 6 Z'};
function avatar(parent, i, size, x, y, o = {}) {
  const c = o.c || BODY[i % BODY.length], sk = SKIN[(i * 3) % SKIN.length], hc = HAIR[(i * 2) % HAIR.length];
  const e = add(parent, `<div class="av" style="--s:${size}px;--c:${c};--sk:${sk};--hc:${hc}"><div class="bd"></div><div class="hd"><div class="hr"></div><i class="e e1"></i><i class="e e2"></i><svg class="mo" viewBox="0 0 40 20"><path d="${MOUTH[o.mouth || 'flat']}"/></svg></div></div>`, {left: x + 'px', top: y + 'px'});
  e.querySelector('.hr').style.height = (30 + (i * 7) % 22) + '%';
  gsap.set(e, {xPercent: -50, yPercent: -100});
  return e;
}
function mouth(av, t, m) { tl.set(av.querySelector('path'), {attr: {d: MOUTH[m]}}, t); }

/* ---------- HUD ---------- */
const hud = document.getElementById('hud'), col = hud.querySelector('.col'), dots = hud.querySelector('.dots');
for (let i = 0; i <= 7; i++) col.appendChild(h(`<div>${FA(i)}</div>`));
const dotEls = []; for (let i = 0; i < 7; i++) dotEls.push(dots.appendChild(h('<div class="dot"></div>')));
function day(t, n) {
  tl.to(col, {y: -84 * n, duration: .5, ease: 'back.out(2.2)'}, t);
  tl.fromTo(hud, {scale: 1.18}, {scale: 1, duration: .5, ease: 'elastic.out(1,.5)', immediateRender: false}, t);
  for (let i = 0; i < n; i++) tl.to(dotEls[i], {backgroundColor: '#FFC72C', duration: .2}, t + i * .03);
}

/* ---------- phone (persistent actor) ---------- */
const phoneWrap = add(persist, '<div style="position:absolute;left:640px;top:540px;width:0;height:0"></div>');
const phone = add(phoneWrap, `<div class="phone" style="left:-235px;top:-470px"><div class="scr"><div class="tm">۱۰:۴۵</div><div class="dt">شنبه</div><div class="ban"><div class="ic">ت</div><div><b>بانک · همین الان</b><span>واریز شد: <em>+۸۰٬۰۰۰ تومان</em></span></div></div></div><div class="isl"></div>
<svg class="crack" viewBox="0 0 438 908"><g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.2" stroke-linecap="round"><path d="M330 700 L290 640 L250 655 L205 590"/><path d="M330 700 L380 650 L430 668"/><path d="M330 700 L345 780 L320 860 L338 908"/><path d="M330 700 L265 745 L215 735 L150 790"/><path d="M330 700 L400 760 L438 755"/><path d="M290 640 L300 585"/><path d="M265 745 L270 800"/></g><circle cx="330" cy="700" r="9" fill="rgba(255,255,255,.35)"/></svg></div>`);
const ban = phone.querySelector('.ban');
gsap.set(phoneWrap, {autoAlpha: 0});
const rings = [0, 1, 2].map(() => add(persist, '<div class="ring"></div>', {left: '640px', top: '330px'}));
function ding(t) {
  tl.fromTo(ban, {y: -190, scale: .9}, {y: 0, scale: 1, duration: .6, ease: 'back.out(1.8)', immediateRender: false}, t);
  tl.fromTo(phone, {rotate: 0}, {keyframes: {rotate: [0, -3, 3, -2.5, 2.5, -1.5, 1.5, 0]}, duration: .45, ease: 'none', immediateRender: false}, t);
  rings.forEach((r, i) => tl.fromTo(r, {scale: .3, opacity: .9}, {scale: 2.6, opacity: 0, duration: 1.1, ease: 'power2.out', immediateRender: false}, t + i * .16));
  tl.fromTo(phone.querySelector('.scr'), {filter: 'brightness(1.6)'}, {filter: 'brightness(1)', duration: .8, immediateRender: false}, t);
}

/* ---------- intro ---------- */
(() => {
  const s = scene('s0');
  add(s.bg, '<div style="position:absolute;inset:0;background:radial-gradient(80% 90% at 50% 45%,#16307A 0%,#0A1A44 45%,#040A1E 100%)"></div>');
  const streak = add(s.bg, '<div style="position:absolute;left:-300px;top:380px;width:900px;height:240px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,199,44,.55),transparent);filter:blur(30px)"></div>');
  tl.fromTo(streak, {x: -200}, {x: 1700, duration: 5.2, ease: 'none', immediateRender: false}, 0);
  const seven = add(s.bg, '<div style="position:absolute;left:960px;top:560px;font:400 1100px Lalezar;color:transparent;-webkit-text-stroke:4px rgba(255,199,44,.22);line-height:1">۷</div>');
  gsap.set(seven, {xPercent: -50, yPercent: -50});
  tl.fromTo(seven, {scale: 1.25, rotate: -6}, {scale: 1, rotate: 0, duration: 5, ease: 'power1.out', immediateRender: false}, 0);
  const dust = []; const R = rng(7);
  for (let i = 0; i < 46; i++) dust.push([add(s.bg, '<i style="position:absolute;width:6px;height:6px;border-radius:50%;background:#FFE08A"></i>'), R() * 1920, R() * 1080, .3 + R() * .9, R() * 6.28, 2 + R() * 5]);
  fxFns.push(t => { if (t > SCENES.s0[1]) return; dust.forEach(([e, x, y, sp, ph, sz]) => { e.style.transform = `translate(${x + Math.sin(t * sp + ph) * 40}px,${y - t * 30 * sp}px) scale(${sz / 6})`; e.style.opacity = .25 + .35 * Math.sin(t * 2 + ph) ** 2; }); });
  const bar = add(s.fg, '<div style="position:absolute;left:560px;top:590px;width:800px;height:8px;border-radius:4px;background:var(--y);transform-origin:50% 50%"></div>');
  gsap.set(bar, {scaleX: .18});
  tl.fromTo(bar, {scaleX: .18}, {scaleX: 1, duration: .9, ease: 'expo.inOut', immediateRender: false}, 0);
  const name = line(s.fg, 'گروه دبیرستان‌های دانشمند', {y: 470, size: 132});
  inLine(name, M.introName, {stagger: .12});
  const sheen = add(name, '<div style="position:absolute;inset:-10% -5%;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%);mix-blend-mode:overlay"></div>');
  tl.fromTo(sheen, {xPercent: 120}, {xPercent: -120, duration: 1.1, ease: 'power2.inOut', immediateRender: false}, M.introName + .6);
  const pres = line(s.fg, 'تقدیم می‌کند', {y: 680, size: 64, font: 'ui', color: 'var(--y)'});
  inLine(pres, M.introPresents);
  const grp = [name, pres, bar];
  tl.to(grp, {scale: 5, autoAlpha: 0, filter: 'blur(20px)', duration: .55, ease: 'power3.in'}, M.introOut);
  tl.to(seven, {scale: 3, autoAlpha: 0, duration: .6, ease: 'power3.in'}, M.introOut);
})();

/* ---------- S1 hook ---------- */
(() => {
  const s = scene('s1');
  add(s.bg, '<div style="position:absolute;inset:0;background:radial-gradient(50% 70% at 33% 50%,#0F2160 0%,#050B1F 60%,#02040C 100%)"></div>');
  tl.set(phoneWrap, {autoAlpha: 1}, M.phoneIn);
  tl.fromTo(phoneWrap, {scale: .82, y: 60, autoAlpha: 0}, {scale: 1, y: 0, autoAlpha: 1, duration: .9, ease: 'expo.out', immediateRender: false}, M.phoneIn);
  tl.set(ban, {y: -190}, M.phoneIn);
  ding(M.ding1);
  const a = say(s.fg, 'این صدا…', T(2, 3), T(4, 1), {x: 1340, y: 420, size: 150});
  const b = say(s.fg, 'هفت روز پیش وجود نداشت.', T(3, 2), T(4, 1), {x: 1340, y: 600, size: 92, hl: [0, 1]});
  /* rewind */
  glitch(M.rewind, 1.9, 1);
  const rw = add(s.fg, '<div style="position:absolute;left:1340px;top:520px;text-align:center"><div style="font:400 72px Lalezar;color:var(--w);opacity:.85">◀◀ عقب‌گرد</div><div class="rwn" style="font:400 300px Lalezar;color:var(--y);line-height:1">۶</div></div>');
  gsap.set(rw, {xPercent: -50, yPercent: -50, autoAlpha: 0});
  tl.set(rw, {autoAlpha: 1}, M.rewind + .15);
  const rwn = rw.querySelector('.rwn');
  for (let i = 0; i < 7; i++) tl.set(rwn, {textContent: FA(6 - i)}, M.rewind + .15 + i * .22);
  tl.fromTo(rw, {scale: .9}, {scale: 1.05, duration: 1.7, ease: 'none', immediateRender: false}, M.rewind + .15);
  tl.to(phoneWrap, {rotate: -360, scale: .7, duration: 1.6, ease: 'power2.in'}, M.rewind + .1);
  tl.to(rw, {scale: 4, autoAlpha: 0, filter: 'blur(16px)', duration: .35, ease: 'power3.in'}, T(5) - .38);
  tl.to(phoneWrap, {scale: 6, autoAlpha: 0, duration: .38, ease: 'power3.in'}, T(5) - .38);
  tl.set(phoneWrap, {rotate: 0, scale: 1, y: 0}, T(5));
})();

/* ---------- S2 title drop ---------- */
(() => {
  const s = scene('s2');
  add(s.bg, '<div style="position:absolute;inset:0;background:radial-gradient(70% 80% at 50% 50%,#1B3A93 0%,#0A1A44 55%,#040A1E 100%)"></div>');

function msg(t, text, mine, style = '') {

  const b = add(mcol, `<div class="bubble" style="top:${y}px;${mine ? 'right:30px;background:var(--y);color:var(--n)' : 'left:30px;background:#26386E;color:var(--w)'};${style}">${text}</div>`);

  fxFns.push(t => { const k = t - M.gold; sp.forEach(([e, a, d, z]) => { if (k < 0 || k > 1.6) { e.style.opacity = 0; return; } const p = 1 - (1 - k / 1.6) ** 3; e.style.opacity = 1 - k / 1.6; e.style.transform = `translate(${960 + Math.cos(a) * d * p}px,${500 + Math.sin(a) * d * p}px) scale(${z * 2})`; }); });

})();

/* ---------- S11 end card ---------- */
(() => {
  const s = scene('s11');
  add(s.bg, '<div style="position:absolute;inset:0;background:radial-gradient(90% 90% at 70% 20%,#1B3A93 0%,#0A1A44 50%,#050D28 100%)"></div>');
  const st = add(s.bg, '<div style="position:absolute;inset:-200px;background:repeating-linear-gradient(-30deg,rgba(255,255,255,.03) 0 40px,transparent 40px 120px)"></div>');
  tl.fromTo(st, {x: 0}, {x: -240, duration: 8, ease: 'none', immediateRender: false}, M.end1);
  const grp = add(s.fg, '<div style="position:absolute;inset:0"></div>');
  tl.fromTo(grp, {scale: 1}, {scale: 1.04, duration: 8, ease: 'none', transformOrigin: '50% 50%', immediateRender: false}, M.end1);
  flash(M.end1, '#FFE08A', .6, .35);
  say(grp, 'هفت روز.', M.end1, null, {y: 230, size: 230, color: 'var(--y)', slam: true, amp: 24});
  say(grp, 'بدون سرمایه.', M.end2, null, {y: 440, size: 130, slam: true, amp: 12, from: 1.8});
  say(grp, 'بدون اجازه.', M.end3, null, {y: 600, size: 130, slam: true, amp: 12, from: 1.8});
  const card = add(grp, '<div style="position:absolute;left:960px;top:830px;padding:22px 60px;border-radius:40px;background:var(--y);color:var(--n);text-align:center;white-space:nowrap;box-shadow:0 20px 60px rgba(0,0,0,.4)"><div style="font:900 40px Vazirmatn">با مهدی مشکانی</div><div style="font:400 64px Lalezar">دوشنبه · ساعت ۱۳ الی ۱۴:۳۰ · دبیرستان دانشمند</div></div>');
  gsap.set(card, {xPercent: -50, yPercent: -50, autoAlpha: 0});
  tl.fromTo(card, {autoAlpha: 1, y: 200, scale: .8}, {y: 0, scale: 1, duration: .6, ease: 'back.out(1.8)', immediateRender: false}, M.endInfo);
  say(grp, 'شاید ایده بعدی همین‌جا شکل بگیرد…', M.endTag, null, {y: 990, size: 44, font: 'ui', color: 'rgba(245,247,255,.85)'});
  add(s.fg, '<div style="position:absolute;left:40px;bottom:28px;font:700 22px Vazirmatn;color:rgba(245,247,255,.45)">روایت نمایشی</div>');
  tl.to('#stage', {}, DURATION);
  tl.fromTo(cam, {opacity: 1}, {opacity: 0, duration: .5, immediateRender: false}, DURATION - .5);
})();

/* ---------- transitions: whoosh-blur between scenes ---------- */
[SCENES.s5[1], SCENES.s9[1], SCENES.s10[1]].forEach(t => glitch(t - .05, .18, .5));

/* ---------- ambient life: floating light motes on every scene ---------- */
const amb = add(cam, '<div class="layer" style="z-index:4;pointer-events:none"></div>');
const motes = []; { const R = rng(99); for (let i = 0; i < 34; i++) { const sz = 8 + R() * 34; motes.push([add(amb, `<i style="position:absolute;left:0;top:0;width:${sz}px;height:${sz}px;border-radius:50%;background:${R() < .6 ? '#FFC72C' : '#FFFFFF'};filter:blur(${2 + sz / 8}px)"></i>`), R() * 1920, R() * 1080, 35 + R() * 70, R() * 6.283, .12 + R() * .22]); } }
fxFns.push(t => motes.forEach(([e, x, y, sp, ph, al]) => { const yy = ((y - t * sp) % 1180 + 1180) % 1180 - 50; e.style.transform = `translate(${x + Math.sin(t * .7 + ph) * 60}px,${yy}px)`; e.style.opacity = al * (.6 + .4 * Math.sin(t * 1.3 + ph)); }));
const DRUMS = [[TL.T(5), TL.T(10)], [TL.T(12), TL.T(26, 3)], [TL.T(28), TL.T(46)]];
const SC = Object.values(SCENES);
/* ---------- grain ---------- */
const gc = document.getElementById('grain'), gx = gc.getContext('2d'), gimg = gx.createImageData(gc.width, gc.height), GR = rng(42);
for (let i = 0; i < gimg.data.length; i += 4) { const v = GR() * 255; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255; }
gx.putImageData(gimg, 0, 0);

/* ---------- per-frame deterministic fx ---------- */
const scan = document.getElementById('scan');
function fx(t) {
  let dx = 0, dy = 0, rot = 0;
  for (const [t0, a, d] of shakes) { const k = t - t0; if (k < 0 || k > d) continue; const e = a * (1 - k / d) ** 2; dx += e * Math.sin(k * 71 + t0); dy += e * Math.cos(k * 63 + t0 * 2); rot += e * .02 * Math.sin(k * 40); }
  let g = 0; for (const [t0, d, a] of glitches) { const k = t - t0; if (k >= 0 && k <= d) g = Math.max(g, a); }
  const f = Math.floor(t * 30);
  if (g > 0) { const o = (hash(f) - .5) * 26 * g, o2 = (hash(f + 7) - .5) * 26 * g; dx += (hash(f + 3) - .5) * 30 * g; cam.style.filter = `drop-shadow(${o}px 0 0 rgba(255,40,90,.75)) drop-shadow(${o2}px 0 0 rgba(0,220,255,.75))`; scan.style.opacity = .9 * g; }
  else { cam.style.filter = 'none'; scan.style.opacity = 0; }
  let z = 1.025; const sc = SC.find(([a, b]) => t >= a && t < b); if (sc) z += .055 * (t - sc[0]) / (sc[1] - sc[0]);
  if (DRUMS.some(([a, b]) => t >= a && t < b)) { const ph = (t / BEAT) % 1, bi = Math.floor(t / BEAT) % 4; z *= 1 + (bi === 0 || bi === 2 ? .016 : .008) * Math.exp(-ph * 6); }
  else if (t >= TL.T(2) && t < M.rewind) { const ph = (t / (BEAT * 2)) % 1; z *= 1 + .01 * (Math.exp(-ph * 9) + Math.exp(-Math.max(0, ph - .2) * 9) * (ph > .2)); }
  dx += Math.sin(t * .55) * 12; dy += Math.sin(t * .43 + 1) * 8;
  cam.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg) scale(${z})`;
  gc.style.transform = `translate(${-Math.floor(hash(f + 1) * 64)}px,${-Math.floor(hash(f + 2) * 64)}px)`;
  fxFns.forEach(fn => fn(t));
}
window.DURATION = DURATION;
window.seek = t => { tl.seek(t, false); fx(t); };
window.ready = document.fonts.ready.then(() => { window.seek(0); return true; });
if (location.search.includes('play')) {
  const sc = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${sc})`;
  const au = new Audio('out/mix.wav'); let t0 = null;
  addEventListener('click', () => { au.currentTime = 0; au.play(); t0 = performance.now(); });
  (function loop() { if (t0 !== null) window.seek(Math.min(DURATION, (performance.now() - t0) / 1000)); requestAnimationFrame(loop); })();
}
if (location.search.includes('t=')) { const tt = parseFloat(new URLSearchParams(location.search).get('t')); window.ready.then(() => window.seek(tt)); }
</script>
</body>
