<!-- Glass engine (STORY_SPEC §8.0): Apple-keynote product sting turned into a vertical news reel. Soft white,
     bright blue, frosted glass. Eight shots: header in a light app window + cursor click → app icon with four
     squares orbiting into a cross (hard cut on the drop) → icon collapses into a menu bar, a frosted prompt box
     springs out and types → whip-tilt into an answer page scrolling into place → a card rises → two stacked cards
     with giant frosted-glass titles → the lone logo disc → black end card with a glowing wordmark.
     Every value is a pure function of the frame number (kf tables, seeded hashes, no timers, no Math.random).
     Each shot has a nominal frame length N (29.97 fps) and a stretch range where extra narration time is absorbed,
     so the designed timing of entries and exits never changes. Prompt reference: user, 2026-10-23.
     Data: story.json {glass:{...}, beats[{id, text, shot}]} + timeline.json. -->

<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute"><defs id="fdefs"></defs></svg>
  <div id="shots"></div>
  <svg id="cursor" viewBox="0 0 26 38"><path d="M2.5 2.5 L2.5 30 L9.4 23.6 L14 34.6 L18.6 32.6 L14.1 21.9 L23.4 21.9 Z" fill="#0c0c0c" stroke="#fff" stroke-width="2.3" stroke-linejoin="round"/></svg>
  <div id="cap"><div></div></div>
</div>
<script src="/logo-motion/node_modules/gsap/dist/gsap.min.js"></script>
<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/glass/';
const url = s => s.startsWith('/') ? s : DIR + s;
const $ = id => document.getElementById(id);
const FPS = 29.97, OY = 420;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const E = {o: gsap.parseEase('expo.out'), io: gsap.parseEase('expo.inOut'), i: gsap.parseEase('power3.in'), i4: gsap.parseEase('power4.in'), s: gsap.parseEase('sine.inOut'), lin: x => x,
           b: gsap.parseEase('back.out(1.25)')};
// keyframe table lookup, continuous in the frame number; ease applies inside each segment
function kf(f, T, ease = E.lin) { if (f <= T[0][0]) return T[0][1]; for (let i = 1; i < T.length; i++) if (f <= T[i][0]) { const [a, va] = T[i - 1], [b, vb] = T[i]; return lerp(va, vb, ease((f - a) / (b - a))); } return T[T.length - 1][1]; }
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
function h(tag, cls, style, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; if (html !== undefined) e.innerHTML = html; return e; }
const ISSUES = [], ICON = {};
async function icon(n, sw = 2) { if (!ICON[n]) { const r = await fetch(`/logo-motion/node_modules/lucide-static/icons/${n}.svg`); ICON[n] = r.ok ? await r.text() : (ISSUES.push('icon missing: ' + n), '<svg viewBox="0 0 24 24"></svg>'); } return ICON[n].replace(/stroke-width="2"/, `stroke-width="${sw}"`); }
// directional blur: one SVG filter per element, stdDeviation set per frame (round blur uses CSS blur)
let FID = 0;
function dfilter(el) { const id = 'df' + (FID++), d = $('fdefs'); d.insertAdjacentHTML('beforeend', `<filter id="${id}" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>`); el._g = d.lastElementChild.firstElementChild; el._fid = id; }
function blur(el, x, y = x, round = false) {
  if (x < .05 && y < .05) { el.style.filter = ''; return; }
  if (round || Math.abs(x - y) < .01) { el.style.filter = `blur(${x}px)`; return; }
  if (!el._g) dfilter(el); el._g.setAttribute('stdDeviation', `${x.toFixed(2)} ${y.toFixed(2)}`); el.style.filter = `url(#${el._fid})`;
}
const DRAWN = c => `<svg viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><path d="M14 22h36l-3 30H17z"/><path d="M24 22v-4a8 8 0 0 1 16 0v4"/><path d="M38 33l2.2 4.8 4.8 2.2-4.8 2.2L38 47l-2.2-4.8L31 40l4.8-2.2z" fill="${c}" stroke-width="2"/></svg>`;
// the mark is a topic slot: the real logo file (glass.logo) when the story names a brand, never redrawn (user rule 2026-10-23)
const MARK = c => S && S.glass && S.glass.logo ? `<img class="logo" src="${url(S.glass.logo)}">` : DRAWN(c);
const CHIPS = a => (a || []).length ? `<div class="chips">${a.map(x => `<span class="chip"><img src="${url(x.src)}"><b>${esc(x.label || '')}</b></span>`).join('')}</div>` : '';

// ---------- cursor (shared by S1, S3, S4) ----------
const CUR = $('cursor');
function cursor(x, y, rot = 0, sc = 1, on = true) { CUR.style.display = on ? 'block' : 'none'; if (on) CUR.style.transform = `translate(${x - 3}px, ${y - 3}px) rotate(${rot}deg) scale(${sc * 1.25})`; }

// ---------- shots ----------
const SH = {};
const LX = 250, LX1 = 1010;   // lockup span on the vertical stage (keeps the pill on screen)
SH.header = {N: 72, stretch: [24, 46], async build(sc, S) {
  const G = S.glass || {};
  sc.append(h('div', '', '', ''));
  const bg = h('div', '', 'position:absolute;inset:0'); sc.append(bg);
  const cam = h('div', 'cam'); sc.append(cam);
  const win = h('div', 'win', '', `<div class="band"></div><div class="search">${await icon('search')}<span>${esc(G.search || 'جست‌وجو')}</span></div>
    <div class="col"><div>${await icon((G.col_icons || [])[0] || 'shopping-bag')}</div><div style="opacity:.45">${await icon((G.col_icons || [])[1] || 'message-circle')}</div></div>
    <div class="pcard"><img src="${url(G.hero)}"><b>${esc(G.card_title || '')}</b><i>${esc(G.card_sub || '')}</i></div>`);
  cam.append(win);
  const ring = h('div', 'ring'); cam.append(ring);
  const lock = h('div', 'lock', '', `<div class="disc">${MARK('#1E2F52')}</div><div class="nm">${esc(G.product || 'Agent Gateway')}</div><div class="pill">${esc(G.pill || 'Walmart')}</div>`); cam.append(lock);
  return {bg, cam, win, ring, lock, nm: lock.children[1], pill: lock.children[2], disc: lock.children[0]};
}, layout(o) {   // fonts are loaded: fit the lockup into x474–1063
  const w = o.lock.scrollWidth; o.ls = Math.min(1.25, (LX1 - LX) / w); o.lw = w;
}, render(n, o, r) {
  const hz = clamp(n / 28); o.bg.style.background = `radial-gradient(1100px 900px at 60% 40%, rgba(183,207,235,${(1 - E.s(hz)) * .95}), rgba(253,253,251,0) 75%), radial-gradient(1400px 520px at 50% 108%, #DBEEFD, rgba(219,238,253,0) 70%), #FDFDFB`;
  const cy = (n <= 37 ? kf(n, [[0, 932], [2, 776], [5, 683], [10, 608], [24, 546], [37, 536]]) : 536 - (n - 37)) + 190 - r * 4;
  const s = o.ls; o.lock.style.transform = `translate(${LX}px, ${cy}px) translateY(-50%) scale(${s})`;
  o.nm.style.opacity = clamp((n - 2) / 2); blur(o.nm, kf(n, [[2, 14], [6, 3], [9, 0]]));
  o.pill.style.opacity = clamp((n - 4) / 1.5); o.pill.style.transform = `translateX(${kf(n, [[4, 15], [12, 0]], E.o)}px)`; blur(o.pill, kf(n, [[4, 22], [6, 9], [11, 0]]));
  o.disc.style.opacity = clamp(n / 2); blur(o.disc, kf(n, [[0, 16], [5, 2], [8, 0]]), kf(n, [[0, 30], [5, 4], [8, 0]]));   // rises out of the haze: vertical smear
  o.win.style.opacity = kf(n, [[0, 0], [14, 0], [15, .53], [19, .7], [24, 1]]); o.win.style.transform = `translateY(${kf(n, [[14, 40], [26, 0]], E.o) - r * 2}px)`;
  // disc centre on stage (for the cursor and the ring)
  const dcx = LX + 66 * s, dcy = cy; o.ring.style.left = dcx + 'px'; o.ring.style.top = dcy + 'px';
  const rk = E.o(clamp((n - 53) / 8)); o.ring.style.opacity = rk; o.ring.style.transform = `scale(${lerp(.75, 1, rk) * s})`;
  // camera zoom about the centre
  const z = n <= 61 ? kf(n, [[0, 1], [46, 1], [60, 1.2]], E.s) : kf(n, [[61, 1.2], [71, 1.04]], E.i);
  o.cam.style.transform = `scale(${z})`;
  // cursor path in square coords → stage; the cursor lives outside the camera, so map through the same zoom
  if (n >= 27) {
    let x, y, rot = 0;
    // glide in from the upper right, decelerating; turn to face the dive; land on the disc's lower right
    const tx = dcx + 46 * s, ty = dcy + 30 * s;
    if (n <= 44) { const k = E.o((n - 27) / 17); x = lerp(960, 820, k); y = lerp(cy - 160, cy - 170, k); }
    else { x = kf(n, [[44, 820], [56, tx + 40], [59, tx + 14], [71, tx - 4]], E.s); y = kf(n, [[44, cy - 170], [50, cy - 70], [56, ty + 18], [59, ty + 6], [71, ty - 4]], E.s); }
