<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>meshkani.pro — animated business explainer (prompt 012)</title>
<!-- Skill motion-graphy-2026, prompt 012 "Animated business explainer" (EXPL), built as its own engine.
     Look from the prompt: five-part explainer (the customer's problem, what it is, how it works in three steps, one
     proof point, the name at the end), bold type, brand colours, smooth transitions where each scene is MADE OUT OF the
     last one (here: the money tag / green card morphs into the next scene's main card), spring + exponential easing,
     something on every beat (120 BPM). Banned (kept): particle bursts, glows, lens flares, camera shake, RGB split,
     crossfades, generic gradients, bouncy easing, holds longer than half a second, template looks.
     Allowed edits: 1920x1080 → 1080x1920, 30 s → the voiced length, the business → the story's subject, the soundtrack →
     page-standard music bed + motion-matched SFX cues, the opening → the real photo hook (RUNBOOK §4.0 rule 4).
     Data: story.json beats[{id, text, scene{type, img}}]; raw/sNN.png photos; el/logo_<brand>.png real logo.
     Scene types: hook, who, before, now, steps, proof, avg, cap, twist, ask (+ end). -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --cr: #F6F1E7; --ink: #121212; --g: #12A150; --gl: #D9F5E3; --vi: #6C5CE7; --mu: #7C766B; --rd: #E5483B; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--cr); }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: V; font-weight: 900; color: var(--ink); }
  #cam, #st, #mo, #cap { position: absolute; inset: 0; }
  #cam { transform-origin: 0 0; }
  .a { position: absolute; }
  .row { display: flex; align-items: center; }
  .m { overflow: hidden; display: inline-block; vertical-align: bottom; }
</style>
</head>
<body>
<div id="root"><div id="cam"><div id="st"></div></div><div id="mo"></div><div id="cap"></div></div>
<script>
const P = new URLSearchParams(location.search), D = P.get('dir') || '/work/story/';
const U = f => f.startsWith('/') ? f : D + f, $ = id => document.getElementById(id);
const K = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), L = (a, b, k) => a + (b - a) * k;
const T = (t, a, b) => K((t - a) / (b - a));
// closed-form spring (no bouncy easing: damping kept high) and exponential ease-out
const sp = (t, t0, w = 15, z = .72) => { const u = t - t0; if (u <= 0) return 0; const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + z * w / wd * Math.sin(wd * u)); };
const ex = k => 1 - Math.pow(2, -10 * K(k)), io = k => (k = K(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const fa = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const BEAT = .5;
const IS = [];
let S, TL, BB = [], DUR = 45, NOW = 0;

function words(b) {
  const Lw = TL.lines[b.id]; if (!Lw) { IS.push('no timing ' + b.id); return null; }
  const raw = b.text.replace(/\[[^\]]*\]/g, ' ');
  const spk = raw.replace(/\{[^|}]*\|([^}]*)\}/g, '$1').replace(/\*/g, '').trim().split(/\s+/);
  const n = Lw.words.length, ix = i => spk.length === n ? i : Math.round(K(i / Math.max(1, spk.length - 1)) * (n - 1));
  const tw = i => (Lw.words[ix(K(i, 0, spk.length - 1))] || [Lw.start])[0];
  const W = []; let si = 0, hot = false;
  for (const tok of raw.replace(/\{([^|}]*)\|([^}]*)\}/g, (m, a, c) => a.replace(/\s/g, '\u0002') + '\u0001' + c.trim().split(/\s+/).length).trim().split(/\s+/)) {
    let w = tok, n2 = 1; if (w.includes('\u0001')) { const [p, r] = w.split('\u0001'); n2 = parseInt(r, 10) || 1; w = p + r.replace(/^\d+/, ''); }
    if (w.startsWith('*')) hot = true; const h = hot; if (/\*[«»"'.…،؛!؟?:]*$/.test(w)) hot = false;
    W.push({w: w.replace(/\*/g, '').replace(/\u0002/g, ' '), h, t: tw(si)}); si += n2;
  }
  const at = (sub, k = 0) => { const m = W.filter(x => x.w.includes(sub)); if (!m.length) { IS.push(`${b.id}: no word "${sub}"`); return Lw.start; } return m[Math.min(k, m.length - 1)].t; };
  return {b, s: b.scene || {}, Lw, W, at};
}
// re-framings (a new shot) inside a beat, and the sound matched to each motion
const KEYS = {
  hook: x => [x.at('حداقل'), x.at('پونزده')], wage: x => [x.at('یک'), x.at('امسال')], rate: x => [x.at('آخر'), x.at('روزها')],
  dollars: x => [x.at('هشتاد'), x.at('امروز')], pct: x => [x.at('بیست'), x.at('شصت')], split: x => [x.at('اجاره'), x.at('گوشی')],
  prompt: x => [x.at('جمله'), x.at('منبع')], ask: x => [x.at('کامنت')]
};
const CUES = {
  hook: x => [[.05, 'counter_tick', .3], [.55, 'hit', .45], [x.at('حداقل'), 'sweep_soft', .25]],
  wage: x => [[x.a + .2, 'counter_tick', .3], [x.at('امسال'), 'pop', .35]],
  rate: x => [[x.a + .1, 'tick', .3], [x.at('آخر'), 'pop', .3], [x.at('روزها'), 'hit', .4]],
  dollars: x => [[x.a + .3, 'pop', .3], [x.at('هشتاد'), 'tick', .3], [x.at('امروز'), 'glass_ping', .35]],
  pct: x => [[x.a + .3, 'sweep_soft', .25], [x.at('شصت'), 'hit', .4]],
  split: x => [[x.at('اجاره'), 'pop', .3], [x.at('گوشی'), 'pop', .3]],
  prompt: x => [[x.at('جمله') + .2, 'typing', .25], [x.at('منبع'), 'glass_ping', .3]],
  ask: x => [[x.a + .4, 'typing', .25], [x.at('کامنت'), 'tap', .35]]
};
window.ready = (async () => {
  S = await (await fetch(U('story.json'))).json(); TL = await (await fetch(U('timeline.json'))).json();
  DUR = TL.total; BB = S.beats.map(words).filter(Boolean);
  BB.forEach((x, i) => { x.a = i ? x.Lw.start - .1 : 0; x.z = i + 1 < BB.length ? BB[i + 1].Lw.start - .1 : TL.end_start; });
  const pics = ['h', 'c', 'g', 't', 'b', 'd', 'm', 'k'].map(n => U('raw/' + n + '.png'));
  await Promise.all(pics.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'دلار تومن')));
  BB.forEach(x => { x.keys = (KEYS[x.s.type] || (() => []))(x).filter(v => v > x.a + .6 && v < x.z - .6).sort((p, q) => p - q); });
  BB.forEach(x => { const pts = [x.a, ...x.keys, x.z], add = [];
    for (let i = 0; i + 1 < pts.length; i++) { const g = pts[i + 1] - pts[i], n = Math.ceil(g / 2.7) - 1; for (let j = 1; j <= n; j++) add.push(pts[i] + g * j / (n + 1)); }
    x.keys = [...x.keys, ...add].sort((p, q) => p - q); });
  const sc = [];
  for (const x of BB) { const pts = [x.a, ...x.keys], cu = (CUES[x.s.type] || (() => []))(x).filter(c => c[0] >= x.a - .05 && c[0] < x.z);
    pts.forEach((p, j) => { const t1 = j + 1 < pts.length ? pts[j + 1] : x.z;
      sc.push({t0: +p.toFixed(2), t1: +t1.toFixed(2), type: x.s.type, bg: x.b.id + (j ? '.' + j : ''), sfx: cu.filter(c => c[0] >= p - .05 && c[0] < t1).map(c => [+c[0].toFixed(2), c[1], c[2]])}); }); }
  sc.push({t0: TL.end_start, t1: DUR, type: 'end', bg: 'end', sfx: [[TL.end_start + .1, 'shimmer', .35]]});
  window.SCENES = sc; window.START = 0; window.DURATION = DUR; window.ISSUES = IS;
  for (const c of sc) if (c.t1 - c.t0 > 3.2) IS.push(`shot ${c.bg} holds ${(c.t1 - c.t0).toFixed(1)} s: add a key`);
  seek(0);
})();
const LG = () => 'logo_' + (S.brand || 'mercor').toLowerCase().replace(/[^a-z0-9]/g, '') + '.png';

// camera: each beat drifts in slowly, each key moment snaps (exponential) to a new framing
function cam(x, t) {
  const pts = [x.a, ...x.keys], j = pts.filter(p => t >= p).length - 1, k = ex(T(t, pts[j], pts[j] + .5));
  const sc = [1, 1.07, 1.03, 1.1][j % 4], fy = [960, 880, 1040, 920][j % 4], pv = j ? [1, 1.07, 1.03, 1.1][(j - 1) % 4] : 1;
  return {s: L(pv, sc, k) * (1 + .03 * T(t, x.a, x.z)), y: j ? L([960, 880, 1040, 920][(j - 1) % 4], fy, k) : 960};
}
function seek(t) {
  if (!BB.length) return; NOW = t;
  let x = BB[0]; for (const q of BB) if (t >= q.a) x = q;
  const end = t >= TL.end_start, c = end ? {s: 1, y: 960} : cam(x, t);
  $('cam').style.transform = `translate(540px,960px) scale(${c.s.toFixed(4)}) translate(-540px,${(-c.y).toFixed(1)}px)`;
  const h = end ? endCard(t - TL.end_start) : scene(x, t); const st = $('st'); if (st._h !== h) { st._h = h; st.innerHTML = h; }
  const mo = morph(t); const m = $('mo'); if (m._h !== mo) { m._h = mo; m.innerHTML = mo; }
  const cp = end ? '' : cap(x, t); const ca = $('cap'); if (ca._h !== cp) { ca._h = cp; ca.innerHTML = cp; }
}
// scene-to-scene morph: the green card of the outgoing scene grows into a full-frame slab and shrinks into the next card
function morph(t) {
  for (let i = 1; i <= BB.length; i++) {
    const T0 = i < BB.length ? BB[i].a : TL.end_start;
    if (t > T0 - .14 && t < T0 + .18) {
      const k = t < T0 ? io(T(t, T0 - .14, T0)) : 1 - io(T(t, T0, T0 + .18));
      const w = L(420, 1180, k), h = L(160, 2000, k), r = L(80, 0, k), col = i % 2 ? 'var(--g)' : 'var(--ink)';
      return `<div class="a" style="left:${(540 - w / 2).toFixed(0)}px;top:${(960 - h / 2).toFixed(0)}px;width:${w.toFixed(0)}px;height:${h.toFixed(0)}px;border-radius:${r.toFixed(0)}px;background:${col}"></div>`;
    }
  }
  return '';
}
// ---------- parts ----------
const pp = (t, t0) => K(sp(t, t0), 0, 1.06);
const ground = () => `<div class="a" style="inset:0;background:var(--cr)"></div>` +
  `<div class="a" style="inset:-80px;background-image:radial-gradient(rgba(18,18,18,.22) 3px,transparent 3px);background-size:40px 40px;background-position:${(-NOW * 14 % 40).toFixed(1)}px ${(-NOW * 22 % 40).toFixed(1)}px"></div>` +
  [[-160, 120, 620, 'rgba(18,161,80,.16)', 18], [640, 760, 560, 'rgba(108,92,231,.12)', -14], [-120, 1300, 700, 'rgba(18,18,18,.07)', 10]].map(([x0, y0, d, c, v]) =>
    `<div class="a" style="left:${(x0 + Math.sin(NOW * .6 + d) * 40).toFixed(0)}px;top:${(y0 + NOW * v % 300).toFixed(0)}px;width:${d}px;height:${d}px;border-radius:50%;background:${c}"></div>`).join('') +
  `<div class="a" style="left:-200px;right:-200px;top:${(-NOW * 40 % 180 - 180).toFixed(0)}px;height:2400px;background-image:repeating-linear-gradient(0deg,rgba(18,18,18,.10) 0 4px,transparent 4px 180px)"></div>` +
  `<div class="a" style="left:${(60 - (NOW * 30) % 1300).toFixed(0)}px;top:1760px;font:900 150px V;color:rgba(18,161,80,.22);white-space:nowrap;direction:ltr">$ $ $ $ $ $ $ $ $ $ $ $ $ $ $ $</div>`;
const up = (h, k, sz, col = 'var(--ink)') => `<span class="m" style="font-size:${sz}px;line-height:1.28;color:${col}"><span style="display:inline-block;transform:translateY(${((1 - ex(k)) * 110).toFixed(1)}%)">${h}</span></span>`;
function tag(x0, y0, sz, txt, t, t0, bg = 'var(--g)', fg = '#fff', dir = 'rtl') { const k = pp(t, t0); if (k <= 0) return '';
  return `<div class="a" style="left:${x0}px;top:${y0}px;padding:${sz * .12}px ${sz * .38}px ${sz * .22}px;border-radius:${sz * .32}px;background:${bg};color:${fg};font:900 ${sz}px/1.15 V;white-space:nowrap;direction:${dir};transform:scale(${k.toFixed(3)})">${txt}</div>`; }
const logo = s => `<span style="display:inline-flex;width:${s}px;height:${s}px;border-radius:${s * .24}px;background:#fff;align-items:center;justify-content:center;vertical-align:middle;box-shadow:0 6px 16px rgba(0,0,0,.12)"><img src="${U('el/' + LG())}" style="width:${s * .74}px;height:${s * .74}px"></span>`;
function pic(img, x0, y0, w, h, k, t, a, pos = '50% 35%', r = 40) { const sh = L(.7, 1, ex(k));
  return `<div class="a" style="left:${x0}px;top:${y0}px;width:${w}px;height:${h}px;border-radius:${r}px;overflow:hidden;transform:scale(${sh.toFixed(3)});box-shadow:0 24px 50px rgba(0,0,0,.18)">` +
    `<img src="${U('raw/' + img + '.png')}" style="width:100%;height:100%;object-fit:cover;object-position:${pos};transform:scale(${L(1.12, 1.02, T(t, a, a + 3)).toFixed(3)})"></div>`; }
const num = (v, k, d = 0) => fa((v * ex(k)).toFixed(d));
function curs(x0, y0, pr) { return `<svg class="a" style="left:${x0}px;top:${y0}px;overflow:visible;transform:scale(${(1 - .18 * pr).toFixed(3)});transform-origin:0 0" width="60" height="80"><path d="M0 0 L0 58 L15 45 L26 72 L37 67 L26 41 L46 41 Z" fill="#121212" stroke="#fff" stroke-width="5"/></svg>`; }
function cur(t, path) { let i = 0; for (let j = 0; j < path.length; j++) if (t >= path[j][0]) i = j;
  const p = path[i], q = path[Math.min(i + 1, path.length - 1)], m = q === p ? 0 : io(T(t, p[0] + .1, q[0]));
  let pr = 0; for (const c of path) if (c[3]) pr = Math.max(pr, Math.exp(-((t - c[0]) ** 2) / .006)); return curs(L(p[1], q[1], m), L(p[2], q[2], m), pr); }
function money(x0, y0, w, k) { // ticker strip of hourly earnings
  return `<div class="a" style="left:${x0}px;top:${y0}px;width:${w}px;height:90px;border-radius:45px;background:var(--ink);overflow:hidden;opacity:${K(k * 3).toFixed(2)}"><div class="a" style="left:${(-(NOW * 220) % 600).toFixed(0)}px;top:14px;white-space:nowrap;font:900 52px V;color:#7CF0A9;direction:ltr">97: $200 · $84 → 1405: $62 · ×15 TOMAN · $1 = 5,500 → 270,000 · 97: $200 · $84 → 1405: $62 · ×15 TOMAN · $1 = 5,500 → 270,000</div></div>`; }

// ---------- captions: spoken words in chunks of ≤ 4, cream pill with ink type, accent in green ----------
function cap(x, t) {
  if (x.s.type === 'hook' && t < x.at('حداقل') - .1) return '';
  if (t > x.Lw.end + .3) return '';
  const W = x.W; let j = 0; for (let q = 0; q < W.length; q++) if (t >= W[q].t - .05) j = q;
  const ch = []; let c = []; W.forEach((w, q) => { c.push(q); if (c.length === 4 || (c.length >= 2 && /[،؛.!؟?…:»]$/.test(w.w))) { ch.push(c); c = []; } }); if (c.length) ch.push(c);
  const nw = ch.find(g => g.includes(j)), k = T(t, W[nw[0]].t - .05, W[nw[0]].t + .2);
  const line = nw.filter(q => t >= W[q].t - .05).map(q => W[q].h ? `<span style="color:var(--g)">${W[q].w}</span>` : W[q].w).join(' ');
  return `<div class="a" style="left:0;right:0;top:1600px;text-align:center"><span style="display:inline-block;max-width:960px;padding:10px 40px 22px;border-radius:30px;background:#fff;border:5px solid var(--ink);color:var(--ink);font-size:66px;line-height:1.25;direction:rtl;unicode-bidi:isolate;transform:translateY(${((1 - ex(k)) * 30).toFixed(1)}px)">${line}</span></div>`;
}

function scene(x, t) {
  const s = x.s, A = x.a, at = x.at;
  const comma = v => fa(Math.round(v).toLocaleString('en-US'));
  const card = (x0, y0, w, h, inner, k, bg = '#fff') => k <= 0 ? '' : `<div class="a" style="left:${x0}px;top:${y0}px;width:${w}px;height:${h}px;border-radius:44px;background:${bg};box-shadow:0 24px 60px rgba(0,0,0,.12);transform:scale(${K(k, 0, 1.06).toFixed(3)});overflow:hidden">${inner}</div>`;
  const bar = (x0, base, w, h, k, col) => `<div class="a" style="left:${x0}px;top:${(base - h * ex(k)).toFixed(0)}px;width:${w}px;height:${(h * ex(k)).toFixed(0)}px;border-radius:18px 18px 0 0;background:${col}"></div>`;
  switch (s.type) {
    case 'hook': {
      // frame 0: the pay-envelope photo already pushing in, the headline from frame 0; ×15 counts up in green while
      // the dollar card slams in red ($200 → $62) at 0.6 s
      const z = L(1.16, 1.0, ex(T(t, 0, 1.4))), kx = T(t, .05, .9), kd = pp(t, .55), kv = T(t, .7, 1.4);
      const tm = Math.max(1, Math.round(15 * ex(kx))), dl = Math.round(L(200, 62, ex(kv)));
      return `<div class="a" style="left:0;top:0;width:1080px;height:1100px;overflow:hidden"><img src="${U('raw/' + s.img + '.png')}" style="width:1080px;height:1920px;object-fit:cover;object-position:50% 30%;transform:scale(${z.toFixed(4)});transform-origin:540px 400px"></div>` +
        `<div class="a" style="left:0;right:0;top:700px;height:1220px;background:linear-gradient(rgba(246,241,231,0),var(--cr) 30%)"></div>` +
        `<div class="a" style="left:30px;right:30px;top:860px;text-align:center;font-size:112px;line-height:1.2"><div>اگه حقوقت رو</div><div><span style="display:inline-block;padding:0 30px 16px;border-radius:26px;background:var(--g);color:#fff">به دلار</span> ببینی چی؟</div></div>` +
        card(80, 1210, 440, 300, `<div style="margin-top:34px;text-align:center;font:900 44px V;color:var(--mu)">به تومن</div><div style="text-align:center;font:900 150px/1.1 V;color:var(--g);direction:ltr">×${fa(tm)}</div>`, pp(t, .05)) +
        (t > .3 && t < x.at('حداقل') - .1 ? money(90, 1560, 900, T(t, .3, .7)) : '') + card(560, 1210, 440, 300, `<div style="margin-top:34px;text-align:center;font:900 40px V;color:var(--mu)">به دلار · ۹۷ → امروز</div><div style="text-align:center;font:900 150px/1.1 V;color:var(--rd);direction:ltr">$${fa(dl)}</div>`, kd);
    }
    case 'wage': {
      const k1 = T(t, A + .2, at('یک') + .9), k2 = T(t, at('امسال') - .1, at('امسال') + 1.2), kb = pp(t, at('امسال') - .1);
      return ground() + pic('g', 120, 200, 840, 520, pp(t, A), t, A, '50% 40%') +
        card(80, 780, 440, 560, `<div style="margin:30px 0 0;text-align:center;font:900 64px V">۱۳۹۷</div><div style="text-align:center;font:900 54px V;color:var(--ink);direction:ltr">${comma(1114000 * ex(k1))}</div><div style="text-align:center;font:600 36px V;color:var(--mu)">تومن در ماه</div>` + bar(170, 545, 100, 14, k1, 'var(--mu)'), pp(t, A + .1)) +
        card(560, 780, 440, 560, `<div style="margin:30px 0 0;text-align:center;font:900 64px V">۱۴۰۵</div><div style="text-align:center;font:900 54px V;color:var(--g);direction:ltr">${comma(16625550 * ex(k2))}</div><div style="text-align:center;font:600 36px V;color:var(--mu)">تومن در ماه</div>` + bar(170, 545, 100, 190, k2, 'var(--g)'), kb) +
        tag(380, 150, 64, '×۱۵ به تومن', t, at('امسال') + .9);
    }
    case 'rate': {
      // three real points only (no invented curve between them): start of 97, end of 97, Aban 1405; log-scaled height
      const P3 = [[at('نود') , 5500, 'فروردین ۹۷'], [at('آخر'), 13300, 'اسفند ۹۷'], [at('روزها'), 270000, 'آبان ۱۴۰۵']];
      const y = v => 1300 - (Math.log10(v) - 3.5) / (5.6 - 3.5) * 760, X = [220, 540, 860];
      const pts = P3.map((p, i) => ({x: X[i], y: y(p[1]), k: pp(t, p[0] - .05), p}));
      const line = pts.slice(1).map((q, i) => { const a = pts[i], k = ex(T(t, q.p[0] - .2, q.p[0] + .3)); return k <= 0 ? '' : `<line x1="${a.x}" y1="${a.y.toFixed(0)}" x2="${L(a.x, q.x, k).toFixed(0)}" y2="${L(a.y, q.y, k).toFixed(0)}" stroke="var(--rd)" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 22"/>`; }).join('');
      return ground() + `<div class="a" style="left:0;right:0;top:200px;text-align:center">${up('دلار آزاد، به تومن', T(t, A, A + .4), 88)}</div>` +
        `<svg class="a" style="left:0;top:0;overflow:visible" width="1080" height="1920">${line}</svg>` +
        pts.map(q => q.k <= 0 ? '' : `<div class="a" style="left:${q.x - 150}px;top:${(q.y - 210).toFixed(0)}px;width:300px;text-align:center;transform:scale(${K(q.k, 0, 1.06).toFixed(3)})"><div style="display:inline-block;padding:8px 26px 18px;border-radius:26px;background:var(--ink);color:#fff;font:900 62px V;direction:ltr">${comma(q.p[1])}</div><div style="margin-top:8px;font:900 40px V;color:var(--mu)">${q.p[2]}</div><div style="margin:14px auto 0;width:40px;height:40px;border-radius:50%;background:var(--rd)"></div></div>`).join('') +
        tag(250, 1360, 46, 'نرخ بازار آزاد · مقیاس لگاریتمی', t, A + .5, 'var(--ink)');
    }
    case 'dollars': {
      const ks = [A + .3, at('هشتاد'), at('امروز')], V = [200, 84, 62], C = ['var(--mu)', '#B9B2A4', 'var(--rd)'], lb = ['۹۷ · اول سال', '۹۷ · آخر سال', '۱۴۰۵'];
      return ground() + pic(s.img, 120, 190, 840, 420, pp(t, A), t, A, '50% 60%') +
        `<div class="a" style="left:110px;right:110px;top:1380px;height:6px;background:var(--ink)"></div>` +
        V.map((v, i) => { const k = T(t, ks[i] - .1, ks[i] + .8); if (k <= 0) return '';
          return bar(150 + i * 290, 1380, 200, 640 * v / 200, k, C[i]) + `<div class="a" style="left:${110 + i * 290}px;top:${(1380 - 640 * v / 200 * ex(k) - 110).toFixed(0)}px;width:280px;text-align:center;font:900 78px V;color:${C[i] === 'var(--rd)' ? 'var(--rd)' : 'var(--ink)'};direction:ltr">$${fa(Math.round(v * ex(k)))}</div>` +
            `<div class="a" style="left:${110 + i * 290}px;top:1400px;width:280px;text-align:center;font:900 38px V;color:var(--mu)">${lb[i]}</div>`; }).join('') +
        tag(330, 120, 56, 'حقوق پایهٔ ماهانه به دلار', t, A + .4, 'var(--ink)');
    }
    case 'pct': {
      const k1 = pp(t, at('بیست') - .05), k2 = pp(t, at('شصت') - .05), ks = ex(T(t, A + .3, A + .7));
      return ground() + `<div class="a" style="inset:0;opacity:.35"><img src="${U('raw/' + s.img + '.png')}" style="width:1080px;height:1920px;object-fit:cover"></div>` +
        `<div class="a" style="left:0;right:0;top:380px;text-align:center"><span style="position:relative;display:inline-block;font:900 120px V;color:var(--g)">×۱۵ به تومن<span style="position:absolute;left:0;top:52%;height:12px;width:${(100 * ks).toFixed(0)}%;background:var(--ink)"></span></span></div>` +
        card(90, 640, 900, 520, `<div style="margin-top:40px;text-align:center;font:900 54px V;color:var(--mu)">به دلار</div>` +
          `<div style="text-align:center;font:900 150px/1.2 V;color:var(--rd);white-space:nowrap">${fa(Math.round(26 * ex(T(t, A + .2, A + .5))))}${k2 > 0 ? ' تا ' + fa(Math.round(26 + 43 * ex(T(t, at('شصت') - .05, at('شصت') + .3)))) : ''}٪</div><div style="text-align:center;font:900 60px V">کمتر</div>`, pp(t, A + .1)) +
        tag(260, 1200, 52, 'بسته به دلار اول یا آخر ۹۷', t, at('شصت') + .4, 'var(--ink)');
    }
    case 'split': {
      const ka = pp(t, at('اجاره') - .05), kg = pp(t, at('گوشی') - .05);
      const col = (x0, head, items, k0, bg, fg) => card(x0, 330, 440, 900, `<div style="margin:40px 0 20px;text-align:center;font:900 64px V;color:${fg}">${head}</div>` +
        items.map((it, i) => `<div style="margin:22px 34px;padding:24px;border-radius:30px;background:rgba(255,255,255,.75);font:900 56px V;color:var(--ink);transform:scale(${K(pp(t, k0 + i * .35), 0, 1.06).toFixed(3)})">${it}</div>`).join(''), pp(t, k0 - .2), bg);
      return ground() + col(80, 'به تومن', ['🏠 اجاره', '🍞 نون'], at('اجاره'), 'var(--gl)', 'var(--g)') +
        col(560, 'به دلار', ['📱 گوشی', '💊 دارو', '💻 لپ‌تاپ'], at('گوشی'), '#FBE3E0', 'var(--rd)') +
        tag(330, 1260, 56, 'وارداتی‌ها → عدد دلاری', t, at('گوشی') + .8, 'var(--ink)');
    }
    case 'prompt': {
      const kt = T(t, at('جمله') + .2, at('جمله') + 3.2), kf = pp(t, at('منبع') - .3), msg = 'حقوق سال اولم و امسالم رو با دلار همون روزها مقایسه کن';
      return ground() + card(90, 220, 900, 980, `<div style="padding:34px 44px;border-bottom:3px solid #EEE7DA;font:900 50px V">💬 چت‌بات</div>` +
          (kt > 0 ? `<div style="margin:40px 40px 0;padding:30px 36px;border-radius:36px;background:var(--ink);color:#fff;font:900 52px/1.45 V">${msg.slice(0, Math.max(1, Math.round(msg.length * K(kt))))}${kt < 1 ? '▌' : ''}</div>` : `<div style="margin:40px;font:900 46px V;color:var(--mu)">یه جمله بنویس…▌</div>`) +
          (kf > 0 ? `<div style="margin:36px 40px 0;padding:30px 36px;border-radius:36px;background:var(--gl);font:900 50px/1.5 V;transform:scale(${K(kf, 0, 1.04).toFixed(3)})">حقوق ÷ نرخ دلار همون روز<br>= <span style="color:var(--g)">حقوقت به دلار</span></div>` : ''), pp(t, A + .05)) +
        tag(250, 1240, 56, '✓ نرخ‌ها رو خودت بده', t, at('منبع') + .1) +
        cur(t, [[A, 900, 1500], [at('جمله'), 820, 560, 1], [at('منبع'), 600, 900, 1], [x.z, 600, 1000]]);
    }
    case 'ask': {
      const kt = T(t, A + .4, at('کامنت') + .2), kc = pp(t, at('کامنت') - .05), msg = 'حقوق من الان: … دلار';
      return ground() + `<div class="a" style="inset:0;opacity:.5"><img src="${U('raw/' + s.img + '.png')}" style="width:1080px;height:1920px;object-fit:cover;transform:scale(${L(1.05, 1.15, T(t, A, x.z)).toFixed(4)})"></div>` +
        card(90, 520, 900, 520, `<div style="padding:34px 44px;font:900 50px V;color:var(--mu)">کامنت‌ها</div><div style="margin:0 40px;padding:34px;border-radius:30px;background:#F3EEE4;font:900 60px V">${msg.slice(0, Math.round(msg.length * K(kt)))}${kt < 1 ? '▌' : ''}</div>` +
          `<div style="margin:30px 40px;text-align:left"><span style="display:inline-block;padding:14px 44px 24px;border-radius:26px;background:var(--g);color:#fff;font:900 52px V;transform:scale(${(kc > 0 ? 1 + .15 * Math.exp(-((t - at('کامنت')) ** 2) / .02) : 1).toFixed(3)})">ارسال</span></div>`, pp(t, A + .05)) +
        tag(230, 1120, 60, 'بفرست برای همکارت ↗', t, at('همکارت') - .1, 'var(--ink)') +
        cur(t, [[A, 900, 1500], [at('کامنت'), 230, 960, 1], [x.z, 300, 1000]]);
    }
  }
  return ground();
}

// end title: the green card from the hook comes back as the end card (final frame echoes the first idea)
function endCard(u) {
  const w = L(200, 860, ex(T(u, 0, .5)));
  return ground() + `<div class="a" style="left:${540 - w / 2}px;top:560px;width:${w}px;height:260px;border-radius:60px;background:var(--g)"></div>` +
    `<div class="a" style="left:0;right:0;top:600px;text-align:center;color:#fff">${up(`<span dir="ltr">$${fa(200)} → $${fa(62)}</span>`, T(u, .3, .7), 110, '#fff')}</div>` +
    `<div class="a" style="left:0;right:0;top:920px;text-align:center">${up((S.end_text || '').replace(/\*([^*]+)\*/g, '<span style="color:var(--g)">$1</span>'), T(u, .5, .9), 92)}</div>` +
    `<div class="a" style="left:0;right:0;top:1100px;text-align:center;font:600 56px V;color:var(--mu);opacity:${T(u, .8, 1.1).toFixed(2)}">${S.end_sub || ''} · ${S.handle || ''}</div>`;
}
window.seek = seek;
</script>
