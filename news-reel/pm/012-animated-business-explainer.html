<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>meshkani.pro — animated business explainer (prompt 012)</title>
<!-- Skill motion-graphy-2026, prompt 012 "Animated business explainer" (EXPL), built as its own engine.
     Look from the prompt: five-part explainer (the customer's problem, what it is, how it works in three steps, one
     proof point, the name at the end), bold type, brand colours, smooth transitions where each scene is MADE OUT OF the
     last one (here: the money tag / green card morphs into the next scene's main card), spring + exponential easing,
     something on every beat (120 BPM). Banned (kept): particle bursts, glows, lens flares, camera shake, RGB split,
     crossfades, generic gradients, bouncy easing, holds longer than half a second, template looks.
     Allowed edits: 1920x1080 → 1080x1920, 30 s → the voiced length, the business → the story's subject, the soundtrack →
     page-standard music bed + motion-matched SFX cues, the opening → the real photo hook (RUNBOOK §4.0 rule 4).
     Data: story.json beats[{id, text, scene{type, img}}]; raw/sNN.png photos; el/logo_<brand>.png real logo.
     Scene types: hook, who, before, now, steps, proof, avg, cap, twist, ask (+ end). -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --cr: #F6F1E7; --ink: #121212; --g: #12A150; --gl: #D9F5E3; --vi: #6C5CE7; --mu: #7C766B; --rd: #E5483B; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--cr); }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: V; font-weight: 900; color: var(--ink); }
  #cam, #st, #mo, #cap { position: absolute; inset: 0; }
  #cam { transform-origin: 0 0; }
  .a { position: absolute; }
  .row { display: flex; align-items: center; }
  .m { overflow: hidden; display: inline-block; vertical-align: bottom; }
</style>
</head>
<body>
<div id="root"><div id="cam"><div id="st"></div></div><div id="mo"></div><div id="cap"></div></div>
<script>
const P = new URLSearchParams(location.search), D = P.get('dir') || '/work/story/';
const U = f => f.startsWith('/') ? f : D + f, $ = id => document.getElementById(id);
const K = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), L = (a, b, k) => a + (b - a) * k;
const T = (t, a, b) => K((t - a) / (b - a));
// closed-form spring (no bouncy easing: damping kept high) and exponential ease-out
const sp = (t, t0, w = 15, z = .72) => { const u = t - t0; if (u <= 0) return 0; const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + z * w / wd * Math.sin(wd * u)); };
const ex = k => 1 - Math.pow(2, -10 * K(k)), io = k => (k = K(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const fa = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const BEAT = .5;
const IS = [];
let S, TL, BB = [], DUR = 45, NOW = 0;

function words(b) {
  const Lw = TL.lines[b.id]; if (!Lw) { IS.push('no timing ' + b.id); return null; }
  const raw = b.text.replace(/\[[^\]]*\]/g, ' ');
  const spk = raw.replace(/\{[^|}]*\|([^}]*)\}/g, '$1').replace(/\*/g, '').trim().split(/\s+/);
  const n = Lw.words.length, ix = i => spk.length === n ? i : Math.round(K(i / Math.max(1, spk.length - 1)) * (n - 1));
  const tw = i => (Lw.words[ix(K(i, 0, spk.length - 1))] || [Lw.start])[0];
  const W = []; let si = 0, hot = false;
  for (const tok of raw.replace(/\{([^|}]*)\|([^}]*)\}/g, (m, a, c) => a.replace(/\s/g, '\u0002') + '\u0001' + c.trim().split(/\s+/).length).trim().split(/\s+/)) {
    let w = tok, n2 = 1; if (w.includes('\u0001')) { const [p, r] = w.split('\u0001'); n2 = parseInt(r, 10) || 1; w = p + r.replace(/^\d+/, ''); }
    if (w.startsWith('*')) hot = true; const h = hot; if (/\*[«»"'.…،؛!؟?:]*$/.test(w)) hot = false;
    W.push({w: w.replace(/\*/g, '').replace(/\u0002/g, ' '), h, t: tw(si)}); si += n2;
  }
  const at = (sub, k = 0) => { const m = W.filter(x => x.w.includes(sub)); if (!m.length) { IS.push(`${b.id}: no word "${sub}"`); return Lw.start; } return m[Math.min(k, m.length - 1)].t; };
  return {b, s: b.scene || {}, Lw, W, at};
}
// re-framings (a new shot) inside a beat, and the sound matched to each motion
const KEYS = {
  hook: x => [x.at('دلار'), x.at('درس')], who: x => [x.at('AI'), x.at('Mercor')], before: x => [x.at('برچسب')], now: x => [x.at('وکیل'), x.at('مهندس')],
  steps: x => [x.at('بررسی'), x.at('درستش')], proof: x => [x.at('حقوق'), x.at('فیزیک'), x.at('برنامه‌نویس')], avg: x => [x.at('۱۱۰')], cap: x => [x.at('سقف')],
  twist: x => [x.at('درس'), x.at('جاشونو')], ask: x => [x.at('کامنت')]
};
const CUES = {
  hook: x => [[.05, 'counter_tick', .3], [.6, 'notify', .25], [.8, 'hit', .5]],
  who: x => [[x.a + .1, 'sweep_soft', .25], [x.at('Mercor'), 'pop', .35]],
  before: x => [[x.a + .1, 'click', .3], [x.at('ارزون'), 'counter_tick', .25]],
  now: x => [[x.at('دکتر'), 'pop', .3], [x.at('وکیل'), 'pop', .3], [x.at('مهندس'), 'pop', .3]],
  steps: x => [[x.a + .1, 'typing', .25], [x.at('بررسی'), 'tap', .35], [x.at('درستش'), 'glass_ping', .3]],
  proof: x => [[x.a + .2, 'counter_tick', .3], [x.at('فیزیک'), 'tap', .3], [x.at('برنامه‌نویس'), 'tap', .3]],
  avg: x => [[x.at('۱۱۰'), 'glass_ping', .35]],
  cap: x => [[x.at('سقف'), 'hit', .45]],
  twist: x => [[x.a + .1, 'sweep_soft', .25], [x.at('جاشونو'), 'bass_drop', .35]],
  ask: x => [[x.a + .1, 'tap', .3], [x.at('کامنت'), 'click', .35]]
};
window.ready = (async () => {
  S = await (await fetch(U('story.json'))).json(); TL = await (await fetch(U('timeline.json'))).json();
  DUR = TL.total; BB = S.beats.map(words).filter(Boolean);
  BB.forEach((x, i) => { x.a = i ? x.Lw.start - .1 : 0; x.z = i + 1 < BB.length ? BB[i + 1].Lw.start - .1 : TL.end_start; });
  const pics = ['s01', 's02', 's03', 's04', 's05', 's06', 's07', 's08', 's10'].map(n => U('raw/' + n + '.png')).concat([U('el/' + LG())]);
  await Promise.all(pics.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'دلار Mercor')));
  BB.forEach(x => { x.keys = (KEYS[x.s.type] || (() => []))(x).filter(v => v > x.a + .6 && v < x.z - .6).sort((p, q) => p - q); });
  const sc = [];
  for (const x of BB) { const pts = [x.a, ...x.keys], cu = (CUES[x.s.type] || (() => []))(x).filter(c => c[0] >= x.a - .05 && c[0] < x.z);
    pts.forEach((p, j) => { const t1 = j + 1 < pts.length ? pts[j + 1] : x.z;
      sc.push({t0: +p.toFixed(2), t1: +t1.toFixed(2), type: x.s.type, bg: x.b.id + (j ? '.' + j : ''), sfx: cu.filter(c => c[0] >= p - .05 && c[0] < t1).map(c => [+c[0].toFixed(2), c[1], c[2]])}); }); }
  sc.push({t0: TL.end_start, t1: DUR, type: 'end', bg: 'end', sfx: [[TL.end_start + .1, 'shimmer', .35]]});
  window.SCENES = sc; window.START = 0; window.DURATION = DUR; window.ISSUES = IS;
  for (const c of sc) if (c.t1 - c.t0 > 3.2) IS.push(`shot ${c.bg} holds ${(c.t1 - c.t0).toFixed(1)} s: add a key`);
  seek(0);
})();
const LG = () => 'logo_' + (S.brand || 'mercor').toLowerCase().replace(/[^a-z0-9]/g, '') + '.png';

// camera: each beat drifts in slowly, each key moment snaps (exponential) to a new framing
function cam(x, t) {
  const pts = [x.a, ...x.keys], j = pts.filter(p => t >= p).length - 1, k = ex(T(t, pts[j], pts[j] + .5));
  const sc = [1, 1.07, 1.03, 1.1][j % 4], fy = [960, 880, 1040, 920][j % 4], pv = j ? [1, 1.07, 1.03, 1.1][(j - 1) % 4] : 1;
  return {s: L(pv, sc, k) * (1 + .03 * T(t, x.a, x.z)), y: j ? L([960, 880, 1040, 920][(j - 1) % 4], fy, k) : 960};
}
function seek(t) {
  if (!BB.length) return; NOW = t;
  let x = BB[0]; for (const q of BB) if (t >= q.a) x = q;
  const end = t >= TL.end_start, c = end ? {s: 1, y: 960} : cam(x, t);
  $('cam').style.transform = `translate(540px,960px) scale(${c.s.toFixed(4)}) translate(-540px,${(-c.y).toFixed(1)}px)`;
  const h = end ? endCard(t - TL.end_start) : scene(x, t); const st = $('st'); if (st._h !== h) { st._h = h; st.innerHTML = h; }
  const mo = morph(t); const m = $('mo'); if (m._h !== mo) { m._h = mo; m.innerHTML = mo; }
  const cp = end ? '' : cap(x, t); const ca = $('cap'); if (ca._h !== cp) { ca._h = cp; ca.innerHTML = cp; }
}
// scene-to-scene morph: the green card of the outgoing scene grows into a full-frame slab and shrinks into the next card
function morph(t) {
  for (let i = 1; i <= BB.length; i++) {
    const T0 = i < BB.length ? BB[i].a : TL.end_start;
    if (t > T0 - .14 && t < T0 + .18) {
      const k = t < T0 ? io(T(t, T0 - .14, T0)) : 1 - io(T(t, T0, T0 + .18));
      const w = L(420, 1180, k), h = L(160, 2000, k), r = L(80, 0, k), col = i % 2 ? 'var(--g)' : 'var(--ink)';
      return `<div class="a" style="left:${(540 - w / 2).toFixed(0)}px;top:${(960 - h / 2).toFixed(0)}px;width:${w.toFixed(0)}px;height:${h.toFixed(0)}px;border-radius:${r.toFixed(0)}px;background:${col}"></div>`;
    }
  }
  return '';
}
// ---------- parts ----------
const pp = (t, t0) => K(sp(t, t0), 0, 1.06);
const ground = () => `<div class="a" style="inset:0;background:var(--cr)"></div>` +
  `<div class="a" style="left:-200px;right:-200px;top:${(-NOW * 40 % 180 - 180).toFixed(0)}px;height:2400px;background-image:repeating-linear-gradient(0deg,rgba(18,18,18,.06) 0 3px,transparent 3px 180px)"></div>` +
  `<div class="a" style="left:${(60 - (NOW * 30) % 1300).toFixed(0)}px;top:1780px;font:900 120px V;color:rgba(18,161,80,.13);white-space:nowrap;direction:ltr">$ $ $ $ $ $ $ $ $ $ $ $ $ $ $ $</div>`;
const up = (h, k, sz, col = 'var(--ink)') => `<span class="m" style="font-size:${sz}px;line-height:1.28;color:${col}"><span style="display:inline-block;transform:translateY(${((1 - ex(k)) * 110).toFixed(1)}%)">${h}</span></span>`;
function tag(x0, y0, sz, txt, t, t0, bg = 'var(--g)', fg = '#fff', dir = 'rtl') { const k = pp(t, t0); if (k <= 0) return '';
  return `<div class="a" style="left:${x0}px;top:${y0}px;padding:${sz * .12}px ${sz * .38}px ${sz * .22}px;border-radius:${sz * .32}px;background:${bg};color:${fg};font:900 ${sz}px/1.15 V;white-space:nowrap;direction:${dir};transform:scale(${k.toFixed(3)})">${txt}</div>`; }
const logo = s => `<span style="display:inline-flex;width:${s}px;height:${s}px;border-radius:${s * .24}px;background:#fff;align-items:center;justify-content:center;vertical-align:middle;box-shadow:0 6px 16px rgba(0,0,0,.12)"><img src="${U('el/' + LG())}" style="width:${s * .74}px;height:${s * .74}px"></span>`;
function pic(img, x0, y0, w, h, k, t, a, pos = '50% 35%', r = 40) { const sh = L(.7, 1, ex(k));
  return `<div class="a" style="left:${x0}px;top:${y0}px;width:${w}px;height:${h}px;border-radius:${r}px;overflow:hidden;transform:scale(${sh.toFixed(3)});box-shadow:0 24px 50px rgba(0,0,0,.18)">` +
    `<img src="${U('raw/' + img + '.png')}" style="width:100%;height:100%;object-fit:cover;object-position:${pos};transform:scale(${L(1.12, 1.02, T(t, a, a + 3)).toFixed(3)})"></div>`; }
const num = (v, k, d = 0) => fa((v * ex(k)).toFixed(d));
function curs(x0, y0, pr) { return `<svg class="a" style="left:${x0}px;top:${y0}px;overflow:visible;transform:scale(${(1 - .18 * pr).toFixed(3)});transform-origin:0 0" width="60" height="80"><path d="M0 0 L0 58 L15 45 L26 72 L37 67 L26 41 L46 41 Z" fill="#121212" stroke="#fff" stroke-width="5"/></svg>`; }
function cur(t, path) { let i = 0; for (let j = 0; j < path.length; j++) if (t >= path[j][0]) i = j;
  const p = path[i], q = path[Math.min(i + 1, path.length - 1)], m = q === p ? 0 : io(T(t, p[0] + .1, q[0]));
  let pr = 0; for (const c of path) if (c[3]) pr = Math.max(pr, Math.exp(-((t - c[0]) ** 2) / .006)); return curs(L(p[1], q[1], m), L(p[2], q[2], m), pr); }
function money(x0, y0, w, k) { // ticker strip of hourly earnings
  return `<div class="a" style="left:${x0}px;top:${y0}px;width:${w}px;height:90px;border-radius:45px;background:var(--ink);overflow:hidden;opacity:${K(k * 3).toFixed(2)}"><div class="a" style="left:${(-(NOW * 220) % 600).toFixed(0)}px;top:14px;white-space:nowrap;font:900 52px V;color:#7CF0A9;direction:ltr">+$110 · +$120 · +$170 · +$400 · +$110 · +$120 · +$170 · +$400 · +$110 · +$120</div></div>`; }

// ---------- captions: spoken words in chunks of ≤ 4, cream pill with ink type, accent in green ----------
function cap(x, t) {
  if (x.s.type === 'hook' && t < x.at('درس') + .3) return '';
  if (t > x.Lw.end + .3) return '';
  const W = x.W; let j = 0; for (let q = 0; q < W.length; q++) if (t >= W[q].t - .05) j = q;
  const ch = []; let c = []; W.forEach((w, q) => { c.push(q); if (c.length === 4 || (c.length >= 2 && /[،؛.!؟?…:»]$/.test(w.w))) { ch.push(c); c = []; } }); if (c.length) ch.push(c);
  const nw = ch.find(g => g.includes(j)), k = T(t, W[nw[0]].t - .05, W[nw[0]].t + .2);
  const line = nw.filter(q => t >= W[q].t - .05).map(q => W[q].h ? `<span style="color:var(--g)">${W[q].w}</span>` : W[q].w).join(' ');
  return `<div class="a" style="left:0;right:0;top:1600px;text-align:center"><span style="display:inline-block;max-width:960px;padding:10px 40px 22px;border-radius:30px;background:#fff;border:5px solid var(--ink);color:var(--ink);font-size:66px;line-height:1.25;direction:rtl;unicode-bidi:isolate;transform:translateY(${((1 - ex(k)) * 30).toFixed(1)}px)">${line}</span></div>`;
}

function scene(x, t) {
  const s = x.s, A = x.a, at = x.at;
  switch (s.type) {
    case 'hook': {
      // frame 0: the lawyer photo full-bleed (face fully in frame), pushing in; the headline with the subject from frame 0;
      // the rate card counts $0 → $400 in 0.8 s and slams; at 0.6 s the twist chip; at 0.3 s the earnings ticker runs
      const z = L(1.0, 1.1, io(T(t, 0, 2.6))), kr = T(t, 0, .8), slam = t > .8 && t < 1 ? 1 + .12 * (1 - T(t, .8, 1)) : 1;
      return `<div class="a" style="inset:0;transform:scale(${z.toFixed(4)});transform-origin:520px 600px"><img src="${U('raw/s01.png')}" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;object-position:50% 0%"></div>` +
        `<div class="a" style="left:0;right:0;top:920px;height:1000px;background:linear-gradient(rgba(246,241,231,0),rgba(246,241,231,.95) 20%,var(--cr))"></div>` +
        `<div class="a" style="left:30px;right:30px;top:1080px;text-align:center;font-size:104px;line-height:1.2"><div>شرکت‌های AI به وکیل‌ها</div><div>ساعتی تا <span style="display:inline-block;padding:0 24px 12px;border-radius:24px;background:var(--g);color:#fff;transform:scale(${slam.toFixed(3)})">${fa(400)} دلار</span> می‌دن</div></div>` +
        `<div class="a" style="left:0;right:0;top:1360px;text-align:center"><span style="display:inline-block;padding:8px 34px 18px;border-radius:24px;background:var(--ink);color:#fff;font:900 52px V">برای درس دادن به AI</span></div>` +
        (t > .3 ? money(90, 1480, 900, T(t, .3, .7)) : '') +
        tag(90, 220, 60, 'همون AI که شاید یه روز جاشونو بگیره؟', t, .6, 'var(--rd)', '#fff');
    }
    case 'who': {
      const k1 = pp(t, A + .05), km = pp(t, at('Mercor') - .05), kc = T(t, A + .3, at('Mercor'));
      const card = (x0, y0, h, k) => k <= 0 ? '' : `<div class="a" style="left:${x0}px;top:${y0}px;width:820px;padding:44px;border-radius:44px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.12);transform:scale(${k.toFixed(3)});box-sizing:border-box">${h}</div>`;
      return ground() + card(130, 260, `<div style="font:900 44px V;color:var(--mu)">پرداخت‌کننده</div><div style="font:900 90px V;margin-top:10px">شرکت‌های AI</div><div style="margin-top:22px;height:22px;width:${(100 * ex(kc)).toFixed(0)}%;border-radius:11px;background:var(--g)"></div>`, k1) +
        `<svg class="a" style="left:0;top:0;overflow:visible" width="1080" height="1920"><path d="M540 610 L540 ${L(610, 820, ex(T(t, A + .4, at('Mercor')))).toFixed(0)}" stroke="var(--ink)" stroke-width="10" stroke-dasharray="20 14" fill="none"/></svg>` +
        card(130, 840, `<div class="row" style="gap:30px;direction:ltr">${logo(130)}<span style="font:900 100px V">Mercor</span></div><div style="margin-top:24px;font:600 42px V;color:var(--mu)">سایت استخدام متخصص برای آموزش AI</div>`, km) +
        (km > 0 ? `<div class="a row" style="left:130px;top:1260px;gap:18px">${['وکیل', 'دکتر', 'مهندس', 'فیزیک‌دان'].map((r, i) => { const k = pp(t, at('Mercor') + .2 + i * BEAT / 2); return `<span style="display:inline-block;padding:6px 30px 16px;border-radius:20px;background:${i ? '#fff' : 'var(--g)'};color:${i ? 'var(--ink)' : '#fff'};font:900 50px V;transform:scale(${k.toFixed(3)});box-shadow:0 8px 20px rgba(0,0,0,.08)">${r}</span>`; }).join('')}</div>` : '') +
        cur(t, [[A, 900, 1500], [at('Mercor') - .2, 600, 1000, 1], [x.z, 600, 1000]]);
    }
    case 'before': {
      const k = T(t, A, A + .4), kb = T(t, at('برچسب') - .1, at('برچسب') + .5), n = Math.floor(K((t - A - .2) / (BEAT / 2), 0, 12));
      const thumbs = Array.from({length: 12}, (_, i) => `<div class="a" style="left:${120 + (i % 4) * 215}px;top:${880 + Math.floor(i / 4) * 170}px;width:195px;height:150px;border-radius:20px;background:${i < n ? '#E8E2D6' : '#fff'};border:4px solid ${i < n ? 'var(--g)' : '#E2DCCF'};text-align:center;font:900 70px/140px V;color:var(--g)">${i < n ? '✓' : ''}</div>`).join('');
      return ground() + pic('s02', 120, 230, 520, 560, k, t, A, '50% 30%') +
        `<div class="a" style="left:680px;top:330px;width:300px;text-align:center"><div style="font:900 44px V;color:var(--mu)">دستمزد</div><div style="font:900 100px V;color:var(--rd);transform:scale(${pp(t, at('ارزون') - .05).toFixed(3)})">ارزون</div><div style="font:900 40px V;color:var(--mu)">کار ساده، قدیم</div></div>` +
        thumbs + `<div class="a" style="left:120px;top:1330px;font:900 54px V">${up('برچسب زدن عکس و متن', kb, 54)}</div>` +
        cur(t, [[A, 300, 1500], ...Array.from({length: 6}, (_, i) => [A + .3 + i * BEAT / 2 * 2, 200 + (i % 4) * 215, 940 + Math.floor(i / 4) * 170, 1]), [x.z, 600, 1200]]);
    }
    case 'now': {
      const ks = [at('دکتر'), at('وکیل'), at('مهندس')], im = ['s03', 's05', 's04'], lb = ['دکتر', 'وکیل', 'مهندس'];
      return ground() + `<div class="a" style="left:0;right:0;top:200px;text-align:center">${up('حالا متخصص می‌خوان', T(t, A, A + .4), 92)}</div>` +
        ks.map((k0, i) => { const k = pp(t, k0 - .1); if (k <= 0) return '';
          return `<div class="a" style="left:${70 + i * 320}px;top:${430 + (i % 2) * 120}px;width:300px;transform:scale(${k.toFixed(3)})">` + pic(im[i], 0, 0, 300, 520, 1, t, k0, '50% 30%', 34).replace('class="a"', 'style="position:relative"') +
            `<div style="margin-top:20px;text-align:center"><span style="display:inline-block;padding:6px 30px 16px;border-radius:22px;background:${i === 1 ? 'var(--g)' : 'var(--ink)'};color:#fff;font:900 56px V">${lb[i]}</span></div></div>`; }).join('') +
        `<div class="a" style="left:120px;top:1300px;width:840px;height:40px;border-radius:20px;background:#E2DCCF"><div style="width:${(100 * ex(T(t, A + .2, x.z))).toFixed(0)}%;height:100%;border-radius:20px;background:var(--g)"></div></div>` +
        `<div class="a" style="left:120px;top:1360px;font:900 44px V;color:var(--mu)">تخصص لازم ↑</div>`;
    }
    case 'steps': {
      const st = t < at('بررسی') ? 0 : t < at('درستش') ? 1 : 2, kk = [A + .1, at('بررسی'), at('درستش')];
      const lab = ['سؤال سخت', 'نمره به جواب AI', 'جواب درست'];
      const stepper = `<div class="a row" style="left:120px;right:120px;top:230px;justify-content:space-between">${lab.map((l, i) => `<div style="text-align:center;width:250px"><div style="margin:0 auto;width:120px;height:120px;border-radius:50%;background:${i <= st ? 'var(--g)' : '#fff'};color:${i <= st ? '#fff' : 'var(--mu)'};font:900 66px/115px V;border:6px solid ${i <= st ? 'var(--g)' : '#E2DCCF'};transform:scale(${(i === st ? 1 + .1 * Math.exp(-6 * (t - kk[i])) : 1).toFixed(3)})">${fa(i + 1)}</div><div style="margin-top:16px;font:900 40px V">${l}</div></div>`).join('')}</div>`;
      const q = 'اگه موجر قرارداد رو زودتر فسخ کنه، مستأجر چه حقی داره؟', nq = Math.round(q.length * ex(T(t, A + .1, A + 1.6)));
      const grade = K(L(3, 9, io(T(t, at('بررسی'), at('بررسی') + .8))), 3, 9);
      const card = `<div class="a" style="left:110px;top:560px;width:860px;padding:40px;border-radius:40px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.12);box-sizing:border-box">` +
        `<div style="font:600 44px/1.5 V">❓ ${q.slice(0, nq)}<span style="opacity:${t * 2 % 1 < .5 ? 1 : 0}">|</span></div>` +
        `<div style="margin-top:30px;padding:26px;border-radius:26px;background:#F1EDE4;font:600 40px/1.5 V;color:${st >= 2 ? 'var(--g)' : 'var(--rd)'}">🤖 ${st >= 2 ? 'جواب اصلاح‌شده، با استناد به قانون ✓' : 'جواب کلی و ناقص ✗'}</div>` +
        `<div style="margin-top:34px;font:900 40px V;color:var(--mu)">نمره</div><div style="margin-top:12px;height:30px;border-radius:15px;background:#E2DCCF;position:relative"><div style="width:${(grade * 10).toFixed(0)}%;height:100%;border-radius:15px;background:var(--g)"></div><div style="position:absolute;left:${(grade * 10 - 3).toFixed(0)}%;top:-14px;width:58px;height:58px;border-radius:50%;background:#fff;border:6px solid var(--ink)"></div></div>` +
        `<div style="margin-top:14px;font:900 64px V;direction:ltr;text-align:left">${fa(Math.round(grade))}/${fa(10)}</div></div>`;
      return ground() + stepper + card + money(90, 1430, 900, T(t, A, A + .4)) + cur(t, [[A, 900, 1500], [at('بررسی'), 300 + grade * 50, 1180, 1], [at('درستش'), 700, 900, 1], [x.z, 700, 900]]);
    }
    case 'proof': {
      const D2 = [['وکیل حقوق مدنی', 400, A + .1, 'var(--g)'], ['متخصص فیزیک', 170, at('فیزیک') - .1, 'var(--ink)'], ['برنامه‌نویس', 120, at('برنامه‌نویس') - .1, 'var(--vi)']];
      return ground() + `<div class="a" style="left:0;right:0;top:200px;text-align:center">${up('<span dir="ltr">Bloomberg</span> · سقف ساعتی آگهی‌ها', T(t, A, A + .4), 64)}</div>` +
        D2.map(([l, v, t0, col], i) => { const k = T(t, t0, t0 + .9), w = 820 * v / 400 * ex(k);
          return `<div class="a" style="left:130px;top:${420 + i * 300}px;font:900 50px V">${l}</div>` +
            `<div class="a" style="left:130px;top:${490 + i * 300}px;width:${w.toFixed(0)}px;height:120px;border-radius:24px;background:${col}"></div>` +
            (w > 520 ? `<div class="a" style="left:${(130 + w - 330).toFixed(0)}px;top:${500 + i * 300}px;width:300px;text-align:right;font:900 90px V;color:#fff;direction:ltr">$${num(v, k)}</div>` : `<div class="a" style="left:${(150 + Math.max(w, 10)).toFixed(0)}px;top:${495 + i * 300}px;font:900 96px V;color:${col};direction:ltr">$${num(v, k)}</div>`); }).join('') +
        `<div class="a" style="left:130px;top:1340px;font:900 40px V;color:var(--mu)">در ساعت · ${fa(16)} اکتبر ${fa(2026)}</div>`;
    }
    case 'avg': {
      const k = T(t, A + .1, at('۱۱۰') + .3), ang = L(-120, L(-120, 120, 110 / 400), ex(k));
      return ground() + `<div class="a row" style="left:0;right:0;top:220px;justify-content:center;gap:24px;direction:ltr">${logo(110)}${up('Mercor', T(t, A, A + .4), 90)}</div>` +
        `<svg class="a" style="left:190px;top:470px;overflow:visible" width="700" height="420"><path d="M60 380 A290 290 0 0 1 640 380" fill="none" stroke="#E2DCCF" stroke-width="54" stroke-linecap="round"/>` +
        `<path d="M60 380 A290 290 0 0 1 640 380" fill="none" stroke="var(--g)" stroke-width="54" stroke-linecap="round" stroke-dasharray="912" stroke-dashoffset="${(912 * (1 - 110 / 400 * ex(k))).toFixed(0)}"/>` +
        `<line x1="350" y1="380" x2="${(350 + 250 * Math.sin(ang * Math.PI / 180)).toFixed(0)}" y2="${(380 - 250 * Math.cos(ang * Math.PI / 180)).toFixed(0)}" stroke="var(--ink)" stroke-width="16" stroke-linecap="round"/><circle cx="350" cy="380" r="26" fill="var(--ink)"/></svg>` +
        `<div class="a" style="left:0;right:0;top:930px;text-align:center;font:900 170px V;color:var(--g);direction:ltr">$${num(110, k)}</div>` +
        `<div class="a" style="left:0;right:0;top:1150px;text-align:center;font:900 52px V">میانگین ساعتی</div>` +
        `<div class="a" style="left:0;right:0;top:1260px;text-align:center;font:600 42px V;color:var(--mu)">به گفتهٔ خود Mercor</div>`;
    }
    case 'cap': {
      const ks = T(t, at('سقف') - .05, at('سقف') + .25), k = pp(t, A + .05);
      const ad = `<div class="a" style="left:130px;top:330px;width:820px;padding:50px;border-radius:44px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.12);box-sizing:border-box;transform:scale(${k.toFixed(3)})">` +
        `<div style="font:900 40px V;color:var(--mu)">آگهی شغلی</div><div style="font:900 70px V;margin-top:10px">وکیل حقوق مدنی</div><div style="font:900 120px V;color:var(--g);direction:ltr;margin-top:20px">≤ $${fa(400)}/h</div>` +
        `<div style="margin-top:20px;height:22px;border-radius:11px;background:#E2DCCF;width:100%"><div style="width:${(30 + 70 * ex(T(t, A + .2, A + 1.4))).toFixed(0)}%;height:100%;border-radius:11px;background:var(--ink)"></div></div><div style="font:600 36px V;color:var(--mu);margin-top:12px">بازهٔ واقعی: کمتر تا این سقف</div></div>`;
      return ground() + ad + (ks > 0 ? `<div class="a" style="left:230px;top:960px;padding:16px 50px 30px;border:12px solid var(--rd);border-radius:26px;color:var(--rd);font:900 100px V;background:rgba(246,241,231,.94);transform:rotate(-7deg) scale(${L(1.8, 1, ex(ks)).toFixed(3)})">فقط سقف آگهی</div>` : '') +
        `<div class="a" style="left:130px;top:1260px;font:900 48px V">${up('نه درآمد تضمینی', T(t, at('همیشگی') - .05, at('همیشگی') + .3), 60, 'var(--ink)')}</div>`;
    }
    case 'twist': {
      const k = T(t, A, A + .5), kf = T(t, at('درس') - .1, x.z), kj = T(t, at('جاشونو') - .1, at('جاشونو') + .7);
      const dots = Array.from({length: 7}, (_, i) => { const u = ((NOW * 1.4 + i / 7) % 1); return `<div class="a" style="left:${L(520, 640, u).toFixed(0)}px;top:${(700 - 40 * Math.sin(u * Math.PI)).toFixed(0)}px;width:26px;height:26px;border-radius:50%;background:var(--g);opacity:${(kf > 0 ? 1 : 0)}"></div>`; }).join('');
      return ground() + pic('s10', 80, 300, 440, 700, k, t, A, '45% 30%') +
        `<div class="a" style="left:660px;top:470px;width:340px;height:440px;border-radius:40px;background:var(--ink);color:#fff;text-align:center;transform:scale(${pp(t, A + .2).toFixed(3)})"><div style="font:900 150px/300px V;direction:ltr">AI</div><div style="font:900 40px V">مهارت</div><div style="margin:20px 40px 0;height:22px;border-radius:11px;background:#333"><div style="width:${(20 + 75 * ex(kf)).toFixed(0)}%;height:100%;border-radius:11px;background:#7CF0A9"></div></div></div>` +
        dots + `<div class="a" style="left:80px;top:1060px;width:900px">${up('متخصص ← دانش ← AI', T(t, at('درس') - .05, at('درس') + .4), 64)}</div>` +
        tag(560, 1130, 56, 'شاید؟', t, at('شاید') - .05, 'var(--rd)', '#fff');
    }
    case 'ask': {
      const k = T(t, A, A + .4), q = 'تو حاضری به AI درس بدی؟', nq = Math.round(q.length * ex(T(t, A + .1, A + 1.2)));
      return ground() + `<div class="a" style="left:120px;top:380px;width:840px;padding:50px;border-radius:44px;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.12);box-sizing:border-box;transform:scale(${L(.8, 1, ex(k)).toFixed(3)})"><div style="font:900 74px/1.4 V">${q.slice(0, nq)}<span style="opacity:${t * 2 % 1 < .5 ? 1 : 0}">|</span></div></div>` +
        ['آره، چرا نه', 'نه، جاشونو می‌گیره', 'بستگی داره'].map((c, i) => tag(160 + (i % 2) * 330, 760 + i * 170, 60, c, t, A + .6 + i * BEAT / 2, i ? '#fff' : 'var(--g)', i ? 'var(--ink)' : '#fff')).join('') +
        `<div class="a" style="left:120px;top:1300px;width:840px;height:120px;border-radius:30px;background:var(--ink);color:#fff;text-align:center;font:900 60px/110px V;transform:scale(${pp(t, at('کامنت')).toFixed(3)})">💬 کامنت کن</div>` +
        `<div class="a" style="left:640px;top:250px;font:900 80px V;color:var(--g);direction:ltr">$${num(L(400, 110, ex(T(t, A + .2, A + 1.2))), 1)}</div>` +
        cur(t, [[A, 900, 1500], [at('کامنت'), 540, 1360, 1], [x.z, 540, 1360]]);
    }
  }
  return ground();
}
// end title: the green card from the hook comes back as the end card (final frame echoes the first idea)
function endCard(u) {
  const w = L(200, 860, ex(T(u, 0, .5)));
  return ground() + `<div class="a" style="left:${540 - w / 2}px;top:560px;width:${w}px;height:260px;border-radius:60px;background:var(--g)"></div>` +
    `<div class="a" style="left:0;right:0;top:600px;text-align:center;color:#fff">${up(`تا ${fa(400)} دلار در ساعت`, T(u, .3, .7), 96, '#fff')}</div>` +
    `<div class="a" style="left:0;right:0;top:920px;text-align:center">${up((S.end_text || '').replace(/\*([^*]+)\*/g, '<span style="color:var(--g)">$1</span>'), T(u, .5, .9), 92)}</div>` +
    `<div class="a" style="left:0;right:0;top:1100px;text-align:center;font:600 56px V;color:var(--mu);opacity:${T(u, .8, 1.1).toFixed(2)}">${S.end_sub || ''} · ${S.handle || ''}</div>`;
}
window.seek = seek;
</script>
