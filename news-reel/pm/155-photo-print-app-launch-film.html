<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>meshkani.pro — keynote UI film (prompt 155)</title>
<!-- Skill motion-graphy-2026, prompt 155 "Photo print app launch film" (UI), built as its own engine.
     Look from the prompt: an Apple-keynote launch film, 2D, one continuous take: nothing fades or cuts — shapes change
     instead. Text rises out of a mask line, icons pop from zero on a closed-form spring, bars draw across, a black
     shape floods the frame and contracts into the next scene, an iris of six blades snaps open onto a photo, a cursor
     drives every change with real clicks, and the camera zooms screen-studio style onto each moment. Warm off-white
     canvas, black UI. Banned (kept): crossfades, blur-ins, 3D flips, particles, glows, holds longer than 1 s.
     Allowed edits: square → 1080x1920, 54 beats → the voiced length at 120 BPM, the photo-print app → the story's
     subject (story.product), downloaded SFX → per-cut sfx + music bed (page standard), the opening → the real photo
     hook (RUNBOOK §4.0 rule 4).
     Data: story.json beats[{id, text, scene{type, img}}]; el/<product>.png, el/<brand>.png real logos; raw/sNN.png.
     Scene types: hook, peek, intro, menu, pin, folder, search, plans, warn, support, crypto, ask (+ end). -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --paper: #F3EFE7; --ink: #0E0E0E; --mute: #8A867E; --line: #DDD7CC; --gpt: #10A37F; --red: #E5322D; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: V; font-weight: 900; color: var(--ink); }
  #cam, #stage, #over, #caps { position: absolute; inset: 0; }
  #cam { transform-origin: 0 0; }
  .a { position: absolute; }
  .row { display: flex; align-items: center; }
  .mask { overflow: hidden; display: inline-block; vertical-align: bottom; }
</style>
</head>
<body>
<div id="root"><div id="cam"><div id="stage"></div></div><div id="over"></div><div id="caps"></div></div>
<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const url = f => f.startsWith('/') ? f : DIR + f, byId = id => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), mix = (a, b, k) => a + (b - a) * k;
const lin = (t, a, b) => cl((t - a) / (b - a));
// closed-form spring step response (prompt build 2): 0 → 1 with a small overshoot, a pure function of time
const spr = (t, t0, w = 16, z = .55) => { const u = t - t0; if (u <= 0) return 0; const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + z * w / wd * Math.sin(wd * u)); };
const eo = k => 1 - Math.pow(1 - cl(k), 3), eio = k => (k = cl(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const fa = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const BPM = 120, BT = 60 / BPM;
const ISS = [];
let S, TL, B = [], DUR = 50;

function parse(b) {
  const L = TL.lines[b.id]; if (!L) { ISS.push('no timing ' + b.id); return null; }
  const raw = b.text.replace(/\[[^\]]*\]/g, ' ');
  const spoken = raw.replace(/\{[^|}]*\|([^}]*)\}/g, '$1').replace(/\*/g, '').trim().split(/\s+/);
  const n = L.words.length, idx = i => spoken.length === n ? i : Math.round(cl(i / Math.max(1, spoken.length - 1)) * (n - 1));
  const tw = i => (L.words[idx(cl(i, 0, spoken.length - 1))] || [L.start])[0];
  const W = []; let si = 0, hot = false;
  for (const tok of raw.replace(/\{([^|}]*)\|([^}]*)\}/g, (m, a, c) => a.replace(/\s/g, '\u0002') + '\u0001' + c.trim().split(/\s+/).length).trim().split(/\s+/)) {
    let w = tok, sp = 1; if (w.includes('\u0001')) { const [p, r] = w.split('\u0001'); sp = parseInt(r, 10) || 1; w = p + r.replace(/^\d+/, ''); }
    if (w.startsWith('*')) hot = true; const h = hot; if (/\*[«»"'.…،؛!؟?:]*$/.test(w)) hot = false;
    W.push({w: w.replace(/\*/g, '').replace(/\u0002/g, ' '), h, t: tw(si)}); si += sp;
  }
  const at = (sub, k = 0) => { const m = W.filter(x => x.w.includes(sub)); if (!m.length) { ISS.push(`${b.id}: no word "${sub}"`); return L.start; } return m[Math.min(k, m.length - 1)].t; };
  return {b, s: b.scene || {}, L, W, at};
}

window.ready = (async () => {
  S = await (await fetch(url('story.json'))).json(); TL = await (await fetch(url('timeline.json'))).json();
  DUR = TL.total; B = S.beats.map(parse).filter(Boolean);
  B.forEach((x, i) => { x.i = i; x.a = i ? x.L.start - .1 : 0; x.z = i + 1 < B.length ? B[i + 1].L.start - .1 : TL.end_start; });
  const imgs = [...new Set(B.map(x => x.s.img).filter(Boolean))].map(n => url('raw/' + n + '.png')).concat([url('el/' + LOGO()), url('el/' + BRANDLOGO())]);
  await Promise.all(imgs.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'قفل ChatGPT')));
  B.forEach(x => { x.keys = (HITS[x.s.type] || (() => []))(x).filter(v => v > x.a + .6 && v < x.z - .6).sort((p, q) => p - q); });
  const sc = [];
  for (const x of B) { const pts = [x.a, ...x.keys];
    pts.forEach((p, j) => sc.push({t0: +p.toFixed(2), t1: +(j + 1 < pts.length ? pts[j + 1] : x.z).toFixed(2), type: x.s.type, bg: x.b.id + (j ? '.' + j : ''), sfx: [[p, j ? 'hit' : 'whoosh', j ? .35 : .3]]})); }
  sc.push({t0: TL.end_start, t1: DUR, type: 'end', bg: 'end', sfx: [[TL.end_start + .1, 'hit', .45]]});
  if (sc.length && sc[0].type === 'hook') sc[0].sfx.push([.7, 'hit', .55]);
  window.SCENES = sc; window.START = 0; window.DURATION = DUR; window.ISSUES = ISS;
  for (const c of sc) if (c.t1 - c.t0 > 3.2) ISS.push(`shot ${c.bg} holds ${(c.t1 - c.t0).toFixed(1)} s: add a hit`);
  seek(0);
})();
const LOGO = () => (S.product || 'chatgpt').toLowerCase().replace(/[^a-z0-9]/g, '') + '.png';
const BRANDLOGO = () => (S.brand || 'openai').toLowerCase().replace(/[^a-z0-9]/g, '') + '.png';

// key moments inside a beat: each one is a screen-studio zoom (a new framing) so no idea holds still
const HITS = {
  hook: x => [x.at('قفل'), x.at('رمز')], peek: x => [x.at('جلوی')], intro: x => [x.at('اکتبر'), x.at('هشدار')], menu: x => [x.at('Lock')],
  pin: x => [x.at('Face')], folder: x => [x.at('Locked')], search: x => [x.at('جستجو')], plans: x => [x.at('Pro'), x.at('آروم')],
  warn: x => [x.at('یادت'), x.at('ریستش'), x.at('پاک')], support: x => [x.at('نمی‌تونه')], crypto: x => [x.at('رمزنگاری')], ask: x => []
};
// camera keys [time, scale, focusX, focusY]
const CAM = {
  hook: x => [[0, 1, 540, 960], [x.at('رمز'), 1.06, 540, 900]],
  peek: x => [[x.a, 1, 540, 960], [x.at('جلوی'), 1.12, 540, 1080]],
  intro: x => [[x.a, 1.2, 540, 900], [x.at('اکتبر'), 1, 540, 960], [x.at('هشدار'), 1.12, 540, 1150]],
  menu: x => [[x.a, 1, 540, 960], [x.a + 1.0, 1.18, 700, 640], [x.at('Lock'), 1.22, 640, 860]],
  pin: x => [[x.a, 1, 540, 960], [x.at('Face'), 1.12, 600, 860]],
  folder: x => [[x.a, 1.1, 540, 900], [x.at('Locked'), 1.2, 540, 980]],
  search: x => [[x.a, 1.15, 540, 620], [x.at('جستجو'), 1, 540, 960]],
  plans: x => [[x.a, 1, 540, 960], [x.at('Pro'), 1.1, 540, 900], [x.at('آروم'), 1.15, 540, 1200]],
  warn: x => [[x.a, 1, 540, 960], [x.at('یادت'), 1.14, 540, 820], [x.at('ریستش'), 1.04, 540, 900], [x.at('پاک'), 1.1, 540, 1080]],
  support: x => [[x.a, 1.1, 540, 900], [x.at('نمی‌تونه'), 1.18, 540, 1000]],
  crypto: x => [[x.a, 1, 540, 960], [x.at('رمزنگاری'), 1.14, 540, 900]],
  ask: x => [[x.a, 1, 540, 960]]
};
function camAt(x, t) {
  const k = (CAM[x.s.type] || (() => [[0, 1, 540, 960]]))(x);
  let i = 0; for (let j = 0; j < k.length; j++) if (t >= k[j][0]) i = j;
  const p = k[Math.max(0, i - 1)], q = k[i], m = i ? eio(lin(t, q[0], q[0] + .45)) : 1;
  return {s: mix(p[1], q[1], m) * (1 + .02 * lin(t, x.a, x.z)), x: mix(p[2], q[2], m), y: mix(p[3], q[3], m)};
}

function seek(t) {
  if (!B.length) return;
  NOW = t;
  let x = B[0]; for (const q of B) if (t >= q.a) x = q;
  const end = t >= TL.end_start, c = end ? {s: 1, x: 540, y: 960} : camAt(x, t);
  byId('cam').style.transform = `translate(540px,960px) scale(${c.s.toFixed(4)}) translate(${(-c.x).toFixed(1)}px,${(-c.y).toFixed(1)}px)`;
  const h = end ? endCard(t - TL.end_start) : scene(x, t);
  const st = byId('stage'); if (st._h !== h) { st._h = h; st.innerHTML = h; }
  const o = flood(t); const ov = byId('over'); if (ov._h !== o) { ov._h = o; ov.innerHTML = o; }
  const cp = end ? '' : caption(x, t); const ca = byId('caps'); if (ca._h !== cp) { ca._h = cp; ca.innerHTML = cp; }
}
// the black shape: at every beat change it floods out from a dot (0.25 s) and contracts away into the next scene (0.3 s)
function flood(t) {
  for (let i = 1; i <= B.length; i++) {
    const T0 = i < B.length ? B[i].a : TL.end_start;
    if (t > T0 - .1 && t < T0 + .16) {
      const r = t < T0 ? 2300 * eio(lin(t, T0 - .1, T0)) : 2300 * (1 - eio(lin(t, T0, T0 + .16)));
      const cx = i % 2 ? 760 : 320, cy = i % 3 ? 1100 : 760;
      return `<div class="a" style="left:${(cx - r).toFixed(0)}px;top:${(cy - r).toFixed(0)}px;width:${(2 * r).toFixed(0)}px;height:${(2 * r).toFixed(0)}px;border-radius:50%;background:var(--ink)"></div>`;
    }
  }
  return '';
}

// ---------- parts ----------
const logo = (f, s, bg = '#fff') => `<span style="display:inline-flex;align-items:center;justify-content:center;width:${s}px;height:${s}px;border-radius:${s * .26}px;background:${bg};vertical-align:middle;box-shadow:0 6px 18px rgba(0,0,0,.12)"><img src="${url('el/' + f)}" style="width:${s * .72}px;height:${s * .72}px;object-fit:contain"></span>`;
// text rising out of a mask line
const rise = (html, k, sz, col = 'var(--ink)') => `<span class="mask" style="font-size:${sz}px;line-height:1.25;color:${col}"><span style="display:inline-block;transform:translateY(${((1 - eo(k)) * 110).toFixed(1)}%)">${html}</span></span>`;
const pop = (t, t0) => cl(spr(t, t0, 18, .5), 0, 1.25);
function chip(html, x0, y0, sz, bg, fg, t, t0, dir = 'rtl') {
  const k = pop(t, t0); if (k <= 0) return '';
  return `<div class="a" style="left:${x0}px;top:${y0}px;padding:${sz * .16}px ${sz * .42}px ${sz * .26}px;border-radius:${sz}px;background:${bg};color:${fg};font:900 ${sz}px/1.15 V;white-space:nowrap;direction:${dir};transform:scale(${k.toFixed(3)});transform-origin:50% 50%">${html}</div>`;
}
function cursor(x0, y0, press) {
  return `<svg class="a" style="left:${x0}px;top:${y0}px;overflow:visible;transform:scale(${(1 - .18 * press).toFixed(3)});transform-origin:0 0" width="60" height="80"><path d="M0 0 L0 58 L15 45 L26 72 L37 67 L26 41 L46 41 Z" fill="#0E0E0E" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>` +
    (press > 0 ? `<div class="a" style="left:${x0 - 34}px;top:${y0 - 34}px;width:68px;height:68px;border-radius:50%;border:5px solid rgba(14,14,14,${(.5 * press).toFixed(2)});transform:scale(${(1 + (1 - press)).toFixed(2)})"></div>` : '');
}
// cursor path: list of [time, x, y, click?]; eased moves between points, a press dip on clicks
function cur(t, path) {
  let i = 0; for (let j = 0; j < path.length; j++) if (t >= path[j][0]) i = j;
  const p = path[i], q = path[Math.min(i + 1, path.length - 1)], m = q === p ? 0 : eio(lin(t, p[0] + .1, q[0]));
  let press = 0; for (const c of path) if (c[3]) press = Math.max(press, Math.exp(-((t - c[0]) ** 2) / .006));
  return cursor(mix(p[1], q[1], m), mix(p[2], q[2], m), press);
}
// six-blade iris over a photo (prompt build 5): open fraction k
function iris(img, x0, y0, d, k, t, a) {
  const R = d / 2, ap = R * mix(.0, 1.05, eo(k)), blades = [];
  for (let i = 0; i < 6; i++) { const th = i * Math.PI / 3 + (1 - k) * .9, ph = th + Math.PI / 3;
    const p1 = [R + ap * Math.cos(th), R + ap * Math.sin(th)], p2 = [R + ap * Math.cos(ph), R + ap * Math.sin(ph)];
    const far = 3 * R, q1 = [R + far * Math.cos(th + .3), R + far * Math.sin(th + .3)], q2 = [R + far * Math.cos(ph + .3), R + far * Math.sin(ph + .3)];
    blades.push(`<polygon points="${[p1, p2, q2, q1].map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="#0E0E0E" stroke="#2A2A2A" stroke-width="3"/>`); }
  const sc = mix(1.15, 1.02, lin(t, a, a + 4));
  return `<div class="a" style="left:${x0}px;top:${y0}px;width:${d}px;height:${d}px;border-radius:50%;overflow:hidden">` +
    `<img src="${url('raw/' + img + '.png')}" style="position:absolute;left:0;top:${-d * .35}px;width:${d}px;height:${d * 1.78}px;object-fit:cover;transform:scale(${sc.toFixed(3)})">` +
    `<svg class="a" style="left:0;top:0" width="${d}" height="${d}">${blades.join('')}</svg></div>`;
}
// rebuilt ChatGPT phone screen (black UI on white): header, bubbles; children drawn inside
function phone(x0, y0, w, h, inner, k = 1, tilt = 0) {
  return `<div class="a" style="left:${x0}px;top:${y0}px;width:${w}px;height:${h}px;border-radius:${w * .12}px;background:#0E0E0E;padding:14px;box-sizing:border-box;transform:translateY(${((1 - eo(k)) * 260).toFixed(1)}px) rotate(${tilt}deg);box-shadow:0 30px 60px rgba(0,0,0,.18)">` +
    `<div style="position:relative;width:100%;height:100%;border-radius:${w * .1}px;background:#fff;overflow:hidden">${inner}</div></div>`;
}
const head = (w, title = 'ChatGPT', dots = false) => `<div class="row" style="height:110px;padding:0 30px;gap:16px;direction:ltr;border-bottom:2px solid #EEE">${logo(LOGO(), 60)}<span style="font:900 42px V">${title}</span>${dots ? '<span style="margin-left:auto;font:900 46px V;letter-spacing:4px">···</span>' : ''}</div>`;
const bub = (x0, y0, w, h, dark) => `<div class="a" style="left:${x0}px;top:${y0}px;width:${w}px;height:${h}px;border-radius:${h / 2}px;background:${dark ? '#0E0E0E' : '#ECECF1'}"></div>`;
function padlock(cx, cy, s, k, col = '#0E0E0E') {
  if (k <= 0) return ''; const sh = 1 - cl((k - .6) / .4) * 0;
  return `<svg class="a" style="left:${cx - 70 * s}px;top:${cy - 90 * s}px;overflow:visible;transform:scale(${k.toFixed(3)});transform-origin:${70 * s}px ${90 * s}px" width="${140 * s}" height="${180 * s}" viewBox="0 0 140 180">` +
    `<path d="M30 80 V55 a40 40 0 0 1 80 0 V80" fill="none" stroke="${col}" stroke-width="18"/><rect x="10" y="78" width="120" height="96" rx="20" fill="${col}"/>` +
    `<circle cx="70" cy="118" r="13" fill="#fff"/><rect x="64" y="122" width="12" height="28" rx="5" fill="#fff"/></svg>`;
}
function faceRing(cx, cy, r, k, ok) {
  const L = 2 * Math.PI * r;
  return `<svg class="a" style="left:${cx - r - 10}px;top:${cy - r - 10}px;overflow:visible" width="${2 * r + 20}" height="${2 * r + 20}"><circle cx="${r + 10}" cy="${r + 10}" r="${r}" fill="none" stroke="${ok ? 'var(--gpt)' : '#0E0E0E'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${(L * (1 - eo(k))).toFixed(1)}" transform="rotate(-90 ${r + 10} ${r + 10})"/></svg>`;
}
const check = (cx, cy, s, k) => k <= 0 ? '' : `<div class="a" style="left:${cx - s / 2}px;top:${cy - s / 2}px;width:${s}px;height:${s}px;border-radius:50%;background:var(--gpt);color:#fff;display:flex;align-items:center;justify-content:center;font-size:${s * .6}px;transform:scale(${k.toFixed(3)})">✓</div>`;
let NOW = 0;
const FR = [[60, 140, 300, 70, .6], [720, 200, 260, 70, 1], [820, 1420, 220, 64, .8], [40, 1480, 280, 70, 1.2], [880, 980, 170, 60, .5], [30, 860, 160, 60, .9]];
const grid = () => `<div class="a" style="inset:0;background-image:radial-gradient(#D9D3C6 2.5px,transparent 2.5px);background-size:54px 54px;background-position:${(-NOW * 12).toFixed(1)}px ${(-NOW * 8).toFixed(1)}px"></div>` +
  `<img class="a" src="${url('el/' + LOGO())}" style="left:20px;top:440px;width:1040px;height:1040px;opacity:.045;transform:rotate(${(NOW * 6).toFixed(1)}deg)">` +
  FR.map(([x0, y0, w, h, sp], i) => `<div class="a" style="left:${x0}px;top:${(y0 - (NOW * 22 * sp) % 260).toFixed(1)}px;width:${w}px;height:${h}px;border-radius:${h / 2}px;background:${i % 3 ? '#fff' : '#0E0E0E'};opacity:${i % 3 ? .75 : .1};box-shadow:0 10px 24px rgba(0,0,0,.06)"></div>`).join('');

// ---------- captions: the spoken words, ≤ 4 per chunk, black pill (UI type), accent words in ChatGPT green ----------
function caption(x, t) {
  if (x.s.type === 'hook' && t < x.at('قفل') - .05) return hookTitle(x, t);
  if (t > x.L.end + .3) return '';
  const W = x.W; let j = 0; for (let q = 0; q < W.length; q++) if (t >= W[q].t - .05) j = q;
  const ch = []; let c = []; W.forEach((w, q) => { c.push(q); if (c.length === 4 || /[،؛.!؟?…:»]$/.test(w.w)) { ch.push(c); c = []; } }); if (c.length) ch.push(c);
  const now = ch.find(g => g.includes(j)), k = lin(t, W[now[0]].t - .05, W[now[0]].t + .2);
  const line = now.filter(q => t >= W[q].t - .05).map(q => W[q].h ? `<span style="color:#5EE3B8">${W[q].w}</span>` : W[q].w).join(' ');
  return `<div class="a" style="left:0;right:0;top:1570px;text-align:center"><span style="display:inline-block;padding:12px 42px 24px;border-radius:60px;background:#0E0E0E;color:#fff;font-size:76px;line-height:1.25;white-space:nowrap;transform:translateY(${((1 - eo(k)) * 26).toFixed(1)}px)">${line}</span></div>`;
}
function hookTitle(x, t) {
  // the cover's own headline, static from frame 0 (no mask rise here, so no half-drawn glyphs)
  return `<div class="a" style="left:0;right:0;top:1190px;text-align:center;color:#fff;font-size:124px;line-height:1.25;text-shadow:0 6px 0 rgba(0,0,0,.45),0 0 26px rgba(0,0,0,.55)">` +
    `<div>حالا می‌شه</div><div>چت‌های <span dir="ltr">ChatGPT</span></div>` +
    `<div style="margin-top:6px"><span style="display:inline-block;padding:0 40px 18px;border-radius:28px;background:#fff;color:#0E0E0E;text-shadow:none;transform:scale(${(1 + .12 * Math.exp(-7 * Math.max(0, t - .3)) * (t > .3 ? 1 : 0)).toFixed(3)})">رو قفل کرد</span></div></div>`;
}
// hook, second half: the phone screen now fills the frame as a rebuilt locked-chat UI on the paper ground
function bigLock(x, t) {
  const A = x.at('قفل') - .05, kr = lin(t, A + .1, A + .9), kd = Math.min(4, Math.floor(cl((t - x.at('رمز') + .1) / (BT / 2), 0, 4)));
  return grid() + phone(150, 260, 780, 1080, head(752) + bub(330, 170, 380, 80, true) + bub(30, 280, 520, 80) + bub(240, 390, 470, 80, true) +

        `<div class="a" style="left:500px;top:620px;font:900 90px V;transform:scale(${pop(t, A + .6).toFixed(3)})">≠</div>` + list;
    }
    case 'ask': {
      const k = lin(t, A, A + .6);
      return grid() + `<div class="a" style="left:240px;top:360px;width:600px;height:1000px;border-radius:70px;overflow:hidden;background:#0E0E0E;padding:14px;box-sizing:border-box;transform:scale(${mix(.6, 1, eo(k)).toFixed(3)})">` +
        `<img src="${url('raw/' + s.img + '.png')}" style="width:100%;height:100%;object-fit:cover;border-radius:58px"></div>` +
        padlock(540, 790, 1.5, pop(t, A + .4)) + chip('کدوم چتتو؟', 300, 1180, 90, '#0E0E0E', '#fff', t, A + .6);
    }
  }
  return grid();
}
// end card: last frame = first frame idea — the black pill with the logo, then the question rises
function endCard(u) {
  const w = mix(60, 820, eo(lin(u, 0, .5)));
  return grid() + `<div class="a" style="left:${540 - w / 2}px;top:620px;width:${w}px;height:220px;border-radius:110px;background:#0E0E0E"></div>` +
    `<div class="a row" style="left:0;right:0;top:640px;height:180px;justify-content:center;gap:24px;direction:ltr;color:#fff">${u > .4 ? logo(LOGO(), 110) : ''}${rise('ChatGPT', lin(u, .45, .8), 90, '#fff')}</div>` +
    `<div class="a" style="left:0;right:0;top:960px;text-align:center">${rise((S.end_text || '').replace(/\*([^*]+)\*/g, '<span style="color:var(--gpt)">$1</span>'), lin(u, .6, .95), 110)}</div>` +
    `<div class="a" style="left:0;right:0;top:1140px;text-align:center;font:600 60px V;color:var(--mute);opacity:${lin(u, .9, 1.2).toFixed(2)}">${S.end_sub || ''} · ${S.handle || ''}</div>`;
}
window.seek = seek;
</script>
