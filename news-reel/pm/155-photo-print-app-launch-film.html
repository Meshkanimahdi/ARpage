<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>meshkani.pro — keynote continuous-take UI film (prompt 155, v2)</title>
<!-- Skill motion-graphy-2026, prompt 155 "Photo print app launch film" (UI), rebuilt from the prompt text (2026-11-04).
     Kept from the prompt: an Apple-keynote film, 2D only, ONE continuous take where every scene is made out of the
     previous one; nothing fades or cuts: a black shape floods the frame from the cursor and contracts into the next
     scene; an iris of six blades snaps open onto a photo; text rises out of a mask line; icons and cards pop from zero
     on closed-form springs; bars draw across; a cursor drives every change with real clicks and drags; the camera
     pushes screen-studio style on each moment. Warm off-white canvas, black UI, one accent. Banned (kept): crossfades,
     blur-ins, 3D flips, particles, glows, holds longer than ~1 s without a change.
     Allowed edits: square → 1080x1920, 54 beats → the voiced length, photo-print app → the story's subject,
     downloaded SFX → per-event cues (page standard), the subtitle pill (page standard).
     Data: story.json beats[{id, text, speaker?, parts:[{at: word index, type, …}]}], theme{acc}, series_tag,
     end_text; plates raw/<id>.png. Part types: photo, vote, stats, phone, reminders, grid, choice, chat, cta, quote.
     Pure seek(t): every style is a function of t. -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --bg: #F3F0EA; --ink: #0E0E10; --mu: #6E6A64; --line: #D9D3C8; --acc: #E8552B; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); font-family: V; color: var(--ink); }
  #cam { position: absolute; inset: 0; transform-origin: 540px 860px; }
  .part { position: absolute; inset: 0; display: none; }
  .a { position: absolute; }
  .card { position: absolute; background: #fff; border-radius: 44px; box-shadow: 0 30px 70px rgba(20,16,10,.12); }
  .blk { position: absolute; background: var(--ink); color: #fff; border-radius: 44px; }
  .mask { overflow: hidden; }
  .mask > span { display: inline-block; }
  .t9 { font-weight: 900; } .t6 { font-weight: 600; }
  #flood { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); transform-origin: 50% 50%; pointer-events: none; }
  #cursor { position: absolute; left: 0; top: 0; width: 64px; height: 64px; z-index: 9; }
  #ring { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 6px solid var(--acc); z-index: 8; opacity: 0; }
  #sub { position: absolute; left: 60px; right: 60px; top: 1610px; text-align: center; z-index: 7; }
  #sub span.pill { display: inline-block; background: var(--ink); color: #fff; padding: 14px 40px 22px; border-radius: 36px; font: 900 58px/1.35 V; }
  #sub .w { display: inline-block; margin: 0 .12em; } #sub .k { color: var(--acc); }
  #tag { position: absolute; top: 120px; left: 0; right: 0; margin: auto; width: max-content; background: var(--ink); color: #fff; font: 900 46px V; padding: 10px 36px 18px; border-radius: 40px; z-index: 7; }
  #end { position: absolute; inset: 0; display: grid; place-items: center; z-index: 6; pointer-events: none; }
</style>
</head>
<body>
<div id="root"><div id="cam"></div><div id="flood"></div><div id="ring"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2 L3 20 L8 15 L11.5 22 L14.5 20.6 L11 13.6 L18 13.6 Z" fill="#0E0E10" stroke="#fff" stroke-width="1.4"/></svg>
  <div id="tag"></div><div id="sub"></div></div>
<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const U = s => s.startsWith('/') ? s : DIR + s, $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), P = (t, a, b) => clamp((t - a) / (b - a)), mix = (a, b, k) => a + (b - a) * k;
const eo = k => 1 - Math.pow(1 - k, 3), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
// closed-form spring step response (prompt build 2): 0 → 1 with a small overshoot
const spr = u => u <= 0 ? 0 : 1 - Math.exp(-6.5 * u) * Math.cos(11 * u);
const fa = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const h = (cls, css, html) => { const e = document.createElement('div'); if (cls) e.className = cls; if (css) e.style.cssText = css; if (html !== undefined) e.innerHTML = html; return e; };
let S, TL, PARTS = [], BEATS = [], END = 60; const ISSUES = []; const PLATES = ['A1', 'B1', 'A3', 'B3', 'A2', 'B2'];

// ---- part builders: each returns {el, cur: [[dt, x, y, click]], draw(u)} with u = seconds since the part began ----
const B = {};
B.photo = p => { const el = h('part'), img = h('a', `left:0;top:0;width:1080px;height:1920px;background:url(${U('raw/' + p.img + '.png')}) center/cover`);
  const iris = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); iris.setAttribute('viewBox', '0 0 1080 1920'); iris.style.cssText = 'position:absolute;inset:0';
  el.append(img, iris); const lab = h('a mask', `left:60px;right:60px;top:${p.first ? 330 : 1330}px;text-align:center`, `<span class="t9" style="font-size:${p.first ? 108 : 80}px;line-height:1.3;color:#fff;${p.first ? 'background:rgba(14,14,16,.82);padding:14px 40px 30px;border-radius:40px;' : ''}text-shadow:0 8px 30px rgba(0,0,0,.6);display:inline-block;max-width:900px">${esc(p.label || '')}</span>`); el.append(lab);
  return {el, cur: p.first ? [[0, 860, 1450, 1], [.6, 900, 1520, 0]] : [[0, 760, 1300, 0], [.5, 880, 1560, 1]], draw(u) {
    const k = p.first ? Math.max(.8, eo(P(u, 0, .35))) : eo(P(u, .45, .95)), R = mix(0, 1400, k), rot = mix(-60, 0, k);   // the hook opens at once   // six blades open from the click
    let d = 'M0 0 H1080 V1920 H0 Z '; for (let i = 0; i < 6; i++) { const a = (rot + i * 60) * Math.PI / 180; d += (i ? 'L' : 'M') + (540 + R * Math.cos(a)).toFixed(1) + ' ' + (960 + R * Math.sin(a)).toFixed(1) + ' '; } d += 'Z';
    iris.innerHTML = `<path d="${d}" fill="#0E0E10" fill-rule="evenodd"/>`;
    img.style.transform = `scale(${(1.14 - .08 * eo(P(u, .5, 4))).toFixed(4)})`;
    const kl = spr(u - (p.first ? .15 : 1.0)); lab.firstChild.style.transform = `translateY(${(1 - Math.min(1, kl)) * 140}px)`; } };
};
B.quote = p => { const el = h('part'), img = h('a', `left:90px;top:300px;width:900px;height:900px;border-radius:60px;background:url(${U('raw/' + p.img + '.png')}) center/cover;box-shadow:0 30px 80px rgba(0,0,0,.25)`);
  const q = h('a mask', 'left:90px;right:90px;top:1260px;text-align:center', `<span class="t9" style="font-size:84px;line-height:1.3">«${esc(p.text)}»</span>`);
  const who = h('a', 'left:0;right:0;top:1500px;text-align:center', `<span class="t6" style="font-size:44px;color:var(--mu)">${esc(p.who || '')}</span>`); el.append(img, q, who);
  return {el, cur: [[0, 600, 900, 0], [.8, 720, 1300, 1]], draw(u) { const k = spr(u - .1); img.style.transform = `scale(${(.6 + .4 * Math.min(1.04, k)).toFixed(4)})`;
    q.firstChild.style.transform = `translateY(${(1 - Math.min(1, spr(u - .6))) * 200}px)`; who.style.opacity = P(u, 1.1, 1.4); } };
};
B.vote = p => { const el = h('part'), card = h('card', 'left:110px;top:420px;width:860px;height:900px');
  card.append(h('a', 'left:60px;right:60px;top:60px;text-align:right', `<span class="t6" style="font-size:44px;color:var(--mu)">${esc(p.title)}</span>`));
  const rows = (p.rows || []).map((r, i) => { const y = 200 + i * 230; const tr = h('a', `left:60px;width:740px;top:${y}px;height:150px;border-radius:30px;background:#EFEBE4`);
    const bar = h('a', `right:60px;top:${y}px;height:150px;border-radius:30px;background:${r.acc ? 'var(--acc)' : 'var(--ink)'};width:0`);
    const lb = h('a', `right:100px;top:${y + 30}px;color:${r.share > .3 ? '#fff' : 'var(--ink)'}`, `<span class="t9" style="font-size:70px">${esc(r.label)}</span>`);
    const val = h('a', `left:100px;top:${y + 34}px`, `<span class="t9" style="font-size:66px"></span>`); card.append(tr, bar, lb, val); return {bar, val, r, y}; });
  const big = h('a mask', 'left:60px;right:60px;top:690px;text-align:center', `<span class="t9" style="font-size:78px">${esc(p.big || '')}</span>`); card.append(big); el.append(card);
  return {el, cur: [[0, 500, 1500, 0], [1.2, 300, 420 + 200 + 75, 1], [2.2, 300, 420 + 430 + 75, 1]], draw(u) {
    card.style.transform = `scale(${(.5 + .5 * Math.min(1.03, spr(u))).toFixed(4)})`;
    rows.forEach((o, i) => { const k = eo(P(u, .5 + i * .45, 1.3 + i * .45)); o.bar.style.width = (Math.max(.06, o.r.share) * 740 * k).toFixed(1) + 'px'; o.bar.style.opacity = k > 0 ? 1 : 0;
      o.val.firstChild.textContent = k > 0 ? fa(Math.round(o.r.value * k)) : ''; });
    big.firstChild.style.transform = `translateY(${(1 - Math.min(1, spr(u - 1.6))) * 120}px)`; } };
};
B.stats = p => { const el = h('part'); const cs = (p.items || []).map((it, i) => { const c = h(it.dark ? 'blk' : 'card', `left:110px;top:${360 + i * 560}px;width:860px;height:480px`);
    c.append(h('a', 'left:60px;right:60px;top:60px;text-align:right', `<span class="t6" style="font-size:48px;${it.dark ? 'color:#bbb' : 'color:var(--mu)'}">${esc(it.label)}</span>`));
    const v = h('a mask', 'left:60px;right:60px;top:170px;text-align:right', `<span class="t9" style="font-size:112px;${it.acc ? 'color:var(--acc)' : ''}">${esc(it.value)}</span>`); c.append(v);
    const ln = h('a', `right:60px;bottom:70px;height:16px;border-radius:8px;background:${it.acc ? 'var(--acc)' : (it.dark ? '#fff' : 'var(--ink)')};width:0`); c.append(ln); el.append(c); return {c, v, ln, i}; });
  return {el, cur: [[0, 800, 1500, 0], [.9, 500, 600, 1], [2.0, 500, 1160, 1]], draw(u) {
    cs.forEach(o => { const s = spr(u - .15 - o.i * .7); o.c.style.transform = `translateY(${(1 - Math.min(1, s)) * 300}px) scale(${(.85 + .15 * Math.min(1.02, s)).toFixed(4)})`; o.c.style.opacity = s > 0 ? 1 : 0;
      o.v.firstChild.style.transform = `translateY(${(1 - Math.min(1, spr(u - .45 - o.i * .7))) * 140}px)`; o.ln.style.width = (740 * eo(P(u, .8 + o.i * .7, 1.6 + o.i * .7))).toFixed(1) + 'px'; }); } };
};
B.phone = p => { const el = h('part'), ph = h('blk', 'left:190px;top:240px;width:700px;height:1300px;border-radius:90px'), scr = h('a', 'left:24px;top:24px;right:24px;bottom:24px;border-radius:70px;background:#fff;overflow:hidden'); ph.append(scr);
  scr.append(h('a', 'left:40px;right:40px;top:70px;text-align:right', `<span class="t9" style="font-size:60px;color:var(--ink)">${esc(p.app)}</span><br><span class="t6" style="font-size:34px;color:var(--mu)">${esc(p.sub || '')}</span>`));
  const rows = (p.rows || []).map((r, i) => { const e = h('a', `left:36px;right:36px;top:${290 + i * 190}px;height:160px;border-radius:34px;background:${i === (p.hi ?? -1) ? 'var(--acc)' : '#F1EEE8'}`,
      `<div style="position:absolute;right:34px;top:30px" class="t9"><span style="font-size:52px;${i === (p.hi ?? -1) ? 'color:#fff' : ''}">${esc(r[0])}</span></div><div style="position:absolute;left:34px;top:46px" class="t6"><span style="font-size:38px;color:${i === (p.hi ?? -1) ? '#fff' : 'var(--mu)'}">${esc(r[1] || '')}</span></div>`); scr.append(e); return e; });
  el.append(ph); const hi = p.hi ?? 0, ry = 240 + 24 + 290 + hi * 190 + 80;
  return {el, cur: [[0, 900, 1600, 0], [1.0, 600, ry, 1], [1.8, 600, ry, 0], [2.6, 360, 1450, 1]], draw(u) {
    ph.style.transform = `translateY(${(1 - Math.min(1, spr(u))) * 900}px)`;
    rows.forEach((e, i) => { const k = eo(P(u, .35 + i * .22, .7 + i * .22)); e.style.transform = `translateX(${(1 - k) * -700}px)`; });
    if (rows[hi]) { const d = eo(P(u, 1.8, 2.6)); rows[hi].style.transform = `translate(${d * -40}px, ${d * 120}px) scale(${1 + .06 * d})`; } } };
};
B.reminders = p => { const el = h('part'); el.append(h('a mask', 'left:0;right:0;top:250px;text-align:center', `<span class="t9" style="font-size:70px;color:#fff">${esc(p.title || '')}</span>`));
  const cs = (p.items || []).map((it, i) => { const c = h('card', `left:90px;top:${470 + i * 340}px;width:900px;height:280px`);
    const ic = h('a', `right:50px;top:60px;width:160px;height:160px;border-radius:50%;background:${i === 0 ? 'var(--acc)' : 'var(--ink)'};display:grid;place-items:center`, `<span class="t9" style="font-size:52px;color:#fff">${fa(i + 1)}</span>`);
    const tm = h('a', 'right:250px;top:46px', `<span class="t9" style="font-size:64px">${esc(it[0])}</span>`), tx = h('a', 'right:250px;top:150px', `<span class="t6" style="font-size:42px;color:var(--mu)"></span>`);
    c.append(ic, tm, tx); el.append(c); return {c, ic, tx, txt: it[1], i}; });
  return {el, cur: [[0, 540, 1600, 0], [.6, 860, 610, 1], [1.4, 860, 950, 1], [2.2, 860, 1290, 1]], draw(u) {
    el.firstChild.firstChild.style.transform = `translateY(${(1 - Math.min(1, spr(u))) * 120}px)`;
    cs.forEach(o => { const a = .4 + o.i * .8, s = spr(u - a); o.c.style.transform = `scale(${(.3 + .7 * Math.min(1.04, s)).toFixed(4)})`; o.c.style.opacity = s > 0 ? 1 : 0;
      o.ic.style.transform = `scale(${Math.min(1.1, spr(u - a - .15)).toFixed(3)})`; const n = Math.round(clamp((u - a - .15) / .35) * o.txt.length); o.tx.firstChild.textContent = o.txt.slice(0, n); }); } };
};
B.grid = p => { const el = h('part'); el.append(h('a mask', 'left:0;right:0;top:300px;text-align:center', `<span class="t9" style="font-size:76px;color:#fff">${esc(p.title || '')}</span>`));
  const cells = []; for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) { const e = h('a', `left:${100 + c * 128}px;top:${520 + r * 150}px;width:108px;height:120px;border-radius:24px;background:#E6E1D7`); el.append(e); cells.push(e); }
  return {el, cur: [[0, 540, 1500, 0], [.8, 200, 600, 1], [2.8, 880, 1150, 0]], draw(u) {
    el.firstChild.firstChild.style.transform = `translateY(${(1 - Math.min(1, spr(u))) * 130}px)`;
    cells.forEach((e, i) => { const on = P(u, .6 + i * .07, .75 + i * .07); e.style.background = on > 0 ? (i % 7 === 6 ? 'var(--acc)' : 'var(--ink)') : '#E6E1D7'; e.style.transform = `scale(${(1 - .25 * Math.sin(Math.PI * on)).toFixed(3)})`; }); } };
};
B.choice = p => { const el = h('part'), n = p.n, c = h(n === 1 ? 'blk' : 'card', 'left:90px;top:360px;width:900px;height:1140px');
  const num = h('a', 'right:70px;top:40px', `<span class="t9" style="font-size:300px;line-height:1;${n === 1 ? 'color:#fff' : 'color:var(--acc)'}">${fa(n)}</span>`);
  const tt = h('a mask', 'left:70px;right:70px;top:400px;text-align:right', `<span class="t9" style="font-size:66px;line-height:1.35;${n === 1 ? 'color:#fff' : ''}">${esc(p.title)}</span>`);
  const pros = (p.lines || []).map((l, i) => { const e = h('a', `left:70px;right:70px;top:${720 + i * 150}px;text-align:right`, `<span class="t6" style="font-size:46px;${n === 1 ? 'color:#ddd' : 'color:var(--mu)'}">${l[0] === '+' ? '✓ ' : '✕ '}${esc(l.slice(1))}</span>`); c.append(e); return e; });
  c.append(num, tt); el.append(c);
  return {el, cur: [[0, 540, 1600, 0], [.7, 820, 520, 1], [1.8, 500, 780, 0], [2.6, 500, 930, 0]], draw(u) {
    const s = spr(u); c.style.transform = `translateX(${(1 - Math.min(1, s)) * (n === 1 ? 1100 : -1100)}px) rotate(${(1 - Math.min(1, s)) * (n === 1 ? 6 : -6)}deg)`;
    num.style.transform = `scale(${Math.min(1.1, spr(u - .3)).toFixed(3)})`; tt.firstChild.style.transform = `translateY(${(1 - Math.min(1, spr(u - .6))) * 160}px)`;
    pros.forEach((e, i) => { const k = eo(P(u, 1.2 + i * .5, 1.6 + i * .5)); e.style.opacity = k; e.style.transform = `translateX(${(1 - k) * -80}px)`; }); } };
};
B.chat = p => { const el = h('part'), ph = h('card', 'left:120px;top:220px;width:840px;height:1300px;border-radius:70px;background:#fff');
  ph.append(h('a', 'left:0;right:0;top:50px;text-align:center', `<span class="t6" style="font-size:40px;color:var(--mu)">${esc(p.head || 'دستیار گوشی')}</span>`));
  const q = h('a', 'left:60px;top:190px;max-width:620px;background:#EFEBE4;border-radius:40px 40px 40px 12px;padding:28px 36px', `<span class="t6" style="font-size:44px;line-height:1.45">${esc(p.q)}</span>`);
  const a = h('a', 'right:60px;top:560px;max-width:660px;background:var(--ink);color:#fff;border-radius:40px 40px 12px 40px;padding:30px 38px', `<span class="t6" style="font-size:44px;line-height:1.45"></span>`);
  const doc = h('a', 'left:150px;right:150px;top:1010px;height:240px;border-radius:26px;border:5px solid var(--ink)'); const lines = [0, 1, 2].map(i => { const l = h('a', `right:36px;top:${46 + i * 62}px;height:16px;border-radius:8px;background:${i ? 'var(--line)' : 'var(--acc)'};width:0`); doc.append(l); return l; });
  ph.append(q, a, doc); el.append(ph);
  return {el, cur: [[0, 540, 1600, 0], [.6, 400, 300, 1], [2.0, 700, 680, 0], [3.0, 540, 1130, 1]], draw(u) {
    ph.style.transform = `scale(${(.7 + .3 * Math.min(1.02, spr(u))).toFixed(4)})`; q.style.transform = `scale(${Math.min(1.05, spr(u - .4)).toFixed(3)})`;
    a.style.transform = `scale(${Math.min(1.05, spr(u - 1.0)).toFixed(3)})`; a.firstChild.textContent = p.a.slice(0, Math.round(clamp((u - 1.1) / 1.6) * p.a.length));
    doc.style.opacity = u > 2.6 ? 1 : 0; lines.forEach((l, i) => l.style.width = (520 * [1, .8, .6][i] * eo(P(u, 2.7 + i * .25, 3.1 + i * .25))).toFixed(1) + 'px'); } };
};
B.cta = p => { const el = h('part'); el.append(h('a mask', 'left:0;right:0;top:280px;text-align:center', `<span class="t9" style="font-size:96px;color:#fff">${esc(p.title || '')}</span>`));
  const bs = [1, 2].map((n, i) => { const b = h(n === 1 ? 'blk' : 'card', `left:${i ? 110 : 570}px;top:560px;width:400px;height:520px;display:grid;place-items:center`, `<span class="t9" style="font-size:300px;${n === 2 ? 'color:var(--acc)' : 'color:#fff'}">${fa(n)}</span>`);
    el.append(b); return b; });
  el.append(h('a', 'left:80px;right:80px;top:1200px;text-align:center', `<span class="t6" style="font-size:50px;color:#eee">${esc(p.sub || '')}</span>`));
  el.append(h('a', 'left:0;right:0;top:1450px;text-align:center', `<span class="t9" style="font-size:40px;letter-spacing:4px;direction:ltr;display:inline-block;color:#fff">MESHKANI.PRO</span>`));
  return {el, cur: [[0, 540, 1500, 0], [.8, 770, 820, 1], [1.8, 310, 820, 1], [3.2, 770, 820, 1], [3.8, 310, 820, 1]], draw(u) {
    el.firstChild.firstChild.style.transform = `translateY(${(1 - Math.min(1, spr(u))) * 160}px)`;
    bs.forEach((b, i) => { const s = spr(u - .3 - i * .25), tap = Math.exp(-((u - .9 - i) ** 2) / .01) + Math.exp(-((u - 3.2 - i * .6) ** 2) / .01), bob = Math.sin((u - i) * 2.4) * 18 * P(u, 2.2, 2.8); b.style.transform = `translateY(${bob.toFixed(1)}px) scale(${(Math.min(1.04, s) * (1 - .08 * tap)).toFixed(4)})`; }); } };
};

window.ready = (async () => {
  S = await (await fetch(U('story.json'))).json(); TL = await (await fetch(U('timeline.json'))).json(); END = TL.total;
  if (S.theme && S.theme.acc) document.documentElement.style.setProperty('--acc', S.theme.acc);
  $('tag').textContent = S.series_tag || ''; if (!S.series_tag) $('tag').remove();
  const shown = t => t.replace(/\[[^\]]*\]/g, '').replace(/\{([^|}]*)\|[^}]*\}/g, '$1').replace(/\|/g, ' ').trim().split(/\s+/);
  for (const bt of S.beats) { const L = TL.lines[bt.id]; if (!L) throw new Error('unknown line ' + bt.id);
    const raw = shown(bt.text), words = raw.map(w => ({w: w.replace(/\*/g, ''), k: /\*/.test(w)}));
    let on = false; raw.forEach((w, i) => { if (w.startsWith('*')) on = true; words[i].k = on || words[i].k; if (/\*[.…!؟?،:]*$/.test(w)) on = false; });
    const wt = j => { const wi = Math.round(j * (L.words.length - 1) / Math.max(1, words.length - 1)); return (L.words[wi] || [L.start])[0]; };
    BEATS.push({bt, L, words, wt}); }
  BEATS.forEach((b, i) => { b.a = b.L.start; b.b = i + 1 < BEATS.length ? BEATS[i + 1].L.start : TL.end_start; });
  const cam = $('cam');
  for (const b of BEATS) for (const p of b.bt.parts) { const f = B[p.type]; if (!f) { ISSUES.push('unknown part ' + p.type); continue; }
    const o = f(p);
    if (p.type !== 'photo' && p.type !== 'quote') {   // prompt: UI over the photos — a dimmed plate behind every UI scene
      const pl = p.bg || PLATES[PARTS.length % PLATES.length]; const bgd = h('a', `left:-40px;top:-40px;width:1160px;height:2000px;background:url(${U('raw/' + pl + '.png')}) center/cover;filter:brightness(.42) saturate(.85);z-index:-1`); o.el.append(bgd); o.el.style.zIndex = 0; o.bgd = bgd; }
    o.t0 = p.at ? b.wt(p.at) - .05 : (b === BEATS[0] ? 0 : b.a - .1); o.p = p; cam.append(o.el); PARTS.push(o); }
  PARTS.sort((x, y) => x.t0 - y.t0); PARTS[0].t0 = 0;
  PARTS.forEach((o, i) => { o.t1 = i + 1 < PARTS.length ? PARTS[i + 1].t0 : END; if (o.t1 - o.t0 > 4 && i < PARTS.length - 1) ISSUES.push(`part ${o.p.type} lasts ${(o.t1 - o.t0).toFixed(1)}s (> 4 s)`); });
  await document.fonts.ready; await Promise.all(['600', '900'].map(w => document.fonts.load(`${w} 40px V`, 'آزمایش AI')));
  await Promise.all([...new Set(S.beats.flatMap(b => b.parts.map(q => q.img).filter(Boolean)).concat(PLATES))].map(id => new Promise(res => { const im = new Image(); im.onload = () => im.decode().then(res, res); im.onerror = () => { ISSUES.push('missing plate ' + id); res(); }; im.src = U('raw/' + id + '.png'); })));
  window.START = 0; window.DURATION = END; window.ISSUES = ISSUES;
  // sound cues written from the motion (§00.22): flood = low swell, iris = shutter tick, click = tap, card spring = pop, bar draw = tick run, typing = keys
  const SFX = {photo: [[.45, 'click', .5]], vote: [[1.2, 'tap', .45], [2.2, 'tap', .45]], stats: [[.15, 'pop', .4], [.85, 'pop', .4]], phone: [[1.0, 'tap', .45], [1.8, 'glass_ping', .35]],
    reminders: [[.4, 'pop', .35], [1.2, 'pop', .35], [2.0, 'pop', .35]], grid: [[.6, 'tick', .25], [1.6, 'tick', .25]], choice: [[.2, 'hit', .4], [.7, 'tap', .4]], chat: [[.4, 'notify', .35], [1.0, 'notify', .35]], cta: [[.9, 'tap', .5], [1.9, 'tap', .5]], quote: [[.1, 'hit', .35]]};
  window.SCENES = PARTS.map(o => ({t0: o.t0, t1: o.t1, type: o.p.type, sfx: (SFX[o.p.type] || []).map(([d, n, v]) => [o.t0 + d, n, v])}));
  seek(0);
})();

function cursorAt(o, u) { const c = o.cur; let x = c[0][1], y = c[0][2];
  for (let i = 1; i < c.length; i++) { const k = spr((u - c[i - 1][0]) * 1.4 - .2); if (u >= c[i - 1][0]) { x = mix(c[i - 1][1], c[i][1], Math.min(1, k)); y = mix(c[i - 1][2], c[i][2], Math.min(1, k)); } }
  let click = 0; for (const [d, , , cl] of c) if (cl) click = Math.max(click, Math.exp(-((u - d - .45) ** 2) / .006));
  return {x, y, click}; }

function seek(t) {
  if (!PARTS.length) return;
  let i = 0; for (let k = 0; k < PARTS.length; k++) if (t >= PARTS[k].t0) i = k;
  const o = PARTS[i], u = t - o.t0;
  PARTS.forEach((q, k) => q.el.style.display = k === i ? 'block' : 'none'); o.draw(u);
  if (o.bgd) o.bgd.style.transform = `scale(${(1.02 + .05 * P(u, 0, 6)).toFixed(4)}) translateY(${(-30 * P(u, 0, 6)).toFixed(1)}px)`;
  // camera: screen-studio push on each part
  $('cam').style.transform = `scale(${(1 + .05 * eio(P(u, .2, Math.max(1, o.t1 - o.t0)))).toFixed(4)})`;
  // cursor drives every change
  const c = cursorAt(o, u), cu = $('cursor'); cu.style.transform = `translate(${c.x}px, ${c.y}px) scale(${1 - .18 * c.click})`;
  const rg = $('ring'); rg.style.opacity = (c.click * .9).toFixed(3); rg.style.transform = `translate(${c.x - 50}px, ${c.y - 50}px) scale(${.6 + .8 * (1 - c.click)})`;
  // black flood: grows from the cursor before the next part, covers, then contracts into the new scene (no cuts, no fades)
  const fl = $('flood'), nx = PARTS[i + 1]; let r = 0, fx = c.x, fy = c.y;
  if (nx && t > nx.t0 - .3) { r = eio(P(t, nx.t0 - .3, nx.t0)) * 2400; }
  else if (i > 0 && u < .35) { r = (1 - eio(P(u, 0, .35))) * 2400; const pc = cursorAt(o, 0); fx = 540; fy = 960; }
  fl.style.transform = `translate(${fx - 5}px, ${fy - 5}px) scale(${(r / 5).toFixed(2)})`; fl.style.display = r > 1 ? 'block' : 'none';
  // subtitle: up to 4 words of the current line
  let b = BEATS[0]; for (const x of BEATS) if (t >= x.a - .1) b = x;
  const sub = $('sub'), lineOn = t >= b.a - .05 && t <= b.L.end + .3 && t < TL.end_start;
  if (lineOn) { let j = 0; for (let q = 0; q < b.words.length; q++) if (t >= b.wt(q) - .04) j = q;
    const c0 = Math.floor(j / 4) * 4, key = b.bt.id + ':' + c0;
    if (sub._k !== key) { sub._k = key; sub.innerHTML = `<span class="pill">${b.words.slice(c0, c0 + 4).map((w, q) => `<span class="w${w.k ? ' k' : ''}" data-i="${q}">${esc(w.w)}</span>`).join(' ')}</span>`; }
    [...sub.querySelectorAll('.w')].forEach(el => { const tw = b.wt(c0 + +el.dataset.i), k = eo(P(t, tw - .04, tw + .14)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * 14}px)`; });
  } else { sub.innerHTML = ''; sub._k = null; }
  const tg = $('tag'); if (tg) tg.style.transform = `translateY(${(1 - Math.min(1, spr(t - .2))) * -200}px)`;
}
window.seek = seek;
</script>
