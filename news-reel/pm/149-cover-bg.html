<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#1F1D1B}</style></head><body>
<svg width="1080" height="1920" style="position:absolute"><defs><filter id="pn"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .9  0 0 0 0 .85  0 0 0 0 .8  1.1 0 0 0 -.45"/></filter>
<radialGradient id="glow" cx="50%" cy="36%" r="50%"><stop offset="0" stop-color="#FF5A36" stop-opacity=".32"/><stop offset="1" stop-color="#FF5A36" stop-opacity="0"/></radialGradient>
<filter id="ds"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-opacity=".5"/></filter></defs>
<rect width="1080" height="1920" fill="url(#glow)"/><rect width="1080" height="1920" filter="url(#pn)" opacity=".3"/>
<g filter="url(#ds)">
 <circle cx="350" cy="570" r="120" fill="#F3EEE4"/><circle cx="370" cy="590" r="52" fill="#1B1A18"/><circle cx="388" cy="570" r="16" fill="#fff"/>
 <circle cx="730" cy="570" r="120" fill="#F3EEE4"/><circle cx="750" cy="590" r="52" fill="#1B1A18"/><circle cx="768" cy="570" r="16" fill="#fff"/>
 <path d="M 790 700 C 815 750, 850 790, 850 830 A 60 60 0 0 1 730 830 C 730 790, 765 750, 790 700 Z" fill="#9EC1FF"/>
</g>
<g id="m" filter="url(#ds)"></g>
</svg>
<script>
let r='';const n=30;for(let i=0;i<n;i++){const u=i/(n-1),x=170+u*740,yc=850+Math.sin(u*Math.PI)*140,a=Math.abs(Math.sin(i*.6+1)*Math.sin(i*.27+.4))*.8+.2,h=170*a*(0.5+Math.sin(u*Math.PI)*.6);
r+=`<rect x="${x-9}" y="${yc-h/2}" width="18" height="${h}" rx="9" fill="#FF5A36"/>`}
document.getElementById('m').innerHTML=r;
</script></body></html>
