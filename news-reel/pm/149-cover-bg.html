<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#1F1D1B}
</style></head><body>
<svg width="1080" height="1920" style="position:absolute"><defs><filter id="pn"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .9  0 0 0 0 .85  0 0 0 0 .8  1.1 0 0 0 -.45"/></filter>
<radialGradient id="glow" cx="50%" cy="34%" r="45%"><stop offset="0" stop-color="#FF5A36" stop-opacity=".35"/><stop offset="1" stop-color="#FF5A36" stop-opacity="0"/></radialGradient>
<filter id="ds"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-opacity=".45"/></filter></defs>
<rect width="1080" height="1920" fill="url(#glow)"/><rect width="1080" height="1920" filter="url(#pn)" opacity=".3"/>
<g id="w"></g>
<g filter="url(#ds)" transform="translate(560 860)"><path d="M 0 -150 C 40 -80, 110 0, 110 70 A 110 110 0 0 1 -110 70 C -110 0, -40 -80, 0 -150 Z" fill="#F3EEE4"/><path d="M -50 40 A 60 60 0 0 0 0 110" stroke="#C9D8EE" stroke-width="16" fill="none" stroke-linecap="round"/></g>
</svg>
<script>
let r='';for(let i=0;i<36;i++){const a=Math.abs(Math.sin(i*.5+1)*Math.sin(i*.21+.4))*.85+.15,h=760*a,x=40+i*28;r+=`<rect x="${x}" y="${560-h/2}" width="18" height="${h}" rx="9" fill="#FF5A36"/>`}
document.getElementById('w').innerHTML=r;
</script></body></html>
