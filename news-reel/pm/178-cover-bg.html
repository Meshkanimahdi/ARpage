<!doctype html><html><head><meta charset="utf-8"><title>cover bg 178</title>
<!-- Cover background for prompt 178 reels, drawn in code (no text): riso spot inks, halftone, misregistration, the hair and nail Pins and the red Guide dot from the reel. -->
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F4EFE6} svg{position:absolute;left:0;top:0} .m{mix-blend-mode:multiply}</style></head><body>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const INK = {pink: '#FF48B0', yel: '#FFE800', blue: '#0078BF', green: '#00A95C', red: '#E60023', ink: '#1D1A2F'};
const HT = `<defs>${Object.entries(INK).map(([k, c]) => `<pattern id="ht-${k}" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(22)"><circle cx="7" cy="7" r="4.2" fill="${c}"/></pattern>`).join('')}</defs>`;
function hairArt(x, y, w, h, seed = 0) {
  const cx = x + w / 2, cy = y + h * .52, s = w / 400;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${28 * s}" fill="INK"/>`.replace('INK', seed % 2 ? INK.yel : INK.pink) +
    `<g transform="translate(${cx} ${cy}) scale(${s})">
      <path d="M -150 -40 C -160 -200, 160 -200, 150 -40 L 165 150 C 120 175, 60 160, 40 120 L -40 120 C -60 160, -120 175, -165 150 Z" fill="${INK.blue}"/>
      <path d="M -165 70 L 165 70 L 165 150 C 120 175, 60 160, 40 120 L -40 120 C -60 160, -120 175, -165 150 Z" fill="url(#ht-yel)"/>
      <ellipse cx="0" cy="10" rx="92" ry="118" fill="#F6C9A8"/>
      <path d="M -100 -60 C -60 -150, 80 -150, 110 -40 C 40 -90, -40 -90, -100 -60 Z" fill="${INK.blue}"/>
      <circle cx="-34" cy="10" r="9" fill="${INK.ink}"/><circle cx="34" cy="10" r="9" fill="${INK.ink}"/><path d="M -24 62 Q 0 80 24 62" stroke="${INK.red}" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M -50 150 L 50 150 L 70 230 L -70 230 Z" fill="#F6C9A8"/><path d="M -190 300 Q 0 180 190 300 L 190 330 L -190 330 Z" fill="${INK.green}"/></g>`;
}
function nailArt(x, y, w, h, seed = 1, nailCol = INK.red) {
  const s = w / 400, cx = x + w / 2, cy = y + h * .6;
  let fingers = ''; [-105, -35, 35, 105].forEach((fx, i) => { const L = [170, 210, 200, 160][i];
    fingers += `<rect x="${fx - 30}" y="${-L}" width="60" height="${L + 40}" rx="30" fill="#F6C9A8"/><path d="M ${fx - 22} ${-L + 52} C ${fx - 24} ${-L + 8}, ${fx - 6} ${-L - 22}, ${fx} ${-L - 26} C ${fx + 6} ${-L - 22}, ${fx + 24} ${-L + 8}, ${fx + 22} ${-L + 52} Z" fill="${nailCol}"/><path d="M ${fx - 8} ${-L} q 4 -16 10 -18" stroke="#fff" stroke-width="6" opacity=".6" fill="none"/>`; });
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${28 * s}" fill="${seed % 2 ? INK.blue : INK.green}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${28 * s}" fill="url(#ht-pink)" opacity=".5"/>` +
    `<g transform="translate(${cx} ${cy}) scale(${s})">${fingers}<rect x="-140" y="10" width="280" height="200" rx="70" fill="#F6C9A8"/><path d="M 140 60 Q 200 40 190 140 L 130 160 Z" fill="#F6C9A8"/></g>`;
}

const g=(inner,cls='')=>`<svg class="${cls}" width="1080" height="1920" viewBox="0 0 1080 1920">${HT}${inner}</svg>`;
document.body.innerHTML =
 g(`<circle cx="1000" cy="1000" r="560" fill="${INK.yel}"/><circle cx="40" cy="1560" r="460" fill="${INK.green}"/><rect x="-80" y="820" width="700" height="900" fill="url(#ht-pink)" transform="rotate(-8 300 1200)"/><circle cx="900" cy="1840" r="380" fill="${INK.blue}"/>`,'m') +
 g(`<rect x="0" y="0" width="1080" height="720" fill="${INK.ink}"/><g fill="${INK.blue}" opacity=".55">${Array.from({length: 12*18}, (_, n) => { const x = 30 + (n % 18) * 60 + (Math.floor(n / 18) % 2) * 30, y = 30 + Math.floor(n / 18) * 60, f = .5 + .5 * Math.sin((x + y) / 200); return `<circle cx="${x}" cy="${y}" r="${4 + 12 * f}"/>`; }).join('')}</g>`) +
 g(`<g transform="translate(330 1260) rotate(-7) translate(-330 -1260)"><rect x="98" y="878" width="480" height="620" rx="36" fill="${INK.ink}"/>${hairArt(80,860,480,620,0)}</g>`) +
 g(`<path d="M 560 1150 C 620 1090, 660 1090, 700 1120" stroke="${INK.ink}" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M 690 1090 L 730 1130 L 680 1150 Z" fill="${INK.ink}"/>`) +
 g(`<g transform="translate(830 1330) rotate(6) translate(-830 -1330)"><rect x="638" y="958" width="400" height="560" rx="30" fill="${INK.ink}"/><rect x="620" y="940" width="400" height="560" rx="30" fill="#FFFDF8"/><rect x="620" y="940" width="400" height="110" rx="30" fill="${INK.red}"/>
   <rect x="660" y="1100" width="300" height="70" rx="35" fill="${INK.pink}"/><rect x="660" y="1200" width="240" height="70" rx="35" fill="${INK.yel}"/><rect x="660" y="1300" width="280" height="70" rx="35" fill="${INK.blue}"/>
   <path d="M 700 1440 C 696 1400, 712 1380, 720 1374 C 728 1380, 744 1400, 740 1440 Z" fill="${INK.red}"/><path d="M 780 1440 C 776 1400, 792 1380, 800 1374 C 808 1380, 824 1400, 820 1440 Z" fill="${INK.red}"/></g>`) +
 g(`<circle cx="590" cy="900" r="90" fill="${INK.red}"/><circle cx="562" cy="872" r="18" fill="#fff" opacity=".3"/>`) +
 g(`<rect x="0" y="0" width="1080" height="1920" filter="url(#n)" opacity=".35"/><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .2 0 0 0 0 .18 0 0 0 0 .25 0 0 0 -1.6 1.05"/></filter>`,'m');
</script></body></html>
