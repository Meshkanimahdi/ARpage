<title>meshkani.pro — product walkthrough explainer (prompt 055)</title>
<!-- Skill motion-graphy-2026, prompt 055 "Datagran ChatGPT ads explainer" (EXPL), built as its own engine (REEL-072, 2026-11-25).
     Structure kept from the prompt: one user's journey through a product; ONE through-line object taken from the product
     (here the red unread dot of a chat) that changes role in every scene and becomes the dot of the end card; the real UI
     rebuilt as vector layers that move on their own, driven by a cursor with real clicks; screen-studio camera (1.0 → 1.04
     per scene plus a short kick, never still); one typeface; one accent colour used only on the through-line object and the
     key word; springs with a small overshoot; nothing appears from nothing (it grows, unfolds or is revealed by a mask);
     scene changes are match cuts: the next ground opens as a circle from the spot where the dot rested.
     Banned by the prompt and not used: particle bursts, glows, lens flares, camera shake, RGB split, crossfades, gradients.
     Page standards: 1080x1920, Persian narration (eleven_v4) with a word-by-word caption, library music, motion-matched SFX.
     Data: story.json beats[{id, text, scene{type}}] with types hook, brand, recipe, saved, trip, perm, ask (set "muse");
     el/instagram.png and el/meta.png (official logos). ?cover=1 draws the cover background instead of the film.
     Pure seek(t): every style is computed from t; no CSS animations, timers or Math.random. -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --acc: #FF3040; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #15131A; }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: V; font-weight: 900; }
  #cam { position: absolute; inset: 0; transform-origin: 540px 900px; }
  #stage { position: absolute; inset: 0; }
  .sc { position: absolute; inset: 0; overflow: hidden; isolation: isolate; }
  .a { position: absolute; }
  .c { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; line-height: 1.25; }
  .w6 { font-weight: 600; }
  .tex { position: absolute; inset: 0; pointer-events: none; }
  #sub { position: absolute; left: 50px; right: 50px; top: 1500px; height: 150px; display: flex; align-items: center; justify-content: center; z-index: 9; }

<body>
<div id="root">
  <div id="cam"><div id="stage"></div></div>
  <svg class="tex" id="texL" width="1080" height="1920" style="mix-blend-mode:multiply"><filter id="tl"><feTurbulence type="fractalNoise" baseFrequency=".009 .013" numOctaves="3" seed="5"/><feColorMatrix values="0 0 0 0 .56  0 0 0 0 .52  0 0 0 0 .5  0 0 0 1.2 -.38"/></filter><rect width="1080" height="1920" filter="url(#tl)"/></svg>
  <svg class="tex" id="texD" width="1080" height="1920" style="mix-blend-mode:screen"><filter id="td"><feTurbulence type="fractalNoise" baseFrequency=".007 .011" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .36  0 0 0 0 .52  0 0 0 .8 -.22"/></filter><rect width="1080" height="1920" filter="url(#td)"/></svg>
  <div id="sub"></div>
</div>
<script>
const Q = new URLSearchParams(location.search), COVER = location.search.startsWith('?cover'), DIR = Q.get('dir') || Q.get('cover?dir') || '/work/story/';   // reel_render.mjs --page=pm/055-….html?cover draws the cover background
const U = s => s.startsWith('/') ? s : DIR + s, $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, k) => a + (b - a) * k, pr = (t, a, b) => cl((t - a) / (b - a));
const ex = k => 1 - Math.pow(2, -10 * cl(k));                                            // exponential ease-out
const spring = k => { k = cl(k); return 1 - Math.exp(-7 * k) * Math.cos(9 * k) * (1 - k * .2); };   // small overshoot (~8%)
const sp = (t, a, d = .55) => t < a ? 0 : spring((t - a) / d);                           // spring that starts at time a
const io = k => { k = cl(k); return k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; };
const fa = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const ISSUES = [];
let S, TL, B = [], END = 40;
const DARK = {hook: 0, brand: 1, recipe: 0, saved: 1, trip: 0, perm: 1, ask: 0, end: 1};
const TH = d => d ? {bg: '#15131A', fg: '#F4F2EE', mu: '#A39FAD', card: '#24212C', line: '#3A3644', grid: '#302C3A'}
                  : {bg: '#F4F2EE', fg: '#15131A', mu: '#8C8894', card: '#FFFFFF', line: '#E4E0D9', grid: '#D3CEC5'};
// where the through-line dot rests at the end of each scene: the next scene opens as a circle from this point (match cut)
const REST = {hook: [112, 828], brand: [540, 420], recipe: [499, 847], saved: [350, 392], trip: [176, 700], perm: [540, 1090], ask: [150, 1100]};

const A = (css, inner = '') => `<div class="a" style="${css}">${inner}</div>`;
const txt = (s, y, size, col, extra = '') => `<div class="c" style="top:${y}px;font-size:${size}px;color:${col};${extra}">${s}</div>`;
const mask = k => `clip-path:inset(-10% 0 -10% ${((1 - cl(k)) * 100).toFixed(1)}%);transform:translateY(${((1 - cl(k)) * 36).toFixed(1)}px);`;   // RTL wipe from the right
const acc = s => `<span style="color:var(--acc)">${s}</span>`, ltr = s => `<span dir="ltr" style="display:inline-block">${s}</span>`;
const bar = (css, w, h, col) => A(`${css};width:${w}px;height:${h}px;border-radius:${h / 2}px;background:${col}`);
const dot = (x, y, r, inner = '', extra = '') => A(`left:${(x - r).toFixed(1)}px;top:${(y - r).toFixed(1)}px;width:${(2 * r).toFixed(1)}px;height:${(2 * r).toFixed(1)}px;border-radius:50%;background:var(--acc);z-index:6;${extra}`, inner);
const chipH = (s, size, bg, fg, k, extra = '') => `<span style="display:inline-block;padding:${size * .2}px ${size * .55}px ${size * .36}px;border-radius:${size * .5}px;background:${bg};color:${fg};font-size:${size}px;white-space:nowrap;transform:scale(${cl(k, 0, 1.2).toFixed(3)});${extra}">${s}</span>`;
const TAG = col => `<span class="w6" style="font-size:30px;color:${col}">بازسازیِ نمایشی</span>`;
function cursor(x, y, t, tc) {
  const press = tc !== undefined && t >= tc ? Math.exp(-8 * (t - tc)) : 0, ring = tc !== undefined && t >= tc ? pr(t, tc, tc + .45) : 1;
  return `<svg class="a" style="left:0;top:0;z-index:8" width="1080" height="1920" viewBox="0 0 1080 1920">${ring < 1 ? `<circle cx="${x}" cy="${y}" r="${24 + ring * 80}" fill="none" stroke="#15131A" stroke-width="${7 * (1 - ring)}"/>` : ''}
    <g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(1 - .18 * press).toFixed(3)})"><path d="M0 0 L0 74 L18 58 L32 90 L46 84 L32 52 L56 52 Z" fill="#fff" stroke="#15131A" stroke-width="6" stroke-linejoin="round"/></g></svg>`;
}
const glide = (t, pts) => { let p = pts[0]; for (let i = 1; i < pts.length; i++) { const q = pts[i]; if (t >= pts[i - 1][0]) { const k = io(pr(t, pts[i - 1][0], q[0])); p = [0, mix(pts[i - 1][1], q[1], k), mix(pts[i - 1][2], q[2], k)]; } } return [p[1], p[2]]; };
const W = (b, s) => { const i = b.words.findIndex(w => w.w.includes(s)); return b.wt(i < 0 ? 0 : i); };   // time of the word that says s
const ground = (P, t) => A(`left:-60px;top:-60px;right:-60px;bottom:-60px;background-color:${P.bg}`) +
  A(`left:-60px;top:-60px;right:-60px;bottom:-60px;background-image:radial-gradient(circle, ${P.grid} 3.4px, transparent 3.9px);background-size:54px 54px;transform:translate(${((t * 7) % 54).toFixed(1)}px,${((t * 10) % 54).toFixed(1)}px)`);
const wrap = (h, d, t, clip) => `<div class="sc" style="${clip ? `clip-path:circle(${clip[2].toFixed(0)}px at ${clip[0]}px ${clip[1]}px)` : ''}">${ground(TH(d), t)}${h}</div>`;
// one chat row of the direct-message list (drawn, never a screenshot)
const row = (P, y, name, badge, hi, press = 0) => A(`left:24px;right:24px;top:${y.toFixed(1)}px;height:144px;border-radius:36px;background:${hi ? '#FFE9EB' : 'transparent'};transform:scale(${(1 - .03 * press).toFixed(3)})`,
  A(`right:22px;top:22px;width:100px;height:100px;border-radius:50%;background:${hi ? P.fg : '#E7E2DA'}`) +
  (name ? A('right:150px;top:16px;font-size:54px;color:' + P.fg, ltr(name)) + A('right:150px;top:88px', `<span class="w6" style="font-size:36px;color:${P.mu}">پیامِ جدید</span>`)
        : bar('right:150px;top:36px', 250, 28, '#D8D3CA') + bar('right:150px;top:86px', 410, 22, '#E7E2DA')) +
  (badge ? A(`left:30px;top:44px;min-width:56px;height:56px;border-radius:28px;background:${P.fg};color:${P.bg};font-size:32px;line-height:54px;text-align:center`, badge) : ''));
const dmHead = (P) => `<img src="${U('el/instagram.png')}" style="position:absolute;right:44px;top:32px;width:76px;height:76px">` + A('right:146px;top:30px;font-size:56px;color:' + P.fg, 'دایرکت‌ها') + A('left:44px;top:50px', TAG(P.mu)) + A(`left:0;right:0;top:140px;height:4px;background:${P.line}`);
const panel = (P, x, y, w, h, inner, extra = '') => A(`left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:56px;background:${P.card};box-shadow:0 30px 70px rgba(21,19,26,.14);overflow:hidden;${extra}`, inner);

const SCN = {
  // 1 — hook: the headline is printed from frame 0; the dot drops beside it and lands on the new Muse chat; a catch-up card unfolds out of it
  hook(b, t, u) { const P = TH(0); let h = '';
    h += txt(`اینستا یه ${ltr('AI')} گذاشت`, 170, 112, P.fg) + txt(`وسطِ ${acc('دایرکت‌ها')}`, 318, 150, P.fg);
    const kin = sp(u, -.2, .5), tc = 1.1, press = u >= tc ? Math.exp(-8 * (u - tc)) : 0;
    let rows = row(P, 160, 'Muse', '', 1, press).replace('transform:scale(', `transform-origin:50% 0;opacity:${cl(kin * 3)};transform:scaleY(${cl(kin, 0, 1.06).toFixed(3)}) scale(`);
    [['', '۳'], ['', '۷'], ['', '۱۲'], ['', '۲']].forEach((r, i) => rows += row(P, 160 + i * 150 + 150 * Math.min(1.03, kin), r[0], r[1], 0));
    h += panel(P, 60, 590, 960, 850, dmHead(P) + rows);
    const kd = pr(u, .05, .45), ky = kd * kd, land = sp(u, .45, .5), dy = mix(-70, 828, ky), sq = u > .45 ? 1 + .25 * Math.exp(-9 * (u - .45)) * Math.cos((u - .45) * 22) : 1;
    const ts = 1.2, ks = sp(u, ts, .6);
    h += A(`left:150px;top:900px;width:800px;height:470px;border-radius:44px;background:${P.fg};transform-origin:0 0;transform:scale(${cl(ks, 0, 1.05).toFixed(3)});opacity:${cl(ks * 4)};box-shadow:0 30px 70px rgba(21,19,26,.3)`,
      A('right:44px;top:26px;font-size:60px;color:' + P.bg, 'جا انداختی:') + [0, 1, 2].map(i => { const kl = ex(pr(u, ts + .3 + i * .16, ts + .6 + i * .16)); const hl = Math.exp(-Math.pow((u - (ts + 1.25 + i * .55)) / .22, 2)); return A(`left:24px;right:24px;top:${144 + i * 100}px;height:92px;border-radius:30px;background:rgba(255,255,255,${(.14 * hl).toFixed(3)});opacity:${kl};transform:translateX(${((1 - kl) * 60).toFixed(0)}px) scale(${(1 + .03 * hl).toFixed(4)})`,
        A('right:16px;top:14px;width:64px;height:64px;border-radius:50%;background:#3A3644') + bar('right:106px;top:30px', [330, 260, 380][i], 30, '#4A4556') + A(`left:16px;top:16px;padding:2px 24px 10px;border-radius:30px;background:#3A3644;color:${P.bg};font-size:36px`, ['۳ پیام', '۷ پیام', '۱۲ پیام'][i])); }).join(''));
    h += dot(112, dy, 26 * (u < .45 ? 1 : sq) * (1 + .12 * Math.sin(u * 5) * pr(u, 1, 1.4)));
    const [cx, cy] = glide(u, [[.5, 880, 1560], [tc, 620, 836], [1.5, 620, 836], [2.3, 900, 1420]]); h += cursor(cx, cy, u, tc);
    return h; },
  // 2 — brand: the dot grows into Muse's avatar, the name types on, the official Meta logo, the five countries and Iran
  brand(b, t, u) { const P = TH(1); let h = '';
    const tM = W(b, 'Muse'), tMeta = W(b, 'Meta'), tC = W(b, 'فعلاً') - .15, tI = Math.max(tC + .62, W(b, 'ایران') - .35);
    h += dot(540, 420, mix(26, 120, sp(u, .05, .6)));
    const n = Math.round(4 * pr(t, tM - .12, tM + .3)), caret = n < 4 || Math.floor(t * 3) % 2 === 0;
    h += `<div class="c" dir="ltr" style="top:545px;font-size:240px;color:${P.fg};line-height:1.1">${'Muse'.slice(0, n)}<span style="display:inline-block;width:16px;height:190px;margin-left:10px;background:${caret ? P.fg : 'transparent'};vertical-align:-12px"></span></div>`;
    h += txt('ایجنتِ هوشِ مصنوعی', 838, 62, P.mu, mask(ex(pr(t, tM + .2, tM + .6))));
    const km = sp(t, tMeta - .1, .5);
    h += A(`left:330px;top:960px;width:420px;height:150px;border-radius:40px;background:#fff;transform:scale(${cl(km, 0, 1.08).toFixed(3)});opacity:${cl(km * 4)}`, `<img src="${U('el/meta.png')}" style="position:absolute;left:50px;top:43px;width:320px;height:64px">`);
    const names = ['آمریکا', 'کانادا', 'مکزیک', 'ژاپن', 'سنگاپور'], ch = (s, i) => chipH(s, 50, P.fg, P.bg, sp(t, tC + i * .09, .4), 'margin:0 10px');
    h += A('left:30px;right:30px;top:1160px;text-align:center;direction:rtl', names.slice(0, 3).map(ch).join(''));
    h += A('left:30px;right:30px;top:1280px;text-align:center;direction:rtl', names.slice(3).map((s, i) => ch(s, i + 3)).join('') +
      chipH(`ایران: ${acc('نه')}`, 50, 'transparent', P.fg, sp(t, tI, .45), `margin:0 10px;box-shadow:inset 0 0 0 5px ${P.fg}`));
    return h; },
  // 3 — recipe: a shared cooking reel flies into the chat; the reply unfolds into a shopping list; the dot becomes the first tick
  recipe(b, t, u) { const P = TH(0); let h = '';
    const tL = W(b, 'لیست') - .35, pan = 60 * io(pr(t, tL, tL + .6));
    h += txt('یه ریلز بفرست', 170, 104, P.fg, mask(ex(pr(u, .02, .4))));
    const kb = sp(u, .35, .55), by = mix(1000, 60, Math.min(1.02, kb));
    const reel = A(`right:50px;top:${by.toFixed(1)}px;width:390px;height:520px;border-radius:50px;background:#FFDFAE;opacity:${cl(kb * 5)}`,
      `<svg width="390" height="520" viewBox="0 0 330 440"><circle cx="150" cy="235" r="78" fill="none" stroke="#15131A" stroke-width="16"/><rect x="222" y="224" width="96" height="22" rx="11" fill="#15131A" transform="rotate(-18 222 235)"/><circle cx="150" cy="235" r="34" fill="#FF9F43"/>
       <path d="M110 120 q14 -22 0 -44 M150 112 q14 -22 0 -44 M190 120 q14 -22 0 -44" fill="none" stroke="#15131A" stroke-width="9" stroke-linecap="round" opacity="${(.4 + .4 * Math.sin(t * 5)).toFixed(2)}"/>
       <circle cx="62" cy="378" r="38" fill="#15131A"/><path d="M50 358 L84 378 L50 398 Z" fill="#fff"/></svg>` + A('left:136px;top:414px;font-size:44px;color:#15131A', 'ریلزِ آشپزی'));
    const kc = sp(t, tL, .6), items = ['گوجه', 'تخم‌مرغ', 'پیاز', 'نان'];
    const tD = tL + .45, kd = io(pr(t, tD, tD + .4)), dx = mix(890, 439, kd), dyy = mix(66, 128 - pan + 359 + 31, kd) - 60 * Math.sin(Math.PI * kd);
    const list = A(`left:40px;top:200px;width:470px;height:640px;border-radius:44px;background:${P.card};box-shadow:inset 0 0 0 5px ${P.line};transform-origin:50% 0;transform:scaleY(${cl(kc, 0, 1.05).toFixed(3)});opacity:${cl(kc * 4)}`,
      A('right:40px;top:22px;font-size:60px;color:' + P.fg, 'لیستِ خرید') + A('left:36px;top:48px', `<span class="w6" style="font-size:30px;color:${P.mu}">نمونه</span>`) +
      items.map((s, i) => { const ki = ex(pr(t, tL + .3 + i * .18, tL + .6 + i * .18)), tk = sp(t, tD + .4 + i * .2, .4);
        return A(`left:40px;right:40px;top:${150 + i * 116}px;height:80px;opacity:${ki};transform:translateY(${((1 - ki) * 30).toFixed(0)}px)`,
          A(`right:0;top:9px;width:62px;height:62px;border-radius:16px;box-shadow:inset 0 0 0 5px ${P.fg};background:${i && tk > .3 ? P.fg : 'transparent'}`, i && tk > .3 ? `<svg width="62" height="62"><path d="M17 32 L27 43 L46 20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>` : '') +
          A('right:92px;top:0', `<span class="w6" style="font-size:56px;color:${P.fg}">${s}</span>`)); }).join(''));
    const head = A('right:40px;top:36px;width:60px;height:60px;border-radius:50%;background:' + (kd > 0 ? '#E7E2DA' : 'var(--acc)')) + A('right:124px;top:26px;font-size:54px;color:' + P.fg, ltr('Muse')) + A('left:44px;top:46px', TAG(P.mu)) + A(`left:0;right:0;top:128px;height:4px;background:${P.line}`);
    const inner = A(`left:0;top:${(128 - pan).toFixed(1)}px;width:960px;height:1300px`, reel + list);
    const fly = kd > 0 ? dot(dx, dyy, mix(30, 31, kd), kd >= 1 ? `<svg width="62" height="62"><path d="M17 32 L27 43 L46 20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>` : '') : '';
    h += panel(P, 60, 360, 960, 1000, inner + A(`left:0;top:0;width:960px;height:130px;background:${P.card}`, head) + fly);
    const [cx, cy] = glide(u, [[0, 900, 1500], [.3, 820, 1240], [.7, 820, 1240], [1.4, 930, 1440]]); h += cursor(cx, cy, u, .3);
    return h; },
  // 4 — saved: a messy grid of saved posts re-flows into three labelled collections; the dot hops across the folder tabs
  saved(b, t, u) { const P = TH(1); let h = '';
    const tS = W(b, 'پوشه') - .45, cat = [0, 1, 2, 1, 2, 0, 2, 0, 1], colX = c => 700 - c * 290, COL = ['#8EC5FF', '#FFC76B', '#D0B2FF'], cnt = [0, 0, 0], seen = [0, 0, 0];
    h += txt('پست‌های سیوشده', 170, 100, P.fg, mask(ex(pr(u, .02, .4))));
    const ICON = [`<path d="M52 150 L210 64 L150 214 L128 156 Z" fill="#15131A"/><path d="M128 156 L210 64" stroke="#8EC5FF" stroke-width="8"/>`,
      `<path d="M56 136 h148 a74 74 0 0 1 -148 0 z" fill="#15131A"/><path d="M100 104 q12 -20 0 -40 M130 96 q12 -20 0 -40 M160 104 q12 -20 0 -40" fill="none" stroke="#15131A" stroke-width="9" stroke-linecap="round"/>`,
      `<path d="M92 52 L116 44 Q130 62 144 44 L168 52 L214 92 L186 122 L170 108 L170 214 L90 214 L90 108 L74 122 L46 92 Z" fill="#15131A"/>`];
    cat.forEach((c, i) => { const k = sp(t, tS + .1 + i * .05, .65), kk = Math.min(1.04, k), r0 = Math.floor(i / 3), c0 = i % 3, x0 = 120 + c0 * 290, y0 = 520 + r0 * 290, x1 = colX(c), y1 = 520 + seen[c] * 290; seen[c]++; if (k > .5) cnt[c]++;
      const wob = (1 - cl(k)) * (((i * 37) % 7) - 3) * 2.2 + (1 - cl(k)) * Math.sin(t * 3 + i) * 1.5, pop = sp(u, .05 + i * .04, .45);
      h += A(`left:${mix(x0, x1, kk).toFixed(1)}px;top:${mix(y0, y1, kk).toFixed(1)}px;width:260px;height:260px;border-radius:40px;background:${COL[c]};transform:rotate(${wob.toFixed(2)}deg) scale(${cl(pop, 0, 1.06).toFixed(3)});z-index:${k > 0 && k < 1 ? 3 : 1}`,
        `<svg width="260" height="260" viewBox="0 0 260 260">${ICON[c]}<path d="M196 22 h36 v52 l-18 -14 l-18 14 z" fill="#15131A" opacity=".85"/></svg>`); });
    ['سفر', 'غذا', 'لباس'].forEach((s, c) => { const k = sp(t, tS + c * .14, .5);
