<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>meshkani.pro — risograph studio intro (prompt 178)</title>
<!-- Skill motion-graphy-2026, prompt 178 "Risograph studio intro" (HAND), built as its own engine.
     Look from the prompt: Risograph print — spot inks laid as separate passes (multiply), misregistration that shifts on
     every beat, fine grain and halftone dots, one typeface, one accent (red) used only on the through-line object and the
     key word, the real product UI rebuilt as vector layers driven by a cursor with real taps, screen-studio camera pushes
     (1.0 → 1.04 per scene, each scene starts at the zoom the last ended on), springs with a small overshoot, nothing
     appearing from nothing (grows, unfolds or is revealed by a mask). Brand-colour input slot = a loud multi-ink riso
     palette (fluoro pink, yellow, blue, green + red accent) for a maximalist look.
     Page standards: 1080x1920, Persian narration (eleven_v4) with a word-by-word caption, music bed at 120 BPM.
     Data: story.json beats[{id, text, scene{type}}], brand, product, end_text, end_sub; el/<brand logo>.png.
     Pure seek(t): every style is computed from t, no CSS animations, timers or Math.random. -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --paper: #F4EFE6; --pink: #FF48B0; --yel: #FFE800; --blue: #0078BF; --green: #00A95C; --red: #E60023; --ink: #1D1A2F; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); font-family: V; font-weight: 900; }
  #cam { position: absolute; inset: 0; transform-origin: 540px 860px; }
  #stage { position: absolute; inset: 0; }
  .L { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; mix-blend-mode: multiply; }
  .t { position: absolute; left: 0; right: 0; text-align: center; line-height: 1.05; white-space: nowrap; mix-blend-mode: multiply; }
  #grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }
  #sub { position: absolute; left: 60px; right: 60px; top: 1450px; height: 150px; display: flex; align-items: center; justify-content: center; }
  #sub .pill { padding: 10px 34px 20px; border-radius: 18px; font: 900 60px/1.3 V; white-space: nowrap; background: var(--ink); color: var(--paper); box-shadow: 8px 8px 0 var(--pink); }
  #sub .w { display: inline-block; margin: 0 .13em; }
</style>
</head>
<body>
<div id="root">
  <div id="cam"><div id="stage"></div></div>
  <svg id="grain" width="1080" height="1920"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .18  0 0 0 0 .25  0 0 0 -1.6 1.05"/></filter><rect width="1080" height="1920" filter="url(#gr)"/><defs><pattern id="tooth" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="6" cy="6" r="2.6" fill="#1D1A2F"/></pattern></defs><rect width="1080" height="1920" fill="url(#tooth)" opacity=".16"/></svg>
  <div id="sub"></div>
</div>
<script src="/logo-motion/node_modules/gsap/dist/gsap.min.js"></script>
<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const U = s => s.startsWith('/') ? s : DIR + s, $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, k) => a + (b - a) * k, pr = (t, a, b) => cl((t - a) / (b - a));
const ex = k => 1 - Math.pow(2, -10 * cl(k));                                  // exponential ease-out
const spring = k => { k = cl(k); return 1 - Math.exp(-7 * k) * Math.cos(9 * k) * (1 - k * .2); };   // small overshoot (~8%)
const io = gsap.parseEase('power2.inOut');
const INK = {pink: '#FF48B0', yel: '#FFE800', blue: '#0078BF', green: '#00A95C', red: '#E60023', ink: '#1D1A2F'};
const fa = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const ISSUES = [];
let S, TL, B = [], END = 50, ZOOM = [];

// misregistration: each beat shifts the second ink pass a few px (deterministic per beat)
const mis = i => { const a = (i * 2.399) % (Math.PI * 2); return [Math.round(Math.cos(a) * 15), Math.round(Math.sin(a) * 12)]; };
// an SVG layer printed as two riso passes: the shape in ink A, the same shape offset in ink B underneath (multiply)
function riso(inner, a, b, off) {
  const ia = inner.replace(/INK/g, a), ib = inner.replace(/INK/g, b);
  return `<svg class="L" viewBox="0 0 1080 1920" style="transform:translate(${off[0]}px,${off[1]}px)">${ib}</svg><svg class="L" viewBox="0 0 1080 1920">${ia}</svg>`;
}
// halftone dot pattern in a given ink
const HT = `<defs>${Object.entries(INK).map(([k, c]) => `<pattern id="ht-${k}" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(22)"><circle cx="7" cy="7" r="4.2" fill="${c}"/></pattern>`).join('')}</defs>`;
// big type in one ink with a ghost pass in another ink, revealed by a mask that wipes in reading order (RTL: from the right)
function type(txt, y, size, a, b, k, off, ltr = false) {
  const m = cl(k) * 100, clip = ltr ? `inset(0 ${100 - m}% 0 0)` : `inset(0 0 0 ${100 - m}%)`, d = ltr ? 'dir="ltr"' : '';
  return `<div class="t" ${d} style="top:${y}px;font-size:${size}px;color:${b};transform:translate(${off[0]}px,${off[1]}px);clip-path:${clip}">${txt}</div>` +
         `<div class="t" ${d} style="top:${y}px;font-size:${size}px;color:${a};clip-path:${clip}">${txt}</div>`;
}
// flat maximal colour blocks behind each scene (scaled past the frame edges), grown with a spring
function blocks(seed, k, t) {
  const cols = ['pink', 'yel', 'blue', 'green'], c1 = cols[seed % 4], c2 = cols[(seed + 1) % 4], c3 = cols[(seed + 2) % 4], e = spring(k);
  const r1 = 520 * e, r2 = 380 * e, w = Math.sin(t * 1.3) * 18;
  // riso poster screen: a coarse halftone whose dot size runs as a diagonal gradient (visible at phone size, never a flat empty ground)
  let dots = ''; const c4 = INK[cols[(seed + 3) % 4]], sh = (seed % 3) * .7;
  for (let y = 32; y < 1920; y += 64) for (let x = 32 + ((y / 64) % 2) * 32; x < 1080; x += 64) {
    const f = .5 + .5 * Math.sin((x * .9 + y * .55) / 260 + sh + t * .6); dots += `<circle cx="${x}" cy="${y}" r="${(5 + 17 * f * e).toFixed(1)}"/>`; }
  return `<svg class="L" viewBox="0 0 1080 1920">${HT}<g fill="${c4}" opacity=".32">${dots}</g>
    <circle cx="${seed % 2 ? 1060 : 20}" cy="${200 + w}" r="${r1}" fill="${INK[c1]}" opacity=".9"/>
    <rect x="${seed % 2 ? -120 : 640}" y="${1300 - 260 * e}" width="620" height="${760 * e}" fill="url(#ht-${c2})" transform="rotate(${seed % 2 ? 8 : -8} 540 1500)"/>
    <circle cx="${seed % 2 ? 60 : 1000}" cy="${1700 - w}" r="${r2}" fill="${INK[c3]}" opacity=".85"/></svg>`;
}
// cursor (a fingertip pointer) with a tap ring when it clicks at time tc
function cursor(x, y, t, tc) {
  const press = tc !== undefined && t >= tc ? Math.exp(-8 * (t - tc)) : 0, ring = tc !== undefined && t >= tc ? pr(t, tc, tc + .5) : 1;
  return `<svg class="L" viewBox="0 0 1080 1920" style="mix-blend-mode:normal">${ring < 1 ? `<circle cx="${x}" cy="${y}" r="${30 + ring * 90}" fill="none" stroke="${INK.ink}" stroke-width="${8 * (1 - ring)}"/>` : ''}
    <g transform="translate(${x} ${y}) scale(${1 - .18 * press})"><path d="M0 0 L0 74 L18 58 L32 90 L46 84 L32 52 L56 52 Z" fill="${INK.paper || '#fff'}" stroke="${INK.ink}" stroke-width="6" stroke-linejoin="round"/></g></svg>`;
}

window.ready = (async () => {
  S = await (await fetch(U('story.json'))).json(); TL = await (await fetch(U('timeline.json'))).json();
  END = TL.total;
  const shown = t => t.replace(/\[[^\]]*\]/g, '').replace(/\{([^|}]*)\|[^}]*\}/g, '$1').trim().split(/\s+/);
  for (const bt of S.beats) {
    const L = TL.lines[bt.id]; if (!L) { ISSUES.push('no timing for ' + bt.id); continue; }
    const raw = shown(bt.text); let on = false;
    const words = raw.map(w => { const st = w.startsWith('*') || w.startsWith('«*'); if (st) on = true; const k = on || /\*/.test(w); if (/\*[.…،؛!؟?»]*$/.test(w)) on = false; return {w: w.replace(/\*/g, ''), k}; });
    const wt = j => { const i = Math.round(cl(j / Math.max(1, words.length - 1)) * (L.words.length - 1)); return (L.words[i] || [L.start])[0]; };
    const kis = words.map((w, i) => w.k && (i === 0 || !words[i - 1].k) ? i : -1).filter(i => i >= 0);
    B.push({bt, sc: bt.scene || {}, L, words, wt, kis, kt: kis.map(wt)});
  }
  B.forEach((b, i) => { b.i = i; b.a = i ? b.L.start - .08 : 0; b.b = i + 1 < B.length ? B[i + 1].L.start - .08 : TL.end_start; });
  await Promise.all([S.logo || 'pinterest.png', ...(S.preload || []), ...S.beats.map(b => (b.scene || {}).photo).filter(Boolean)].map(f => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = U('el/' + f); })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'بچه حفظ مهارت')));
  window.START = 0; window.DURATION = END; window.ISSUES = ISSUES;
  const SC = [];
  for (const b of B) {
    const pts = [b.a, ...b.kt.filter(h => h > b.a + .9 && h < b.b - .9)];
    if (b.sc.extra_hits) b.sc.extra_hits.forEach(j => { const h = b.wt(j); if (h > b.a + .9 && h < b.b - .9) pts.push(h); });
    const pz = [...new Set(pts.map(x => +x.toFixed(2)))].sort((p, q) => p - q), fill = [];
    [...pz, b.b].forEach((q, i, arr) => { if (!i) return; const g = q - arr[i - 1], n = Math.ceil(g / 2.7) - 1; for (let j = 1; j <= n; j++) fill.push(+(arr[i - 1] + g * j / (n + 1)).toFixed(2)); });
    const ps = [...pz, ...fill].sort((p, q) => p - q);
    ps.forEach((p, i) => SC.push({t0: p, t1: i + 1 < ps.length ? ps[i + 1] : b.b, type: b.sc.type, bg: b.bt.id + (i ? '.' + i : ''), sfx: i ? [[p, ['pop', 'tap', 'tick', 'click', 'counter_tick'][(i + b.i) % 5], .3]] : (SFX[b.sc.type] || (() => [[p, 'pop', .3]]))(b, p)}));
  }
  SC.push({t0: TL.end_start, t1: END, type: 'end', bg: 'end', sfx: [[TL.end_start + .2, 'shimmer', .45]]});
  SC.forEach(c => c.sfx = c.sfx.filter(x => x[0] < c.t1 + .5));
  window.SCENES = SC;
  for (const s of SC) if (s.t1 - s.t0 > 3.2) ISSUES.push(`idea ${s.bg} holds ${(s.t1 - s.t0).toFixed(1)} s (> 3): add a hit`);
  seek(0);
})();
// motion-matched sound cues per scene (STORY_SPEC "Sound design"): typing for the prompt box, taps for keys and buttons,
// a shimmer when a world is revealed, ticks for counters, a hit for the ×2 stamp; never a whoosh on every cut
const SFX = {
  hook: (b, p) => [[.5, 'hit', .45], [.9, 'pop', .35], [1.3, 'pop', .3]],
  tech: (b, p) => [[p + .05, 'sweep_soft', .3]],
  human: (b, p) => [[p + .05, 'pop', .3]],
  versus: (b, p) => [[p + .05, 'tick', .3]],
  do1: (b, p) => [[p + .05, 'hit', .4]],
  do2: (b, p) => [[p + .05, 'hit', .4]],
  do3: (b, p) => [[p + .05, 'hit', .4]],
  age: (b, p) => [[p + .05, 'glass_ping', .35]],
  ask: (b, p) => [[p + .05, 'typing', .3]],
};
function seek(t) {
  if (!B.length) return;
  let bi = 0; for (let i = 0; i < B.length; i++) if (t >= B[i].a) bi = i;
  const endOn = t >= TL.end_start, b = B[bi];
  let si = 0, sc = (window.SCENES || [])[0] || {t0: 0, t1: 1}; (window.SCENES || []).forEach((s, i) => { if (t >= s.t0) { si = i; sc = s; } });
  // screen-studio camera: each idea pushes 1.0 → 1.04, plus a short exponential kick on every new idea
  const k = pr(t, sc.t0, sc.t1), kick = Math.exp(-9 * (t - sc.t0)) * .035;
  $('cam').style.transform = `scale(${(1 + .04 * io(k) + kick).toFixed(4)})`;
  const off = mis(si);
  const h = endOn ? endCard(t - TL.end_start, t, off) : scene(b, t, t - b.a, si, off);
  const st = $('stage'); if (st._h !== h) { st._h = h; st.innerHTML = h; }
  caption(b, t, endOn);
}
function caption(b, t, endOn) {
  const sub = $('sub');
  if (endOn || t > b.L.end + .3 || (b.sc.type === 'hook' && t < b.wt(3) - .05)) { if (sub._k) { sub.innerHTML = ''; sub._k = null; } return; }
  let j = 0; for (let q = 0; q < b.words.length; q++) if (t >= b.wt(q) - .04) j = q;
  const c0 = Math.floor(j / 4) * 4, ch = b.words.slice(c0, c0 + 4), key = b.bt.id + c0;
  if (sub._k !== key) { sub._k = key; const lat = w => /^[«]?[A-Za-z0-9.\-]+[،,.!?؟…؛»]*$/.test(w.w); const gs = [];
    ch.forEach((w, q) => { const g = gs[gs.length - 1]; if (g && lat(w) && g.l) { g.w += ' ' + w.w; g.k = g.k || w.k; } else gs.push({w: w.w, k: w.k, i: q, l: lat(w)}); });
    sub.innerHTML = `<span class="pill">${gs.map(g => `<span class="w" data-i="${g.i}" ${g.l ? 'dir="ltr"' : ''} style="${g.k ? 'color:#FF48B0' : ''}">${g.w}</span>`).join(' ')}</span>`; }
  sub.querySelectorAll('.w').forEach(el => { const tw = b.wt(c0 + +el.dataset.i), k = ex(pr(t, tw - .05, tw + .2)); el.style.opacity = .3 + .7 * k; });
}
// ---- riso props, all vector ----
const dot = (x, y, r) => `<svg class="L" viewBox="0 0 1080 1920" style="mix-blend-mode:normal"><circle cx="${x}" cy="${y}" r="${Math.max(0, r)}" fill="${INK.red}"/><circle cx="${x - r * .3}" cy="${y - r * .3}" r="${Math.max(0, r * .18)}" fill="#fff" opacity=".25"/></svg>`;
// a hair Pin: face + bob with balayage ends (halftone yellow over blue), drawn inside a rounded card
function hairArt(x, y, w, h, seed = 0) {
  const cx = x + w / 2, cy = y + h * .52, s = w / 400;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${28 * s}" fill="INK"/>`.replace('INK', seed % 2 ? INK.yel : INK.pink) +
    `<g transform="translate(${cx} ${cy}) scale(${s})">
      <path d="M -150 -40 C -160 -200, 160 -200, 150 -40 L 165 150 C 120 175, 60 160, 40 120 L -40 120 C -60 160, -120 175, -165 150 Z" fill="${INK.blue}"/>
      <path d="M -165 70 L 165 70 L 165 150 C 120 175, 60 160, 40 120 L -40 120 C -60 160, -120 175, -165 150 Z" fill="url(#ht-yel)"/>
      <ellipse cx="0" cy="10" rx="92" ry="118" fill="#F6C9A8"/>
      <path d="M -100 -60 C -60 -150, 80 -150, 110 -40 C 40 -90, -40 -90, -100 -60 Z" fill="${INK.blue}"/>
      <circle cx="-34" cy="10" r="9" fill="${INK.ink}"/><circle cx="34" cy="10" r="9" fill="${INK.ink}"/><path d="M -24 62 Q 0 80 24 62" stroke="${INK.red}" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M -50 150 L 50 150 L 70 230 L -70 230 Z" fill="#F6C9A8"/><path d="M -190 300 Q 0 180 190 300 L 190 330 L -190 330 Z" fill="${INK.green}"/></g>`;
}
// a nail Pin: a hand with almond nails
function nailArt(x, y, w, h, seed = 1, nailCol = INK.red) {
  const s = w / 400, cx = x + w / 2, cy = y + h * .6;
  let fingers = ''; [-105, -35, 35, 105].forEach((fx, i) => { const L = [170, 210, 200, 160][i];
    fingers += `<rect x="${fx - 30}" y="${-L}" width="60" height="${L + 40}" rx="30" fill="#F6C9A8"/><path d="M ${fx - 22} ${-L + 52} C ${fx - 24} ${-L + 8}, ${fx - 6} ${-L - 22}, ${fx} ${-L - 26} C ${fx + 6} ${-L - 22}, ${fx + 24} ${-L + 8}, ${fx + 22} ${-L + 52} Z" fill="${nailCol}"/><path d="M ${fx - 8} ${-L} q 4 -16 10 -18" stroke="#fff" stroke-width="6" opacity=".6" fill="none"/>`; });
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${28 * s}" fill="${seed % 2 ? INK.blue : INK.green}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${28 * s}" fill="url(#ht-pink)" opacity=".5"/>` +
    `<g transform="translate(${cx} ${cy}) scale(${s})">${fingers}<rect x="-140" y="10" width="280" height="200" rx="70" fill="#F6C9A8"/><path d="M 140 60 Q 200 40 190 140 L 130 160 Z" fill="#F6C9A8"/></g>`;
}
// phone frame (vector) at x,y with width w; inner svg drawn in phone coords 0..w
function phone(x, y, w, inner, k = 1) {
  const h = w * 2.05, e = spring(k);
  return `<svg class="L" viewBox="0 0 1080 1920" style="mix-blend-mode:normal">${HT}<g transform="translate(${x + w / 2} ${y + h / 2}) scale(${e.toFixed(3)}) translate(${-w / 2} ${-h / 2})">
    <rect x="-18" y="-18" width="${w + 36}" height="${h + 36}" rx="70" fill="${INK.ink}"/><rect x="0" y="0" width="${w}" height="${h}" rx="54" fill="#FFFDF8"/>
    <svg x="0" y="0" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg><rect x="${w / 2 - 70}" y="14" width="140" height="34" rx="17" fill="${INK.ink}"/></g></svg>`;
}
const chip = (x, y, txt, bg, fg, size, k, rot = 0, ltr = false) => { const e = spring(k);
  return `<div style="position:absolute;left:${x}px;top:${y}px;padding:${size * .2}px ${size * .5}px ${size * .32}px;border-radius:${size * .4}px;background:${bg};color:${fg};font:900 ${size}px V;white-space:nowrap;box-shadow:10px 10px 0 ${INK.ink};transform:rotate(${rot}deg) scale(${e.toFixed(3)});transform-origin:50% 50%;opacity:${cl(k * 4)}" ${ltr ? 'dir="ltr"' : ''}>${txt}</div>`; };
// ---- Genie 4 props (REEL-021), all vector except the official Google DeepMind stills ----
const W = (b, s) => { const i = b.words.findIndex(w => w.w.includes(s)); return b.wt(i < 0 ? 0 : i); };   // time of the word that says s
const elimg = (f) => U('el/' + f);
// an official still printed into a riso frame: ink shadow, paper border, slow push, optional mask reveal (k) from a point
function photoCard(src, x, y, w, h, rot, z, pos = '50% 50%', k = 1, o = 1) {
  const e = spring(k);
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg) scale(${e.toFixed(3)});opacity:${o};box-shadow:16px 16px 0 ${INK.ink};border:10px solid #FFFDF8;border-radius:28px;overflow:hidden;background:#000"><img src="${elimg(src)}" style="width:100%;height:100%;object-fit:cover;object-position:${pos};transform:scale(${z.toFixed(3)})"></div>`;
}
// full-bleed still with a push-in
const bleed = (src, z, pos = '50% 50%', extra = '') => `<div style="position:absolute;inset:0;overflow:hidden;background:#000"><img src="${elimg(src)}" style="width:100%;height:100%;object-fit:cover;object-position:${pos};transform:scale(${z.toFixed(4)});${extra}"></div>`;
// the through-line object: the prompt box with its text cursor (the cursor becomes the Genie mark on the end card)
function promptBox(x, y, w, label, txt, k, t, blink = true, ltr = true) {
  const e = spring(k), n = Math.round(txt.length * cl(k * 1.6 - .2)), shown = txt.slice(0, n), on = !blink || Math.floor(t * 2.4) % 2 === 0;
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;transform:scale(${e.toFixed(3)});transform-origin:50% 50%;opacity:${cl(k * 5)}">
    <div style="background:#FFFDF8;border:8px solid ${INK.ink};border-radius:34px;box-shadow:14px 14px 0 ${INK.pink};padding:22px 34px 30px">
      <div dir="ltr" style="font:600 36px V;color:${INK.blue};text-align:left">${label}</div>
      <div ${ltr ? 'dir="ltr"' : ''} style="font:900 58px/1.25 V;color:${INK.ink};text-align:${ltr ? 'left' : 'right'};white-space:nowrap">${shown}<span style="display:inline-block;width:8px;height:62px;margin:0 4px;vertical-align:-10px;background:${INK.red};opacity:${on ? 1 : 0}"></span></div></div></div>`;
}
// arrow-key cluster; the key whose name is in `act` is pressed
function keys(x, y, s, act, t) {
  const K = {up: [70, 0, 'M0 14 L-16 -6 L16 -6Z'], left: [0, 74, 'M-14 0 L6 -16 L6 16Z'], down: [70, 74, 'M0 14 L-16 -6 L16 -6Z'], right: [140, 74, 'M14 0 L-6 -16 L-6 16Z']};
  let r = '';
  for (const [n, [kx, ky, d]] of Object.entries(K)) { const p = act === n ? 1 : 0;
    r += `<g transform="translate(${kx} ${ky + p * 8})"><rect x="0" y="${p ? 0 : 8}" width="64" height="64" rx="14" fill="${INK.ink}"/><rect x="0" y="0" width="64" height="64" rx="14" fill="${p ? INK.yel : '#FFFDF8'}" stroke="${INK.ink}" stroke-width="5"/><path d="${d}" transform="translate(32 32) rotate(${n === 'up' ? 180 : n === 'down' ? 0 : 0})" fill="${INK.ink}"/></g>`; }
  return `<svg class="L" viewBox="0 0 1080 1920" style="mix-blend-mode:normal"><g transform="translate(${x} ${y}) scale(${s})">${r}</g></svg>`;
}
const logoChip = (x, y, d, f, k, label = '', ltr = true) => { const e = spring(k);
  return `<div style="position:absolute;left:${x}px;top:${y}px;display:flex;align-items:center;gap:18px;padding:14px 30px 14px 14px;border-radius:${d}px;background:#FFFDF8;border:6px solid ${INK.ink};box-shadow:10px 10px 0 ${INK.ink};transform:scale(${e.toFixed(3)});opacity:${cl(k * 5)}" dir="ltr"><img src="${elimg(f)}" style="width:${d}px;height:${d}px;object-fit:contain">${label ? `<span style="font:900 ${Math.round(d * .55)}px V;color:${INK.ink}">${label}</span>` : ''}</div>`; };
// waveform track that draws on (seeded, pure function of t)
function wave(x, y, w, h, col, k, t, seed) {
  let p = ''; const n = 46;
  for (let i = 0; i < n * cl(k); i++) { const a = Math.abs(Math.sin(i * 1.7 + seed) * Math.cos(i * .37 + seed * 2)) * (.45 + .55 * Math.abs(Math.sin(t * 6 + i * .5 + seed))); const bh = 8 + a * h;
    p += `<rect x="${x + i * (w / n)}" y="${y - bh / 2}" width="${w / n * .62}" height="${bh}" rx="4" fill="${col}"/>`; }
  return p;
}
const bigT = (txt, y, size, col, k, sh = INK.pink) => `<div class="t" style="top:${y}px;font-size:${size}px;color:${col};mix-blend-mode:normal;text-shadow:8px 8px 0 ${sh};transform:scale(${spring(k).toFixed(3)});opacity:${cl(k * 5)}">${txt}</div>`;
function scene(b, t, u, si, off) {
  const s = b.sc, kt = b.kt, A = b.a, B1 = b.b;
  let r = blocks(si, pr(t, (window.SCENES[si] || {}).t0 || 0, ((window.SCENES[si] || {}).t0 || 0) + .5), t);
  const K = j => kt[Math.min(j, kt.length - 1)] || A;                 // time of the j-th highlighted phrase
  const big = (txt, x, y, size, bg, fg, k, rot = -4) => { const e = spring(k); return k <= 0 ? '' : `<div style="position:absolute;left:${x}px;top:${y}px;padding:0 ${size * .28}px ${size * .12}px;border-radius:${size * .2}px;background:${bg};color:${fg};font:900 ${size}px/1.2 V;transform:rotate(${rot}deg) scale(${e.toFixed(3)});box-shadow:14px 14px 0 ${INK.ink}">${txt}</div>`; };
  const card = (x, y, w, h, bg, html, k, rot = 0) => { const e = spring(k); return k <= 0 ? '' : `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg};border:8px solid ${INK.ink};border-radius:34px;box-shadow:14px 14px 0 ${INK.ink};transform:rotate(${rot}deg) scale(${e.toFixed(3)});display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font:900 64px/1.25 V;color:${INK.ink}">${html}</div>`; };
  switch (s.type) {
    case 'hook': {

      L3.forEach((l, i) => { r += chip(90, 260 + i * 170, l, [INK.yel, INK.green, INK.blue][i], i ? '#fff' : INK.ink, 72, pr(t, K(i) - .05, K(i) + .25), i % 2 ? 3 : -3); });
      r += card(110, 860, 860, 420, '#fff', `<div style="font-size:60px">تحلیل کردن</div><div style="font-size:170px;color:${INK.red};line-height:1.1">${fa(Math.round(70 * ex(pr(t, K(4) - .1, K(4) + .7))))}٪</div><div style="font:600 44px V">کارفرماها: ضروریه</div>`, pr(t, K(3) - .1, K(3) + .3));

      r += photoCard(s.photo, 140, 200, 800, 460, -2, 1.04 + .08 * pr(t, A, B1), '50% 50%', pr(t, A, A + .5));
      r += `<div style="position:absolute;left:540px;top:760px;width:10px;height:560px;background:${INK.ink};transform:translateX(-50%)"></div>`;
      r += `<div style="position:absolute;left:140px;top:760px;width:800px;height:16px;background:${INK.ink};transform:rotate(${tilt}deg);transform-origin:50% 50%"></div>`;
      r += card(90, 820, 400, 330, INK.yel, `<div>حفظ کردن</div><div>جواب</div>`, k1, -tilt / 2);
      r += card(590, 820, 400, 330, INK.green, `<div style="color:#fff">پرسیدن</div><div style="color:#fff">سؤال</div>`, k2, -tilt / 2);
      r += cursor(mix(330, 790, ex(pr(t, K(1) - .4, K(1)))), 1080, t, K(1) + .1);
      return r;
    }
    case 'do1': {
      const q = 'خودت چی فکر می‌کنی؟', kq = pr(t, A + .6, K(1) + .6);
      r += big(fa(1), 110, 210, 260, INK.pink, '#fff', pr(t, K(0) - .1, K(0) + .3), -6);
      r += photoCard(s.photo, 470, 240, 520, 620, 3, 1.04 + .08 * pr(t, A, B1), '50% 60%', pr(t, A + .1, A + .6));
      r += card(100, 960, 880, 300, '#fff', `<div style="font-size:72px">«${q.slice(0, Math.round(q.length * cl(kq)))}${kq < 1 ? '▌' : ''}»</div>`, pr(t, A + .4, A + .8), -1);
      r += chip(300, 1300, 'جای جواب دادن', INK.yel, INK.ink, 58, pr(t, A + .8, A + 1.1), 2);

    }
    case 'do2': {
      const kc = pr(t, K(2) - .1, K(2) + .4); r += chip(600, 860, 'برای بزرگ‌ترها', INK.ink, '#fff', 50, pr(t, A + .3, A + .6), -2);
      r += big(fa(2), 110, 200, 260, INK.blue, '#fff', pr(t, K(0) - .1, K(0) + .3), -6);

      const inner = `<rect x="30" y="120" width="380" height="110" rx="34" fill="${INK.ink}"/><text x="390" y="190" text-anchor="start" direction="rtl" font-family="V" font-weight="900" font-size="40" fill="#fff">چرا آسمون آبیه؟</text>` +
        `<rect x="60" y="260" width="380" height="150" rx="34" fill="${INK.yel}"/><text x="420" y="330" text-anchor="start" direction="rtl" font-family="V" font-weight="900" font-size="36" fill="${INK.ink}">جواب چت‌بات…</text>` +
        (kc > 0 ? `<g transform="translate(240 520) scale(${spring(kc).toFixed(3)})"><circle r="80" fill="${INK.green}"/><path d="M -36 0 L -10 26 L 40 -28" stroke="#fff" stroke-width="18" fill="none" stroke-linecap="round"/></g>` : '');
      r += phone(120, 800, 460, inner, pr(t, A + .3, A + .8));

      r += big(fa(3), 110, 200, 260, INK.green, '#fff', pr(t, K(0) - .1, K(0) + .3), -6);
      r += photoCard(s.photo, 470, 220, 520, 560, 3, 1.04 + .08 * pr(t, A, B1), '50% 50%', pr(t, A + .1, A + .6));

      r += chip(260, 1260, 'فکر می‌سازه', INK.ink, '#fff', 70, pr(t, K(5) - .05, K(5) + .25), -2);
      return r;

    case 'age': {
      const k13 = pr(t, K(0) - .1, K(0) + .35), ks = pr(t, K(1) - .1, K(1) + .35);
      r += logoChip(260, 230, 120, 'unesco.svg', pr(t, A, A + .4), 'UNESCO · 2023');
      r += big(`${fa(13)}+ سال`, 290, 520, 300, INK.red, '#fff', k13, -5);

      r += chip(320, 1300, '🛡 حریم خصوصی', INK.green, '#fff', 72, ks, -3);

      const kq = pr(t, A + .4, K(1) + .2), msg = 'امسال یاد گرفت…';
      r += bleed(s.photo, 1.05 + .1 * pr(t, A, B1), '50% 50%', 'filter:brightness(.75)');
      const inner = `<text x="420" y="130" text-anchor="start" direction="rtl" font-family="V" font-weight="900" font-size="40" fill="${INK.ink}">کامنت‌ها</text>` +
        `<rect x="30" y="170" width="400" height="120" rx="30" fill="#EEE8DC"/><text x="410" y="245" text-anchor="start" direction="rtl" font-family="V" font-weight="900" font-size="40" fill="${INK.ink}">${msg.slice(0, Math.round(msg.length * cl(kq)))}</text>` +
        `<rect x="30" y="320" width="180" height="90" rx="30" fill="${INK.pink}"/><text x="120" y="378" text-anchor="middle" font-family="V" font-weight="900" font-size="38" fill="#fff">ارسال</text>`;
      r += phone(310, 380, 460, inner, pr(t, A + .1, A + .5));
      r += chip(150, 1330, 'بفرست برای پدر و مادرها ↗', INK.yel, INK.ink, 60, pr(t, K(2) - .05, K(2) + .25), -2);
      r += cursor(mix(820, 420, ex(pr(t, K(1) - .4, K(1)))), 1150, t, K(1) + .1);

  return r;
}

const logo = (x, y, d, o) => `<svg class="L" viewBox="0 0 1080 1920" style="mix-blend-mode:normal;opacity:${o}"><circle cx="${x}" cy="${y}" r="${d / 2 + 14}" fill="#fff"/><image href="${U('el/' + (S.logo || 'pinterest.png'))}" x="${x - d / 2}" y="${y - d / 2}" width="${d}" height="${d}"/></svg>`;
const svg2 = inner => `<svg class="L" viewBox="0 0 1080 1920" style="mix-blend-mode:normal">${inner}</svg>`;
function endCard(u, t, off) {
  // the through-line dot becomes the real logo, the name prints in passes, then the question
  const g = spring(.4 + pr(u, 0, .4)), q = (S.end_text || '').replace(/\*([^*]+)\*/g, `<span style="color:${INK.red}">$1</span>`);
  let r = blocks(3, pr(u, 0, .4), t) + dot(540, 640, 150 * g) + logo(540, 640, 300 * g, pr(u, 0, .15));
  for (let i = 0; i < 3; i++) { const ph = ((u * .9 + i / 3) % 1); r += svg2(`<circle cx="540" cy="640" r="${(190 + 260 * ph).toFixed(1)}" fill="none" stroke="${[INK.pink, INK.blue, INK.yel][i]}" stroke-width="${(14 * (1 - ph)).toFixed(1)}" opacity="${(1 - ph).toFixed(2)}"/>`); }
  r += type(`${S.brand}${S.product ? ' ' + S.product : ''}`, 860, 90, INK.ink, INK.pink, pr(u, .2, .6), off, true);
  r += `<div class="t" style="top:1020px;font-size:${Math.min(100, Math.floor(1700 / (S.end_text || 'x').length))}px;color:${INK.ink};opacity:${pr(u, .4, .7)}">${q}</div>`;
  r += `<div class="t" style="top:1190px;font-size:60px;font-weight:600;color:${INK.ink};opacity:${pr(u, .6, .9)}">${S.end_sub || ''}</div>`;
  return r + `<div class="t" dir="ltr" style="top:1300px;font-size:44px;letter-spacing:4px;color:${INK.blue};opacity:${pr(u, .8, 1.1)}">${(S.handle || '').replace('@', '').toUpperCase()}</div>`;
}
