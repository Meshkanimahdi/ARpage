<!doctype html>
<html lang="fa" dir="rtl">

<meta charset="utf-8">
<title>meshkani.pro — white ball UI motion loop (prompt 228)</title>
<!-- Skill motion-graphy-2026, prompt 228 "White ball UI motion loop" (TOPIC/UI), built as its own engine.
     Look from the prompt: a near-black canvas with a faint dot grid, charcoal controls, sharp white text, ONE electric-blue
     accent and a white ball that travels through the whole film. A real cursor makes the opening click physical; after
     that the ball guides every hand-off (toggle → card → slider → notifications → reply field → keyboard → return).
     All UI lives in ONE world; a single camera (position + log-space zoom) moves through it, so every close-up is a
     move inside that world, never a hard cut. Closed-form springs with a small overshoot and a brief squash on impact.
     Banned by the prompt and kept out: hard cuts, stock footage, glows, particle bursts, disconnected transitions,
     excessive bouncing, blurry text during camera moves. The opening photo (user realism rule, RUNBOOK §4.0 rule 4)
     shrinks into the world as a card, so the first move is still continuous.
     Page standards: 1080x1920, Persian narration (eleven_v4) with a word-by-word caption, music bed at 120 BPM, SFX via
     SCENES[].sfx. Data: story.json beats[{id, text, scene{type, img?}}], end_text, end_sub; el/*.
     Pure seek(t): every style is computed from t, no CSS animations, timers or Math.random. -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --bg: #0B0B0E; --ch: #1D1E24; --ch2: #2A2C34; --line: #3A3C46; --w: #FFFFFF; --mu: #9A9CA8; --blue: #2F7BFF; --red: #FF4D5E; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--bg); font-family: V; font-weight: 900; color: var(--w); }
  #world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; }
  #scr { position: absolute; inset: 0; }
  .a { position: absolute; white-space: nowrap; }
  .card { position: absolute; background: var(--ch); border: 3px solid var(--line); border-radius: 36px; box-sizing: border-box; }
  .t { position: absolute; white-space: nowrap; }
  #sub { position: absolute; left: 50px; right: 50px; top: 1450px; height: 150px; display: flex; align-items: center; justify-content: center; }
  #sub .pill { padding: 10px 34px 20px; border-radius: 26px; font: 900 58px/1.3 V; white-space: nowrap; background: rgba(29,30,36,.94); border: 3px solid var(--line); color: #fff; }
  #sub .w { display: inline-block; margin: 0 .12em; }
</style>

<body>
<div id="root"><div id="world"></div><div id="scr"></div><div id="sub"></div></div>
<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const U = s => s.startsWith('/') ? s : DIR + s, $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, k) => a + (b - a) * k, pr = (t, a, b) => cl((t - a) / (b - a));
const ex = k => 1 - Math.pow(2, -10 * cl(k));
const eio = k => { k = cl(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const spring = k => { k = cl(k); return 1 - Math.exp(-7 * k) * Math.cos(9 * k) * (1 - k * .2); };   // ~8% overshoot
const fa = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const ISSUES = [];
let S, TL, B = [], END = 50;

// ---- the one world: station centres (world px) and where the ball lands on each ----
const ST = {
  T: [0, 0], P: [1300, 0], C: [1300, 1500], D: [0, 1500], L: [-1300, 1500], SL: [-1300, 3000], H: [0, 3000],
  G: [1300, 3000], K: [1300, 4500], F: [0, 4500], R: [-1300, 4500]
};
const BEAT_ST = {hook: 'T', found: 'P', cards: 'C', delay: 'D', photos: 'L', slider: 'SL', hotel: 'H', gift: 'G',
  ask_ai: 'K', answer: 'K', night: 'K', flaw: 'F', tip: 'R', ask: 'T'};
const SC_Y = 820;                                           // the screen point the camera centres stations on

window.ready = (async () => {
  S = await (await fetch(U('story.json'))).json(); TL = await (await fetch(U('timeline.json'))).json();
  END = TL.total;
  const shown = t => t.replace(/\[[^\]]*\]/g, '').replace(/\{([^|}]*)\|[^}]*\}/g, '$1').trim().split(/\s+/);
  for (const bt of S.beats) {
    const L = TL.lines[bt.id]; if (!L) { ISSUES.push('no timing for ' + bt.id); continue; }
    const raw = shown(bt.text); let on = false;
    const words = raw.map(w => { const st = w.startsWith('*') || w.startsWith('«*'); if (st) on = true; const k = on || /\*/.test(w); if (/\*[.…،؛!؟?»]*$/.test(w)) on = false; return {w: w.replace(/\*/g, ''), k}; });
    const wt = j => { const i = Math.round(cl(j / Math.max(1, words.length - 1)) * (L.words.length - 1)); return (L.words[i] || [L.start])[0]; };
    B.push({bt, sc: bt.scene || {}, L, words, wt});
  }
  B.forEach((b, i) => { b.i = i; b.a = i ? b.L.start - .08 : 0; b.b = i + 1 < B.length ? B[i + 1].L.start - .08 : TL.end_start; b.st = BEAT_ST[b.sc.type] || 'T'; });
  await Promise.all(['s00.jpg', 'telegram.png'].map(f => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = U('el/' + f); })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'ربات Sofia')));
  window.START = 0; window.DURATION = END; window.ISSUES = ISSUES;
  // one idea per beat plus extra ideas on the beat's own moments (cards, ring, keys…), each with its matching sound
  const SC = [];
  for (const b of B) {
    const pts = [[b.a, SFX0[b.sc.type] || 'pop']];
    (MOM[b.sc.type] || (() => []))(b).forEach(m => { if (m[0] > b.a + .9 && m[0] < b.b - .7) pts.push(m); });
    pts.sort((p, q) => p[0] - q[0]);
    pts.forEach((p, i) => SC.push({t0: +p[0].toFixed(2), t1: +(i + 1 < pts.length ? pts[i + 1][0] : b.b).toFixed(2), type: b.sc.type, bg: b.bt.id + (i ? '.' + i : ''), sfx: [[p[0] + .02, p[1], .32]]}));
  }
  SC.push({t0: TL.end_start, t1: END, type: 'end', bg: 'end', sfx: [[TL.end_start + .15, 'shimmer', .4]]});
  window.SCENES = SC;
  for (const s of SC) if (s.t1 - s.t0 > 3.2) ISSUES.push(`idea ${s.bg} holds ${(s.t1 - s.t0).toFixed(1)} s (> 3): add a moment`);
  seek(0);
})();
const W = (b, s) => { const i = b.words.findIndex(w => w.w.includes(s)); return b.wt(i < 0 ? 0 : i); };
// sound that opens each beat, matched to its motion (never a whoosh)
const SFX0 = {hook: 'notify', found: 'tap', cards: 'notify', delay: 'typing', photos: 'tap', slider: 'counter_tick', hotel: 'pop',
  gift: 'pop', ask_ai: 'typing', answer: 'notify', night: 'notify', flaw: 'notify', tip: 'sweep_soft', ask: 'click'};
// the moments inside a beat that get their own idea (camera kick) and sound
const MOM = {
  hook: b => [[1.2, 'click']],
  found: b => [[W(b, 'Xiniu'), 'shimmer'], [W(b, 'بانکی'), 'tap']],
  cards: b => [[b.a + 1.4, 'notify'], [b.a + 2.6, 'notify'], [W(b, 'روزها'), 'notify']],
  delay: b => [[W(b, 'ثانیه'), 'counter_tick'], [b.b - 1.1, 'notify']],
  photos: b => [[W(b, 'کتابخونه'), 'tap']],
  slider: b => [[W(b, '۷۰'), 'hit'], [W(b, 'اعتماد'), 'counter_tick']],
  hotel: b => [[W(b, 'پول'), 'click'], [W(b, 'لینک'), 'tap']],
  gift: b => [[W(b, 'هدیه'), 'pop'], [W(b, 'پول'), 'click']],
  ask_ai: b => [[W(b, 'AI'), 'tap']],
  answer: b => [[W(b, 'واقعی'), 'hit']],
  night: b => [[W(b, 'نصف'), 'notify']],
  flaw: b => [[W(b, 'ساکت'), 'notify'], [b.a + 1.2, 'notify']],
  tip: b => [[W(b, 'پول'), 'hit']],
  ask: b => [[W(b, 'کامنت'), 'notify']],
};

// ---- camera: station to station through one world, log-space zoom dipping out and back in on each move ----
function camAt(t) {
  let bi = 0; for (let i = 0; i < B.length; i++) if (t >= B[i].a) bi = i;
  const b = B[bi], prev = B[Math.max(0, bi - 1)], k = eio(pr(t, b.a, b.a + .75));
  const p0 = ST[prev.st], p1 = ST[b.st];
  const ZS = 1.12; let z1 = ZS, z0 = prev.sc.type === 'tip' ? .3 : ZS, c1 = p1;
  if (b.sc.type === 'tip') { c1 = [-1300, 4420]; z1 = 1.12 * (1 + .12 * eio(pr(t, b.a + .3, b.b))); }
  if (b.sc.type === 'ask') { const kk = eio(pr(t, b.a, b.a + 1.3)); return {x: mix(-1300, 0, kk), y: mix(4420, 0, kk), z: Math.exp(mix(Math.log(1.12), Math.log(1.12), kk) - 1.25 * Math.sin(Math.PI * kk))}; }
  const dist = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), dip = dist > 10 ? Math.min(.45, dist / 4200) : 0;
  z0 = prev.sc.type === 'tip' ? 1.12 : z0;
  const lz = mix(Math.log(z0), Math.log(z1), k) - dip * Math.sin(Math.PI * k);
  const drift = .03 * pr(t, b.a + .75, b.b);                      // the camera never sits still
  let x = mix(p0[0], c1[0], k), y = mix(p0[1], c1[1], k), z = Math.exp(lz) * (1 + drift);
  // screen-studio punch: every moment inside a beat alternates a wide and a tight framing on where the ball works,
  // so each idea fills the frame (closed-form ease, ~0.3 s, a move through the same world, never a cut)
  if (b.sc.type !== 'tip' && b.sc.type !== 'hook' && b.sc.type !== 'night') {
    const ids = (window.SCENES || []).filter(sc => sc.bg.split('.')[0] === b.bt.id && sc.t0 <= t);
    const i = ids.length - 1, t0 = i >= 0 ? ids[i].t0 : b.a, f = (j) => j % 2 ? 1 : 0;
    const prevF = i > 0 ? f(i - 1) : 0, curF = i >= 0 ? f(i) : 0, kk = eio(pr(t, t0, t0 + .32)), pf = mix(prevF, curF, kk);
    const [fx, fy] = contact(b, t), cx = mix(p1[0], fx, .75), cy = mix(p1[1], fy, .75);
    if (t > b.a + .75) { x = mix(x, cx, pf); y = mix(y, cy, pf); z *= 1 + .38 * pf; }
  }
  return {x, y, z};
}
// ---- the white ball: one continuous route; lands on each station's contact point with a squash ----
function ballAt(t) {
  let bi = 0; for (let i = 0; i < B.length; i++) if (t >= B[i].a) bi = i;
  const b = B[bi], cur = contact(b, t), prev = bi ? contact(B[bi - 1], b.a - .01) : cur;
  const k = pr(t, b.a, b.a + .6), e = eio(k), arc = Math.sin(Math.PI * k) * -260;
  const x = mix(prev[0], cur[0], e), y = mix(prev[1], cur[1], e) + arc;
  const land = t - (b.a + .6), sq = land >= 0 && land < .25 ? Math.sin(land / .25 * Math.PI) * .22 : 0;
  return [x, y, sq];
}
// contact point of the ball inside a beat (world px); some stations move it along (slider knob, keys…)
function contact(b, t) {
  const s = ST[b.st], u = t - b.a;
  switch (b.sc.type) {
    case 'hook': return [s[0] + 150, s[1]];
    case 'found': return [s[0] + 300, s[1] + 250];
    case 'cards': { const n = u < 1.4 ? 0 : u < 2.6 ? 1 : 2; return [s[0] + 380, s[1] - 260 + n * 230]; }
    case 'delay': return [s[0] + 300 * Math.cos(-Math.PI / 2 + 2 * Math.PI * pr(t, W(b, 'ثانیه') - .5, b.b - 1.1)), s[1] - 40 + 300 * Math.sin(-Math.PI / 2 + 2 * Math.PI * pr(t, W(b, 'ثانیه') - .5, b.b - 1.1))];
    case 'photos': return [s[0] + 40, s[1] + 500];
    case 'slider': return [s[0] - 380 + 760 * sliderK(b, t), s[1] + 60];
    case 'hotel': return [s[0] + 330, s[1] + 360];
    case 'gift': return [s[0] + 330, s[1] + 380];
    case 'ask_ai': { const kp = keyPress(b, t); return kp ? kp : [s[0] + 300, s[1] + 330]; }
    case 'answer': return [s[0] + 380, s[1] + 330];
    case 'night': return [s[0] + 60, s[1] + 120];
    case 'flaw': return [s[0], s[1] + 380 - Math.abs(Math.sin((t - b.a) * 4.2)) * 220];
    case 'tip': return [s[0], s[1] + 260];
    case 'ask': return [ST.T[0] - 150, ST.T[1]];
  }
  return s;
}
const sliderK = (b, t) => eio(pr(t, b.a + .5, W(b, '۷۰') + .2));
// keyboard: the ball strikes each key of "Are you AI?" at a fixed time
const KEYROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
function keyXY(ch) {
  const c = ch.toLowerCase(); for (let r = 0; r < 3; r++) { const i = KEYROWS[r].indexOf(c); if (i >= 0) return [ST.K[0] - 450 + i * 100 + r * 40, ST.K[1] + 170 + r * 120]; }
  if (ch === ' ') return [ST.K[0], ST.K[1] + 530]; if (ch === '↵') return [ST.K[0] + 410, ST.K[1] + 530]; return [ST.K[0] + 410, ST.K[1] + 410];
}
const TYPED = 'Are you AI?';
const keyTimes = b => { const t0 = b.a + .7, t1 = W(b, 'AI') + .35; return [...TYPED, '↵'].map((c, i) => [t0 + (t1 - t0) * i / TYPED.length, c]); };
function keyPress(b, t) { const ks = keyTimes(b); let last = null; ks.forEach(([tk, c]) => { if (t >= tk - .12) last = keyXY(c); }); return t >= ks[0][0] - .12 ? last : null; }

// ---- small UI kit, all vector (charcoal controls, white text, one blue accent) ----
const box = (x, y, w, h, inner = '', st = '') => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${st}">${inner}</div>`;
const txt = (x, y, s, size, col = '#fff', st = '', ltr = false) => `<div class="t" ${ltr ? 'dir="ltr"' : ''} style="left:${x}px;top:${y}px;font-size:${size}px;color:${col};${st}">${s}</div>`;
const rtxt = (r, y, s, size, col = '#fff', st = '') => `<div class="t" style="left:${-r - 900}px;width:900px;text-align:right;top:${y}px;font-size:${size}px;color:${col};${st}">${s}</div>`;
const pop = (k, inner, ox = '50%', oy = '50%') => `<div class="a" style="left:0;top:0;transform-origin:${ox} ${oy};transform:scale(${spring(k).toFixed(3)});opacity:${cl(k * 6)}">${inner}</div>`;
function toggle(x, y, on, k = 1, label = 'AI') {
  const kx = mix(0, 1, on);
  return `<div class="a" style="left:${x - 170}px;top:${y - 90}px;width:340px;height:180px;border-radius:90px;background:${on > .5 ? 'var(--blue)' : 'var(--ch2)'};border:3px solid var(--line);transform:scale(${spring(k).toFixed(3)})"></div>` +
    txt(x - 120, y - 210, label, 64, '#fff', '', true) + `<div class="a" style="left:${x - 150 + kx * 160}px;top:${y - 70}px;width:140px;height:140px;border-radius:50%;background:#2E3038"></div>`;
}
function bubble(x, y, w, s, k, me = false, sz = 50) {
  const e = spring(k);
  return `<div class="a" style="left:${x}px;top:${y}px;width:${w}px;transform:translateY(${(1 - ex(k)) * 60}px) scale(${e.toFixed(3)});transform-origin:${me ? '100%' : '0'} 100%;opacity:${cl(k * 5)}">
    <div style="display:inline-block;padding:20px 34px 28px;border-radius:40px;${me ? 'border-bottom-right-radius:10px;background:var(--blue)' : 'border-bottom-left-radius:10px;background:#2E3038'};font:900 ${sz}px/1.3 V;color:#fff">${s}</div></div>`;
}
const dots = (x, y, t) => `<div class="a" style="left:${x}px;top:${y}px;padding:26px 34px;border-radius:40px;background:#2E3038;display:flex;gap:16px">${[0, 1, 2].map(i => `<div style="width:22px;height:22px;border-radius:50%;background:#fff;opacity:${(.35 + .65 * Math.abs(Math.sin(t * 5 - i * .7))).toFixed(2)}"></div>`).join('')}</div>`;
const avatar = (x, y, d) => `<div class="a" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%;background:#FF5C93;font:900 ${d * .45}px/${d}px V;text-align:center" dir="ltr">S</div>`;
const tg = (x, y, d) => `<img class="a" src="${U('el/telegram.png')}" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;border-radius:50%">`;

// ---- every station draws itself from the time (local progress), wherever the camera is ----
function stations(t) {
  let r = '';
  const bt = type => B.find(b => b.sc.type === type);
  // T: the AI-persona toggle (flips ON in the hook, OFF at the end)
  { const h = bt('hook'), a = bt('ask'), on = (t >= 1.2 ? ex(pr(t, 1.2, 1.45)) : 0) * (a && t >= a.a + .9 ? 1 - ex(pr(t, a.a + .9, a.a + 1.15)) : 1);
    r += box(-470, -330, 940, 660) + toggle(0, 60, on) + rtxt(-430, -280, 'حالت ربات', 54, 'var(--mu)');
    if (a && t >= W(a, 'کامنت') - .1) r += pop(pr(t, W(a, 'کامنت') - .1, W(a, 'کامنت') + .35), bubble(-380, 420, 760, 'کامنت کن 👇', 1, true, 70)); }
  // P: product card «Xiniu» + investigator badge + «sold on Telegram» chip
  { const b = bt('found'), k = b ? pr(t, b.a + .2, b.a + .6) : 0, kn = b ? pr(t, W(b, 'Xiniu') - .1, W(b, 'Xiniu') + .3) : 0;
    r += box(840, -380, 920, 760, '', `transform:scale(${(.9 + .1 * ex(k)).toFixed(3)})`) + txt(900, -330, 'AI CUSTOMER SERVICE', 40, 'var(--mu)', 'letter-spacing:4px', true);
    r += txt(900, -260, 'Xiniu', 170, '#fff', `opacity:${(.15 + .85 * ex(kn)).toFixed(2)}`, true) + txt(910, -40, '夕牛', 80, 'var(--blue)', '', true);
    r += pop(pr(t, (b ? b.a : 0) + .9, (b ? b.a : 0) + 1.3), `<div class="a" style="left:900px;top:90px;padding:16px 30px;border-radius:30px;background:var(--ch2);font:900 46px V">🔎 محقق کلاهبرداری بانکی</div>`);
    r += pop(pr(t, (b ? b.a : 0) + 1.6, (b ? b.a : 0) + 2), `<div class="a" style="left:1300px;top:220px;padding:16px 34px;border-radius:30px;background:var(--blue);font:900 46px V">خرید ↗</div>`); }
  // C: three notification cards, each on its beat, with the Telegram mark and a running day counter
  { const b = bt('cards'), m = [['سلام عزیزم 😊', 0], ['دلم برات تنگ شده', 1.4], ['هنوز بیداری؟', 2.6]];
    m.forEach(([s, d], i) => { const k = b ? pr(t, b.a + d, b.a + d + .45) : 0; const y = 1500 - 360 + i * 230;
      r += pop(k, box(860, y, 900, 200, '', 'border-radius:44px') + avatar(890, y + 40, 120) + txt(1030, y + 30, 'Sofia', 50, '#fff', '', true) + rtxt(-1700, y + 100, s, 50, '#D8D9E0') + tg(1660, y + 30, 70), '1300px', y + 100 + 'px'); });
    const days = b ? 1 + Math.floor(2.99 * pr(t, W(b, 'روزها'), b.b)) : 1;
    r += box(1020, 1820, 560, 150) + rtxt(-1550, 1850, `روز ${fa(days)}`, 70, '#fff') + `<div class="a" style="left:1060px;top:1880px;width:${(220 * pr(t, b ? W(b, 'روزها') : 0, b ? b.b : 1)).toFixed(0)}px;height:24px;border-radius:12px;background:var(--blue)"></div>`; }
  // D: typing dots + a 7–9 s timer ring filling, the bubble lands when the ring completes
  { const b = bt('delay'), kr = b ? pr(t, W(b, 'ثانیه') - .5, b.b - 1.1) : 0, s = 7 + 2 * kr, C = 2 * Math.PI * 300;
    r += `<svg class="a" style="left:-340px;top:1120px" width="680" height="680"><circle cx="340" cy="340" r="300" fill="none" stroke="#2A2C34" stroke-width="34"/><circle cx="340" cy="340" r="300" fill="none" stroke="#2F7BFF" stroke-width="34" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C * (1 - kr)).toFixed(1)}" transform="rotate(-90 340 340)"/></svg>`;
    r += txt(-200, 1340, `${fa(kr > 0 ? s.toFixed(1) : '۰')}<span style="font-size:70px"> ثانیه</span>`, 150, '#fff', 'width:400px;text-align:center');
    r += t < (b ? b.b - 1.1 : 0) ? dots(-110, 1560, t) : bubble(-260, 1560, 600, 'ببخشید، دیر دیدم ❤', b ? pr(t, b.b - 1.1, b.b - .7) : 1);
