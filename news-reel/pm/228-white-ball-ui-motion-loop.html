<!-- Skill motion-graphy-2026, prompt 228 "White ball UI motion loop" (TOPIC/UI), built as its own engine.
     Look from the prompt: a near-black canvas with a faint dot grid, charcoal controls, sharp white text, ONE electric-blue
     accent and a white ball that travels through the whole film. A real cursor makes the opening click physical; after
     that the ball guides every hand-off (toggle → card → slider → notifications → reply field → keyboard → return).
     All UI lives in ONE world; a single camera (position + log-space zoom) moves through it, so every close-up is a
     move inside that world, never a hard cut. Closed-form springs with a small overshoot and a brief squash on impact.
     Banned by the prompt and kept out: hard cuts, stock footage, glows, particle bursts, disconnected transitions,
     excessive bouncing, blurry text during camera moves. The opening photo (user realism rule, RUNBOOK §4.0 rule 4)
     shrinks into the world as a card, so the first move is still continuous.
     Page standards: 1080x1920, Persian narration (eleven_v4) with a word-by-word caption, music bed at 120 BPM, SFX via
     SCENES[].sfx. Data: story.json beats[{id, text, scene{type, img?}}], end_text, end_sub; el/*.
     Pure seek(t): every style is computed from t, no CSS animations, timers or Math.random. -->

// ---- camera: station to station through one world, log-space zoom dipping out and back in on each move ----
function camAt(t) {
  let bi = 0; for (let i = 0; i < B.length; i++) if (t >= B[i].a) bi = i;
  const b = B[bi], prev = B[Math.max(0, bi - 1)], k = eio(pr(t, b.a, b.a + .75));
  const p0 = ST[prev.st], p1 = ST[b.st];
  const ZS = 1.12; let z1 = ZS, z0 = prev.kind === 'tip' ? .3 : ZS, c1 = p1;
  if (b.kind === 'tip') { c1 = [-1300, 4420]; z1 = 1.12 * (1 + .12 * eio(pr(t, b.a + .3, b.b))); }
  if (b.kind === 'ask') { const kk = eio(pr(t, b.a, b.a + 1.3)); return {x: mix(-1300, 0, kk), y: mix(4420, 0, kk), z: Math.exp(mix(Math.log(1.12), Math.log(1.12), kk) - 1.25 * Math.sin(Math.PI * kk))}; }
  const dist = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), dip = dist > 10 ? Math.min(.45, dist / 4200) : 0;
  z0 = prev.kind === 'tip' ? 1.12 : z0;
  const lz = mix(Math.log(z0), Math.log(z1), k) - dip * Math.sin(Math.PI * k);
  const drift = .03 * pr(t, b.a + .75, b.b);                      // the camera never sits still
  let x = mix(p0[0], c1[0], k), y = mix(p0[1], c1[1], k), z = Math.exp(lz) * (1 + drift);

  // so each idea fills the frame (closed-form ease, ~0.3 s, a move through the same world, never a cut)
  if (b.kind !== 'tip' && b.kind !== 'hook' && b.kind !== 'night') {
    const ids = (window.SCENES || []).filter(sc => sc.bg.split('.')[0] === b.bt.id && sc.t0 <= t);
    const i = ids.length - 1, t0 = i >= 0 ? ids[i].t0 : b.a, f = (j) => j % 2 ? 1 : 0;
    const prevF = i > 0 ? f(i - 1) : 0, curF = i >= 0 ? f(i) : 0, kk = eio(pr(t, t0, t0 + .32)), pf = mix(prevF, curF, kk);
    const [fx, fy] = contact(b, t), cx = mix(p1[0], fx, .75), cy = mix(p1[1], fy, .75);

// ---- the white ball: one continuous route; lands on each station's contact point with a squash ----
function ballAt(t) {

  const b = B[bi], cur = contact(b, t), prev = bi ? contact(B[bi - 1], b.a - .01) : cur;

// contact point of the ball inside a beat (world px); some stations move it along (slider knob, keys…)
function contact(b, t) {

  switch (b.sc.type) {
    case 'hook': return [s[0] + 150, s[1]];
    case 'found': return [s[0] + 300, s[1] + 250];
    case 'cards': { const n = u < 1.4 ? 0 : u < 2.6 ? 1 : 2; return [s[0] + 380, s[1] - 260 + n * 230]; }
    case 'delay': return [s[0] + 300 * Math.cos(-Math.PI / 2 + 2 * Math.PI * pr(t, W(b, 'ثانیه') - .5, b.b - 1.1)), s[1] - 40 + 300 * Math.sin(-Math.PI / 2 + 2 * Math.PI * pr(t, W(b, 'ثانیه') - .5, b.b - 1.1))];
    case 'photos': return [s[0] + 40, s[1] + 500];
    case 'slider': return [s[0] - 380 + 760 * sliderK(b, t), s[1] + 60];
    case 'hotel': return [s[0] + 330, s[1] + 360];
    case 'gift': return [s[0] + 330, s[1] + 380];
    case 'ask_ai': { const kp = keyPress(b, t); return kp ? kp : [s[0] + 300, s[1] + 330]; }
    case 'answer': return [s[0] + 380, s[1] + 330];
    case 'night': return [s[0] + 60, s[1] + 120];
    case 'flaw': return [s[0], s[1] + 380 - Math.abs(Math.sin((t - b.a) * 4.2)) * 220];
    case 'tip': return [s[0], s[1] + 260];
    case 'ask': return [ST.T[0] - 150, ST.T[1]];

    case 'vc_clone': return [s[0] + 300 - 600 * vcTog(b, t), s[1] + 330];
    case 'vc_call': { const n = t < W(b, 'تصادف') - .2 ? 0 : t < W(b, 'پول') - .2 ? 1 : 2; return [s[0] - 330, s[1] - 230 + n * 200]; }
    case 'vc_secret': return [s[0], s[1] - 20];
    case 'vc_fbi': return [s[0] + 380, s[1] + 360];
    case 'vc_three': return [s[0] - 380 + 760 * vcSl(b, t), s[1] - 160];
    case 'vc_code': { const kp = vcKeyPress(b, t); return kp ? kp : [s[0] + 300, s[1] - 250]; }
    case 'vc_ask': return t < b.b - 1.0 ? [s[0] - 380, s[1] - 200] : [s[0] + 380, s[1] + 230];
    case 'vc_back': return t < W(b, 'شماره') - .1 ? [s[0], s[1] + 330] : t < W(b, 'زنگ') - .1 ? [s[0] + 250, s[1] + 20] : [s[0], s[1] + 330];
    case 'vc_fake': return [s[0] + 380, s[1] + 600];

const sliderK = (b, t) => eio(pr(t, b.a + .5, W(b, '۷۰') + .2));
const vcTog = (b, t) => ex(pr(t, W(b, 'کپی') - .15, W(b, 'کپی') + .15));
const vcSl = (b, t) => eio(pr(t, b.a + .4, W(b, 'سه') + .25));
const VTYPED = 'golabi';
const fsSl = (b, t) => eio(pr(t, b.a + .3, W(b, 'چهار') + .25));
const FTYPED = 'paybank';
const fsKeyTimes = b => { const t0 = b.a + .5, t1 = W(b, 'بانکی'); return [...FTYPED, '↵'].map((c, i) => [t0 + (t1 - t0) * i / FTYPED.length, c]); };
function fsKeyPress(b, t) { const ks = fsKeyTimes(b); let last = null; ks.forEach(([tk, c]) => { if (t >= tk - .12) last = keyXY(c); }); return t >= ks[0][0] - .12 ? last : null; }
const vcKeyTimes = b => { const t0 = W(b, 'رمز') + .1, t1 = W(b, 'می‌دونید'); return [...VTYPED, '↵'].map((c, i) => [t0 + (t1 - t0) * i / VTYPED.length, c]); };
function vcKeyPress(b, t) { const ks = vcKeyTimes(b); let last = null; ks.forEach(([tk, c]) => { if (t >= tk - .12) last = keyXY(c); }); return t >= ks[0][0] - .12 ? last : null; }
// keyboard: the ball strikes each key of "Are you AI?" at a fixed time
const KEYROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
function keyXY(ch) {
  const c = ch.toLowerCase(); for (let r = 0; r < 3; r++) { const i = KEYROWS[r].indexOf(c); if (i >= 0) return [ST.K[0] - 450 + i * 100 + r * 40, ST.K[1] + 170 + r * 120]; }
  if (ch === ' ') return [ST.K[0], ST.K[1] + 530]; if (ch === '↵') return [ST.K[0] + 410, ST.K[1] + 530]; return [ST.K[0] + 410, ST.K[1] + 410];
