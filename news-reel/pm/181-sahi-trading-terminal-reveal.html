<!doctype html>
<html lang="fa" dir="rtl">

<meta charset="utf-8">
<title>meshkani.pro — terminal reveal (prompt 181)</title>
<!-- Skill motion-graphy-2026, prompt 181 "Sahi trading terminal reveal" (MUSIC), built as its own engine.
     Look from the prompt: real-looking data in real layouts; the journey starts as a single dot on a black screen,
     windows land one per beat (100 BPM), the camera zooms in and out across scales, pulls out until the desktop is a
     point in space, and zooms back in to a phone split in two halves; it ends on one line.
     Kept from the prompt's banned list: no particle bursts, glows, lens flares, camera shake, RGB split, crossfades,
     generic gradients or bouncy easing. Blur follows speed on fast camera moves; easing is exponential.
     Allowed edits: 30 s → the voiced length, 1920x1080 → 1080x1920, the product = the story's subject (story.product),
     Web Audio → per-cut sfx + music bed (page standard), the opening = the real photo hook (RUNBOOK §4.0 rule 4).
     Data: story.json beats[{id, text, scene{type, img}}]; el/<product>.png, el/<brand>.png real logos; raw/sNN.png.
     Scene types: hook, dot, desk, map, pay, token, enter, count, check, official, guard, space, phone (+ end). -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --bg: #05070A; --pane: #0D1117; --line: #1F2833; --dim: #6B7785; --tx: #E6EDF3; --up: #16C784; --dn: #F6465D; --amb: #F0B90B; --blu: #3B82F6; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #frame { position: absolute; inset: 0; overflow: hidden; font-family: V; font-weight: 900; color: var(--tx); }
  #cam, #layer, #caps { position: absolute; inset: 0; }
  #cam { transform-origin: 0 0; }
  .ab { position: absolute; }
  .mono { font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace; font-weight: 700; direction: ltr; }
  .win { position: absolute; background: var(--pane); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
  .bar { height: 54px; border-bottom: 2px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 0 20px; direction: ltr; background: #0A0E13; }
  .bar i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  .bar b { font: 700 24px 'DejaVu Sans Mono', monospace; color: var(--dim); margin-left: 8px; letter-spacing: .5px; }
  .cap { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
</style>
</head>
<body>
<div id="frame"><div id="cam"><div id="layer"></div></div><div id="caps"></div></div>
<script>
const P = new URLSearchParams(location.search), HOME = P.get('dir') || '/work/story/';
const src = f => f.startsWith('/') ? f : HOME + f, $ = id => document.getElementById(id);
const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v)), lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ex = k => 1 - Math.pow(2, -10 * clamp(k)), exIO = k => (k = clamp(k), k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2);
const fa = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const BEAT = 60 / 100;                          // the prompt's 100 BPM grid: windows land on beats
const ISSUES = [];
let D, T, BEATS = [], TOTAL = 50;

// ---------- words → times ----------
function prep(b) {
  const L = T.lines[b.id]; if (!L) { ISSUES.push('no timing for ' + b.id); return null; }
  const clean = b.text.replace(/\[[^\]]*\]/g, ' ');
  const spoken = clean.replace(/\{[^|}]*\|([^}]*)\}/g, '$1').replace(/\*/g, '').trim().split(/\s+/);
  const n = L.words.length, map = i => spoken.length === n ? i : Math.round(clamp(i / Math.max(1, spoken.length - 1)) * (n - 1));
  const at = i => (L.words[map(clamp(i, 0, spoken.length - 1))] || [L.start])[0];
  const shown = []; let si = 0, star = false;
  for (const tok of clean.replace(/\{([^|}]*)\|([^}]*)\}/g, (m, a, c) => a.replace(/\s/g, '\u0002') + '\u0001' + c.trim().split(/\s+/).length).trim().split(/\s+/)) {
    let w = tok, span = 1; if (w.includes('\u0001')) { const [w0, rest] = w.split('\u0001'); span = parseInt(rest, 10) || 1; w = w0 + rest.replace(/^\d+/, ''); }
    if (w.startsWith('*')) star = true; const k = star; if (/\*[«»"'.…،؛!؟?:]*$/.test(w)) star = false;
    shown.push({w: w.replace(/\*/g, '').replace(/\u0002/g, ' '), k, t: at(si)}); si += span;
  }
  // when('token') → time of the first shown word containing the text (a number, name or result lands on its word)
  const when = (sub, nth = 0) => { const hit = shown.filter(w => w.w.includes(sub)); if (!hit.length) { ISSUES.push(`${b.id}: no word "${sub}"`); return L.start; } return hit[Math.min(nth, hit.length - 1)].t; };
  return {b, s: b.scene || {}, L, at, shown, when};
}

window.ready = (async () => {
  D = await (await fetch(src('story.json'))).json(); T = await (await fetch(src('timeline.json'))).json();
  TOTAL = T.total;
  BEATS = D.beats.map(prep).filter(Boolean);
  BEATS.forEach((x, i) => { x.i = i; x.a = i ? x.L.start - .08 : 0; x.z = i + 1 < BEATS.length ? BEATS[i + 1].L.start - .08 : T.end_start; });
  const pics = [...new Set(BEATS.map(x => x.s.img).filter(Boolean))].map(n => src('raw/' + n + '.png')).concat([src('el/' + PROD()), src('el/' + BRAND())]);
  await Promise.all(pics.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'آمار Claude')));
  BEATS.forEach(x => { x.keys = (KEYS[x.s.type] || (() => []))(x).filter(v => v > x.a + .5 && v < x.z - .5).sort((p, q) => p - q); });
  // rhythm: no shot longer than ~2.7 s; extra keys are small camera moves (push/drift) between the word keys
  BEATS.forEach(x => { const pts = [x.a, ...x.keys, x.z], add = [];
    for (let i = 0; i + 1 < pts.length; i++) { const g = pts[i + 1] - pts[i], n = Math.ceil(g / 2.7) - 1; for (let j = 1; j <= n; j++) add.push(pts[i] + g * j / (n + 1)); }
    x.extra = add; x.keys = [...x.keys, ...add].sort((p, q) => p - q); });
  const cuts = [];
  for (const x of BEATS) {
    const pts = [x.a, ...x.keys];
    pts.forEach((p, j) => cuts.push({t0: +p.toFixed(2), t1: +(j + 1 < pts.length ? pts[j + 1] : x.z).toFixed(2), type: x.s.type, bg: x.b.id + (j ? '.' + j : ''), sfx: [[p, j ? 'hit' : 'whoosh', j ? .35 : .3]]}));
  }
  cuts.push({t0: T.end_start, t1: TOTAL, type: 'end', bg: 'end', sfx: [[T.end_start + .1, 'hit', .5]]});
  window.SCENES = cuts; window.START = 0; window.DURATION = TOTAL; window.ISSUES = ISSUES;
  for (const c of cuts) if (c.t1 - c.t0 > 3.2) ISSUES.push(`shot ${c.bg} holds ${(c.t1 - c.t0).toFixed(1)} s (> 3): add a key`);
  seek(0);
})();
const PROD = () => (D.product || 'fiverr').toLowerCase().replace(/[^a-z0-9]/g, '') + '.svg';
const BRAND = () => (D.brand || 'upwork').toLowerCase().replace(/[^a-z0-9]/g, '') + '.svg';

// camera keys inside a beat (each is a clear camera change = a new shot)
const KEYS = {
  hook: x => [x.at(4), x.when('مانع')], count: x => [x.when('شش'), x.when('هزار')], agent: x => [x.when('تکراری'), x.when('هر')],
  video: x => [x.when('جست‌وجوش'), x.when('هزار')], human: x => [x.when('انسانی'), x.when('ششصد')], label: x => [x.when('دویست'), x.when('بیست')],
  catch: x => [x.when('تحریم'), x.when('نصف')], choice: x => [x.when('سی‌روزه'), x.when('دو:')], vote: x => [x.when('کامنت')]
};

// ---------- building blocks ----------
function win(x0, y0, w, h, title, body, k, from = 'up', accent = '') {
  // a window lands on its beat: exponential slide + scale from 0.9, no overshoot (the prompt bans bouncy easing)
  if (k <= 0) return '';
  const e = ex(k), d = (1 - e), dx = from === 'left' ? -260 * d : from === 'right' ? 260 * d : 0, dy = from === 'up' ? 220 * d : from === 'down' ? -220 * d : 0;
  return `<div class="win" style="left:${x0}px;top:${y0}px;width:${w}px;height:${h}px;transform:translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) scale(${lerp(.9, 1, e).toFixed(4)});opacity:${clamp(k * 4).toFixed(2)}${accent ? ';border-color:' + accent : ''}">` +
    `<div class="bar"><i style="background:#F6465D"></i><i style="background:#F0B90B"></i><i style="background:#16C784"></i><b>${title}</b></div>` +
    `<div style="position:absolute;left:0;right:0;top:56px;bottom:0">${body}</div></div>`;
}
const logo = (f, s, bg = '#fff') => `<span style="display:inline-flex;align-items:center;justify-content:center;width:${s}px;height:${s}px;border-radius:${s * .24}px;background:${bg};vertical-align:middle"><img src="${src('el/' + f)}" style="width:${s * .74}px;height:${s * .74}px;object-fit:contain"></span>`;
const chip = (html, x0, y0, sz, bg, fg, k, dir = 'ltr') => k <= 0 ? '' : `<div class="ab" style="left:${x0}px;top:${y0}px;padding:${sz * .18}px ${sz * .4}px ${sz * .26}px;border-radius:${sz * .3}px;background:${bg};color:${fg};font:900 ${sz}px/1.15 V;white-space:nowrap;direction:${dir};transform:scale(${lerp(1.5, 1, ex(k)).toFixed(3)});opacity:${clamp(k * 5).toFixed(2)};transform-origin:50% 50%">${html}</div>`;
const typed = (s, k) => s.slice(0, Math.round(s.length * clamp(k)));
const caret = t => (t * 2 % 1 < .5 ? '▌' : ' ');
function photoIn(img, w, h, t, a, z, zoom = [1.18, 1.04]) {
  const k = ramp(t, a, z), sc = lerp(zoom[0], zoom[1], exIO(k));
  return `<div style="position:absolute;inset:0;overflow:hidden"><img src="${src('raw/' + img + '.png')}" style="position:absolute;left:0;top:0;width:${w}px;height:${h}px;object-fit:cover;transform:scale(${sc.toFixed(4)});transform-origin:50% 45%"></div>`;
}
// a line chart of random-but-seeded "real-looking" data that draws on
function spark(w, h, k, seed, col, n = 40, rise = 0) {
  let v = 50, pts = []; for (let i = 0; i < n; i++) { v += Math.sin(seed * 9.1 + i * 1.7) * 6 + Math.cos(seed * 3.3 + i * .9) * 4 + rise; pts.push(v); }
  const lo = Math.min(...pts), hi = Math.max(...pts), m = Math.max(2, Math.round(n * clamp(k)));
  const xy = pts.slice(0, m).map((p, i) => `${(i / (n - 1) * w).toFixed(1)},${(h - (p - lo) / (hi - lo + 1e-6) * h * .9 - h * .05).toFixed(1)}`).join(' ');
  const last = xy.split(' ').pop().split(',');
  return `<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0;overflow:visible"><polyline points="${xy}" fill="none" stroke="${col}" stroke-width="4" stroke-linejoin="round"/>` +
    `<circle cx="${last[0]}" cy="${last[1]}" r="9" fill="${col}"/></svg>`;
}
function bars(w, h, vals, k, col, hi = -1) {
  const n = vals.length, bw = w / n * .62, mx = Math.max(...vals);
  return vals.map((v, i) => { const kk = ex(clamp(k * 1.6 - i * .6 / n)), bh = v / mx * h * kk;
    return `<div class="ab" style="left:${(i * w / n + (w / n - bw) / 2).toFixed(1)}px;top:${(h - bh).toFixed(1)}px;width:${bw.toFixed(1)}px;height:${bh.toFixed(1)}px;background:${i === hi ? 'var(--amb)' : col};border-radius:6px 6px 0 0"></div>`; }).join('') +
    `<div class="ab" style="left:0;right:0;top:${h}px;height:2px;background:var(--line)"></div>`;
}
const rows = (list, k, t0, step, t) => list.map((r, i) => { const kk = ramp(t, t0 + i * step, t0 + i * step + .2); if (kk <= 0) return '';
  return `<div class="mono" style="display:flex;justify-content:space-between;padding:14px 26px;border-bottom:1px solid var(--line);font-size:26px;color:${r[2] || 'var(--tx)'};background:${r[3] || 'transparent'};opacity:${kk.toFixed(2)};transform:translateX(${((1 - ex(kk)) * 40).toFixed(1)}px)"><span>${r[0]}</span><span>${r[1]}</span></div>`; }).join('');
const ground = () => `<div class="ab" style="inset:-400px;background-color:var(--bg);background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:90px 90px;opacity:.55"></div>`;

// ---------- camera: one key per cut; scale/position eased exponentially; blur follows speed ----------
let CAM = {s: 1, x: 540, y: 960, blur: 0};
function camAt(t, x) {
  const keys = (CAMS[x.s.type] || (() => [[0, 1, 540, 960]]))(x).slice();       // [[time, scale, focusX, focusY], …]
  (x.extra || []).forEach((e, i) => { let b = keys[0]; for (const k of keys) if (k[0] <= e) b = k; keys.push([e, b[1] * (i % 2 ? 1.08 : .93), b[2] + (i % 2 ? 40 : -40), b[3] + (i % 2 ? 90 : -90)]); });
  keys.sort((p, q) => p[0] - q[0]);
  let i = 0; for (let j = 0; j < keys.length; j++) if (t >= keys[j][0]) i = j;
  const k0 = keys[Math.max(0, i - 1)], k1 = keys[i], dur = .5, kk = i ? exIO(ramp(t, k1[0], k1[0] + dur)) : 1;
  const s = Math.exp(lerp(Math.log(k0[1]), Math.log(k1[1]), kk)), fx = lerp(k0[2], k1[2], kk), fy = lerp(k0[3], k1[3], kk);
  const sp = i ? Math.abs(Math.log(k1[1] / k0[1])) * (1 - Math.abs(kk * 2 - 1)) : 0;
  const drift = 1 + .025 * ramp(t, x.a, x.z);
  return {s: s * drift, fx, fy, blur: Math.min(10, sp * 14)};
}
const CAMS = {
  hook: x => [[x.a, 1, 540, 960], [x.at(4), 1.08, 540, 1100], [x.when('مانع'), 1.16, 540, 1240]],
  count: x => [[x.a, 1.5, 540, 520], [x.when('شش'), 1, 540, 960], [x.when('هزار'), 1.14, 540, 1080]],
  agent: x => [[x.a, 2.4, 540, 420], [x.a + .6, 1, 540, 960], [x.when('تکراری'), 1.12, 540, 1000], [x.when('هر'), 1.05, 540, 1250]],
  video: x => [[x.a, 1.3, 540, 560], [x.when('جست‌وجوش'), 1, 540, 960], [x.when('هزار'), 1.15, 540, 1180]],
  human: x => [[x.a, 1, 540, 960], [x.when('انسانی'), 1.12, 540, 700], [x.when('ششصد'), 1.08, 540, 1180]],
  label: x => [[x.a, 1.4, 540, 600], [x.when('دویست'), 1, 540, 960], [x.when('بیست'), 1.1, 540, 1150]],
  catch: x => [[x.a, .4, 540, 960], [x.a + .5, 1, 540, 960], [x.when('تحریم'), 1.15, 540, 700], [x.when('نصف'), 1.05, 540, 1150]],
  choice: x => [[x.a, 1, 540, 960], [x.when('سی‌روزه'), 1.12, 540, 640], [x.when('دو:'), 1.12, 540, 1180]],
  vote: x => [[x.a, .2, 540, 960], [x.a + .5, 1, 540, 960], [x.when('کامنت'), 1.1, 540, 1050]]
};

function seek(t) {
  if (!BEATS.length) return;
  let x = BEATS[0]; for (const q of BEATS) if (t >= q.a) x = q;
  const endOn = t >= T.end_start, c = endOn ? {s: 1, fx: 540, fy: 960, blur: 0} : camAt(t, x);
  $('cam').style.transform = `translate(540px,960px) scale(${c.s.toFixed(4)}) translate(${(-c.fx).toFixed(1)}px,${(-c.fy).toFixed(1)}px)`;
  $('cam').style.filter = c.blur > .3 ? `blur(${c.blur.toFixed(1)}px)` : 'none';
  const html = endOn ? ending(t - T.end_start, t) : draw(x, t);
  const lay = $('layer'); if (lay._h !== html) { lay._h = html; lay.innerHTML = html; }
  const caps = endOn ? '' : captions(x, t) + hud(x, t); const cp = $('caps'); if (cp._h !== caps) { cp._h = caps; cp.innerHTML = caps; }
}

// running HUD: a status strip with the clock and the beat ticker (the terminal's own chrome), every scene but the hook
function hud(x, t) {
  if (x.s.type === 'hook' || x.s.type === 'vote') return '';
  const pulse = Math.exp(-8 * ((t % BEAT + BEAT) % BEAT));
  return `<div class="ab mono" style="left:40px;right:40px;top:58px;height:64px;display:flex;align-items:center;gap:18px;padding:0 24px;border-radius:14px;background:rgba(10,14,19,.92);border:2px solid var(--line);font-size:26px;color:var(--dim)">` +
    `${logo(PROD(), 40, '#fff')}${logo(BRAND(), 40, '#fff')}<span style="color:var(--tx)">freelance market · AI skills</span><span style="margin-left:auto">2025 reports</span>` +
    `<span style="display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--up);transform:scale(${(1 + .5 * pulse).toFixed(3)})"></span></div>`;
}
// captions: the spoken words, chunk by chunk (≤ 4 words), accent words in amber, on a solid dark plate
function captions(x, t) {
  if (x.s.type === 'hook' && t < x.at(4)) return hookTitle(x, t);
  if (t > x.L.end + .3) return '';
  const W = x.shown, n = W.length; let j = 0; for (let q = 0; q < n; q++) if (t >= W[q].t - .05) j = q;
  const ch = []; let cur = []; W.forEach((w, q) => { cur.push(q); if (cur.length === 4 || /[،؛.!؟?…:»]$/.test(w.w)) { ch.push(cur); cur = []; } }); if (cur.length) ch.push(cur);
  const now = ch.find(c => c.includes(j)), k = ramp(t, W[now[0]].t - .05, W[now[0]].t + .12);
  const line = now.filter(q => t >= W[q].t - .05).map(q => W[q].k ? `<span style="color:var(--amb)">${W[q].w}</span>` : W[q].w).join(' ');
  const y = x.s.type === 'phone' ? 1770 : 1560;
  return `<div class="cap" style="top:${y}px"><span style="display:inline-block;padding:14px 40px 24px;border-radius:24px;background:rgba(5,7,10,.88);border:2px solid var(--line);font-size:78px;line-height:1.25;transform:translateY(${((1 - ex(k)) * 30).toFixed(1)}px)">${line}</span></div>`;
}
function hookTitle(x, t) {
  const k = ex(ramp(t, 0, .25));
  return `<div class="ab" style="left:0;right:0;top:170px;transform:translateY(${((1 - k) * -40).toFixed(1)}px)">` +
    `<div class="cap" style="position:relative;margin-bottom:24px"><span style="display:inline-block;padding:6px 30px 14px;border-radius:20px;background:var(--up);color:#05070A;font:900 56px V">${D.series_tag || ''}</span></div>` +
    `<div class="cap" style="position:relative;font-size:132px;line-height:1.2;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.6)">اگه درآمدت</div>` +
    `<div class="cap" style="position:relative;margin-top:10px"><span style="display:inline-block;padding:4px 34px 22px;border-radius:26px;background:var(--up);color:#05070A;font-size:132px;line-height:1.2">دلاری</span> <span style="font-size:132px;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.55)">بود چی؟</span></div></div>`;
}

function draw(x, t) {
  const s = x.s, A = x.a, at = x.at, w = x.when;
  const big = (txt, x0, y0, sz, col, k) => k <= 0 ? '' : `<div class="ab" style="left:${x0}px;right:${x0}px;top:${y0}px;text-align:center;font:900 ${sz}px/1.1 V;color:${col};direction:ltr;transform:scale(${lerp(1.5, 1, ex(k)).toFixed(3)});opacity:${clamp(k * 5).toFixed(2)}">${txt}</div>`;
  const pct = (v, k) => '+' + fa(Math.round(v * (k >= 1 ? 1 : ex(k))).toLocaleString('en-US')) + '٪';
  const stat = (x0, y0, wd, label, val, k, col) => k <= 0 ? '' : `<div class="ab" style="left:${x0}px;top:${y0}px;width:${wd}px;height:300px;border-radius:24px;background:var(--pane);border:3px solid ${col};transform:translateY(${((1 - ex(k)) * 120).toFixed(1)}px);opacity:${clamp(k * 4).toFixed(2)};text-align:center">` +
    `<div style="margin-top:34px;font:900 44px V;color:var(--dim)">${label}</div><div style="margin-top:16px;font:900 120px/1 V;color:${col};direction:ltr">${val}</div></div>`;
  switch (s.type) {
    case 'hook': {
      // frame 0: the green-chart plate already pushing in, the headline from frame 0, and a marketplace search window
      // already on screen: the query types, «+18,347% searches» lands on the beat, the sanctions flag lands at 2 s
      const kq = ramp(t, .05, .35), kr = ramp(t, .4, .55), kw = ramp(t, w('مانع') - .05, w('مانع') + .2), kf = ramp(t, 1.5, 1.65);
      const term = `<div class="win" style="left:70px;top:1060px;width:940px;height:470px;border-color:var(--up);transform:translateY(${((1 - ex(ramp(t, 0, .25))) * 120).toFixed(1)}px)">` +
        `<div class="bar"><i style="background:#F6465D"></i><i style="background:#F0B90B"></i><i style="background:#16C784"></i><b>fiverr.com/search</b></div>` +
        `<div class="mono" style="padding:24px 34px;font-size:46px;line-height:1.55"><div style="color:#C9D1D9">🔍 ${typed('AI agent specialist', kq)}${kq < 1 ? caret(t) : ''}</div>` +
        (kr > 0 ? `<div style="color:var(--up);font-size:130px;line-height:1.1;transform:scale(${lerp(1.8, 1, ex(kr)).toFixed(3)});transform-origin:0 50%">${pct(18347, ramp(t, .4, 1.4))}</div><div style="color:var(--dim);font:900 38px V;direction:rtl;text-align:right">رشد جست‌وجو در ۶ ماه · گزارش ۲۰۲۵</div>` : '') + '</div></div>';
      const sc = lerp(1.06, 1.3, ex(ramp(t, 0, 2.4)));
      return `<div class="ab" style="inset:0;transform:scale(${sc.toFixed(4)});transform-origin:540px 700px"><img src="${src('raw/' + s.img + '.png')}" style="width:1080px;height:1920px;object-fit:cover"></div>` +
        `<div class="ab" style="inset:0;background:linear-gradient(rgba(0,0,0,.8),rgba(0,0,0,.45) 34%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.6))"></div>` + term +
        chip('⚠ ولی تحریم…', 330, 940, 68, 'var(--dn)', '#fff', kf, 'rtl') +
        (kw > 0 ? `<div class="ab" style="left:120px;right:120px;top:830px;text-align:center"><span style="display:inline-block;padding:10px 40px 22px;border-radius:24px;background:#fff;color:#05070A;font:900 70px V;transform:scale(${lerp(1.5, 1, ex(kw)).toFixed(3)})">۳ مهارت + ۱ مانع</span></div>` : '');
    }
    case 'count': {
      const k6 = ramp(t, A + .5, A + 1.0), kn = ramp(t, Math.min(w('هزار') - .3, A + 2.5), w('هزار') + 1.0);
      const photo = win(80, 200, 920, 480, 'Fiverr · Business Trends Index · Spring 2025', photoIn(s.img, 920, 440, t, x.a, x.z), ramp(t, A, A + .3), 'up');
      const bh = 300, b1 = 18 * ex(k6), b2 = bh * ex(kn);
      const chart = `<div class="ab" style="left:60px;top:40px;width:800px;height:${bh}px">` +
        `<div class="ab" style="left:120px;top:${(bh - b1).toFixed(0)}px;width:200px;height:${b1.toFixed(0)}px;background:var(--dim);border-radius:8px 8px 0 0"></div>` +
        `<div class="ab" style="left:480px;top:${(bh - b2).toFixed(0)}px;width:200px;height:${b2.toFixed(0)}px;background:var(--up);border-radius:8px 8px 0 0"></div>` +
        `<div class="ab" style="left:0;right:0;top:${bh}px;height:3px;background:var(--line)"></div>` +
        `<div class="ab" style="left:90px;top:${bh + 14}px;width:260px;text-align:center;font:900 36px V;color:var(--dim)">۶ ماه قبل</div>` +
        `<div class="ab" style="left:450px;top:${bh + 14}px;width:260px;text-align:center;font:900 36px V;color:var(--up)">۶ ماه بعد</div></div>`;
      return ground() + photo + win(80, 720, 920, 470, 'searches · "AI agent"', chart, ramp(t, A + .3, A + .6), 'down') +
        big(pct(18347, kn), 80, 1220, 140, 'var(--up)', kn) + chip('رشد جست‌وجو، نه درآمد', 300, 1400, 52, '#fff', '#05070A', kn, 'rtl') +
        chip(`${logo(PROD(), 70, '#fff')} <span style="vertical-align:middle">Fiverr</span>`, 560, 560, 60, '#fff', '#05070A', ramp(t, A + .05, A + .3));
    }
    case 'agent': {
      // a business workflow builds itself node by node on the beat: inbox → AI agent → CRM → reply
      const nodes = [['📥', 'ایمیل مشتری', 50], ['🤖', 'ایجنت AI', 300], ['🗂', 'ثبت در CRM', 550], ['✉️', 'پاسخ آماده', 800]];
      const t0 = A + .3, st = BEAT;
      const body = nodes.map((n, i) => { const kk = ramp(t, t0 + i * st, t0 + i * st + .3); if (kk <= 0) return '';
        const ln = i ? `<div class="ab" style="left:440px;top:${n[2] - 50}px;width:8px;height:${(50 * ex(kk)).toFixed(0)}px;background:var(--up)"></div>` : '';
        return ln + `<div class="ab" style="left:130px;top:${n[2]}px;width:640px;height:200px;border-radius:26px;background:${i === 1 ? 'rgba(22,199,132,.16)' : '#0A0E13'};border:3px solid ${i === 1 ? 'var(--up)' : 'var(--line)'};display:flex;align-items:center;gap:30px;padding:0 40px;box-sizing:border-box;transform:scale(${lerp(.85, 1, ex(kk)).toFixed(3)});opacity:${clamp(kk * 4).toFixed(2)}">` +
          `<span style="font-size:90px">${n[0]}</span><span style="font:900 60px V">${n[1]}</span><span style="margin-right:auto;font:900 60px V;color:var(--up)">${t > t0 + i * st + .6 ? '✓' : ''}</span></div>`; }).join('');
      const kr = ramp(t, w('تکراری') - .05, w('تکراری') + .25), km = ramp(t, w('هر') - .05, w('هر') + .25);
      const ph = ((t - t0 - 4 * st) / 1.6) % 1, py = 50 + 100 + ph * 750, pk = t > t0 + 4 * st ? 1 : 0;
      const packet = pk ? `<div class="ab" style="left:420px;top:${py.toFixed(0)}px;width:48px;height:48px;border-radius:50%;background:var(--amb);box-shadow:0 0 0 10px rgba(240,185,11,.25)"></div>` +
        `<div class="ab mono" style="left:520px;top:${(py + 4).toFixed(0)}px;font-size:28px;color:var(--amb)">${['email', 'agent', 'crm', 'reply'][Math.min(3, Math.floor(ph * 4))]}</div>` : '';
      return ground() + win(90, 180, 900, 1080, 'workflow · automation', body + packet, ramp(t, A, A + .3), 'up', 'var(--up)') +
        chip('کار تکراری → خودکار', 260, 1290, 66, 'var(--amb)', '#05070A', kr, 'rtl') +
        chip('کار هر روزِ من برای کسب‌وکارها', 130, 1420, 56, '#fff', '#05070A', km, 'rtl');
    }
    case 'video': {
      const kn = ramp(t, w('هزار') - .3, w('هزار') + 1.0), kj = ramp(t, w('جست‌وجوش') - .1, w('جست‌وجوش') + .3);
      const clips = [0, 1, 2, 3, 4, 5, 6].map(i => { const kk = ramp(t, A + .3 + i * BEAT / 2, A + .5 + i * BEAT / 2); return kk <= 0 ? '' :
        `<div class="ab" style="left:${30 + i * 124}px;top:${30 + (i % 2) * 110}px;width:${110 + (i % 3) * 20}px;height:90px;border-radius:10px;background:${['#E5322D', '#3B82F6', '#F0B90B', '#16C784', '#A855F7', '#3B82F6', '#E5322D'][i]};transform:scaleX(${ex(kk).toFixed(3)});transform-origin:0 50%"></div>`; }).join('');
      const head = 30 + 860 * ramp(t, A, x.z);
      return ground() + win(80, 220, 920, 640, 'AI video · render', photoIn(s.img, 920, 600, t, x.a, x.z, [1.02, 1.2]), ramp(t, A, A + .3), 'left') +
        win(80, 900, 920, 300, 'timeline', clips + `<div class="ab" style="left:${head.toFixed(0)}px;top:0;width:4px;height:250px;background:#fff"></div>`, ramp(t, A + .2, A + .5), 'right') +
        big(pct(1739, kn), 80, 1240, 140, 'var(--up)', kn) + chip('ویدیو با AI · رشد جست‌وجو', 230, 1410, 54, '#fff', '#05070A', kj, 'rtl');
    }
    case 'human': {
      const kr = ramp(t, A + .2, A + .5), ks = ex(ramp(t, w('انسانی') - .1, w('انسانی') + .3)), kh = ramp(t, w('انسانی') + .2, w('ششصد'));
      const robot = 'در این مقاله به بررسی جامع ابعاد مختلف این موضوع می‌پردازیم.';
      const human = 'خلاصه‌ش؟ این ابزار نصف کارمو برداشت.';
      const body = `<div style="padding:40px;font:900 50px/1.6 V;direction:rtl">` +
        `<div style="color:var(--dim);font-size:34px">متن ماشینی</div><div style="position:relative;color:#C9D1D9;opacity:${clamp(kr * 4).toFixed(2)}">${robot}<span style="position:absolute;right:0;top:50%;height:6px;width:${(100 * ks).toFixed(0)}%;background:var(--dn)"></span></div>` +
        `<div style="margin-top:40px;color:var(--dim);font-size:34px">متن انسانی</div><div style="color:var(--up)">${typed(human, kh)}${kh > 0 && kh < 1 ? caret(t) : ''}</div></div>`;
      const kn = ramp(t, w('ششصد') - .1, w('ششصد') + .8);
      const rowsH = [['ایجنت AI', '+۱۸٬۳۴۷٪'], ['ویدیو با AI', '+۱٬۷۳۹٪'], ['انسانی کردن متن', pct(641, kn)]].map((r, i) =>
        `<div style="display:flex;justify-content:space-between;padding:20px 34px;border-bottom:2px solid var(--line);font:900 52px V;color:${i === 2 ? 'var(--up)' : 'var(--tx)'};background:${i === 2 ? 'rgba(22,199,132,.12)' : 'transparent'}"><span>${r[0]}</span><span style="direction:ltr">${r[1]}</span></div>`).join('');
      return ground() + win(80, 220, 920, 700, 'rewrite · diff', body, ramp(t, A, A + .3), 'up') +
        win(80, 960, 920, 420, 'Fiverr · 2025 · search growth', rowsH, ramp(t, A + .8, A + 1.1), 'down', 'var(--up)');
    }
    case 'label': {
      const k1 = ramp(t, w('دویست') - .1, w('دویست') + .7), k2 = ramp(t, w('بیست') - .1, w('بیست') + .7);
      return ground() + win(80, 220, 920, 760, 'data labelling · bounding boxes', photoIn(s.img, 920, 720, t, x.a, x.z), ramp(t, A, A + .3), 'up') +
        stat(80, 1020, 440, 'حداکثر رشد تقاضا', pct(220, k1), k1, 'var(--up)') + stat(560, 1020, 440, 'حداکثر دستمزد بیشتر', pct(22, k2), k2, 'var(--amb)') +
        chip(`${logo(BRAND(), 70, '#fff')} <span style="vertical-align:middle">Upwork · 2025</span>`, 470, 860, 60, '#fff', '#05070A', ramp(t, A + .05, A + .3));
    }
    case 'catch': {
      const kd = ramp(t, A + .4, A + 1.2), kx = ramp(t, w('تحریم') - .05, w('تحریم') + .25), kh = ramp(t, w('نصف') - .1, w('نصف') + .6);
      const form = `<div style="padding:40px;font:900 46px V;direction:ltr;text-align:left">` +
        `<div style="color:var(--dim);font-size:34px">Sign up · Country</div><div style="margin-top:18px;padding:24px 30px;border-radius:18px;border:3px solid ${kx > 0 ? 'var(--dn)' : 'var(--line)'};color:#fff">${typed('Iran', kd)}${kd < 1 ? caret(t) : ''}</div>` +
        (kx > 0 ? `<div style="margin-top:22px;color:var(--dn)">✕ not available in your region</div>` : '') + '</div>';
      const prog = `<div class="ab" style="left:40px;right:40px;top:70px;height:70px;border-radius:35px;background:#0A0E13;border:3px solid var(--line);overflow:hidden"><div style="width:${(50 * ex(kh)).toFixed(1)}%;height:100%;background:var(--up)"></div></div>` +
        `<div class="ab" style="left:40px;right:40px;top:170px;display:flex;justify-content:space-between;font:900 48px V;direction:rtl"><span style="color:var(--up)">مهارت ✓</span><span style="color:var(--dn)">بازار ✕</span></div>`;
      const stamp = kx > 0 ? `<div class="ab" style="left:300px;top:560px;padding:14px 40px 24px;border:10px solid var(--dn);border-radius:22px;color:var(--dn);font:900 96px V;background:rgba(5,7,10,.85);transform:rotate(-7deg) scale(${lerp(1.8, 1, ex(kx)).toFixed(3)})">تحریم</div>` : '';
      return ground() + win(80, 240, 920, 560, 'freelance platform', form, ramp(t, A, A + .3), 'up') + stamp +
        win(80, 900, 920, 320, 'progress', prog, ramp(t, A + .3, A + .6), 'down') + big('نصف راه', 80, 1290, 130, '#fff', kh);
    }
    case 'choice': {
      const k1 = ramp(t, w('یک') - .05, w('یک') + .3), k2 = ramp(t, w('دو:') - .05, w('دو:') + .3), kc = ramp(t, w('سی‌روزه') - .1, w('سی‌روزه') + 1.4);
      const cal = Array.from({length: 30}, (_, i) => `<div style="width:120px;height:56px;border-radius:10px;background:${i < 30 * kc ? 'var(--up)' : '#1A222C'}"></div>`).join('');
      const o1 = `<div style="padding:26px 34px"><div style="font:900 60px V;direction:rtl">۱ · نقشهٔ ۳۰ روزه</div><div style="margin-top:22px;display:grid;grid-template-columns:repeat(6,120px);gap:12px;direction:ltr">${cal}</div></div>`;
      const o2 = `<div style="padding:26px 34px;direction:rtl"><div style="font:900 60px V">۲ · مشتری خارجی</div>` +
        [['✓', 'راه‌های قانونی', 'var(--up)'], ['⚠', 'ریسک‌ها', 'var(--amb)']].map((r, i) => `<div style="margin-top:20px;font:900 52px V;color:${r[2]};opacity:${clamp(ramp(t, w('دو:') + .3 + i * .5, w('دو:') + .6 + i * .5) * 4).toFixed(2)}">${r[0]} ${r[1]}</div>`).join('') + '</div>';
      return ground() + chip('قسمت بعد رو شما انتخاب کنید', 150, 170, 56, '#fff', '#05070A', ramp(t, A + .05, A + .3), 'rtl') +
        win(80, 300, 920, 600, 'option 1', o1, k1, 'left', 'var(--up)') + win(80, 960, 920, 480, 'option 2', o2, k2, 'right', 'var(--amb)');
    }
    case 'vote': {
      const kq = ramp(t, w('کامنت') - .05, w('کامنت') + .3), ky = ramp(t, w('کامنت') + .2, w('کامنت') + 1.2);
      return `<div class="ab" style="inset:0;transform:scale(${lerp(1.1, 1.25, ramp(t, A, x.z)).toFixed(4)})"><img src="${src('raw/' + s.img + '.png')}" style="width:1080px;height:1920px;object-fit:cover;filter:brightness(.45)"></div>` +
        `<div class="ab" style="left:150px;top:420px;width:780px;height:1120px;border-radius:90px;background:#111;border:14px solid #2A2F36;overflow:hidden">` +
        `<div class="ab" style="left:0;right:0;top:0;bottom:0;background:#0D1117;padding:80px 40px 0;box-sizing:border-box;direction:rtl">` +
        `<div style="font:900 50px V;color:var(--dim)">کامنت‌ها</div>` +
        `<div style="margin-top:36px;display:flex;gap:30px;justify-content:center"><span style="padding:20px 70px 34px;border-radius:30px;background:var(--up);color:#05070A;font:900 130px V">۱</span><span style="padding:20px 70px 34px;border-radius:30px;background:var(--amb);color:#05070A;font:900 130px V">۲</span></div>` +
        `<div style="margin-top:60px;padding:28px 34px;border-radius:30px;background:#1A222C;font:900 54px V;color:#fff">${typed('من ۱ رو می‌خوام', ky)}${ky > 0 && ky < 1 ? caret(t) : ''}</div>` +
        `<div style="margin-top:30px;font:900 40px V;color:var(--dim)">قسمت بعد با انتخاب شما</div></div></div>` +
        chip('یک یا دو؟', 330, 250, 96, 'var(--up)', '#05070A', ramp(t, A + .05, A + .3), 'rtl') + chip('کامنت بنویس ✍', 300, 1580, 70, '#fff', '#05070A', kq, 'rtl');
    }
  }
  return ground();
}

// a simplified US outline (lower 48) with Georgia as its own highlighted shape; dots for the other states' capitals
function usMap(x0, y0, w, k, kg) {
  const S = w / 1000, US = 'M60,110 L250,95 L420,90 L560,92 L640,115 L720,105 L800,95 L880,70 L940,60 L960,120 L920,170 L880,230 L860,300 L820,360 L780,420 L760,470 L790,560 L760,590 L700,500 L640,480 L560,500 L520,560 L470,600 L420,520 L330,500 L250,470 L180,420 L110,380 L70,300 L50,200 Z';
  const GA = 'M712,360 L770,352 L800,410 L812,470 L790,478 L738,482 L726,430 Z';
  const dots = [[150, 180], [260, 260], [380, 200], [470, 320], [560, 250], [640, 330], [700, 220], [820, 200], [880, 140], [600, 420], [480, 470], [340, 400]];
  return `<svg class="ab" style="left:${x0}px;top:${y0}px;overflow:visible" width="${w}" height="${700 * S}" viewBox="0 0 1000 700">` +
    `<path d="${US}" fill="#121A24" stroke="#3B4856" stroke-width="4" stroke-dasharray="4000" stroke-dashoffset="${(4000 * (1 - ex(k))).toFixed(0)}"/>` +
    dots.map((d, i) => `<circle cx="${d[0]}" cy="${d[1]}" r="7" fill="#3B4856" opacity="${clamp(k * 3 - i * .15).toFixed(2)}"/>`).join('') +
    `<path d="${GA}" fill="${kg > 0 ? '#F0B90B' : '#1B2633'}" stroke="#F0B90B" stroke-width="${kg > 0 ? 6 : 2}" transform="translate(760 420) scale(${lerp(1.6, 1, ex(kg)).toFixed(3)}) translate(-760 -420)"/>` +
    (kg > 0 ? `<circle cx="760" cy="420" r="${(14 + 40 * (1 - ex(ramp(kg, 0, 1)))).toFixed(1)}" fill="none" stroke="#F0B90B" stroke-width="5" opacity="${(1 - ex(kg) * .6).toFixed(2)}"/>` : '') + '</svg>';
}
// end card: the line the prompt ends on, on the terminal ground
function ending(u, t) {
  const k = ramp(u, 0, .3), k2 = ramp(u, .5, .8);
  return ground() + `<div class="ab" style="left:0;right:0;top:520px;text-align:center;transform:scale(${lerp(1.4, 1, ex(k)).toFixed(3)})">` +
    `<div style="font:900 150px/1.2 V;color:#fff">${(D.end_text || '').replace(/\*([^*]+)\*/g, '<span style="color:var(--amb)">$1</span>')}</div>` +
    `<div style="margin-top:30px;font:900 64px V;color:var(--dim);opacity:${k2.toFixed(2)}">${D.end_sub || ''}</div>` +
    `<div style="margin-top:50px;display:flex;flex-direction:column;gap:22px;align-items:center;opacity:${k2.toFixed(2)}"><span style="padding:12px 36px 20px;border-radius:22px;background:var(--up);color:#05070A;font:900 54px V">۱ · نقشهٔ ۳۰ روزه</span><span style="padding:12px 36px 20px;border-radius:22px;background:var(--amb);color:#05070A;font:900 54px V">۲ · مشتری خارجی، قانونی</span></div>` +
    `<div class="mono" style="margin-top:60px;font-size:44px;color:var(--dim);opacity:${k2.toFixed(2)}">${D.handle || ''}</div></div>`;
}
window.seek = seek;
</script>
