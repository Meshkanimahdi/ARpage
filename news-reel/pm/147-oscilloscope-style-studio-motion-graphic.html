<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>meshkani.pro — oscilloscope studio film (prompt 147)</title>
<!-- Skill motion-graphy-2026, prompt 147 "Oscilloscope-style studio motion graphic" (MUSIC), built as its own engine.
     Look from the prompt: green phosphor lines on black, traces that glow and decay, everything drawn as oscilloscope
     traces; ONE through-line object (here: the heartbeat / data trace) that changes role in every scene and becomes the
     logo chip on the end card; UI rebuilt as vector layers driven by a cursor; the camera never sits still (push 1.0 →
     1.04 per scene, each scene starts at the zoom the last ended on); springs with a small overshoot; nothing appears
     from nothing (it grows, unfolds or is revealed by a mask); something changes on every beat (120 BPM).
     Banned (kept): particle bursts, lens flares, camera shake, RGB split, crossfades, generic gradients, bouncy easing.
     Allowed edits: 1920x1080 → 1080x1920, 20 s → the voiced length, the studio → the story's subject, the soundtrack →
     page-standard music bed + motion-matched SFX cues, the opening → the real photo hook (RUNBOOK §4.0 rule 4).
     Data: story.json beats[{id, text, scene{type, img}}]; raw/sNN.png photos; el/logo_<brand>.svg real logo.
     Scene types: hook, stake, paper, cases, steps, bars, bars2, er, sim, team, next, ask (+ end). -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --bk: #04100A; --ph: #3DFF8E; --dim: #0E3A22; --ink: #EAF7EF; --mute: #7FA892; --red: #FF5A4E; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bk); }
  #root { position: absolute; inset: 0; overflow: hidden; font-family: V; font-weight: 900; color: var(--ink); }
  #cam, #stage, #caps { position: absolute; inset: 0; }
  #cam { transform-origin: 0 0; }
  .a { position: absolute; }
  .row { display: flex; align-items: center; }
  .mask { overflow: hidden; display: inline-block; vertical-align: bottom; }
</style>
</head>
<body>
<div id="root"><div id="cam"><div id="stage"></div></div><div id="caps"></div></div>
<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const url = f => f.startsWith('/') ? f : DIR + f, byId = id => document.getElementById(id);
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), mix = (a, b, k) => a + (b - a) * k;
const lin = (t, a, b) => cl((t - a) / (b - a));
const spr = (t, t0, w = 16, z = .6) => { const u = t - t0; if (u <= 0) return 0; const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + z * w / wd * Math.sin(wd * u)); };
const eo = k => 1 - Math.pow(1 - cl(k), 3), eio = k => (k = cl(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const fa = s => String(s).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const BPM = 120, BT = 60 / BPM;
const ISS = [];
let S, TL, B = [], DUR = 50, NOW = 0;

function parse(b) {
  const L = TL.lines[b.id]; if (!L) { ISS.push('no timing ' + b.id); return null; }
  const raw = b.text.replace(/\[[^\]]*\]/g, ' ');
  const spoken = raw.replace(/\{[^|}]*\|([^}]*)\}/g, '$1').replace(/\*/g, '').trim().split(/\s+/);
  const n = L.words.length, idx = i => spoken.length === n ? i : Math.round(cl(i / Math.max(1, spoken.length - 1)) * (n - 1));
  const tw = i => (L.words[idx(cl(i, 0, spoken.length - 1))] || [L.start])[0];
  const W = []; let si = 0, hot = false;
  for (const tok of raw.replace(/\{([^|}]*)\|([^}]*)\}/g, (m, a, c) => a.replace(/\s/g, '\u0002') + '\u0001' + c.trim().split(/\s+/).length).trim().split(/\s+/)) {
    let w = tok, sp = 1; if (w.includes('\u0001')) { const [p, r] = w.split('\u0001'); sp = parseInt(r, 10) || 1; w = p + r.replace(/^\d+/, ''); }
    if (w.startsWith('*')) hot = true; const h = hot; if (/\*[«»"'.…،؛!؟?:]*$/.test(w)) hot = false;
    W.push({w: w.replace(/\*/g, '').replace(/\u0002/g, ' '), h, t: tw(si)}); si += sp;
  }
  const at = (sub, k = 0) => { const m = W.filter(x => x.w.includes(sub)); if (!m.length) { ISS.push(`${b.id}: no word "${sub}"`); return L.start; } return m[Math.min(k, m.length - 1)].t; };
  return {b, s: b.scene || {}, L, W, at};
}

// key moments (camera re-frames) and the sound that matches each motion (never a whoosh per cut)
const HITS = {
  hook: x => [x.at('ChatGPT'), x.at('شمعه'), x.at('استفاده')], stake: x => [x.at('چت‌بات'), x.at('صدای')], paper: x => [x.at('سه'), x.at('ایمنی')], quote: x => [x.at('بهتر'), x.at('کاذب')],
  mit: x => [x.at('MIT'), x.at('عمداً'), x.at('نود')], step1: x => [x.at('نشونم'), x.at('نصف')], step2: x => [x.at('دیاگ'), x.at('تأیید')],
  step3: x => [x.at('قیمت'), x.at('مکتوب'), x.at('اعتماد')], ask: x => [x.at('کامنت'), x.at('راننده‌ها'), x.at('مکانیکت')]
};
const SFX = {
  hook: x => [[.05, 'counter_tick', .25], [.45, 'typing', .25], [1.0, 'hit', .5], [1.6, 'sweep_soft', .22]],
  stake: x => [[x.a + .2, 'notify', .28], [x.at('چت‌بات'), 'pop', .3], [x.at('صدای'), 'click', .3]],
  paper: x => [[x.a + .1, 'sweep_soft', .22], [x.at('سه'), 'tick', .28], [x.at('ایمنی'), 'tap', .3]],
  quote: x => [[x.a + .1, 'typing', .25], [x.at('بهتر'), 'glass_ping', .3], [x.at('کاذب'), 'bass_drop', .3]],
  mit: x => [[x.a + .1, 'riser', .22], [x.at('MIT'), 'tap', .3], [x.at('نود'), 'counter_tick', .3]],
  step1: x => [[x.a + .05, 'hit', .35], [x.at('نشونم'), 'notify', .28], [x.at('نصف'), 'tick', .3]],
  step2: x => [[x.a + .05, 'hit', .35], [x.at('دیاگ'), 'click', .3], [x.at('تأیید'), 'tap', .3]],
  step3: x => [[x.a + .05, 'hit', .35], [x.at('قیمت'), 'typing', .25], [x.at('مکتوب'), 'pop', .3], [x.at('اعتماد'), 'shimmer', .28]],
  ask: x => [[x.a + .1, 'tap', .3], [x.at('کامنت'), 'notify', .3], [x.at('راننده‌ها'), 'tap', .3], [x.at('مکانیکت'), 'click', .3]]
};

window.ready = (async () => {
  S = await (await fetch(url('story.json'))).json(); TL = await (await fetch(url('timeline.json'))).json();
  DUR = TL.total; B = S.beats.map(parse).filter(Boolean);
  B.forEach((x, i) => { x.a = i ? x.L.start - .1 : 0; x.z = i + 1 < B.length ? B[i + 1].L.start - .1 : TL.end_start; });
  const imgs = ['h1', 'h2', 'h3', 'h6'].map(n => url('el/' + n + '.jpg'));
  await Promise.all(imgs.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'مکانیک ChatGPT')));
  B.forEach(x => { x.keys = (HITS[x.s.type] || (() => []))(x).filter(v => v > x.a + .6 && v < x.z - .6).sort((p, q) => p - q); });
  B.forEach(x => { const pz = [x.a, ...x.keys, x.z], fill = []; for (let i = 1; i < pz.length; i++) { const g = pz[i] - pz[i - 1], n = Math.ceil(g / 2.7) - 1; for (let j = 1; j <= n; j++) fill.push(pz[i - 1] + g * j / (n + 1)); } x.keys = [...x.keys, ...fill].sort((p, q) => p - q); });
  const sc = [];
  for (const x of B) { const pts = [x.a, ...x.keys]; const cues = (SFX[x.s.type] || (() => []))(x).filter(c => c[0] >= x.a - .05 && c[0] < x.z);
    pts.forEach((p, j) => { const t1 = j + 1 < pts.length ? pts[j + 1] : x.z;
      sc.push({t0: +p.toFixed(2), t1: +t1.toFixed(2), type: x.s.type, bg: x.b.id + (j ? '.' + j : ''), sfx: cues.filter(c => c[0] >= p - .05 && c[0] < t1).map(c => [+c[0].toFixed(2), c[1], c[2]])}); }); }
  sc.push({t0: TL.end_start, t1: DUR, type: 'end', bg: 'end', sfx: [[TL.end_start + .1, 'whoosh', .2]]});
  window.SCENES = sc; window.START = 0; window.DURATION = DUR; window.ISSUES = ISS;
  for (const c of sc) if (c.t1 - c.t0 > 3.2) ISS.push(`shot ${c.bg} holds ${(c.t1 - c.t0).toFixed(1)} s: add a hit`);
  seek(0);
})();
const LOGO = () => 'logo_' + (S.brand || 'microsoft').toLowerCase().replace(/[^a-z0-9]/g, '') + '.svg';

// camera: push 1.0 → 1.04 across each beat, plus a re-frame at each key moment; each beat starts where the last ended
function camAt(x, t) {
  const pts = [x.a, ...x.keys], j = pts.filter(p => t >= p).length - 1, base = 1 + .04 * lin(t, x.a, x.z);
  const fy = [960, 900, 1020, 940][(B.indexOf(x) + j) % 4], m = eio(lin(t, pts[j], pts[j] + .45));
  const sPrev = j ? 1.06 : 1.0, sNow = j ? 1.0 : 1.06;
  return {s: base * mix(sPrev, sNow, j ? m : 1) * (j % 2 ? 1.05 : 1), x: 540, y: j ? mix(960, fy, m) : 960};
}
function seek(t) {
  if (!B.length) return;
  NOW = t;
  let x = B[0]; for (const q of B) if (t >= q.a) x = q;
  const end = t >= TL.end_start, c = end ? {s: 1, x: 540, y: 960} : camAt(x, t);
  byId('cam').style.transform = `translate(540px,960px) scale(${c.s.toFixed(4)}) translate(${(-c.x).toFixed(1)}px,${(-c.y).toFixed(1)}px)`;
  const h = end ? endCard(t - TL.end_start) : scene(x, t);
  const st = byId('stage'); if (st._h !== h) { st._h = h; st.innerHTML = h; }
  const cp = end ? '' : caption(x, t); const ca = byId('caps'); if (ca._h !== cp) { ca._h = cp; ca.innerHTML = cp; }
}

// ---------- parts ----------
const pop = (t, t0) => cl(spr(t, t0, 18, .6), 0, 1.15);
// graticule: the oscilloscope screen grid that fills every frame, drifting slowly (parallax layer)
const grat = () => `<div class="a" style="inset:0;background:#0A2818"></div>` +
  `<div class="a" style="inset:-60px;background-image:linear-gradient(#1E6A42 3px,transparent 3px),linear-gradient(90deg,#1E6A42 3px,transparent 3px);background-size:90px 90px;background-position:${(-NOW * 10 % 90).toFixed(1)}px ${(-NOW * 6 % 90).toFixed(1)}px"></div>` +
  `<div class="a" style="inset:0;background-image:radial-gradient(#2E8A58 2.5px,transparent 2.5px);background-size:30px 30px;opacity:.55"></div>` +
  `<div class="a" style="left:0;right:0;top:${((NOW * 260) % 2200 - 200).toFixed(0)}px;height:160px;background:rgba(61,255,142,.10);border-top:3px solid rgba(61,255,142,.35)"></div>`;
// the through-line trace: a heartbeat line drawn left→right up to fraction k, with a bright head and a decaying tail
function ecg(x0, y0, w, h, k, col = 'var(--ph)', sw = 8, beats = 3) {
  const P = []; const n = 120;
  for (let i = 0; i <= n; i++) { const u = i / n, ph = (u * beats) % 1;
    let y = 0; if (ph > .42 && ph < .46) y = -.25; else if (ph >= .46 && ph < .5) y = 1; else if (ph >= .5 && ph < .54) y = -.55; else if (ph > .62 && ph < .72) y = .18 * Math.sin((ph - .62) / .1 * Math.PI);
    P.push([x0 + u * w, y0 - y * h]); }
  const m = Math.max(1, Math.round(n * cl(k))), pts = P.slice(0, m + 1).map(p => p.map(v => v.toFixed(1)).join(',')).join(' '), hd = P[m];
  return `<svg class="a" style="left:0;top:0;overflow:visible" width="1080" height="1920"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 10px ${col})"/>` +
    (k < 1 ? `<circle cx="${hd[0].toFixed(1)}" cy="${hd[1].toFixed(1)}" r="${sw * 1.6}" fill="#fff" style="filter:drop-shadow(0 0 16px ${col})"/>` : '') + '</svg>';
}
const rise = (html, k, sz, col = 'var(--ink)') => `<span class="mask" style="font-size:${sz}px;line-height:1.3;color:${col}"><span style="display:inline-block;transform:translateY(${((1 - eo(k)) * 110).toFixed(1)}%)">${html}</span></span>`;
function chip(html, x0, y0, sz, bg, fg, t, t0, dir = 'rtl') {
  const k = pop(t, t0); if (k <= 0) return '';
  return `<div class="a" style="left:${x0}px;top:${y0}px;padding:${sz * .14}px ${sz * .4}px ${sz * .24}px;border-radius:${sz * .3}px;background:${bg};color:${fg};font:900 ${sz}px/1.15 V;white-space:nowrap;direction:${dir};transform:scale(${k.toFixed(3)});transform-origin:50% 50%">${html}</div>`;
}
const logo = s => `<span style="display:inline-flex;align-items:center;justify-content:center;width:${s}px;height:${s}px;border-radius:${s * .2}px;background:#fff;vertical-align:middle"><img src="${url('el/' + LOGO())}" style="width:${s * .72}px;height:${s * .72}px"></span>`;
const msChip = (x0, y0, s, t, t0) => chip(`${logo(s)} <span dir="ltr" style="vertical-align:middle">Microsoft</span>`, x0, y0, s * .7, '#fff', '#111', t, t0, 'ltr');
// photo inside a scope-screen frame (one layer of the composition, never the whole scene)
function scope(img, x0, y0, w, h, k, t, a, pos = '50% 40%') {
  const sc = mix(1.12, 1.02, lin(t, a, a + 4)), rh = h * mix(.55, 1, eo(k));
  return `<div class="a" style="left:${x0}px;top:${(y0 + (h - rh) / 2).toFixed(0)}px;width:${w}px;height:${rh.toFixed(0)}px;border-radius:28px;overflow:hidden;border:5px solid var(--ph);box-shadow:0 0 30px rgba(61,255,142,.35)">` +
    `<img src="${url('el/' + img + '.jpg')}" style="position:absolute;left:0;top:${((rh - h) / 2).toFixed(0)}px;width:${w}px;height:${h}px;object-fit:cover;object-position:${pos};transform:scale(${sc.toFixed(3)})"></div>`;
}
function count(v, k, dec = 0) { return fa((v * eo(k)).toFixed(dec)); }
function bar(x0, y0, w, hMax, v, k, col, label, sub) {
  const h = hMax * v / 100 * eo(k);
  return `<div class="a" style="left:${x0}px;top:${y0 + hMax - h}px;width:${w}px;height:${h.toFixed(0)}px;border-radius:18px 18px 4px 4px;background:${col};box-shadow:0 0 26px ${col === 'var(--ph)' ? 'rgba(61,255,142,.5)' : 'rgba(255,255,255,.15)'}"></div>` +
    `<div class="a" style="left:${x0 - 40}px;width:${w + 80}px;top:${(y0 + hMax - h - 150).toFixed(0)}px;text-align:center;font:900 120px V;color:${col}">${count(v, k)}٪</div>` +
    `<div class="a" style="left:${x0 - 60}px;width:${w + 120}px;top:${y0 + hMax + 24}px;text-align:center;font:900 46px/1.25 V">${label}</div>` +
    (sub ? `<div class="a" style="left:${x0 - 60}px;width:${w + 120}px;top:${y0 + hMax + 90}px;text-align:center;font:600 34px V;color:var(--mute)">${sub}</div>` : '');
}
function cursor(x0, y0, press) {
  return `<svg class="a" style="left:${x0}px;top:${y0}px;overflow:visible;transform:scale(${(1 - .18 * press).toFixed(3)});transform-origin:0 0" width="60" height="80"><path d="M0 0 L0 58 L15 45 L26 72 L37 67 L26 41 L46 41 Z" fill="var(--ph)" stroke="#04100A" stroke-width="5" stroke-linejoin="round"/></svg>`;
}
function cur(t, path) {
  let i = 0; for (let j = 0; j < path.length; j++) if (t >= path[j][0]) i = j;
  const p = path[i], q = path[Math.min(i + 1, path.length - 1)], m = q === p ? 0 : eio(lin(t, p[0] + .1, q[0]));
  let press = 0; for (const c of path) if (c[3]) press = Math.max(press, Math.exp(-((t - c[0]) ** 2) / .006));
  return cursor(mix(p[1], q[1], m), mix(p[2], q[2], m), press);
}
// ✓/✗ grid filling per case (data layer): n cells, share ok
function tally(x0, y0, cols, rows, ok, k, cell = 56) {
  let h = ''; const n = cols * rows, shown = Math.floor(n * eo(k)), good = Math.round(n * ok / 100);
  for (let i = 0; i < shown; i++) { const c = i % cols, r = Math.floor(i / cols), g = i < good;
    h += `<div class="a" style="left:${x0 + c * (cell + 10)}px;top:${y0 + r * (cell + 10)}px;width:${cell}px;height:${cell}px;border-radius:12px;background:${g ? 'rgba(61,255,142,.18)' : 'rgba(255,90,78,.16)'};border:3px solid ${g ? 'var(--ph)' : 'var(--red)'};color:${g ? 'var(--ph)' : 'var(--red)'};font:900 ${cell * .6}px/${cell - 6}px V;text-align:center">${g ? '✓' : '✗'}</div>`; }
  return h;
}

// ---------- captions: the spoken words, ≤ 4 per chunk, phosphor pill ----------
function caption(x, t) {
  if (x.s.type === 'hook') return '';
  if (t > x.L.end + .3) return '';
  const W = x.W; let j = 0; for (let q = 0; q < W.length; q++) if (t >= W[q].t - .05) j = q;
  const ch = []; let c = []; W.forEach((w, q) => { c.push(q); if (c.length === 4 || (c.length >= 2 && /[،؛.!؟?…:»]$/.test(w.w))) { ch.push(c); c = []; } }); if (c.length) ch.push(c);
  const now = ch.find(g => g.includes(j)), k = lin(t, W[now[0]].t - .05, W[now[0]].t + .2);
  const line = now.filter(q => t >= W[q].t - .05).map(q => W[q].h ? `<span style="color:var(--ph)">${W[q].w}</span>` : W[q].w).join(' ');
  return `<div class="a" style="left:0;right:0;top:1590px;text-align:center"><span style="display:inline-block;max-width:960px;padding:12px 42px 24px;border-radius:24px;background:rgba(2,10,6,.92);border:3px solid var(--ph);color:#fff;font-size:68px;line-height:1.25;direction:rtl;unicode-bidi:isolate;transform:translateY(${((1 - eo(k)) * 26).toFixed(1)}px)">${line}</span></div>`;
}

function scene(x, t) {
  const s = x.s, A = x.a, at = x.at;
  const big = (n, k) => `<div class="a" style="left:96px;top:230px;font:900 300px/1 V;color:var(--ph);text-shadow:0 0 40px rgba(61,255,142,.6);transform:scale(${mix(1.6, 1, eo(k)).toFixed(3)});opacity:${cl(k * 3).toFixed(2)}">${fa(n)}</div>`;
  const bubble = (txt, x0, y0, w, k, me = false) => k <= 0 ? '' : `<div class="a" style="left:${x0}px;top:${y0}px;width:${w}px;padding:20px 30px 28px;border-radius:30px;${me ? 'border-bottom-left-radius:8px;background:#0E301D;border:3px solid var(--ph)' : 'border-bottom-right-radius:8px;background:#fff;color:#0B1A12'};font:900 44px/1.35 V;transform:scale(${pop(0, -1) && cl(k * 1.2).toFixed(3)});opacity:${cl(k * 3).toFixed(2)}">${txt}</div>`;
  const typed = (s0, k) => s0.slice(0, Math.round(s0.length * cl(k))) + (k > 0 && k < 1 ? '▌' : '');
  switch (s.type) {
    case 'hook': {
      // frame 0: the bright garage plate (hands + glowing phone over an open engine) pushing in, headline from frame 0;
      // 0.5 s a chat bubble types a fault code; 1.0 s «✓ جواب آماده» slams; the engine-sound trace runs from frame 0
      const z = mix(1.0, 1.15, eo(lin(t, 0, 2.4))), kq = lin(t, .4, 1.1), ka = pop(t, 1.0);
      const jolt = t > 1.0 && t < 1.25 ? Math.sin((t - 1.0) * 80) * 10 * (1 - lin(t, 1.0, 1.25)) : 0;
      return `<div class="a" style="inset:0;transform:translate(${jolt.toFixed(1)}px,0) scale(${z.toFixed(4)});transform-origin:520px 1150px"><img src="${url('el/h1.jpg')}" style="position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;object-position:50% 50%;filter:brightness(1.12)"></div>` +
        `<div class="a" style="left:0;right:0;top:0;height:720px;background:linear-gradient(rgba(4,16,10,.94),rgba(4,16,10,.85) 75%,rgba(4,16,10,0))"></div>` +
        `<div class="a" style="left:40px;right:40px;top:110px;text-align:center;font-size:104px;line-height:1.22"><div>مکانیک‌ها، مشتری</div><div style="font-size:92px;white-space:nowrap">با جواب <span dir="ltr" style="display:inline-block;padding:0 24px 12px;border-radius:22px;background:var(--ph);color:#04100A">ChatGPT</span> میاد</div></div>` +
        (kq > 0 ? `<div class="a" style="left:120px;top:600px;padding:20px 34px 30px;border-radius:30px;border-bottom-right-radius:8px;background:#fff;color:#0B1A12;font:900 52px V;opacity:${cl(kq * 4).toFixed(2)}">${typed('«گفته از شمعه!»', kq)}</div>` : '') +
        chip('بحث؟ یا استفاده؟', 520, 740, 66, 'var(--ph)', '#04100A', t, 1.0) +
        ecg(0, 1360, 1080, 120, lin(t, 0, 1.6), 'var(--ph)', 9, 4) +
        (ka > 0 ? `<div class="a" style="left:60px;top:1450px;padding:12px 30px 20px;border-radius:22px;background:rgba(4,16,10,.88);border:3px solid var(--ph);font:900 44px V">🎙 صدای موتور · ${fa('0:12')}</div>` : '');
    }
    case 'stake': {
      const k = lin(t, A, A + .5), tg = at('چت‌بات'), ts = at('صدای'), kr = lin(t, ts - .1, x.z);
      const phone = `<div class="a" style="left:80px;top:${(280 + (1 - eo(k)) * 200).toFixed(0)}px;width:520px;height:1000px;border-radius:60px;background:#020805;border:7px solid var(--ph);box-shadow:0 0 40px rgba(61,255,142,.35)"></div>`;
      return grat() + phone +
        bubble('کد خطای <span dir="ltr">P0300</span>', 130, 380, 420, lin(t, A, A + .3)) + (t < tg - .1 ? `<div class="a" style="left:400px;top:${(560 + 6 * Math.sin(t * 8)).toFixed(0)}px;padding:14px 26px 22px;border-radius:26px;background:#0E301D;border:3px solid var(--ph);font:900 50px V;color:var(--ph)">${'•'.repeat(1 + Math.floor(t * 4) % 3)}</div>` : '') +
        bubble('چت‌بات: احتمالاً شمع یا کوئل…', 130, 560, 420, lin(t, tg - .1, tg + .4), true) +
        (t > ts - .1 ? ecg(120, 1050, 440, 70, kr, 'var(--ph)', 6, 6) + chip(`🎙 ${fa('0:' + String(Math.min(12, Math.floor((t - ts) * 4))).padStart(2, '0'))}`, 150, 1150, 46, '#fff', '#0B1A12', t, ts) : '') +
        scope('h3', 640, 300, 360, 640, lin(t, A + .2, A + .7), t, A, '50% 60%') +
        chip('قبل از تعمیرگاه', 640, 1000, 50, 'var(--ph)', '#04100A', t, A + .4) + cur(t, [[A, 900, 1500], [ts, 300, 1100, 1], [x.z, 300, 1100]]);
    }
    case 'paper': {
      const kc = lin(t, A, A + .6), crit = ['ایمنی', 'قانونی بودن', 'درستی', 'کاربرد'], bots = ['ChatGPT', 'Google AI Overview', 'Microsoft Copilot'], ti = at('ایمنی');
      const card = `<div class="a" style="left:90px;top:${(260 + (1 - eo(kc)) * 260).toFixed(0)}px;width:900px;height:900px;border-radius:30px;background:#F4F7F5;color:#0B1A12;padding:50px;box-sizing:border-box;box-shadow:0 0 0 6px var(--ph),0 0 50px rgba(61,255,142,.35)">` +
        `<div style="font:900 74px/1 Georgia,serif;direction:ltr;text-align:left">Auto Express</div><div style="font:600 34px V;color:#4A6656;margin-top:10px;direction:ltr;text-align:left">27 Oct 2025 · rated by a workshop manager</div><div style="height:5px;background:#0B1A12;margin:24px 0 30px"></div>` +
        bots.map((b, i) => `<div style="height:96px;display:flex;align-items:center;gap:20px;border-bottom:3px solid #C9D6CF;opacity:${cl((t - A - .4 - i * .35) * 3).toFixed(2)};direction:ltr"><span style="font:900 40px V;color:#139C4E">◉</span><span style="font:900 48px V">${b}</span></div>`).join('') +
        `<div style="margin-top:40px;font:900 40px V;color:#4A6656">معیارهای نمره:</div><div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:20px">` +
        crit.map((c, j) => `<span style="padding:10px 26px 18px;border-radius:30px;background:#0B1A12;color:var(--ph);font:900 42px V;transform:scale(${pop(t, Math.min(ti - .2, A + 1.4) + j * .3).toFixed(3)});display:inline-block">${c}</span>`).join('') + `</div></div>`;
      return grat() + card + scope('h4', 90, 1230, 900, 250, lin(t, A + .3, A + .8), t, A, '50% 55%') + chip('سه چت‌بات · خرابی‌های رایج', 220, 1190, 52, 'var(--ph)', '#04100A', t, at('سه'));
    }
    case 'quote': {
      const tb = at('بهتر'), tw = at('کاذب'), kq = lin(t, A + .1, tb + .8), kw = pop(t, tw - .1), conf = mix(40, 140, eo(lin(t, A + .3, tw)));
      return grat() + `<div class="a" style="left:90px;top:280px;width:900px;padding:50px;box-sizing:border-box;border-radius:30px;background:#0A2416;border:5px solid var(--ph)"><div style="font:900 120px/0.6 Georgia;color:var(--ph)">“</div><div style="font:900 70px/1.35 V">${typed('خیلی بهتر از انتظارم بود', kq)}</div><div style="margin-top:24px;font:600 38px V;color:var(--mute)">سرپرست تعمیرگاه، انگلیس</div></div>` +
        `<div class="a" style="left:90px;top:860px;width:420px;height:200px;border-radius:26px;background:rgba(61,255,142,.14);border:4px solid var(--ph);text-align:center;font:900 54px/200px V;color:var(--ph);transform:scale(${pop(t, tb).toFixed(3)})">✓ جواب‌های خوب</div>` +
        (kw > 0 ? `<div class="a" style="left:570px;top:860px;width:420px;height:200px;border-radius:26px;background:rgba(255,90,78,.14);border:4px solid var(--red);text-align:center;font:900 50px/200px V;color:var(--red);transform:scale(${kw.toFixed(3)})">⚠ اعتمادبه‌نفس کاذب</div>` : '') +
        `<div class="a" style="left:120px;top:1130px;font:900 40px V;color:var(--mute)">اعتمادبه‌نفس مشتری</div><div class="a" style="left:120px;top:1190px;width:840px;height:46px;border-radius:23px;background:var(--dim)"><div style="width:${Math.min(100, conf / 1.4).toFixed(1)}%;height:100%;border-radius:23px;background:${conf > 100 ? 'var(--red)' : 'var(--ph)'}"></div></div>` +
        `<div class="a" style="left:${(120 + 840 * .72).toFixed(0)}px;top:1170px;width:6px;height:86px;background:#fff"></div>` + ['«گفته از شمعه»', '«کوئل خرابه»', '«باتری ضعیفه»'].map((c, i) => { const ph = ((t - A) * .25 + i / 3) % 1; return `<div class="a" style="left:${(1080 - 1300 * ph).toFixed(0)}px;top:${1330 + (i % 2) * 90}px;padding:10px 28px 18px;border-radius:26px;background:#fff;color:#0B1A12;font:900 44px V;white-space:nowrap">${c}</div>`; }).join('');
    }
    case 'mit': {
      const k = lin(t, A, A + .5), tm = at('MIT'), tn = at('نود'), kb = lin(t, A + .5, Math.max(A + 1.5, tn + .3));
      const axis = (y0, col, ph) => { let d = ''; for (let i = 0; i <= 80; i++) { const xx = 560 + i * 5.5, yy = y0 + Math.sin(i * .5 + t * 9 + ph) * 22 * (1 + .6 * Math.sin(i * .13 + t * 2)); d += (i ? 'L' : 'M') + xx.toFixed(1) + ' ' + yy.toFixed(1); } return `<path d="${d}" fill="none" stroke="${col}" stroke-width="5"/>`; };
      return grat() + scope('h6', 90, 280, 440, 760, k, t, A, '50% 50%') + ecg(90, 1150, 440, 80, (t * .5) % 1, 'var(--ph)', 6, 5) +
        `<svg class="a" style="left:0;top:0;overflow:visible" width="1080" height="1920">${axis(400, '#3DFF8E', 0)}${axis(520, '#FFD23F', 1.7)}${axis(640, '#7FD4FF', 3.1)}</svg>` +
        `<div class="a" style="left:1010px;top:380px;font:900 34px V;color:var(--mute)">x</div><div class="a" style="left:1010px;top:500px;font:900 34px V;color:var(--mute)">y</div><div class="a" style="left:1010px;top:620px;font:900 34px V;color:var(--mute)">z</div>` +
        `<div class="a" style="left:560px;top:720px;font:900 40px V;color:var(--mute)">میکروفون + لرزش‌سنج</div>` + chip('عیب‌های عمداً ایجادشده', 560, 1220, 44, '#0A2416', 'var(--ph)', t, at('عمداً')) +
        `<div class="a" style="left:560px;top:800px;width:440px;text-align:center;font:900 150px V;color:var(--ph);direction:ltr">+${count(90, kb)}٪</div><div class="a" style="left:560px;top:990px;width:440px;text-align:center;font:900 40px V">دقت در آزمایش‌ها</div>` +
        chip('<span dir="ltr">MIT · 2017</span>', 700, 1110, 60, '#0A2416', 'var(--ph)', t, tm, 'ltr');
    }
    case 'step1': {
      const k1 = lin(t, A, A + .4), th = at('نصف'), kk = lin(t, A + .6, th);
      const items = ['لرزش موقع روشن شدن', 'چراغ چک روشنه', 'کد P0300'];
      return grat() + big(1, k1) +
        bubble('از دیروز ماشین موقع روشن شدن می‌لرزه، چراغ چک هم روشنه…', 330, 300, 600, lin(t, A + .2, A + .6)) +
        items.map((it, i) => { const ki = pop(t, A + .8 + i * ((th - A - .8) / 3)); return ki <= 0 ? '' : `<div class="a row" style="left:120px;top:${700 + i * 130}px;width:840px;height:110px;gap:24px;padding:0 30px;box-sizing:border-box;border-radius:24px;background:#0A2416;border:3px solid var(--ph);font:900 48px V;transform:scale(${ki.toFixed(3)})"><span style="color:var(--ph)">✓</span><span>${it.replace('P0300', '<span dir=ltr>P0300</span>')}</span></div>`; }).join('') +
        `<div class="a" style="left:120px;top:1110px;width:840px;height:40px;border-radius:20px;background:var(--dim)"><div style="width:${(50 * eo(kk)).toFixed(1)}%;height:100%;border-radius:20px;background:var(--ph)"></div></div>` +
        chip('نصف عیب‌یابی ✓', 560, 1180, 58, 'var(--ph)', '#04100A', t, th) + chip('بگو: «چتت رو نشونم بده»', 120, 1290, 56, '#fff', '#0B1A12', t, at('نشونم'));
    }
    case 'step2': {
      const k2 = lin(t, A, A + .4), td = at('دیاگ'), tt = at('تأیید'), ks = lin(t, td - .1, tt + .4), kok = pop(t, tt + .2);
      return grat() + big(2, k2) + scope('h2', 400, 260, 600, 560, lin(t, A + .1, A + .6), t, A, '50% 70%') + chip('دیاگ', 440, 830, 60, 'var(--ph)', '#04100A', t, td) +
        ['سیلندر ۱', 'سیلندر ۲', 'سیلندر ۳', 'سیلندر ۴'].map((c, i) => { const v = i === 2 ? 92 : 18 + i * 6; return `<div class="a" style="left:120px;top:${900 + i * 80}px;width:200px;font:900 38px V">${c}</div><div class="a" style="left:330px;top:${912 + i * 80}px;width:630px;height:40px;border-radius:20px;background:var(--dim)"><div style="width:${(v * eo(cl(ks * 1.3 - i * .1))).toFixed(1)}%;height:100%;border-radius:20px;background:${i === 2 ? 'var(--red)' : 'var(--ph)'}"></div></div>`; }).join('') +
        (kok > 0 ? `<div class="a" style="left:560px;top:1230px;padding:10px 36px 20px;border:8px solid var(--ph);border-radius:20px;color:var(--ph);font:900 70px V;transform:rotate(-5deg) scale(${mix(1.8, 1, cl(kok)).toFixed(3)})">تأیید شد ✓</div>` : '') +
        `<div class="a" style="left:120px;top:1240px;font:600 34px V;color:var(--mute)">نمونهٔ نمایشی</div>`;
    }
    case 'step3': {
      const k3 = lin(t, A, A + .4), tm = at('مکتوب'), tr = at('اعتماد'), kw = lin(t, A + .4, tm + .6), ksend = pop(t, tm + .5), ktr = lin(t, tm + .5, tr + .4);
      const lines = ['عیب: کوئل سیلندر ۳', 'کار: تعویض کوئل و شمع', 'زمان: حدود ۱ ساعت', 'قیمت: طبق فاکتور قطعه'];
      return grat() + big(3, k3) + `<div class="a" style="left:330px;top:260px;width:670px;height:760px;border-radius:30px;background:#F4F7F5;color:#0B1A12;padding:46px;box-sizing:border-box;box-shadow:0 0 0 6px var(--ph)"><div style="font:900 56px V">برآورد تعمیر 📄</div><div style="height:4px;background:#0B1A12;margin:20px 0 26px"></div>` +
        lines.map((l, i) => `<div style="font:900 42px/1.25 V;margin:18px 0;opacity:${cl(kw * 4 - i).toFixed(2)}">${fa(l)}</div>`).join('') + `</div>` +
        (ksend > 0 ? `<div class="a" style="left:560px;top:1050px;padding:16px 50px 26px;border-radius:40px;background:var(--ph);color:#04100A;font:900 56px V;transform:scale(${ksend.toFixed(3)})">ارسال ➤</div>` : '') +
        `<div class="a" style="left:120px;top:1190px;font:900 40px V;color:var(--mute)">اعتماد مشتری</div><div class="a" style="left:120px;top:1250px;width:840px;height:44px;border-radius:22px;background:var(--dim)"><div style="width:${mix(25, 85, eo(ktr)).toFixed(1)}%;height:100%;border-radius:22px;background:var(--ph)"></div></div>` +
        cur(t, [[A, 900, 1500], [tm + .3, 860, 1110, 1], [x.z, 860, 1110]]);
    }
    case 'ask': {
      const k = lin(t, A, A + .5), tc = at('کامنت'), td = at('راننده‌ها'), tm = at('مکانیکت');
      return grat() + `<div class="a" style="left:0;right:0;top:260px;text-align:center">${rise('مشتری‌هاتون چی میارن؟', k, 86)}</div>` +
        chip('🔧 مکانیک‌ها: کامنت', 140, 480, 60, 'var(--ph)', '#04100A', t, A + .4) + chip('🚗 راننده‌ها: بفرست', 420, 600, 58, '#fff', '#111', t, td) +
        (t > Math.min(tc, A + 1.5) - .1 ? `<div class="a" style="left:120px;top:780px;width:840px;padding:26px 36px 36px;border-radius:34px;background:#0A2416;border:4px solid var(--ph);font:900 48px V">💬 ${typed('کد خطا، عکس داشبورد، صدای موتور…', lin(t, Math.min(tc, A + 1.5) - .1, Math.min(tc, A + 1.5) + 1.4))}</div>` : '') +
        ['کد خطا', 'صدای موتور', 'عکس داشبورد'].map((c, i) => chip(c, 100 + i * 310, 1180, 46, '#0A2416', 'var(--ph)', t, A + 1 + i * .3)).join('') +
        chip('↗ برای مکانیکت بفرست', 250, 1060, 62, '#fff', '#111', t, tm) +
        ecg(0, 1420, 1080, 80, lin(t, A, x.z), 'var(--ph)', 7, 4) + cur(t, [[A, 900, 1500], [tm + .2, 520, 1090, 1], [x.z, 520, 1090]]);
    }
  }
  return grat();
}
// end card: the trace draws across, then the question rises
function endCard(u) {
  return grat() + ecg(0, 760, 1080, 140, lin(u, 0, .8)) +
    chip('🔧 مکانیک‌ها: کامنت', 120, 380, 54, 'var(--ph)', '#04100A', u + 10, 10.3) + chip('🚗 راننده‌ها: بفرست', 560, 480, 54, '#fff', '#111', u + 10, 10.6) +
    `<div class="a" style="left:0;right:0;top:960px;text-align:center">${rise((S.end_text || '').replace(/\*([^*]+)\*/g, '<span style="color:var(--ph)">$1</span>'), lin(u, .4, .8), 84)}</div>` +
    `<div class="a" style="left:0;right:0;top:1180px;text-align:center;font:900 60px V;color:#fff;opacity:${lin(u, .8, 1.1).toFixed(2)}">↗ ${S.end_sub || ''} · <span dir="ltr">${S.handle || ''}</span></div>`;
}
window.seek = seek;
</script>
