<title>meshkani.pro — product promo film (prompt 117)</title>
<!-- Skill motion-graphy-2026, prompt 117 "Matra caption app promo" (UI), built as its own engine.
     Look from the prompt: Apple-keynote white space, one idea per shot, the device as the hero; one typeface, one accent
     colour used only on the through-line object and the key word; the real UI rebuilt as vector layers driven by a
     cursor with real clicks and drags; springs with at most a small overshoot; nothing appears from nothing (it grows,
     unfolds or is revealed by a mask); the camera never sits still (1.0 → 1.04 per scene, each scene starting at the zoom
     the last ended on); something changes on every beat.
     Through-line object: the product's own round screen (a circle). It starts as the glowing clock on the nightstand,
     becomes the product lockup, a sonar ring, a sleep chart's marker, a wake-window dial, a sunrise, a clock-face
     carousel, a mute button, a data dot, and finally the brand mark on the end card.
     Brand slot: the product's own colours (navy #232F3E, accent orange #FF9900) on a warm white page.
     Page standards: 1080x1920, Persian narration (eleven_v4) + word-by-word caption, music at 120 BPM, SFX via SCENES[].sfx.
     Data: story.json beats[{id, text, scene{type, img?}}], end_text, end_sub, brand; el/*.
     Pure seek(t): no CSS animations, timers or Math.random. -->
<style>

<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const U = s => s.startsWith('/') ? s : DIR + s, $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, k) => a + (b - a) * k, pr = (t, a, b) => cl((t - a) / (b - a));
const ex = k => 1 - Math.pow(2, -10 * cl(k));
const sp = k => { k = cl(k); return 1 - Math.exp(-6.5 * k) * Math.cos(8 * k) * (1 - k * .15); };   // small overshoot
const fa = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const ACC = '#E2725B', INK = '#1E2A3F';
const ISSUES = [];
let S, TL, B = [], END = 50;

window.ready = (async () => {
  S = await (await fetch(U('story.json'))).json(); TL = await (await fetch(U('timeline.json'))).json();
  END = TL.total;
  const shown = t => t.replace(/\[[^\]]*\]/g, '').replace(/\{([^|}]*)\|[^}]*\}/g, '$1').trim().split(/\s+/);
  for (const bt of S.beats) {
    const L = TL.lines[bt.id]; if (!L) { ISSUES.push('no timing for ' + bt.id); continue; }
    let on = false;
    const words = shown(bt.text).map(w => { if (w.startsWith('*')) on = true; const k = on || /\*/.test(w); if (/\*[.…،؛!؟?»]*$/.test(w)) on = false; return {w: w.replace(/\*/g, ''), k}; });
    const wt = j => { const i = Math.round(cl(j / Math.max(1, words.length - 1)) * (L.words.length - 1)); return (L.words[i] || [L.start])[0]; };
    B.push({bt, sc: bt.scene || {}, L, words, wt});
  }
  B.forEach((b, i) => { b.i = i; b.a = i ? b.L.start - .08 : 0; b.b = i + 1 < B.length ? B[i + 1].L.start - .08 : TL.end_start; });
  await Promise.all((S.preload || ['h1.jpg', 'h6.jpg', 'h7.jpg']).map(f => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = U('el/' + f); })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'تصمیم رفتن Mirror')));

  const SC = [];
  for (const b of B) {
    const pts = [[b.a, (OPEN[b.sc.type] || 'pop')]];
    (MOM[b.sc.type] || (() => []))(b).forEach(m => { if (m[0] > b.a + .9 && m[0] < b.b - .6) pts.push(m); });
    pts.sort((p, q) => p[0] - q[0]);

    pts.push(...fl); pts.sort((p, q) => p[0] - q[0]);

  }
  SC.push({t0: TL.end_start, t1: END, type: 'end', bg: 'end', sfx: [[TL.end_start + .15, 'riser', .35]]});
  window.SCENES = SC;
  for (const s of SC) if (s.t1 - s.t0 > 3.2) ISSUES.push(`idea ${s.bg} holds ${(s.t1 - s.t0).toFixed(1)} s (> 3): add a moment`);

})();
const W = (b, s) => { const i = b.words.findIndex(w => w.w.includes(s)); return b.wt(i < 0 ? 0 : i); };

const MOM = {

  poll: b => [[W(b, '۱۳۰۰'), 'counter_tick'], [W(b, 'مهاجرت'), 'click']],
  bars: b => [[W(b, '۳۳'), 'counter_tick'], [W(b, '۲۰۱۶'), 'click'], [W(b, '۲۹.۸'), 'counter_tick']],
  gap: b => [[W(b, 'Calgary'), 'sweep_soft'], [W(b, 'زیاد،'), 'tap'], [W(b, 'شانس'), 'click']],

  limbo: b => [[W(b, 'پنهان'), 'click'], [W(b, 'گرفته'), 'tap'], [W(b, 'معلق'), 'sweep_soft']],
  mirror: b => [[W(b, 'برو'), 'tap'], [W(b, 'گفتگو'), 'notify'], [W(b, 'ترس'), 'tap'], [W(b, 'جدا'), 'click']],
  report: b => [[W(b, 'گزارش'), 'typing'], [W(b, 'پاک'), 'sweep_soft'], [W(b, 'خودت'), 'shimmer']],
  ask: b => [[W(b, 'یک:'), 'tap'], [W(b, 'دو:'), 'tap'], [W(b, 'سه:'), 'tap'], [W(b, 'کامنت'), 'notify']],

// ---- kit ----
const card = (x, y, w, h, inner = '', st = '') => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${st}">${inner}</div>`;

const grow = (k, inner, ox, oy) => `<div class="a" style="left:0;top:0;width:1080px;height:1920px;transform-origin:${ox}px ${oy}px;transform:scale(${sp(k).toFixed(3)});opacity:${cl(k * 6).toFixed(2)}">${inner}</div>`;

}
const ring = (cx, cy, r, fill = INK, inner = '', stroke = ACC) => `<svg class="a" style="left:0;top:0" width="1080" height="1920"><circle cx="${cx}" cy="${cy}" r="${Math.max(0, r)}" fill="${fill}"/><circle cx="${cx}" cy="${cy}" r="${Math.max(0, r)}" fill="none" stroke="${stroke}" stroke-width="10"/>${inner}</svg>`;
const photoRing = (img, cx, cy, r, z = 1, pos = '50% 50%', st = '') => `<div class="a" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;overflow:hidden;border:10px solid ${ACC};box-sizing:border-box;box-shadow:0 20px 50px rgba(30,42,63,.25);${st}"><img src="${U('el/' + img)}" style="width:100%;height:100%;object-fit:cover;object-position:${pos};transform:scale(${z.toFixed(3)})"></div>`;
const toggle = (x, y, on, label) => `<div class="a" style="left:${x}px;top:${y}px;display:flex;align-items:center;gap:26px;flex-direction:row-reverse"><div style="font:900 50px V;color:${INK}">${label}</div><div style="width:150px;height:84px;border-radius:42px;background:${on > .5 ? ACC : '#D9D3CA'};position:relative"><div style="position:absolute;top:8px;left:${8 + 66 * on}px;width:68px;height:68px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2)"></div></div></div>`;
const head = (s, k, y = 250, size = 92) => mask(k, C(y, s, size, INK, 'line-height:1.15'));
const counter = (v, k) => k >= 1 ? v : Math.round(v * ex(k) / .999);
const people = (x, y, n, lit, k, size = 64) => { let s = ''; for (let i = 0; i < n; i++) { const on = i < lit && k > (i + 1) / (lit + 1); s += `<div class="a" style="left:${x + (i % 3) * (size + 26)}px;top:${y + Math.floor(i / 3) * (size * 1.5)}px;font-size:${size}px;filter:${on ? 'none' : 'grayscale(1) opacity(.35)'};transform:scale(${on ? 1.12 : 1})">🧳</div>`; } return s; };
function scene(b, t) {
  const s = b.sc, A = b.a, Bb = b.b, u = t - A;
  let r = '';
  if ((s.type || '').startsWith('b_')) { const rb = sceneB(b, t); if (rb !== null) return rb; }
  if (!['hook', 'mirror', 'limbo'].includes(s.type)) { const big = {poll: '1300', bars: '33%', gap: '≠', study: '71', report: '✓', ask: '?'}[s.type] || '';
    r += `<div class="a" dir="ltr" style="left:${(-120 - 60 * pr(t, A, Bb)).toFixed(1)}px;top:${(1180 - 30 * pr(t, A, Bb)).toFixed(1)}px;font:900 460px/1 V;color:transparent;-webkit-text-stroke:4px rgba(226,114,91,.2)">${big}</div><div class="a" style="left:140px;top:1080px;width:800px;height:60px;border-radius:50%;background:radial-gradient(rgba(30,42,63,.14),rgba(30,42,63,0) 70%)"></div>`; }
  switch (s.type) {
    case 'hook': {
      // frame 0: the half-packed suitcase plate big and bright with a slow push-in; headline at the top from frame 0;
      // the through-line circle frames the suitcase like a porthole and pulses; «رفتی» / «موندی» chips tick on their words
      const z = 1.02 + .1 * ex(pr(t, 0, 2.2)) + .06 * pr(t, 2.2, Bb), dx = -40 * Math.sin(t * .9), tr = Math.min(W(b, 'کار،'), .7), tm = W(b, 'رفتن');
      r += `<div class="a" style="left:0;top:560px;width:1080px;height:1360px;overflow:hidden"><img src="${U('el/h1.jpg')}" style="position:absolute;left:${dx.toFixed(1)}px;top:-300px;width:1120px;transform:scale(${z.toFixed(3)});transform-origin:300px 1100px"></div>`;
      let rings = ''; for (let i = 0; i < 3; i++) { const ph = ((t * .5 + i / 3) % 1); rings += `<circle cx="300" cy="1350" r="${230 + 260 * ph}" fill="none" stroke="#fff" stroke-width="${10 * (1 - ph) + 2}" opacity="${(.85 * (1 - ph)).toFixed(2)}"/>`; }
      r += `<svg class="a" style="left:0;top:0" width="1080" height="1920"><circle cx="300" cy="1350" r="230" fill="none" stroke="${ACC}" stroke-width="12"/>${rings}</svg>`;
      r += `<div class="a" style="left:0;top:0;width:1080px;height:700px;background:linear-gradient(#F3EEE7 0%,#F3EEE7 70%,rgba(243,238,231,0))"></div>`;
      r += `<div class="a" style="left:0;right:0;top:170px;text-align:center;font-size:116px;color:${INK}">زندگیت</div><div class="a" style="left:0;right:0;top:320px;text-align:center;font-size:116px;color:${INK}">منتظر <span style="display:inline-block;background:${ACC};color:#fff;padding:0 .2em .1em;border-radius:.18em">مهاجرته</span>؟</div>`;
      [['💼 کار', tr], ['🏠 خونه', Math.min(W(b, 'خونه،'), 1.1)], ['❤️ رابطه', Math.min(W(b, 'رابطه،'), 1.5)]].forEach(([c, tq], i) => { r += chip(600, 900 + i * 120, c + (t > tm ? ' · بعداً' : ''), '#fff', INK, 52, pr(t, tq - .1, tq + .25)); });
      r += chip(600, 1280, 'بعد از رفتن؟', INK, '#fff', 64, pr(t, tm + .2, tm + .5)) + `<div class="a" style="left:80px;top:1280px;transform:scale(${(1 + .06 * Math.sin(t * 5)).toFixed(3)});transform-origin:0 50%;padding:6px 30px 18px;border-radius:30px;background:${INK};color:#fff;font:900 96px V">${fa(33)}٪</div><div class="a" style="left:80px;top:1420px;padding:8px 22px 14px;border-radius:20px;background:rgba(30,42,63,.85);font:900 40px V;color:#fff">نظرسنجی تلفنی ۲۰۲۱ · ۱۳۰۰ نفر: اگه بتونن می‌رن</div>`;

      const tn = W(b, '۱۳۰۰'), tq = W(b, 'اگه'), tmh = W(b, 'مهاجرت'), n = counter(1300, pr(t, A + .3, Math.max(A + 1.5, tn + .4)));

      let pul = ''; for (let i = 0; i < 3; i++) { const ph = ((t * .8 + i / 3) % 1); pul += `<circle cx="540" cy="620" r="${80 + 110 * ph}" fill="none" stroke="${ACC}" stroke-width="${6 * (1 - ph) + 1}" opacity="${(1 - ph).toFixed(2)}"/>`; }
      r += `<svg class="a" style="left:0;top:0" width="1080" height="1920">${pul}</svg>` + ring(540, 620, 80, ACC, `<text x="540" y="652" text-anchor="middle" font-size="86">📞</text>`);
      r += T(170, 470, '۰۰:' + String(Math.min(59, Math.floor(u * 4))).padStart(2, '0'), 44, '#7A8494', 'direction:ltr');
      const q = 'اگه بتونی، مهاجرت می‌کنی؟', kq = pr(t, A + .4, Math.max(A + 2, tmh + .4));
      r += `<div class="a" style="left:170px;top:780px;width:740px;padding:24px 34px 34px;border-radius:36px;border-bottom-left-radius:10px;background:#EFE9E0;font:900 58px/1.35 V;color:${INK};white-space:normal">${q.slice(0, Math.round(q.length * cl(kq)))}${kq < 1 ? '▌' : ''}</div>`;
      r += T(170, 1010, fa(n), 120, ACC) + T(470, 1050, 'نفر، تلفنی', 52, '#7A8494');

      r += `<svg class="a" style="left:0;top:0" width="1080" height="1920"><circle cx="${sx.toFixed(1)}" cy="520" r="80" fill="rgba(255,255,255,.12)" stroke="${ACC}" stroke-width="10"/></svg>`;

      const t10 = W(b, 'ده'); r += chip(560, 1150, `این هفته: ${fa(tot)} بار`, INK, '#fff', 60, pr(t, tc - .1, tc + .2)) + chip(110, 1150, 'مثال', '#EFE9E0', '#7A8494', 46, pr(t, A + .3, A + .6)) + chip(200, 370, 'کمتر از ۱۰ بار؟ شاید لازمش نداری', ACC, '#fff', 50, pr(t, t10 - .1, t10 + .25)) + `<div class="a" style="left:150px;right:150px;top:${(930 - 60 * 10 / 5).toFixed(0)}px;border-top:6px dashed ${ACC};opacity:${pr(t, t10 - .1, t10 + .2)}"></div>`;
      r += head('یه هفته بشمار', pr(t, A, A + .4), 240, 92);
      return r;
    }
    case 'b_s2': {
      const tc = W(b, 'ارزون‌تر'), tg = W(b, 'ارتقا') - .2, ti = W(b, 'ارتقا') + .3, on = ex(pr(t, tc, tc + .35));
      r += coin(170, 300, 90, fa(2), pr(t, A - .05, A + .3), ACC, 100);
      r += card(90, 460, 900, 300, toggle(50, 60, on, 'بسته‌ی ارزون‌تر اول') + T(50, 190, `${fa(347)} هزار تومن – کم آوردی؟ ارتقا`, 44, ACC));
      r += card(90, 800, 900, 420, T(50, 40, 'گرون‌تره بیشتر برای:', 46, '#7A8494') + [['🧠 مدل‌های قوی‌تر', tg], ['🖼 عکس‌سازی بیشتر', ti]].map(([c, tq], i) => `<div class="a" style="left:50px;top:${130 + i * 120}px;padding:10px 30px 18px;border-radius:30px;background:#EFE9E0;font:900 52px V;color:${INK};transform:scale(${sp(pr(t, tq - .1, tq + .25)).toFixed(3)});opacity:${cl(pr(t, tq - .1, tq + .2) * 5).toFixed(2)}">${c}</div>`).join(''));
      r += cursor(mix(980, 300, ex(pr(t, tc - .6, tc))), mix(1500, 600, ex(pr(t, tc - .6, tc))), t, tc) + head('اول ارزون‌تر', pr(t, A, A + .4), 240, 92);
      return r;
    }
    case 'b_s3': {
      const tk = W(b, 'کار'), tf = W(b, 'کار') + 1.1, tr = W(b, 'تمدید'), q = 'این قرارداد رو خلاصه کن و ریسک‌هاش رو بگو', kq = pr(t, tk - .2, tk + 1.4), off = 1 - ex(pr(t, tr, tr + .35));
      r += coin(170, 300, 90, fa(3), pr(t, A - .05, A + .3), ACC, 100);
      r += card(90, 440, 900, 500, `<div class="a" style="right:40px;top:40px;max-width:760px;padding:24px 34px 34px;border-radius:36px 36px 10px 36px;background:${ACC};color:#fff;font:900 52px/1.4 V;white-space:normal">${q.slice(0, Math.round(q.length * cl(kq)))}${kq < 1 ? '▌' : ''}</div>` +
        `<div class="a" style="left:40px;top:300px;padding:18px 30px 28px;border-radius:30px;background:#EFE9E0;font:900 46px V;color:#7A8494;opacity:${(1 - .5 * pr(t, tf, tf + .3)).toFixed(2)}">«یه شعر درباره‌ی گربه بگو»${t > tf ? `<div style="position:absolute;left:20px;right:20px;top:50%;height:8px;background:#E5322D;transform:scaleX(${ex(pr(t, tf, tf + .3)).toFixed(3)});transform-origin:100% 50%"></div>` : ''}</div>`);
      r += card(90, 990, 900, 180, toggle(50, 45, off, 'تمدید خودکار'));
      r += cursor(mix(980, 230, ex(pr(t, tr - .6, tr))), mix(1500, 1090, ex(pr(t, tr - .6, tr))), t, tr) + head('سؤال کار خودت', pr(t, A, A + .4), 240, 92);
      return r;
    }
    case 'b_priv': {
      const tb2 = W(b, 'بانکی'), th = W(b, 'هیچ');
      const fields = [['شماره کارت', '۶۰۳۷ •••• •••• ••••'], ['رمز دوم', '••••••'], ['کد ملی', '••••••••••']];
      r += card(90, 380, 900, 620, fields.map((f, i) => { const k = pr(t, tb2 - .3 + i * .25, tb2 + i * .25); return `<div class="a" style="left:50px;right:50px;top:${50 + i * 180}px;height:140px;border-radius:30px;background:#EFE9E0;opacity:${cl(k * 4).toFixed(2)}"><div style="position:absolute;right:30px;top:20px;font:900 38px V;color:#7A8494">${f[0]}</div><div dir="ltr" style="position:absolute;left:30px;top:70px;font:900 46px V;color:${INK}">${f[1]}</div></div>`; }).join(''));
      if (t > th - .1) r += `<div class="a" style="left:300px;top:560px;padding:14px 46px 26px;border:12px solid #E5322D;border-radius:24px;color:#E5322D;font:900 110px V;background:rgba(255,255,255,.9);transform:rotate(-7deg) scale(${mix(1.8, 1, ex(pr(t, th - .1, th + .25))).toFixed(3)})">ننویس</div>`;
      r += coin(840, 1150, 100, '🔒', pr(t, A + .2, A + .5), INK, 90) + chip(110, 1110, 'تو هیچ چت‌باتی', ACC, '#fff', 60, pr(t, th, th + .3)) + head('اطلاعات حساس؟', pr(t, A, A + .4), 220, 92);
      return r;
    }
    case 'b_ask': {
      const tq = W(b, 'چقدر'), tc = W(b, 'کامنت'), ts = W(b, 'بفرست'), ky = pr(t, tc + .1, tc + 1.1);
      r += pulse(540, 440, 120, u) + coin(540, 440, 120, '؟', pr(t, A, A + .4), ACC, 120);
      [['۳۴۷ هزار', 0], ['۸۳۷ هزار', .3], ['هیچی، مجانی', .6]].forEach(([c, d], i) => { r += chip(150 + (i % 2) * 60, 640 + i * 130, c, '#fff', INK, 62, pr(t, tq - .1 + d, tq + .2 + d)); });
      r += card(110, 1060, 860, 120, `<div class="a" style="right:40px;top:30px;font:900 50px V;color:${INK}">${'من ماهی ۳۴۷ می‌دم'.slice(0, Math.round(17 * cl(ky)))}${ky > 0 && ky < 1 ? '▌' : ''}</div><div class="a" style="left:24px;top:18px;padding:10px 26px 18px;border-radius:30px;background:${ky >= 1 ? ACC : '#D9D3CA'};color:#fff;font:900 44px V">ارسال</div>`);
      r += chip(90, 1220, 'بفرست برای کسی که تازه بسته خریده ↗', INK, '#fff', 46, pr(t, ts - .1, ts + .25)) + head('تو چقدر می‌دی؟', pr(t, A, A + .4), 220);
      return r;
    }
  }
  return null;
}

function endCard(u) {
  const k = ex(pr(u, 0, .5)), q = (S.end_text || '').replace(/\*([^*]+)\*/g, `<span style="color:${ACC}">$1</span>`);
  let pul = ''; for (let i = 0; i < 3; i++) { const ph = ((u * .7 + i / 3) % 1); pul += `<circle cx="540" cy="620" r="${160 + 220 * ph}" fill="none" stroke="${ACC}" stroke-width="${8 * (1 - ph) + 1}" opacity="${(1 - ph).toFixed(2)}"/>`; }
  return `<svg class="a" style="left:0;top:0" width="1080" height="1920">${pul}</svg>` + photoRing(S.end_img || 'h6.jpg', 540, 620, mix(60, 170, k), 1.1, '45% 30%') +
    C(860, (S.brand || ''), 96, INK, `direction:ltr;opacity:${pr(u, .1, .5)}`) + C(1000, q, 84, INK, `opacity:${pr(u, .3, .7)}`) +
    C(1140, S.end_sub || '', 56, ACC, `direction:ltr;opacity:${pr(u, .5, .9)}`) + C(1250, (S.handle || '').replace('@', '').toUpperCase(), 44, '#7A8494', `direction:ltr;letter-spacing:4px;opacity:${pr(u, .7, 1)}`) + (S.end_chips || ['۱ رفتم', '۲ موندم', '۳ نیمه‌رفته']).map((c, i) => chip(S.end_chips ? 220 : 110 + i * 300, S.end_chips ? 1330 + i * 110 : 1330, c, '#fff', INK, 50, pr(u, .8 + i * .2, 1.1 + i * .2))).join('');
}
function seek(t) {
  if (!B.length) return;
  let bi = 0; for (let i = 0; i < B.length; i++) if (t >= B[i].a) bi = i;
  const b = B[bi], endOn = t >= TL.end_start;
  // camera: 1.0 → 1.04 across a scene, starting at the zoom the last one ended on; small kick on every idea
  let si = 0, sc = (window.SCENES || [])[0] || {t0: 0, t1: 1}; (window.SCENES || []).forEach((x, i) => { if (t >= x.t0) { si = i; sc = x; } });
  // camera keys: every idea (scene moment) is its own shot — a hard punch to a new zoom and framing (cuts on the beat)
  const PZ = [0, .07, .03, .1], OX = [540, 480, 600, 540], OY = [800, 720, 880, 680], k4 = si % 4;
  const z = (b.sc.type === 'hook' ? 1 : 1.06) + PZ[k4] + .03 * pr(t, sc.t0, sc.t1) + Math.exp(-10 * (t - sc.t0)) * .025;
  $('cam').style.transformOrigin = `${OX[k4]}px ${OY[k4]}px`;
  $('root').style.background = ['#F3EEE7', '#E8DCCD', '#DDE7E4', '#EFE3E0'][k4];
  $('cam').style.transform = `scale(${z.toFixed(4)})`;
  // scene entry: the next scene is revealed by a circular mask growing from the through-line circle (never a crossfade)
  let h = endOn ? endCard(t - TL.end_start) : scene(b, t);
  if (!endOn && b.i > 0 && t < b.a + .45) { const k = ex(pr(t, b.a, b.a + .45)); h = scene(B[b.i - 1], t) + `<div class="a" style="left:0;top:0;width:1080px;height:1920px;background:${['#F3EEE7', '#E8DCCD', '#DDE7E4', '#EFE3E0'][si % 4]};clip-path:circle(${(30 + 1300 * k).toFixed(0)}px at 540px 760px)">${h}</div>`; }
  const st = $('stage'); if (st._h !== h) { st._h = h; st.innerHTML = h; }
  caption(b, t, endOn);
}
function caption(b, t, endOn) {
  const sub = $('sub');
  if (endOn || t > b.L.end + .3 || (b.i === 0)) { if (sub._k) { sub.innerHTML = ''; sub._k = null; } return; }
  let j = 0; for (let q = 0; q < b.words.length; q++) if (t >= b.wt(q) - .04) j = q;
  const c0 = Math.floor(j / 4) * 4, ch = b.words.slice(c0, c0 + 4), key = b.bt.id + c0;
  if (sub._k !== key) { sub._k = key; const lat = w => /^[A-Za-z0-9+$\-]+$/.test(w.w); const gs = [];
    ch.forEach((w, q) => { const g = gs[gs.length - 1]; if (g && lat(w) && g.l) { g.w += ' ' + w.w; g.k = g.k || w.k; } else gs.push({w: w.w, k: w.k, i: q, l: lat(w)}); });
    sub.innerHTML = `<span class="pill">${gs.map(g => `<span class="w" data-i="${g.i}" ${g.l ? 'dir="ltr"' : ''} style="${g.k ? 'color:' + ACC : ''}">${g.w}</span>`).join(' ')}</span>`; }
  sub.querySelectorAll('.w').forEach(el => { const tw = b.wt(c0 + +el.dataset.i), k = ex(pr(t, tw - .05, tw + .2)); el.style.opacity = .35 + .65 * k; });
}
window.seek = seek;
</script>
