<!doctype html>

<meta charset="utf-8">
<title>meshkani.pro — product promo film (prompt 117)</title>
<!-- Skill motion-graphy-2026, prompt 117 "Matra caption app promo" (UI), built as its own engine.
     Look from the prompt: Apple-keynote white space, one idea per shot, the device as the hero; one typeface, one accent
     colour used only on the through-line object and the key word; the real UI rebuilt as vector layers driven by a
     cursor with real clicks and drags; springs with at most a small overshoot; nothing appears from nothing (it grows,
     unfolds or is revealed by a mask); the camera never sits still (1.0 → 1.04 per scene, each scene starting at the zoom
     the last ended on); something changes on every beat.
     Through-line object: the product's own round screen (a circle). It starts as the glowing clock on the nightstand,
     becomes the product lockup, a sonar ring, a sleep chart's marker, a wake-window dial, a sunrise, a clock-face
     carousel, a mute button, a data dot, and finally the brand mark on the end card.
     Brand slot: the product's own colours (navy #232F3E, accent orange #FF9900) on a warm white page.
     Page standards: 1080x1920, Persian narration (eleven_v4) + word-by-word caption, music at 120 BPM, SFX via SCENES[].sfx.
     Data: story.json beats[{id, text, scene{type, img?}}], end_text, end_sub, brand; el/*.
     Pure seek(t): no CSS animations, timers or Math.random. -->
<style>
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: V; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: V; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --page: #F3EEE7; --ink: #1E2A3F; --mu: #7A8494; --acc: #E2725B; --card: #FFFFFF; --line: #E4DED5; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--page); }
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--page); font-family: V; font-weight: 900; color: var(--ink); }
  #cam { position: absolute; inset: 0; transform-origin: 540px 800px; }

  #sub .pill { padding: 10px 34px 20px; border-radius: 30px; font: 900 58px/1.3 V; white-space: nowrap; background: var(--ink); color: #fff; }

<body>
<div id="root"><div id="cam"><div id="stage"></div></div><div id="sub"></div></div>
<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const U = s => s.startsWith('/') ? s : DIR + s, $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), mix = (a, b, k) => a + (b - a) * k, pr = (t, a, b) => cl((t - a) / (b - a));
const ex = k => 1 - Math.pow(2, -10 * cl(k));
const sp = k => { k = cl(k); return 1 - Math.exp(-6.5 * k) * Math.cos(8 * k) * (1 - k * .15); };   // small overshoot
const fa = n => String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const ACC = '#E2725B', INK = '#1E2A3F';
const ISSUES = [];
let S, TL, B = [], END = 50;

window.ready = (async () => {
  S = await (await fetch(U('story.json'))).json(); TL = await (await fetch(U('timeline.json'))).json();
  END = TL.total;
  const shown = t => t.replace(/\[[^\]]*\]/g, '').replace(/\{([^|}]*)\|[^}]*\}/g, '$1').trim().split(/\s+/);
  for (const bt of S.beats) {
    const L = TL.lines[bt.id]; if (!L) { ISSUES.push('no timing for ' + bt.id); continue; }
    let on = false;
    const words = shown(bt.text).map(w => { if (w.startsWith('*')) on = true; const k = on || /\*/.test(w); if (/\*[.…،؛!؟?»]*$/.test(w)) on = false; return {w: w.replace(/\*/g, ''), k}; });
    const wt = j => { const i = Math.round(cl(j / Math.max(1, words.length - 1)) * (L.words.length - 1)); return (L.words[i] || [L.start])[0]; };
    B.push({bt, sc: bt.scene || {}, L, words, wt});
  }
  B.forEach((b, i) => { b.i = i; b.a = i ? b.L.start - .08 : 0; b.b = i + 1 < B.length ? B[i + 1].L.start - .08 : TL.end_start; });
  await Promise.all(['h1.jpg', 'h6.jpg', 'h7.jpg'].map(f => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = U('el/' + f); })));
  await document.fonts.ready; await Promise.all(['900 40px V', '600 40px V'].map(f => document.fonts.load(f, 'تصمیم رفتن Mirror')));
  window.START = 0; window.DURATION = END; window.ISSUES = ISSUES;
  const SC = [];
  for (const b of B) {
    const pts = [[b.a, (OPEN[b.sc.type] || 'pop')]];
    (MOM[b.sc.type] || (() => []))(b).forEach(m => { if (m[0] > b.a + .9 && m[0] < b.b - .6) pts.push(m); });
    pts.sort((p, q) => p[0] - q[0]);
    const fl = []; [...pts.map(p => p[0]), b.b].forEach((q, i, arr) => { if (!i) return; const g = q - arr[i - 1], n = Math.ceil(g / 2.7) - 1; for (let j = 1; j <= n; j++) fl.push([+(arr[i - 1] + g * j / (n + 1)).toFixed(2), FILL[(j + i + b.i) % FILL.length]]); });
    pts.push(...fl); pts.sort((p, q) => p[0] - q[0]);
    pts.forEach((p, i) => SC.push({t0: +p[0].toFixed(2), t1: +(i + 1 < pts.length ? pts[i + 1][0] : b.b).toFixed(2), type: b.sc.type, bg: b.bt.id + (i ? '.' + i : ''), sfx: [[p[0] + .02, p[1], .32]]}));
  }
  SC.push({t0: TL.end_start, t1: END, type: 'end', bg: 'end', sfx: [[TL.end_start + .15, 'riser', .35]]});
  window.SCENES = SC;
  for (const s of SC) if (s.t1 - s.t0 > 3.2) ISSUES.push(`idea ${s.bg} holds ${(s.t1 - s.t0).toFixed(1)} s (> 3): add a moment`);
  seek(0);
})();
const W = (b, s) => { const i = b.words.findIndex(w => w.w.includes(s)); return b.wt(i < 0 ? 0 : i); };
// opening sound of each scene, matched to its motion (never a whoosh)
const OPEN = {hook: 'riser', poll: 'notify', bars: 'sweep_soft', gap: 'click', study: 'typing', limbo: 'sweep_soft', mirror: 'shimmer', report: 'typing', ask: 'notify'};
const MOM = {
  hook: b => [[W(b, 'کار،'), 'tap'], [W(b, 'رابطه،'), 'tap'], [W(b, 'رفتن'), 'click']],
  poll: b => [[W(b, '۱۳۰۰'), 'counter_tick'], [W(b, 'مهاجرت'), 'click']],
  bars: b => [[W(b, '۳۳'), 'counter_tick'], [W(b, '۲۰۱۶'), 'click'], [W(b, '۲۹.۸'), 'counter_tick']],
  gap: b => [[W(b, 'Calgary'), 'sweep_soft'], [W(b, 'زیاد،'), 'tap'], [W(b, 'شانس'), 'click']],
  study: b => [[W(b, '۷۱'), 'counter_tick'], [W(b, 'فارسی'), 'tap'], [W(b, '۲۰۰'), 'counter_tick'], [W(b, 'آستانه'), 'shimmer']],
  limbo: b => [[W(b, 'پنهان'), 'click'], [W(b, 'گرفته'), 'tap'], [W(b, 'معلق'), 'sweep_soft']],
  mirror: b => [[W(b, 'برو'), 'tap'], [W(b, 'گفتگو'), 'notify'], [W(b, 'ترس'), 'tap'], [W(b, 'جدا'), 'click']],
  report: b => [[W(b, 'گزارش'), 'typing'], [W(b, 'پاک'), 'sweep_soft'], [W(b, 'خودت'), 'shimmer']],
  ask: b => [[W(b, 'یک:'), 'tap'], [W(b, 'دو:'), 'tap'], [W(b, 'سه:'), 'tap'], [W(b, 'کامنت'), 'notify']],
};
const FILL = ['tap', 'click', 'notify'];
// ---- kit ----
const card = (x, y, w, h, inner = '', st = '') => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${st}">${inner}</div>`;
const T = (x, y, s, size, col = INK, st = '') => `<div class="a" style="left:${x}px;top:${y}px;font-size:${size}px;color:${col};${st}">${s}</div>`;
const C = (y, s, size, col = INK, st = '') => `<div class="a" style="left:0;right:0;top:${y}px;text-align:center;font-size:${size}px;color:${col};white-space:normal;${st}">${s}</div>`;
const grow = (k, inner, ox, oy) => `<div class="a" style="left:0;top:0;width:1080px;height:1920px;transform-origin:${ox}px ${oy}px;transform:scale(${sp(k).toFixed(3)});opacity:${cl(k * 6).toFixed(2)}">${inner}</div>`;
const mask = (k, inner) => `<div class="a" style="left:0;top:0;width:1080px;height:1920px;clip-path:inset(0 0 ${(100 - 100 * ex(k)).toFixed(1)}% 0)">${inner}</div>`;
const chip = (x, y, s, bg, fg, size, k, ltr = false) => k <= 0 ? '' : grow(k, `<div class="a" ${ltr ? 'dir="ltr"' : ''} style="left:${x}px;top:${y}px;padding:${size * .22}px ${size * .5}px ${size * .34}px;border-radius:${size}px;background:${bg};color:${fg};font:900 ${size}px V;box-shadow:0 12px 30px rgba(30,42,63,.14)">${s}</div>`, x + 100, y + size / 2);
function cursor(x, y, t, tc) {
  const p = tc !== undefined && t >= tc ? Math.exp(-9 * (t - tc)) : 0, ring = tc !== undefined && t >= tc ? pr(t, tc, tc + .45) : 1;
  return `<svg class="a" style="left:0;top:0" width="1080" height="1920">${ring < 1 ? `<circle cx="${x}" cy="${y}" r="${24 + 70 * ring}" fill="none" stroke="${ACC}" stroke-width="${6 * (1 - ring)}"/>` : ''}<g transform="translate(${x} ${y}) scale(${1 - .16 * p})"><path d="M0 0 L0 64 L16 50 L28 76 L40 70 L28 46 L50 46 Z" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/></g></svg>`;
}
const ring = (cx, cy, r, fill = INK, inner = '', stroke = ACC) => `<svg class="a" style="left:0;top:0" width="1080" height="1920"><circle cx="${cx}" cy="${cy}" r="${Math.max(0, r)}" fill="${fill}"/><circle cx="${cx}" cy="${cy}" r="${Math.max(0, r)}" fill="none" stroke="${stroke}" stroke-width="10"/>${inner}</svg>`;
const photoRing = (img, cx, cy, r, z = 1, pos = '50% 50%', st = '') => `<div class="a" style="left:${cx - r}px;top:${cy - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;overflow:hidden;border:10px solid ${ACC};box-sizing:border-box;box-shadow:0 20px 50px rgba(30,42,63,.25);${st}"><img src="${U('el/' + img)}" style="width:100%;height:100%;object-fit:cover;object-position:${pos};transform:scale(${z.toFixed(3)})"></div>`;
const toggle = (x, y, on, label) => `<div class="a" style="left:${x}px;top:${y}px;display:flex;align-items:center;gap:26px;flex-direction:row-reverse"><div style="font:900 50px V;color:${INK}">${label}</div><div style="width:150px;height:84px;border-radius:42px;background:${on > .5 ? ACC : '#D9D3CA'};position:relative"><div style="position:absolute;top:8px;left:${8 + 66 * on}px;width:68px;height:68px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2)"></div></div></div>`;
const head = (s, k, y = 250, size = 92) => mask(k, C(y, s, size, INK, 'line-height:1.15'));
const counter = (v, k) => Math.round(v * ex(k));
const people = (x, y, n, lit, k, size = 64) => { let s = ''; for (let i = 0; i < n; i++) { const on = i < lit && k > (i + 1) / (lit + 1); s += `<div class="a" style="left:${x + (i % 3) * (size + 26)}px;top:${y + Math.floor(i / 3) * (size * 1.5)}px;font-size:${size}px;filter:${on ? 'none' : 'grayscale(1) opacity(.35)'};transform:scale(${on ? 1.12 : 1})">🧳</div>`; } return s; };
function scene(b, t) {
  const s = b.sc, A = b.a, Bb = b.b, u = t - A;
  let r = '';
  if (!['hook', 'mirror', 'limbo'].includes(s.type)) { const big = {poll: '1300', bars: '33%', gap: '≠', study: '71', report: '✓', ask: '?'}[s.type] || '';
    r += `<div class="a" dir="ltr" style="left:${(-120 - 60 * pr(t, A, Bb)).toFixed(1)}px;top:${(1180 - 30 * pr(t, A, Bb)).toFixed(1)}px;font:900 460px/1 V;color:transparent;-webkit-text-stroke:4px rgba(226,114,91,.2)">${big}</div><div class="a" style="left:140px;top:1080px;width:800px;height:60px;border-radius:50%;background:radial-gradient(rgba(30,42,63,.14),rgba(30,42,63,0) 70%)"></div>`; }
  switch (s.type) {
    case 'hook': {
      // frame 0: the half-packed suitcase plate big and bright with a slow push-in; headline at the top from frame 0;
      // the through-line circle frames the suitcase like a porthole and pulses; «رفتی» / «موندی» chips tick on their words
      const z = 1 + .16 * pr(t, 0, Bb), tr = W(b, 'کار،'), tm = W(b, 'رفتن');
      r += `<div class="a" style="left:0;top:560px;width:1080px;height:1360px;overflow:hidden"><img src="${U('el/h1.jpg')}" style="position:absolute;left:0;top:-260px;width:1080px;transform:scale(${z.toFixed(3)});transform-origin:300px 1100px"></div>`;
      let rings = ''; for (let i = 0; i < 3; i++) { const ph = ((t * .5 + i / 3) % 1); rings += `<circle cx="300" cy="1350" r="${230 + 260 * ph}" fill="none" stroke="#fff" stroke-width="${10 * (1 - ph) + 2}" opacity="${(.85 * (1 - ph)).toFixed(2)}"/>`; }
      r += `<svg class="a" style="left:0;top:0" width="1080" height="1920"><circle cx="300" cy="1350" r="230" fill="none" stroke="${ACC}" stroke-width="12"/>${rings}</svg>`;
      r += `<div class="a" style="left:0;top:0;width:1080px;height:700px;background:linear-gradient(#F3EEE7 0%,#F3EEE7 70%,rgba(243,238,231,0))"></div>`;
      r += `<div class="a" style="left:0;right:0;top:170px;text-align:center;font-size:110px;color:${INK}">زندگیت موکول شده</div><div class="a" style="left:0;right:0;top:320px;text-align:center;font-size:110px;color:${INK}">به <span style="display:inline-block;background:${ACC};color:#fff;padding:0 .2em .1em;border-radius:.18em">مهاجرت</span>؟</div>`;
      [['💼 کار', tr], ['🏠 خونه', W(b, 'خونه،')], ['❤️ رابطه', W(b, 'رابطه،')]].forEach(([c, tq], i) => { r += chip(600, 900 + i * 120, c + (t > tm ? ' · بعداً' : ''), '#fff', INK, 52, pr(t, tq - .1, tq + .25)); });
      r += chip(560, 1660, 'بعد از رفتن؟', INK, '#fff', 64, pr(t, tm + .2, tm + .5)) + chip(300, 470, 'نظرسنجی تلفنی ۲۰۲۱ · ۱۳۰۰ نفر', '#fff', '#7A8494', 40, 1);
      return r;
    }
    case 'poll': {
      // a phone-call card: the circle is the call button; the question types in; the 1300 counter climbs; source chip
      const tn = W(b, '۱۳۰۰'), tq = W(b, 'اگه'), tmh = W(b, 'مهاجرت'), n = counter(1300, pr(t, tn - .3, tn + .9));
      r += card(110, 420, 860, 760, '', `transform:scale(${sp(pr(t, A, A + .5)).toFixed(3)});transform-origin:540px 800px`);
      let pul = ''; for (let i = 0; i < 3; i++) { const ph = ((t * .8 + i / 3) % 1); pul += `<circle cx="540" cy="620" r="${80 + 110 * ph}" fill="none" stroke="${ACC}" stroke-width="${6 * (1 - ph) + 1}" opacity="${(1 - ph).toFixed(2)}"/>`; }
      r += `<svg class="a" style="left:0;top:0" width="1080" height="1920">${pul}</svg>` + ring(540, 620, 80, ACC, `<text x="540" y="652" text-anchor="middle" font-size="86">📞</text>`);
      r += T(170, 470, '۰۰:' + String(Math.min(59, Math.floor(u * 4))).padStart(2, '0'), 44, '#7A8494', 'direction:ltr');
      const q = 'اگه بتونی، مهاجرت می‌کنی؟', kq = pr(t, tq - .1, tmh + .6);
      r += `<div class="a" style="left:170px;top:780px;width:740px;padding:24px 34px 34px;border-radius:36px;border-bottom-left-radius:10px;background:#EFE9E0;font:900 58px/1.35 V;color:${INK};white-space:normal">${q.slice(0, Math.round(q.length * cl(kq)))}${kq < 1 ? '▌' : ''}</div>`;
      r += T(170, 1010, fa(n), 120, ACC) + T(470, 1050, 'نفر، تلفنی', 52, '#7A8494');
      r += chip(150, 1230, 'Keyou Analytics · 2021', INK, '#fff', 48, pr(t, A + .6, A + .9), true);
      r += head('یه نظرسنجی تلفنی', pr(t, A, A + .4), 230);
      if (t > tmh) r += chip(640, 1230, 'آره / نه', ACC, '#fff', 52, pr(t, tmh, tmh + .3)) + cursor(mix(980, 760, ex(pr(t, tmh, tmh + .5))), mix(1500, 1270, ex(pr(t, tmh, tmh + .5))), t, tmh + .5);
      return r;
    }
    case 'bars': {
      // two bars grow: 2016 29.8% and 2021 33.3%; a 1-in-3 row of suitcases lights up; delta arrow
      const t3 = W(b, '۳۳'), t0 = W(b, '۲۰۱۶'), k1 = pr(t, t3 - .3, t3 + .7), k0 = pr(t, t0 - .2, t0 + .6);
      const H0 = 640, base = 1200, h21 = H0 * .333 / .35 * ex(k1), h16 = H0 * .298 / .35 * ex(k0);
      r += card(90, 380, 900, 900);
      r += `<div class="a" style="left:220px;top:${base - h16}px;width:240px;height:${h16}px;border-radius:24px 24px 0 0;background:#C9C1B5"></div><div class="a" style="left:620px;top:${base - h21}px;width:240px;height:${h21}px;border-radius:24px 24px 0 0;background:${ACC}"></div>`;
      r += T(250, 1215, '۲۰۱۶', 52, '#7A8494') + T(650, 1215, '۲۰۲۱', 52, INK);
      if (k0 > 0) r += T(215, base - h16 - 110, fa((29.8 * ex(k0)).toFixed(1)).replace('.', '٫') + '٪', 76, '#7A8494');
      if (k1 > 0) r += T(615, base - h21 - 110, fa((33.3 * ex(k1)).toFixed(1)).replace('.', '٫') + '٪', 76, ACC);
      r += chip(560, 300, 'دو نظرسنجی جدا', '#fff', '#7A8494', 42, pr(t, t0 - .1, t0 + .2)) + people(330, 1340, 3, 1, pr(t, t3, t3 + .8), 70) + T(620, 1350, '= یک از سه', 56, INK, `opacity:${pr(t, t3 + .5, t3 + .9)}`);
      r += head('اگه بتونن، می‌رن', pr(t, A, A + .4), 230);
      return r;
    }
    case 'gap': {
      // the circle scans the two numbers; «خواستن» bar is long, «رفتن» bar stays short; a bracket labels the gap
      const tg = W(b, 'خواستنه'), tw = W(b, 'زیاد،'), tr = W(b, 'شانس'), kw = ex(pr(t, tw - .2, tw + .6)), kr = ex(pr(t, tr - .2, tr + .6));
      const sx = mix(160, 900, (Math.sin(u * 1.6) + 1) / 2);
      r += ring(sx, 560, 70, 'rgba(30,42,63,.06)', '', ACC);
      r += T(800, 760, 'خواستن', 58, INK) + `<div class="a" style="left:120px;top:850px;width:${(840 * kw).toFixed(0)}px;height:90px;border-radius:45px;background:${ACC}"></div>`;
      r += T(740, 1010, 'شانس رفتن', 58, INK) + `<div class="a" style="left:${(960 - 260 * kr).toFixed(0)}px;top:1100px;width:${(260 * kr).toFixed(0)}px;height:90px;border-radius:45px;background:${INK}"></div>`;
      if (t > tr + .2) { const kb = ex(pr(t, tr + .2, tr + .7)); r += `<svg class="a" style="left:0;top:0" width="1080" height="1920"><path d="M120 1240 L120 1270 L${120 + 580 * kb} 1270 L${120 + 580 * kb} 1240" fill="none" stroke="${ACC}" stroke-width="8"/></svg>` + chip(260, 1300, 'شکاف', ACC, '#fff', 60, pr(t, tr + .4, tr + .7)); }
      r += head('خواستن زیاد، رفتن کم', pr(t, tg - .5, tg), 240) + chip(560, 400, '🎓 Calgary · 2024', INK, '#fff', 46, pr(t, W(b, 'Calgary') - .1, W(b, 'Calgary') + .25), true);
      return r;
    }
    case 'study': {
