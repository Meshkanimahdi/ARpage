<style>

  :root { --fd: Vaz; --ft: Vaz; --o: #FF6A13; --paper: #EDEAE4; --ink: #17171A; --dark: #121214; --mute: #8C8A86; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--dark); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Vaz, sans-serif; }
  .bg { position: absolute; inset: 0; opacity: 0; }
  #paper { background: radial-gradient(1200px 1400px at 50% 45%, #F4F2EE, #E6E2DB 75%, #DAD5CD); }
  #dark { background: radial-gradient(900px 1100px at 50% 52%, #2A1A12 0%, #17151A 45%, #0E0E10 80%); }
  #arc { position: absolute; width: 1500px; height: 1500px; left: -600px; top: 260px; border-radius: 50%; border: 70px solid rgba(120,118,114,.16); box-sizing: border-box; }
  #floor { position: absolute; left: -540px; right: -540px; bottom: 0; height: 900px; transform-origin: 50% 100%; transform: perspective(700px) rotateX(64deg);
    background-image: linear-gradient(rgba(255,255,255,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.07) 2px, transparent 2px); background-size: 120px 120px; }
  #code { position: absolute; left: 70px; top: 120px; opacity: .55; }
  .beat { position: absolute; inset: 0; display: none; }
  .txt { position: absolute; left: 70px; right: 70px; top: 150px; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; column-gap: 18px; row-gap: 0; direction: rtl; text-align: center; }
  .w { display: inline-block; font-family: var(--ft), Vaz; font-weight: 700; font-size: 58px; line-height: 1.35; white-space: nowrap; will-change: transform, filter, opacity; }
  .w.k { font-family: var(--fd), Vaz; font-weight: 900; font-size: 132px; line-height: 1.15; color: var(--o); }
  .w.b { font-weight: 900; }
  .w.br { flex-basis: 100%; height: 0; }
  .paper .w { color: var(--ink); } .paper .w.k { color: var(--kl, var(--o)); }
  .lightaccent .paper .w.k { background: linear-gradient(transparent 58%, var(--o) 58%, var(--o) 92%, transparent 92%); padding: 0 8px; }
  .accent .w { color: var(--ink); } .accent .w.k { color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,.25); }
  #accentbg { background: var(--o); }
  .mono .obj, .mono .person { filter: grayscale(1) contrast(1.12) drop-shadow(0 40px 50px rgba(0,0,0,.3)); }
  .minimal #arc, .minimal #floor, .minimal #code { display: none; }
  .deco { position: absolute; font-family: Inter; font-weight: 800; font-size: 22px; letter-spacing: 4px; opacity: .45; direction: ltr; }
  #ticker { position: absolute; left: 0; right: 0; bottom: 150px; height: 56px; overflow: hidden; display: none; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: .5; }
  #ticker div { position: absolute; white-space: nowrap; font-weight: 900; font-size: 34px; line-height: 56px; direction: rtl; }
  .busy #ticker { display: block; }
  #dots { position: absolute; inset: 0; display: none; background-image: radial-gradient(currentColor 1.6px, transparent 1.6px); background-size: 36px 36px; opacity: .08; }
  .busy #dots { display: block; }
  .dark .w { color: #F3F1EE; } .dark .w.k { color: var(--o); text-shadow: 0 0 26px rgba(255,106,19,.55), 0 0 60px rgba(255,106,19,.25); }
  .huge .w.k { font-size: 300px; }
  .vis { position: absolute; left: 0; right: 0; top: 560px; height: 1050px; }
  .abs { position: absolute; will-change: transform, opacity, filter; }
  .obj { filter: drop-shadow(0 40px 50px rgba(0,0,0,.28)); }
  .dark .obj { filter: drop-shadow(0 40px 60px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(255,106,19,.12)); }
  .stamp { padding: 10px 34px; border: 8px solid var(--o); border-radius: 16px; color: var(--o); font-weight: 900; font-size: 76px; white-space: nowrap; background: rgba(18,18,20,.55); }
  .mark { font-weight: 900; font-size: 110px; color: var(--o); }
  .card { border-radius: 34px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .card.d { background: #1C1C20; border: 2px solid rgba(255,255,255,.06); }
  .card.l { background: #F7F5F1; border: 2px solid rgba(0,0,0,.05); }
  .person { filter: grayscale(1) contrast(1.08); }
  .cap { font-weight: 700; font-size: 34px; color: var(--mute); text-align: center; }
  .ico { width: 170px; height: 170px; border-radius: 30px; display: grid; place-items: center; }
  .ico svg { width: 84px; height: 84px; }
  /* soft-ui look (STORY_SPEC §4/§8): pastel blobs, serif headline on top, one-line karaoke caption at the bottom */
  #blobs { position: absolute; inset: 0; display: none; }

  #tabs.dk span.on { background: #fff; color: #111; }
  .soft { background: #fff; border-radius: 30px; box-shadow: 0 18px 50px rgba(20,20,30,.10), 0 0 0 2px rgba(20,20,30,.04); color: #141414; }
  .dark .soft { background: #1B1B20; color: #EEE; box-shadow: 0 18px 50px rgba(0,0,0,.4), 0 0 0 2px rgba(255,255,255,.06); }
  .chip { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 28px; padding: 12px 22px 14px; border-radius: 22px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #2BC56B; display: inline-block; }
  /* maximalist look (preset "maxi-pop"): clashing saturated fields that change every beat, patterns, double
     tickers, sticker cut-outs with white borders, offset-shadow type, spinning badges */
  #maxi { position: absolute; inset: 0; display: none; overflow: hidden; }
  .maxi #maxi { display: block; } .maxi #arc, .maxi #floor, .maxi #code, .maxi #dots { display: none; }
  #maxi .pat { position: absolute; }
  #mxA { left: -120px; top: 1180px; width: 760px; height: 760px; border-radius: 50%; background: repeating-conic-gradient(var(--m2) 0 12deg, transparent 12deg 24deg); opacity: .9; }
  #mxB { right: -90px; top: 60px; width: 420px; height: 420px; border-radius: 50%; background: radial-gradient(var(--m3) 9px, transparent 10px) 0 0/44px 44px; }
  #mxC { left: -100px; right: -100px; top: 1560px; height: 120px; transform: rotate(-6deg); background: repeating-linear-gradient(90deg, var(--m4) 0 60px, #111 60px 120px); }
  #mxD { left: 40px; top: 470px; width: 200px; height: 200px; background: conic-gradient(#111 25%, #fff 0 50%, #111 0 75%, #fff 0) 0 0/50px 50px; transform: rotate(14deg); border: 8px solid #111; }
  #mxStar { right: 50px; top: 1250px; width: 230px; height: 230px; }
  #mxStar svg { width: 100%; height: 100%; }
  #mxStar b { position: absolute; inset: 0; display: grid; place-items: center; font: 900 46px/1.05 Vaz; color: #111; text-align: center; }
  #tick2 { position: absolute; left: -40px; right: -40px; top: 1660px; height: 70px; background: #111; color: var(--m3); transform: rotate(3deg); overflow: hidden; display: none; }
  .maxi #tick2 { display: block; }
  #tick2 div { position: absolute; white-space: nowrap; font: 900 40px/70px Lalezar; direction: rtl; }
  .maxi #ticker { opacity: 1; background: var(--m4); color: #111 !important; border: 0; bottom: auto; top: 40px; height: 64px; transform: rotate(-2deg); }
  .maxi #ticker div { font-family: Lalezar; font-weight: 400; font-size: 40px; line-height: 64px; }
  .maxi .w { font-family: Lalezar, Vaz; font-weight: 400; color: #111 !important; text-shadow: 4px 4px 0 #fff, 8px 8px 0 var(--m2); }
  .maxi .dark .w { color: #fff !important; text-shadow: 4px 4px 0 #111, 8px 8px 0 var(--m2); }
  .maxi .w.k { display: inline-block; color: #fff !important; background: #111; padding: 0 18px; transform: rotate(-3deg); text-shadow: 6px 6px 0 var(--m2); border-radius: 10px; margin: 6px 0; }
  .maxi .w.k:nth-of-type(even) { background: var(--m2); color: #111 !important; text-shadow: 5px 5px 0 #fff; transform: rotate(2.5deg); }
  .maxi .obj { filter: drop-shadow(6px 0 0 #fff) drop-shadow(-6px 0 0 #fff) drop-shadow(0 6px 0 #fff) drop-shadow(0 -6px 0 #fff) drop-shadow(14px 16px 0 rgba(17,17,17,.9)) !important; }
  .maxi .cap { color: #111; background: #fff; border: 4px solid #111; display: table; margin: 0 auto; padding: 6px 22px; }
  .maxi .card { border: 6px solid #111; box-shadow: 14px 16px 0 #111; }
  .maxi .deco { opacity: 1; color: #111 !important; background: #fff; padding: 4px 12px; border: 3px solid #111; }
  /* maxi-photo look: full-bleed photoreal maximalist scenes, the headline typeset on a blank poster inside the
     scene, the narration in a frosted-glass pill; the camera explores the set (STORY_SPEC §4, §8.0) */
  .vis.full { top: 0; height: 1920px; overflow: hidden; }
  .poster { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; direction: rtl; font-family: Lalezar, Vaz; color: #141414; line-height: 1.02; }
  .poster .pl { display: block; } .poster .pk { color: #E8197D; }
  .poster .ps { font-family: Vaz; font-weight: 700; color: #3a3a3a; margin-top: .45em; font-size: .3em; }
  .mphoto .txt { top: auto; bottom: 250px; left: 70px; right: 70px; padding: 20px 34px 26px; border-radius: 62px; background: rgba(255,255,255,.2); backdrop-filter: blur(26px) saturate(1.35); -webkit-backdrop-filter: blur(26px) saturate(1.35); box-shadow: inset 0 0 0 2px rgba(255,255,255,.4), 0 24px 60px rgba(0,0,0,.28); column-gap: 14px; }
  .mphoto .w, .mphoto .w.k { font-family: Vaz; font-weight: 900; font-size: 52px; line-height: 1.45; color: #fff !important; text-shadow: 0 2px 14px rgba(0,0,0,.45); background: none; }
  .mphoto .w.k { color: #FFE14D !important; background: none !important; padding: 0; }
  .mphoto #dots, .mphoto #ticker, .mphoto .deco, .mphoto #code { display: none !important; }
  #end { position: absolute; inset: 0; display: none; background: var(--dark); }
</style>

<body>
<div id="stage">
  <div class="bg" id="paper"><div id="arc"></div></div>
  <div class="bg" id="dark"><div id="floor"></div></div>
  <div class="bg" id="accentbg"></div>
  <div id="dots"></div>
  <div id="maxi"><div class="pat" id="mxA"></div><div class="pat" id="mxB"></div><div class="pat" id="mxC"></div><div class="pat" id="mxD"></div>
    <div class="pat" id="mxStar"><svg viewBox="0 0 100 100"><polygon fill="var(--m3)" stroke="#111" stroke-width="2.5" points="${''}"/></svg><b id="mxSt"></b></div></div>
  <div class="deco" id="dTL" style="left:70px; top:80px"></div><div class="deco" id="dTR" style="right:70px; top:80px"></div>
  <div class="deco" id="dBL" style="left:70px; bottom:90px"></div><div class="deco" id="dBR" style="right:70px; bottom:90px"></div>
  <div id="ticker"><div id="tick"></div></div><div id="tick2"><div id="tk2"></div></div>
  <svg id="code" width="150" height="44"></svg>
  <div id="blobs"><i id="b1" style="width:760px;height:760px;left:-220px;top:900px"></i><i id="b2" style="width:640px;height:640px;right:-200px;top:180px;opacity:.4"></i></div>
  <div id="beats"></div>
  <div id="tabs"></div>
  <div id="end"></div>
</div>
<script>
// Story reel in the reference style (paper / dark, one orange accent, word-by-word kinetic type
// that follows the narration, real-object cut-outs). Data: <dir>/story.json + <dir>/timeline.json
// (story_voice.mjs writes word times). window.seek(t) renders absolute time t.
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const url = s => s.startsWith('/') ? s : DIR + s;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = .55, c3 = c1 + 1;   // a soft settle, not a toy bounce (STORY_SPEC §8.0)
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
function h(tag, cls, style, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (style) e.style.cssText = style; if (html !== undefined) e.innerHTML = html; return e; }
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const tf = (e, s) => { e.style.transform = s; };
const ISSUES = [];
// appear: blur-to-sharp rise (the reference's focus-pull entrance)
function appear(e, t, a, d = .35, dy = 26, s0 = .96) { const k = P(t, a, a + d); e.style.opacity = clamp(k * 1.4); e.style.filter = k < 1 ? `blur(${(1 - eo(k)) * 16}px)` : ''; return {y: (1 - eo(k)) * dy, s: lerp(s0, 1, eo(k))}; }

// tiny line icons for icon_grid / network
const ICON = {
  bank: '<path d="M8 30h48M12 26h40L32 12 12 26zm4 4v16m10-16v16m12-16v16m10-16v16M8 50h48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>',
  doc: '<path d="M18 8h20l10 10v38H18zM38 8v10h10M24 30h18M24 38h18M24 46h12" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/>',
  card: '<rect x="8" y="16" width="48" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M8 26h48M16 40h12" stroke="currentColor" stroke-width="3.5"/>',
  dollar: '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M39 24c-2-3-5-4-8-4-4 0-7 2-7 5 0 8 16 4 16 12 0 3-3 6-8 6-4 0-7-2-9-5M32 16v4m0 24v4" fill="none" stroke="currentColor" stroke-width="3.5"/>',
  building: '<path d="M16 56V10h32v46M10 56h44M24 18h6m6 0h6M24 28h6m6 0h6M24 38h6m6 0h6M28 56v-8h8v8" fill="none" stroke="currentColor" stroke-width="3.5"/>',
  user: '<circle cx="32" cy="22" r="10" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M12 54c2-12 10-18 20-18s18 6 20 18" fill="none" stroke="currentColor" stroke-width="3.5"/>',
  chart: '<path d="M10 54h44M16 46V34m10 12V24m10 22V30m10 16V16" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>',
  chip: '<rect x="18" y="18" width="28" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="M24 10v8m8-8v8m8-8v8M24 46v8m8-8v8m8-8v8M10 24h8m-8 8h8m-8 8h8M46 24h8m-8 8h8m-8 8h8" stroke="currentColor" stroke-width="3.5"/>',
  heart: '<path d="M32 54S10 40 10 24a11 11 0 0 1 22-3 11 11 0 0 1 22 3c0 16-22 30-22 30z" fill="none" stroke="currentColor" stroke-width="3.5"/>',
  car: '<path d="M10 40l5-14h34l5 14v10H10zM10 40h44M18 50v4m28-4v4" fill="none" stroke="currentColor" stroke-width="3.5"/><circle cx="20" cy="44" r="3" fill="currentColor"/><circle cx="44" cy="44" r="3" fill="currentColor"/>',
  book: '<path d="M10 14h18c3 0 4 2 4 4v36c0-2-1-4-4-4H10zM54 14H36c-3 0-4 2-4 4v36c0-2 1-4 4-4h18z" fill="none" stroke="currentColor" stroke-width="3.5"/>',
};
const svg = k => `<svg viewBox="0 0 64 64">${ICON[k] || ICON.doc}</svg>`;

// ---------------- visuals: each returns {el, anim(t,a,b)} ----------------
const V = {};
const img = (src, w, cls = 'obj', style = '') => { const e = h('img', 'abs ' + cls, `width:${w}px;${style}`); e.src = url(src); return e; };
V.object = s => {   // one or more cut-outs; optional stamp and floating marks
  const el = h('div', 'vis'), items = (s.objects || [s]).map((o, i) => {
    const w = o.w || 640, e = img(o.el.includes('/') ? o.el : 'el/' + o.el + '.png', w);
    e.style.left = `${(o.x ?? 540) - w / 2}px`; e.style.top = `${o.y ?? 60}px`; el.append(e); return {e, o, i}; });
  const st = s.stamp ? h('div', 'abs stamp', `left:50%; top:${s.stamp_y || 420}px`, esc(s.stamp)) : null; if (st) el.append(st);
  const marks = (s.marks ? [[170, 120, -14], [880, 260, 12], [820, 40, 6]] : []).map(([x, y, r]) => { const m = h('div', 'abs mark', `left:${x}px; top:${y}px`, '؟'); el.append(m); return {m, r}; });
  return {el, anim(t, a, b) {
    for (const {e, o, i} of items) { const at = a + (o.at || 0) + i * .18, k = P(t, at, at + .5), sp = P(t, a, b);
      const mv = o.anim === 'slide' ? `translateX(${(1 - eo(k)) * (o.from === 'left' ? -500 : 500)}px)` : `translateY(${(1 - eo(k)) * 60}px)`;
      tf(e, `${mv} scale(${lerp(o.anim === 'pop' ? .6 : .9, 1, o.anim === 'pop' ? back(k) : eo(k)) * (1 + .05 * sp)}) rotate(${(o.r || 0) + Math.sin(t * 1.3 + i) * (o.float ? 2 : .4)}deg)`);

  if (S.tabs) { $('tabs').style.display = 'flex'; $('tabs').innerHTML = S.tabs.map(x => `<span>${esc(x)}</span>`).join(''); }
  { // a light accent (e.g. acid yellow) is unreadable on paper: keywords become ink with an accent marker band

function seek(t) {
  let cur = BEATS.findIndex(b => t >= b.a && t < b.b); const inEnd = t >= TL.end_start;
  const bgName = inEnd ? 'dark' : (BEATS[Math.max(0, cur)]?.bt.bg || 'paper');
  // background swap with a quick blur dissolve at each beat change

  const lightBg = bgName !== 'dark'; for (const id of ['dTL', 'dTR', 'dBL', 'dBR', 'ticker', 'dots']) $(id).style.color = lightBg ? (bgName === 'accent' ? '#111' : 'var(--ink)') : '#eee';
  $('tick').style.transform = `translateX(${(t * 90) % 2400 - 1200}px)`; $('dBR').textContent = cur >= 0 ? `${fa(String(cur + 1).padStart(2, '0'))}/${fa(BEATS.length)}` : '';

  $('blobs').style.opacity = bgName === 'paper' && !inEnd ? 1 : 0; $('b1').style.transform = `translate(${Math.sin(t * .4) * 80}px,${Math.cos(t * .3) * 60}px)`; $('b2').style.transform = `translate(${Math.cos(t * .35) * 70}px,${Math.sin(t * .5) * 50}px)`;
  if (S.tabs) { const ti = BEATS[Math.max(0, cur)]?.bt.tab; [...$('tabs').children].forEach((x, i) => x.className = i === ti ? 'on' : ''); $('tabs').style.opacity = ti == null || inEnd ? 0 : 1; $('tabs').style.color = bgName === 'dark' ? '#eee' : ''; $('tabs').classList.toggle('dk', bgName === 'dark'); }
  if (document.body.classList.contains('maxi')) {   // every beat gets a new clashing field + pattern colours
    const MX = [['#FFE14D', '#FF2E93', '#2D5BFF', '#00D27A'], ['#FF2E93', '#FFE14D', '#00D27A', '#2D5BFF'], ['#2D5BFF', '#FF8A00', '#FFE14D', '#FF2E93'], ['#00D27A', '#2D5BFF', '#FF2E93', '#FFE14D'], ['#FF8A00', '#7B2DFF', '#FFE14D', '#00D27A'], ['#B8F2FF', '#FF2E93', '#FF8A00', '#2D5BFF']];
    const m = MX[Math.max(0, cur) % MX.length], rs = document.documentElement.style; if (bgName === 'paper') $('paper').style.background = m[0];
    rs.setProperty('--m2', m[1]); rs.setProperty('--m3', m[2]); rs.setProperty('--m4', m[3]);
    $('maxi').style.opacity = inEnd ? 0 : 1; $('mxA').style.transform = `rotate(${t * 18}deg)`; $('mxB').style.transform = `rotate(${-t * 10}deg)`;
    $('mxD').style.transform = `rotate(${14 + Math.sin(t * 2) * 8}deg)`; $('mxStar').style.transform = `rotate(${t * 40}deg) scale(${1 + .06 * Math.sin(t * 6)})`; $('mxSt').style.transform = `rotate(${-t * 40}deg)`;

  $('arc').style.transform = `rotate(${t * 6}deg)`; $('floor').style.backgroundPosition = `0 ${t * 40}px`;

  if (inEnd) { const a = TL.end_start, k = P(t, a, a + .6); $('elogo').style.opacity = k; $('elogo').style.transform = `scale(${lerp(.8, 1, back(k))})`;
    $('eh').style.opacity = P(t, a + .3, a + .7); $('el').style.transform = `scaleX(${eio(P(t, a + .5, a + 1))})`; $('eq').style.opacity = P(t, a + .8, a + 1.2); }
}
