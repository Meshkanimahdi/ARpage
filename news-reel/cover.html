<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>meshkani.pro reel cover</title>
<!-- Reel cover, YouTube-thumbnail style (user rule 2026-10-23). A scroll-stopping photoreal background made with our
     image model (no text in it), the news subject's REAL logo, and a huge typeset Persian headline (exact spelling,
     never model-drawn). Everything important sits inside the 4:5 grid crop (y 285–1635) and avoids the reel UI.
     Data: <dir>/cover.json {bg, logo?, logo_label?, kicker?, title ("*word*" = accent box), sub?, sub_px?, twist? (big red pill under the headline: the story's tension), twist_px?, accent?, ink?, dark?,
     pos?: bottom|top|middle (headline position; vary it cover to cover, user rule 2026-10-24), align?: center|right} -->
<style>
  @font-face { font-family: Vaz; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-900-normal.woff2); }
  @font-face { font-family: Vaz; font-weight: 900; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-900-normal.woff2); unicode-range: U+0000-00FF; }
  @font-face { font-family: Vaz; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-600-normal.woff2); }
  @font-face { font-family: Vaz; font-weight: 600; src: url(/logo-motion/node_modules/@fontsource/vazirmatn/files/vazirmatn-latin-600-normal.woff2); unicode-range: U+0000-00FF; }
  :root { --acc: #FFD400; --ink: #111; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #c { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Vaz; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.25) 52%, rgba(0,0,0,.82) 78%, rgba(0,0,0,.9) 100%); }
  #top { position: absolute; left: 70px; right: 70px; top: 320px; display: flex; align-items: center; justify-content: space-between; direction: rtl; }
  #kicker { font: 900 44px Vaz; color: var(--ink); background: var(--acc); padding: 10px 28px 18px; border-radius: 16px; transform: rotate(-2deg); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #logo { display: flex; align-items: center; gap: 18px; background: #fff; padding: 18px 28px; border-radius: 30px; box-shadow: 0 14px 40px rgba(0,0,0,.4); direction: ltr; }
  #logo img { height: 74px; max-width: 300px; object-fit: contain; }
  #logo span { font: 600 38px Vaz; color: #111; }
  #title { position: absolute; left: 60px; right: 60px; bottom: 430px; text-align: center; direction: rtl; font: 900 132px Vaz; line-height: 1.12; color: #fff;
           text-shadow: 0 6px 0 rgba(0,0,0,.35), 0 18px 50px rgba(0,0,0,.55); letter-spacing: -1px; }
  #title b { color: var(--ink); background: var(--acc); padding: 0 .16em .08em; border-radius: .14em; text-shadow: none; display: inline-block; transform: rotate(-1.5deg); }
  #sub { position: absolute; left: 80px; right: 80px; bottom: 360px; text-align: center; font: 600 44px Vaz; color: rgba(255,255,255,.92); direction: rtl; }
  #brand { position: absolute; left: 0; right: 0; bottom: 305px; text-align: center; font: 600 30px Vaz; color: rgba(255,255,255,.7); letter-spacing: 2px; direction: ltr; }
  /* light key (cover.json "light": true): white shade, dark headline — lets covers alternate key on the grid */
  #c.light #shade { background: linear-gradient(180deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.55) 54%, rgba(255,255,255,.94) 72%, #fff 100%); }
  #c.light #title { color: #111; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  #c.light #title b { color: #fff; }
  #c.light #sub { color: rgba(17,17,17,.85); }
  #c.light #brand { color: rgba(17,17,17,.55); }
  /* headline position (cover.json "pos"): the shade follows the headline */
  #c.top #shade { background: linear-gradient(0deg, rgba(0,0,0,0) 38%, rgba(0,0,0,.3) 56%, rgba(0,0,0,.8) 76%, rgba(0,0,0,.88) 100%); }
  #c.top #top { top: auto; bottom: 330px; }
  #c.top #title { bottom: auto; top: 330px; }
  #c.top #sub, #c.middle #sub { bottom: auto; }
  #c.middle #shade { background: linear-gradient(180deg, rgba(0,0,0,.1) 0%, rgba(0,0,0,.62) 40%, rgba(0,0,0,.62) 62%, rgba(0,0,0,.1) 100%); }
  #c.middle #title { bottom: auto; top: 50%; transform: translateY(-50%); }
  #c.right #title, #c.right #sub { text-align: right; left: 70px; right: 70px; }
  #c.light.top #shade { background: linear-gradient(0deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.6) 58%, rgba(255,255,255,.95) 78%, #fff 100%); }
  #c.light.middle #shade { background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.8) 40%, rgba(255,255,255,.8) 62%, rgba(255,255,255,0) 100%); }
  /* centred layout (user rule 2026-11-03, Mahdi: «تمامی نوشتارهای روی کاور در مرکز کاور باشه نه اطرافش و حاشیه»): every text block
     (logo, kicker, headline, sub, twist, brand) sits in ONE stack in the middle of the cover; the kicker is very big */
  #stack { position: absolute; left: 50px; right: 50px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 34px; direction: rtl; text-align: center; }
  #stack > * { position: static !important; transform: none; margin: 0; left: auto; right: auto; top: auto; bottom: auto; }
  #stack #kicker { font-size: var(--kpx, 112px); padding: 6px 48px 26px; border-radius: 30px; transform: rotate(-2deg); line-height: 1.25; white-space: nowrap; }
  #stack #title { width: 100%; }
  #stack #twist { transform: rotate(-2deg) !important; }
  #stack #brand { font-size: 30px; }
  #c.center #shade { background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.7) 30%, rgba(0,0,0,.7) 70%, rgba(0,0,0,.15) 100%); }
  #c.light.center #shade { background: linear-gradient(180deg, rgba(255,255,255,.1) 0%, rgba(255,255,255,.85) 30%, rgba(255,255,255,.85) 70%, rgba(255,255,255,.1) 100%); }
</style>
</head>
<body>
<div id="c"><img id="bg"><div id="shade"></div><div id="top"><div id="kicker"></div><div id="logo"></div></div><div id="title"></div><div id="sub"></div><div id="brand">MESHKANI.PRO</div></div>
<script>
const Q = new URLSearchParams(location.search), DIR = Q.get('dir') || '/work/story/';
const url = s => s.startsWith('/') ? s : DIR + s, $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
window.ISSUES = [];
window.ready = (async () => {
  const C = await (await fetch(url('cover.json'))).json();
  if (C.accent) document.documentElement.style.setProperty('--acc', C.accent); if (C.ink) document.documentElement.style.setProperty('--ink', C.ink);
  $('bg').src = url(C.bg); if (C.light) $('c').classList.add('light');
  const POS = 'center'; /* user rule 2026-11-03: always centred; cover.json pos is ignored */ $('c').classList.add('center'); if (C.kicker_px) document.documentElement.style.setProperty('--kpx', C.kicker_px + 'px'); if (C.align === 'right') $('c').classList.add('right');
  if (C.kicker) $('kicker').textContent = C.kicker; else $('kicker').remove();
  if (C.logo) $('logo').innerHTML = `<img src="${url(C.logo)}">${C.logo_label ? `<span>${esc(C.logo_label)}</span>` : ''}`; else $('logo').remove();
  $('title').innerHTML = esc(C.title).replace(/\*([^*]+)\*/g, '<b>$1</b>').replace(/\|/g, '<br>');
  if (C.sub) { $('sub').textContent = C.sub; if (C.sub_px) $('sub').style.fontSize = C.sub_px + 'px'; } else $('sub').remove();
  if (C.twist) { const w = document.createElement('div'); w.id = 'twist'; w.textContent = C.twist; w.style.cssText = 'position:absolute;left:0;right:0;margin:auto;width:max-content;font:900 ' + (C.twist_px || 96) + 'px Vaz;color:#fff;background:#E5322D;padding:8px 44px 24px;border-radius:26px;transform:rotate(-2deg);box-shadow:0 16px 40px rgba(0,0,0,.45);direction:rtl'; $('c').appendChild(w); }
  { const st = document.createElement('div'); st.id = 'stack'; $('c').appendChild(st);
    for (const id of ['logo', 'kicker', 'title', 'sub', 'twist', 'brand']) if ($(id)) st.appendChild($(id));
    if ($('top')) $('top').remove(); }
  await document.fonts.ready; await Promise.all(['600', '900'].map(w => document.fonts.load(`${w} 40px Vaz`, 'آزمایش AI')));
  await Promise.all([...document.images].map(i => i.decode().catch(() => ISSUES.push('image failed: ' + i.src))));
  // fit: shrink the headline until it is at most 3 lines and stays inside the 4:5 grid crop
  // fit: shrink the headline until it is at most 3 lines and stays inside the 4:5 grid crop (y 285–1635)
  const T = $('title'), out = () => { const r = $('stack').getBoundingClientRect(); return r.top < 300 || r.bottom > 1620; };
  // big enough to read in the Explore grid (user rule 2026-10-25): start at 150 px, never below 120 px (raised 2026-10-27)
  
  if (C.lh) T.style.lineHeight = C.lh;
  let fs = C.fs0 || 150; T.style.fontSize = fs + 'px';
  while (fs > 120 && (T.offsetHeight > fs * 1.12 * 3 + 4 || out())) { fs -= 2; T.style.fontSize = fs + 'px'; }
  const nWords = C.title.replace(/[*|]/g, ' ').trim().split(/\s+/).filter(w => w.length > 0).length;
  if (T.offsetHeight > fs * 1.12 * 3 + 4 || out()) ISSUES.push(`headline does not fit at ${fs}px (min 120): shorten it (4–7 words read best)`);
  if (nWords > 9) ISSUES.push(`headline has ${nWords} words (max 9; 4–7 is best)`);
  // user rule 2026-11-03: no «هوش مصنوعی» / «از دید…» label anywhere on the cover (kicker, title, sub, twist, logo label)
  const ALL = [C.kicker, C.title, C.sub, C.twist, C.logo_label].filter(Boolean).join(' ');
  if (/هوش[\s\u200c]*مصنوعی|از دید|هوش مصنوعی می/.test(ALL)) ISSUES.push('cover text uses «هوش مصنوعی» or an «از دید…» label: banned on covers (RUNBOOK §00.20)');
  // user rule 2026-11-05 (REEL-039: kicker «۳۹٪ مهارت‌ها عوض | می‌شه» broke over two lines): the kicker is one line;
  // shrink it to fit 980 px, and refuse below 56 px (shorten the kicker instead)
  const K = $('kicker'); let kpx = 0;
  if (K && K.textContent.trim()) { kpx = parseFloat(getComputedStyle(K).fontSize);
    while (K.getBoundingClientRect().width > 980 && kpx > 56) { kpx -= 4; K.style.fontSize = kpx + 'px'; }
    if (K.getBoundingClientRect().width > 980) ISSUES.push(`kicker «${C.kicker}» does not fit on one line even at 56 px: shorten it (2–5 words)`); }
  window.REPORT = {kicker_px: kpx, font_px: fs, pos: POS, words: nWords, lines: Math.round(T.offsetHeight / (fs * 1.12)), title: C.title, kicker: C.kicker || '', sub: C.sub || '', twist: C.twist || '', logo: C.logo || ''};
  
  { const q = $('stack').getBoundingClientRect(); if (q.bottom > 1635 || q.top < 285) ISSUES.push('cover text stack falls outside the 4:5 grid crop: shorten the headline or drop the sub'); }
})();
</script>
</body>
</html>
