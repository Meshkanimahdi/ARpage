const post = new THREE.ShaderMaterial({uniforms: {tex: {value: rt.texture}, k: {value: .14}, blur: {value: 0}, dir: {value: new THREE.Vector2(0, 1)}, flash: {value: 0}, fcol: {value: new THREE.Color(LIME)}, seed: {value: 0}, ca: {value: .004}},
  vertexShader: 'varying vec2 vUv; void main(){vUv=uv; gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader: `uniform sampler2D tex; uniform float k, blur, flash, seed, ca; uniform vec2 dir; uniform vec3 fcol; varying vec2 vUv;
    vec2 barrel(vec2 uv, float s){ vec2 c=(uv-.5)*vec2(.5625,1.); float r2=dot(c,c); float n=1.+k*(.5625*.5625+1.)*.25; c*=(1.+k*r2)/n*s; return c/vec2(.5625,1.)+.5; }
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))+seed)*43758.5453); }
    void main(){ vec3 col=vec3(0.); for(int i=0;i<9;i++){ float o=(float(i)/8.-.5)*blur; vec2 d=dir*o;
        col.r+=texture2D(tex, barrel(vUv,1.+ca)+d).r; col.g+=texture2D(tex, barrel(vUv,1.)+d).g; col.b+=texture2D(tex, barrel(vUv,1.-ca)+d).b; }
      col/=9.; vec2 c=vUv-.5; col*=1.-.32*dot(c,c)*1.6; col=mix(col,fcol,flash); col+=(h(vUv*1000.)-.5)*.035; gl_FragColor=linearToOutputTexel(vec4(col,1.)); }`});
const pq = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post), ps = new THREE.Scene(); ps.add(pq); const oc = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ---------- HUD (DOM, crisp, kept clear of the Instagram UI) ----------
const hud = document.getElementById('hud'), endEl = document.getElementById('end');
function drawHud(sc, t) {
  const c = sc.hud.dark ? LIME : NAVY; hud.style.setProperty('--c', c); let h = '';
  for (const [pos, txt, at] of sc.hud.labels || []) { if (at && t < at) continue; const fa = isFa(txt) ? ' fa' : '';
    const st = pos === 'tl' ? 'left:70px;top:250px' : pos === 'bl' ? 'left:70px;bottom:330px' : 'right:70px;top:300px;font-size:40px;font-weight:800';
    h += `<div class="lab${fa}" style="${st};opacity:${(at ? clamp((t - at) / .2) : 1) * .85}">${txt}</div>`; }
  if (sc.hud.brackets) for (const [x, y, bs] of [['left:110px', 'top:470px', 'border-right:0;border-bottom:0'], ['right:110px', 'top:470px', 'border-left:0;border-bottom:0'], ['left:110px', 'bottom:520px', 'border-right:0;border-top:0'], ['right:110px', 'bottom:520px', 'border-left:0;border-top:0']]) h += `<div class="br" style="${x};${y};${bs}"></div>`;
  hud.innerHTML = h;
  const e = clamp((t - bt(57)) / .35); endEl.style.opacity = e; endEl.style.transform = `scale(${.86 + .14 * back((t - bt(57)) / .45)})`;
  hud.style.opacity = 1 - e;
}

// ---------- boot / seek ----------
window.ready = (async () => {
  const F = [['400 10px Lalezar', 'خبر'], ['800 10px Changa', 'خبر'], ['700 10px Markazi', 'خبر'], ['900 10px Vazirmatn', 'خبر۲۴'], ['800 10px Vazirmatn', 'خبر'], ['700 10px Ruqaa', 'خبر'], ['900 10px Inter', 'AI'], ['800 10px Inter', 'AI'], ['600 10px Inter', 'AI'], ['italic 900 10px Inter', 'PRO'], ['700 10px Ruqaa', 'PRO']];
  await Promise.all(F.map(([f, s]) => document.fonts.load(f, s)));
  for (const [f, s] of F) if (!document.fonts.check(f, s)) ISSUES.push('font not loaded: ' + f);
  window.LOGO = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('logo')); i.src = 'assets/m.png'; });
  for (const sc of SC) { sc.update = sc.build(); CUR[sc.name] = LAST; }
  window.SCENES = SC.map(s => ({t0: +s.t0.toFixed(3), t1: +s.t1.toFixed(3), type: s.name, bg: s.hud.dark ? 'dark' : 'paper'}));
})();
// cuts: whip direction + flash colour
const CUTS = SC.slice(1).map((s, i) => ({t: s.t0, dir: [[0, 1], [1, .3], [0, -1], [1, 0], [-.3, 1], [1, 0], [0, 1], [0, -1]][i % 8], flash: s.name === 'ransom' || s.name === 'boom' ? .9 : 0}));
window.seek = t => {
  const sc = SC.find(s => t >= s.t0 && t < s.t1) || SC[SC.length - 1];
  // the build() closure owns its scene: grab it via a tiny registry
  sc.update(t - sc.t0, t);
  let blur = 0, flash = 0, dir = [0, 1];
  for (const c of CUTS) { const d = t - c.t, w = Math.exp(-(d * d) / (2 * .045 * .045)); if (w > .01 && w * .09 > blur) { blur = w * .09; dir = c.dir; } if (d >= 0 && d < .25 && c.flash) flash = Math.max(flash, c.flash * (1 - d / .25)); }
  const fin = clamp((t - 30.1) / .4);
  post.uniforms.blur.value = blur; post.uniforms.dir.value.set(...dir).normalize(); post.uniforms.flash.value = Math.max(flash, 0); post.uniforms.seed.value = Math.floor(t * 30) % 97;
  renderer.setRenderTarget(rt); renderer.render(CUR[sc.name], cam); renderer.setRenderTarget(null); renderer.render(ps, oc);
  drawHud(sc, t); document.body.style.filter = fin ? `brightness(${1 - fin})` : '';
};
const CUR = {};
let LAST = null; function mkScene() { return LAST = new THREE.Scene(); }
</script>
