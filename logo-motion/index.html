<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>meshkani.pro logo motion</title>
<style>
  @font-face { font-family: Vazirmatn; font-weight: 700; src: url(node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 700; src: url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Inter; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Logo motion: news streams converge, the M draws itself, "AI" lights up,
// a scan passes, then the handle and tagline settle in. seek(t) renders time t.
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1080);
const DURATION = 6.0;
const CYAN = '#10F5EE';
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
const off = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const layerM = off(), layerAI = off(), comp = off(), tmp = off();

// Logo geometry: source image is 1254 px square; the M occupies x 271-983, y 280-988.
const SRC = 1254, M_BOX = {x0: 271, x1: 983, y0: 280, y1: 988};
const DOT = {x: 897, y: 497};          // antenna dot in source pixels
const portrait = H > W;
const logoW = W * (portrait ? 0.62 : 0.56);           // on-screen width of the M
const scaleSrc = logoW / (M_BOX.x1 - M_BOX.x0);

const bars = [];
for (let i = 0; i < 46; i++) {
  const ang = rnd() * Math.PI * 2;
  bars.push({ ang, r0: Math.hypot(W, H) * (0.55 + rnd() * 0.25), delay: rnd() * 0.75, dur: 0.75 + rnd() * 0.5,
              len: 60 + rnd() * 190, th: 2 + rnd() * 4, off: (rnd() - .5) * logoW * 0.5, dots: rnd() < .45 });
}
const motes = [];
for (let i = 0; i < 70; i++) motes.push({ x: rnd(), y: rnd(), s: 0.6 + rnd() * 1.8, sp: 0.01 + rnd() * 0.03, ph: rnd() * 6.28 });

let imgM, imgAI;
window.ready = (async () => {
  [imgM, imgAI] = await Promise.all([load('assets/m.png'), load('assets/ai.png')]);
  await Promise.all([document.fonts.load('700 40px Vazirmatn', 'اخبار'), document.fonts.load('700 40px Inter'), document.fonts.load('600 40px Inter')]);
  seek(0);
})();

function logoFrame(t) {
  // Where the logo sits: it starts centred, then rises to make room for the text.
  const settle = easeInOut(prog(t, 3.35, 4.25));
  const s = scaleSrc * (1 - 0.16 * settle);
  const cx = W / 2, cy = H / 2 - (portrait ? 0.09 : 0.11) * H * settle;
  const mcx = (M_BOX.x0 + M_BOX.x1) / 2, mcy = (M_BOX.y0 + M_BOX.y1) / 2;
  return { s, x: cx - mcx * s, y: cy - mcy * s, cx, cy };
}

function drawBackground(t) {
  ctx.fillStyle = '#030506'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  const glow = 0.10 + 0.08 * easeOut(prog(t, 1.0, 2.6));
  g.addColorStop(0, `rgba(16,245,238,${glow})`); g.addColorStop(0.45, 'rgba(16,245,238,0.025)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // faint dot grid drifting upward, like a data field
  const sp = 34, drift = (t * 10) % sp;
  ctx.fillStyle = 'rgba(16,245,238,0.07)';
  for (let y = -sp; y < H + sp; y += sp) for (let x = sp / 2; x < W; x += sp) {
    const d = Math.hypot(x - W / 2, y - H / 2) / Math.max(W, H);
    if (d > 0.62) continue;
    ctx.fillRect(x, y - drift, 1.6, 1.6);
  }
  for (const m of motes) {
    const y = ((m.y - t * m.sp) % 1 + 1) % 1, a = 0.25 + 0.25 * Math.sin(t * 2 + m.ph);
    ctx.fillStyle = `rgba(160,255,250,${a * 0.5})`;
    ctx.beginPath(); ctx.arc(m.x * W, y * H, m.s, 0, 7); ctx.fill();
  }
}

function drawBars(t, L) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const b of bars) {
    const p = prog(t, b.delay, b.delay + b.dur); if (p <= 0 || p >= 1) continue;
    const e = easeOut(p);
    const ux = Math.cos(b.ang), uy = Math.sin(b.ang);
    const tx = L.cx + -uy * b.off, ty = L.cy + ux * b.off;   // aim slightly off-centre
    const r = b.r0 * (1 - e);
    const hx = tx + ux * r, hy = ty + uy * r;
    const len = b.len * (1 - e * 0.85);
    const alpha = (1 - Math.pow(p, 4)) * 0.9;
    const grad = ctx.createLinearGradient(hx, hy, hx + ux * len, hy + uy * len);
    grad.addColorStop(0, `rgba(170,255,252,${alpha})`); grad.addColorStop(1, 'rgba(16,245,238,0)');
    ctx.strokeStyle = grad; ctx.lineWidth = b.th;
    ctx.shadowColor = CYAN; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + ux * len, hy + uy * len); ctx.stroke();
    if (b.dots) {   // a few "headline" ticks trailing the bar
      ctx.fillStyle = `rgba(16,245,238,${alpha * 0.6})`;
      for (let k = 1; k <= 3; k++) { const d = len + k * 14; ctx.fillRect(hx + ux * d - 2, hy + uy * d - 2, 4, 4); }
    }
  }
  ctx.restore();
}

function buildLogo(t, L) {
  const dw = SRC * L.s;
  // --- M, revealed by a soft diagonal sweep that follows the swoosh (bottom-left to top-right)
  const pr = easeInOut(prog(t, 0.95, 2.15));
  const lc = layerM.getContext('2d');
  lc.clearRect(0, 0, W, H);
  if (pr > 0) {
    lc.drawImage(imgM, L.x, L.y, dw, dw);
    const ax = L.x + M_BOX.x0 * L.s, ay = L.y + M_BOX.y1 * L.s, bx = L.x + M_BOX.x1 * L.s, by = L.y + M_BOX.y0 * L.s;
    const soft = 0.12, edge = -soft + pr * (1 + 2 * soft);
    const g = lc.createLinearGradient(ax, ay, bx, by);
    g.addColorStop(clamp(edge - soft), 'rgba(0,0,0,1)'); g.addColorStop(clamp(edge + soft), 'rgba(0,0,0,0)');
    lc.globalCompositeOperation = 'destination-in'; lc.fillStyle = g; lc.fillRect(0, 0, W, H);
    lc.globalCompositeOperation = 'source-over';
    // bright leading edge
    if (pr < 1) {
      const tc = tmp.getContext('2d'); tc.clearRect(0, 0, W, H);
      tc.drawImage(imgM, L.x, L.y, dw, dw);
      const g2 = tc.createLinearGradient(ax, ay, bx, by);
      const e0 = clamp(edge - 0.035), e1 = clamp(edge), e2 = clamp(edge + 0.035);
      g2.addColorStop(e0, 'rgba(0,0,0,0)'); g2.addColorStop(e1, 'rgba(0,0,0,1)'); g2.addColorStop(e2, 'rgba(0,0,0,0)');
      tc.globalCompositeOperation = 'destination-in'; tc.fillStyle = g2; tc.fillRect(0, 0, W, H);
      tc.globalCompositeOperation = 'source-in'; tc.fillStyle = '#E8FFFE'; tc.fillRect(0, 0, W, H);
      tc.globalCompositeOperation = 'source-over';
      lc.save(); lc.globalCompositeOperation = 'lighter'; lc.filter = 'blur(6px)'; lc.drawImage(tmp, 0, 0); lc.filter = 'none'; lc.drawImage(tmp, 0, 0); lc.restore();
    }
  }
  // --- "AI": pops into the bubble with a little overshoot and focus pull
  const pa = prog(t, 2.0, 2.65);
  const ac = layerAI.getContext('2d'); ac.clearRect(0, 0, W, H);
  if (pa > 0) {
    const k = 0.62 + 0.38 * easeBack(pa);
    const px = L.x + 795 * L.s, py = L.y + 620 * L.s;      // centre of the AI letters
    ac.save(); ac.globalAlpha = clamp(pa * 1.8);
    ac.filter = `blur(${(1 - easeOut(pa)) * 10}px)`;
    ac.translate(px, py); ac.scale(k, k); ac.translate(-px, -py);
    ac.drawImage(imgAI, L.x, L.y, dw, dw); ac.restore();
  }
  // --- compose + diagonal light scan clipped to the logo
  const cc = comp.getContext('2d'); cc.clearRect(0, 0, W, H);
  cc.drawImage(layerM, 0, 0); cc.drawImage(layerAI, 0, 0);
  const ps = prog(t, 2.8, 3.55);
  if (ps > 0 && ps < 1) {
    const x0 = L.x + (M_BOX.x0 - 300 + ps * 1300) * L.s;
    const g = cc.createLinearGradient(x0 - 140 * L.s, 0, x0 + 140 * L.s, 0);
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    cc.save(); cc.globalCompositeOperation = 'source-atop';
    cc.translate(L.cx, L.cy); cc.rotate(-0.35); cc.translate(-L.cx, -L.cy);
    cc.fillStyle = g; cc.fillRect(-W, -H, W * 3, H * 3); cc.restore();
  }
  return comp;
}

function drawLogo(t, L) {
  const c = buildLogo(t, L);
  const bloom = 0.35 + 0.25 * Math.exp(-Math.pow((t - 2.3) / 0.35, 2)) + 0.06 * Math.sin(t * 2.2) * prog(t, 3.5, 4.5);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = bloom; ctx.filter = 'blur(38px)'; ctx.drawImage(c, 0, 0);
  ctx.globalAlpha = bloom * 0.6; ctx.filter = 'blur(12px)'; ctx.drawImage(c, 0, 0);
  ctx.restore();
  ctx.drawImage(c, 0, 0);
  // antenna pulse rings
  for (const t0 of [2.55, 2.85]) {
    const p = prog(t, t0, t0 + 0.9); if (p <= 0 || p >= 1) continue;
    const x = L.x + DOT.x * L.s, y = L.y + DOT.y * L.s;
    ctx.save(); ctx.strokeStyle = `rgba(16,245,238,${(1 - p) * 0.9})`; ctx.lineWidth = 3 * (1 - p) + 1;
    ctx.shadowColor = CYAN; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(x, y, 8 + easeOut(p) * 70 * L.s / scaleSrc, 0, 7); ctx.stroke(); ctx.restore();
  }
}

function drawText(t, L) {
  const handle = '@meshkani.pro';
  const p = prog(t, 3.7, 4.6);
  if (p <= 0) return;
  const baseY = L.cy + (M_BOX.y1 - (M_BOX.y0 + M_BOX.y1) / 2) * L.s + H * (portrait ? 0.075 : 0.095);
  const fs = Math.round(W * 0.062);
  ctx.save();
  ctx.font = `700 ${fs}px Inter`; ctx.textBaseline = 'middle';
  ctx.letterSpacing = `${Math.round(fs * 0.04)}px`;
  const total = ctx.measureText(handle).width;
  let x = W / 2 - total / 2;
  for (let i = 0; i < handle.length; i++) {
    const ch = handle[i], w = ctx.measureText(ch).width;
    const pi = easeOut(clamp(p * 1.6 - i * 0.045));
    ctx.globalAlpha = pi;
    ctx.fillStyle = ch === '@' ? CYAN : '#F2FFFE';
    ctx.fillText(ch, x, baseY + (1 - pi) * fs * 0.5);
    x += w + Math.round(fs * 0.04);
  }
  // underline that grows from the centre
  const pl = easeInOut(prog(t, 4.1, 4.9));
  ctx.globalAlpha = 1;
  const lw = total * 0.7 * pl, ly = baseY + fs * 0.85;
  const g = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
  g.addColorStop(0, 'rgba(16,245,238,0)'); g.addColorStop(0.5, CYAN); g.addColorStop(1, 'rgba(16,245,238,0)');
  ctx.fillStyle = g; ctx.shadowColor = CYAN; ctx.shadowBlur = 10;
  ctx.fillRect(W / 2 - lw / 2, ly, lw, 3);
  // Persian tagline
  const pt = easeOut(prog(t, 4.35, 5.1));
  ctx.shadowBlur = 0; ctx.letterSpacing = '0px';
  ctx.globalAlpha = pt * 0.82;
  ctx.font = `700 ${Math.round(fs * 0.58)}px Vazirmatn`;
  ctx.direction = 'rtl'; ctx.textAlign = 'center';
  ctx.fillStyle = '#CFF7F5';
  ctx.fillText('خبرهای روز هوش مصنوعی', W / 2, ly + fs * 0.95 + (1 - pt) * 14);
  ctx.restore();
}

function seek(t) {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  const L = logoFrame(t);
  drawBackground(t);
  drawBars(t, L);
  drawLogo(t, L);
  drawText(t, L);
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
window.seek = seek; window.DURATION = DURATION;
</script>
</body>
</html>
